<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="'Courier New', monospace">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>

    <!-- Box glow - orange (user) -->
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Box glow - purple (Claude) -->
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Box glow - green (executor) -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2530" stroke-width="0.5"/>
    </pattern>

    <!-- Arrow marker - cyan -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22d3ee"/>
    </marker>

    <!-- Arrow marker - orange -->
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fb923c"/>
    </marker>

    <!-- Arrow marker - green -->
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>

    <!-- Arrow marker - purple -->
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c084fc"/>
    </marker>

    <!-- Clip path for rounded rect -->
    <clipPath id="bgClip">
      <rect width="1000" height="520" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="12" fill="url(#bgGrad)"/>
  <rect width="1000" height="520" rx="12" fill="url(#grid)" opacity="0.4"/>

  <!-- Outer border -->
  <rect width="948" height="518" x="1" y="1" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="13" fill="#8b949e" letter-spacing="3" font-family="'Courier New', monospace">CLAUDE CODE — AGENTIC TOOL USE LOOP</text>
  <line x1="60" y1="50" x2="840" y2="50" stroke="#21262d" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ROW 1: USER TASK  ──►  CLAUDE (THINK)  ──►  TOOL_USE? -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- USER TASK box -->
  <rect x="48" y="88" width="148" height="72" rx="8" fill="#0d1f12" stroke="#4ade80" stroke-width="1.5" filter="url(#glowGreen)"/>
  <rect x="48" y="88" width="148" height="20" rx="8" fill="#052e16"/>
  <rect x="48" y="100" width="148" height="8" fill="#052e16"/>
  <text x="122" y="102" text-anchor="middle" font-size="9" fill="#4ade80" letter-spacing="1.5" font-weight="bold">USER TASK</text>
  <text x="122" y="128" text-anchor="middle" font-size="11" fill="#86efac">"Add clamp()"</text>
  <text x="122" y="146" text-anchor="middle" font-size="11" fill="#86efac">to utils.py</text>

  <!-- Arrow: USER → CLAUDE -->
  <line x1="198" y1="124" x2="268" y2="124" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowCyan)"/>
  <text x="233" y="116" text-anchor="middle" font-size="9" fill="#67e8f9" letter-spacing="0.5">messages[]</text>

  <!-- CLAUDE THINK box -->
  <rect x="270" y="80" width="164" height="88" rx="8" fill="#160d2a" stroke="#c084fc" stroke-width="1.5" filter="url(#glowPurple)"/>
  <rect x="270" y="80" width="164" height="20" rx="8" fill="#2e1065"/>
  <rect x="270" y="92" width="164" height="8" fill="#2e1065"/>
  <text x="352" y="94" text-anchor="middle" font-size="9" fill="#c084fc" letter-spacing="1.5" font-weight="bold">CLAUDE THINKS</text>
  <text x="352" y="118" text-anchor="middle" font-size="10.5" fill="#d8b4fe">claude-sonnet-4</text>
  <text x="352" y="135" text-anchor="middle" font-size="10" fill="#a78bfa">stop_reason =</text>
  <text x="352" y="152" text-anchor="middle" font-size="10" fill="#f472b6" font-weight="bold">"tool_use"</text>

  <!-- Arrow: CLAUDE → DECISION -->
  <line x1="434" y1="124" x2="508" y2="124" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="471" y="116" text-anchor="middle" font-size="9" fill="#c084fc" letter-spacing="0.5">tool_use block</text>

  <!-- DECISION diamond -->
  <polygon points="560,88 620,124 560,160 500,124" fill="#1a1206" stroke="#fb923c" stroke-width="1.5" filter="url(#glowOrange)"/>
  <text x="560" y="120" text-anchor="middle" font-size="9" fill="#fdba74" font-weight="bold">TOOL</text>
  <text x="560" y="133" text-anchor="middle" font-size="9" fill="#fdba74" font-weight="bold">CALL?</text>

  <!-- YES label on diamond right side -->
  <text x="626" y="113" text-anchor="start" font-size="9" fill="#4ade80" font-weight="bold">YES</text>

  <!-- Arrow: DECISION YES → EXECUTOR -->
  <line x1="620" y1="124" x2="690" y2="124" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- EXECUTOR box -->
  <rect x="692" y="88" width="154" height="72" rx="8" fill="#061a1a" stroke="#22d3ee" stroke-width="1.5" filter="url(#glowGreen)"/>
  <rect x="692" y="88" width="154" height="20" rx="8" fill="#042f2e"/>
  <rect x="692" y="100" width="154" height="8" fill="#042f2e"/>
  <text x="769" y="102" text-anchor="middle" font-size="9" fill="#22d3ee" letter-spacing="1.5" font-weight="bold">TOOL EXECUTOR</text>
  <text x="769" y="126" text-anchor="middle" font-size="10" fill="#67e8f9">execute_tool(</text>
  <text x="769" y="142" text-anchor="middle" font-size="10" fill="#67e8f9">name, input)</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ROW 2: TOOLS  (bash / read_file / write_file)  -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Vertical arrow down from EXECUTOR to TOOLS -->
  <line x1="769" y1="162" x2="769" y2="226" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- Tool boxes row -->
  <!-- BASH -->
  <rect x="620" y="228" width="110" height="60" rx="7" fill="#0c1a0a" stroke="#4ade80" stroke-width="1"/>
  <text x="675" y="252" text-anchor="middle" font-size="10" fill="#4ade80" font-weight="bold">bash</text>
  <text x="675" y="268" text-anchor="middle" font-size="9" fill="#6b7280">subprocess.run()</text>
  <text x="675" y="281" text-anchor="middle" font-size="9" fill="#6b7280">timeout=30s</text>

  <!-- READ_FILE -->
  <rect x="742" y="228" width="114" height="60" rx="7" fill="#0c160d" stroke="#34d399" stroke-width="1"/>
  <text x="799" y="252" text-anchor="middle" font-size="10" fill="#34d399" font-weight="bold">read_file</text>
  <text x="799" y="268" text-anchor="middle" font-size="9" fill="#6b7280">Path.read_text()</text>
  <text x="799" y="281" text-anchor="middle" font-size="9" fill="#6b7280">UTF-8</text>

  <!-- WRITE_FILE -->
  <rect x="868" y="228" width="116" height="60" rx="7" fill="#0c160d" stroke="#34d399" stroke-width="1"/>
  <text x="926" y="252" text-anchor="middle" font-size="10" fill="#34d399" font-weight="bold">write_file</text>
  <text x="926" y="268" text-anchor="middle" font-size="9" fill="#6b7280">Path.write_text()</text>
  <text x="926" y="281" text-anchor="middle" font-size="9" fill="#6b7280">mkdir parents</text>

  <!-- Connector lines from executor to individual tools -->
  <line x1="730" y1="192" x2="675" y2="226" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowCyan)"/>
  <line x1="769" y1="226" x2="799" y2="226" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="808" y1="192" x2="926" y2="226" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowCyan)"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- tool_result feedback loop  -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Label: tool_result -->
  <text x="769" y="316" text-anchor="middle" font-size="9" fill="#fb923c" letter-spacing="1">tool_result</text>

  <!-- Curved return path: tool result back to Claude -->
  <!-- Down from tools area, left arc back to Claude -->
  <path d="M 450 330 Q 450 390 352 390 Q 254 390 254 320 Q 254 260 270 200" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  
  <!-- feedback path label -->
  <text x="360" y="407" text-anchor="middle" font-size="9" fill="#fb923c" letter-spacing="1">append tool_result → messages[]</text>

  <!-- Horizontal return arrow from tool boxes area to the left side of diagram -->
  <line x1="620" y1="330" x2="460" y2="330" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>

  <!-- Vertical from tool boxes down to return path -->
  <line x1="675" y1="290" x2="675" y2="330" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="675" y1="330" x2="620" y2="330" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- NO branch → FINAL RESPONSE  -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- NO label on diamond -->
  <text x="546" y="175" text-anchor="middle" font-size="9" fill="#f87171" font-weight="bold">NO</text>
  <text x="536" y="185" text-anchor="middle" font-size="8" fill="#6b7280">(end_turn)</text>

  <!-- Arrow DOWN from diamond NO -->
  <line x1="560" y1="162" x2="560" y2="224" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <!-- FINAL RESPONSE box -->
  <rect x="432" y="226" width="156" height="66" rx="8" fill="#1a0f0a" stroke="#fb923c" stroke-width="1.5" filter="url(#glowOrange)"/>
  <rect x="432" y="226" width="156" height="20" rx="8" fill="#431407"/>
  <rect x="432" y="238" width="156" height="8" fill="#431407"/>
  <text x="510" y="240" text-anchor="middle" font-size="9" fill="#fb923c" letter-spacing="1.5" font-weight="bold">FINAL RESPONSE</text>
  <text x="510" y="264" text-anchor="middle" font-size="10" fill="#fdba74">stop_reason =</text>
  <text x="510" y="279" text-anchor="middle" font-size="10" fill="#fbbf24" font-weight="bold">"end_turn"</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- MAX_TURNS guard  -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Guard box bottom-left -->
  <rect x="48" y="340" width="190" height="68" rx="7" fill="#1a0808" stroke="#f87171" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="143" y="362" text-anchor="middle" font-size="9" fill="#f87171" letter-spacing="1" font-weight="bold">SAFETY GUARD</text>
  <text x="143" y="380" text-anchor="middle" font-size="10" fill="#fca5a5">MAX_TURNS = 20</text>
  <text x="143" y="396" text-anchor="middle" font-size="9" fill="#6b7280">prevents runaway billing</text>

  <!-- Arrow from loop counter to guard -->
  <line x1="143" y1="340" x2="200" y2="280" stroke="#f87171" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- BOTTOM LEGEND  -->
  <!-- ═══════════════════════════════════════════════ -->

  <line x1="60" y1="450" x2="840" y2="450" stroke="#21262d" stroke-width="1"/>

  <!-- Legend items -->
  <!-- Cyan dashes = messages -->
  <line x1="80" y1="470" x2="110" y2="470" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="118" y="474" font-size="10" fill="#8b949e">API messages[]</text>

  <!-- Purple = tool_use block -->
  <line x1="230" y1="470" x2="260" y2="470" stroke="#c084fc" stroke-width="2"/>
  <text x="268" y="474" font-size="10" fill="#8b949e">tool_use block</text>

  <!-- Orange dashes = tool_result -->
  <line x1="380" y1="470" x2="410" y2="470" stroke="#fb923c" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="418" y="474" font-size="10" fill="#8b949e">tool_result feedback</text>

  <!-- Green = executor call -->
  <line x1="560" y1="470" x2="590" y2="470" stroke="#4ade80" stroke-width="2"/>
  <text x="598" y="474" font-size="10" fill="#8b949e">executor dispatch</text>

  <!-- Red dashes = guard -->
  <line x1="720" y1="470" x2="750" y2="470" stroke="#f87171" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="758" y="474" font-size="10" fill="#8b949e">safety limit</text>

  <!-- Bottom credit -->
  <text x="450" y="505" text-anchor="middle" font-size="9" fill="#30363d" letter-spacing="1">markaicode.com · anthropic sdk 0.25 · python 3.12</text>
</svg>