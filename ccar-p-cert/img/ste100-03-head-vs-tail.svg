<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="480" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1A7F37"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A15C07"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0E7C7B"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B3FA0"/></marker></defs><text x="560" y="38" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Head-based vs tail-based sampling</text><rect x="30" y="70" width="520" height="250" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="290" y="98" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">HEAD-BASED</text><text x="290" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">decides at request start</text><text x="290" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">e.g. keep 1% of traces</text><text x="290" y="164" font-size="13.5" fill="#24292F" text-anchor="middle">cheap, but can miss</text><text x="290" y="185" font-size="13.5" fill="#24292F" text-anchor="middle">rare failures</text><rect x="570" y="70" width="520" height="250" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="830" y="98" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">TAIL-BASED</text><text x="830" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">decides after the request</text><text x="830" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">keep 100% of errors + slow,</text><text x="830" y="164" font-size="13.5" fill="#24292F" text-anchor="middle">1% of the rest</text><text x="830" y="185" font-size="13.5" fill="#24292F" text-anchor="middle">costs collector memory</text><rect x="160" y="360" width="800" height="80" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="560" y="388" font-size="15" fill="#0E7C7B" text-anchor="middle" font-weight="700">THE SELECTION RULE</text><text x="560" y="412" font-size="13.5" fill="#24292F" text-anchor="middle">pick tail-based over log-everything for production agent systems</text></svg>