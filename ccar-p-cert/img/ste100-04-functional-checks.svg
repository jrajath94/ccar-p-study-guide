<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker></defs><text x="560.0" y="34" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The deterministic layer: functional checks</text><rect x="20" y="70" width="253" height="250" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="146.5" y="100" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">Schema check</text><text x="146.5" y="126" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">output parses as JSON</text><text x="146.5" y="148" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">required fields present</text><text x="146.5" y="170" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">types match the contract</text><rect x="293" y="70" width="253" height="250" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="419.5" y="100" font-size="15" fill="#0E7C7B" text-anchor="middle" font-weight="700">Format check</text><text x="419.5" y="126" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">citations use [n] style</text><text x="419.5" y="148" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">no markdown tables</text><text x="419.5" y="170" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">length within budget</text><rect x="566" y="70" width="253" height="250" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="692.5" y="100" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">Refusal check</text><text x="692.5" y="126" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">refuses disallowed asks</text><text x="692.5" y="148" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">refusal is polite + short</text><text x="692.5" y="170" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">never half-complies</text><rect x="839" y="70" width="253" height="250" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="965.5" y="100" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">Regression check</text><text x="965.5" y="126" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">golden answers unchanged</text><text x="965.5" y="148" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">runs on every commit</text><text x="965.5" y="170" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">blocks the merge on fail</text><text x="560.0" y="386" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">Cheap exact checks run before any LLM judge. They never flake.</text></svg>