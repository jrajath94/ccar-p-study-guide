<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="420" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Multi-turn: you are the memory</text><rect x="60" y="100" width="300" height="200" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="210.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#1F5FBF">Turn 1</text><text x="210.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">user: hi</text><text x="210.0" y="177" font-size="13" text-anchor="middle" fill="#24292F">assistant: hello</text><rect x="400" y="100" width="300" height="200" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="550.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#1F5FBF">Turn 2</text><text x="550.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">+ user: price?</text><text x="550.0" y="177" font-size="13" text-anchor="middle" fill="#24292F">+ assistant: $2/M</text><rect x="740" y="100" width="300" height="200" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="890.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#1F5FBF">Turn 3</text><text x="890.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">+ user: cached?</text><text x="890.0" y="177" font-size="13" text-anchor="middle" fill="#24292F">+ assistant: yes</text><line x1="360" y1="200" x2="400" y2="200" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="700" y1="200" x2="740" y2="200" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Claude keeps no memory between calls. You resend the history every turn, so it grows.</text></svg>