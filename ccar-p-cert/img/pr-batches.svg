<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Half price, next day: when latency does not matter</text>
  <rect x="30" y="70" width="180" height="90" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="120" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Your requests</text>
  <text x="120" y="122" text-anchor="middle" font-size="13" fill="#475569">up to 100,000</text>
  <text x="120" y="142" text-anchor="middle" font-size="13" fill="#475569">or 256 MB per batch</text>
  <text x="222" y="120" font-size="26" fill="#64748b">&#8594;</text>
  <rect x="250" y="70" width="180" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="340" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Wait</text>
  <text x="340" y="122" text-anchor="middle" font-size="13" fill="#475569">processed within</text>
  <text x="340" y="142" text-anchor="middle" font-size="13" fill="#475569">24 hours</text>
  <text x="442" y="120" font-size="26" fill="#64748b">&#8594;</text>
  <rect x="470" y="70" width="180" height="90" rx="10" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="560" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#064e3b">Results</text>
  <text x="560" y="122" text-anchor="middle" font-size="13" fill="#475569">at 50% of standard</text>
  <text x="560" y="142" text-anchor="middle" font-size="13" fill="#475569">prices</text>
  <g font-size="13.5">
    <rect x="30" y="190" width="310" height="100" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text x="185" y="218" text-anchor="middle" font-weight="bold" fill="#1e293b">Each result: matched by your</text>
    <text x="185" y="240" text-anchor="middle" fill="#475569">custom_id. Status: succeeded,</text>
    <text x="185" y="262" text-anchor="middle" fill="#475569">errored, canceled, expired.</text>
    <rect x="360" y="190" width="290" height="100" rx="10" fill="#fef3c7" stroke="#b45309"/>
    <text x="505" y="218" text-anchor="middle" font-weight="bold" fill="#78350f">Limits that matter</text>
    <text x="505" y="240" text-anchor="middle" fill="#475569">results kept 29 days, then deleted</text>
    <text x="505" y="262" text-anchor="middle" fill="#475569">no streaming, no max_tokens: 0</text>
  </g>
</svg>
