<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">The system prompt: rules behind the curtain</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">A job description handed to Claude before the user ever speaks. It applies to every turn.</text>
<rect x="150" y="100" width="600" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
<text x="450" y="130" text-anchor="middle" font-size="14" fill="#5b21b6" font-weight="bold">SYSTEM (top-level parameter, not a message)</text>
<text x="450" y="156" text-anchor="middle" font-size="13" fill="#64748b">who it is  |  rules it always follows  |  exact output format</text>
<text x="450" y="182" text-anchor="middle" font-size="12" fill="#94a3b8">read first, never appears in the transcript</text>
<line x1="450" y1="210" x2="230" y2="236" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah)"/>
<rect x="170" y="240" width="120" height="56" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="230" y="268" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">turn 1</text>
<line x1="450" y1="210" x2="430" y2="236" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah)"/>
<rect x="370" y="240" width="120" height="56" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="430" y="268" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">turn 2</text>
<line x1="450" y1="210" x2="630" y2="236" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah)"/>
<rect x="570" y="240" width="120" height="56" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="630" y="268" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">turn 3</text>
<text x="450" y="340" text-anchor="middle" font-size="13" fill="#64748b">Every message restates nothing. The rules live once, in the system prompt.</text>
<text x="450.0" y="380" text-anchor="middle" font-size="12" fill="#94a3b8">Write it once. It steers every turn without being repeated.</text>
</svg>
