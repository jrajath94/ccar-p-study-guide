<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif">
<rect x="0" y="0" width="1120" height="520" fill="#F7F4EE"/>
<defs><pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#FFFDF8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#5C6B7A" stroke-width="1.5"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1B2838"/></marker></defs>
<text x="64" y="56" font-size="32" font-weight="600" fill="#1B2838">Unplanned time becomes a budget</text>
<text x="64" y="88" font-size="17" fill="#5C6B7A">120 minutes divided by 63 items.</text>
<rect x="64" y="128" width="400" height="300" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="2"/>
<text x="88" y="160" font-size="14" font-weight="500" fill="#5C6B7A">Before: unplanned</text>
<rect x="154.0" y="258" width="220" height="40" rx="999" fill="#E6E2DA" stroke="#D9D3C7" stroke-width="2"/>
<text x="264.0" y="284" font-size="15" font-weight="500" text-anchor="middle" fill="#1B2838">120 minutes</text>
<rect x="656" y="128" width="400" height="300" rx="12" fill="#FFFDF8" stroke="#D9D3C7" stroke-width="2"/>
<text x="680" y="160" font-size="14" font-weight="500" fill="#5C6B7A">After: a budget</text>
<rect x="746.0" y="230" width="220" height="40" rx="999" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="856.0" y="256" font-size="15" font-weight="500" text-anchor="middle" fill="#1B2838">114s per item</text>
<rect x="746.0" y="294" width="220" height="40" rx="999" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="2"/>
<text x="856.0" y="320" font-size="15" font-weight="500" text-anchor="middle" fill="#1B2838">63 items</text>
<line x1="464" y1="278" x2="656" y2="278" stroke="#1B2838" stroke-width="2" marker-end="url(#ah)"/>
<rect x="500.0" y="262" width="120" height="32" rx="999" fill="#F7F4EE" stroke="#D9D3C7" stroke-width="1.5"/>
<text x="560.0" y="283" font-size="14" font-weight="500" text-anchor="middle" fill="#1B2838">divide by 63</text>
<text x="64" y="480" font-size="15" fill="#5C6B7A">63 times 114 seconds is 120 minutes.</text>
</svg>