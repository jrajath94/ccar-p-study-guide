<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1A7F37"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A15C07"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0E7C7B"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B3FA0"/></marker></defs><text x="560" y="38" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Twelve agents, one copy-paste mess: the modular fix</text><rect x="30" y="70" width="500" height="180" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/><text x="280" y="98" font-size="15" fill="#B42318" text-anchor="middle" font-weight="700">THE DRIFT</text><text x="280" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">12 agents, shared compliance text</text><text x="280" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">copy-pasted into each prompt</text><text x="280" y="164" font-size="13.5" fill="#24292F" text-anchor="middle">updates take weeks;</text><text x="280" y="185" font-size="13.5" fill="#24292F" text-anchor="middle">agents disagree</text><line x1="530" y1="160" x2="590" y2="160" stroke="#1A7F37" stroke-width="2" marker-end="url(#ahg)"/><rect x="590" y="70" width="500" height="180" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="840" y="98" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">THE FIX (TWO MOVES)</text><text x="840" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">1. extract into versioned modules</text><text x="840" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">(or a Skill)</text><text x="840" y="164" font-size="13.5" fill="#24292F" text-anchor="middle">2. stable content first: it forms</text><text x="840" y="185" font-size="13.5" fill="#24292F" text-anchor="middle">a cacheable prefix</text><text x="560" y="320" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">the traps: "one giant shared prompt" (fixes drift, taxes every request)</text><text x="560" y="348" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">"fine-tune a custom model" (overkill for a copy-paste problem)</text></svg>