<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="560" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Indirect prompt injection, step by step</text><rect x="20" y="70" width="256" height="330" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="148.0" y="100" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="700">1. FETCH</text><text x="148.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">agent fetches a vendor page</text><text x="148.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">to compare prices</text><rect x="292" y="70" width="256" height="330" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="420.0" y="100" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="700">2. HIDDEN TEXT</text><text x="420.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">page contains hidden text:</text><text x="420.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">&quot;ignore previous instructions...&quot;</text><rect x="564" y="70" width="256" height="330" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="692.0" y="100" font-size="13.5" fill="#A15C07" text-anchor="middle" font-weight="700">3. ONE CONTEXT</text><text x="692.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">page text and your instructions</text><text x="692.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">share one context window;</text><text x="692.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">no marker for data vs orders</text><rect x="836" y="70" width="256" height="330" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="964.0" y="100" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="700">4. EXECUTION</text><text x="964.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">agent with an email tool and</text><text x="964.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">no confirmation gate</text><text x="964.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">composes and sends</text><line x1="276" y1="235" x2="292" y2="235" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="548" y1="235" x2="564" y2="235" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="820" y1="235" x2="836" y2="235" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="430" width="1000" height="90" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="560" y="462" font-size="14" fill="#1A7F37" text-anchor="middle" font-weight="700">defenses stack</text><text x="560" y="490" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">delimit and label untrusted content as DATA, never follow it; require a confirmation gate before side-effecting tools</text></svg>