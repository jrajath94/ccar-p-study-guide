<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="468" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Integration mechanism selector</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Each mechanism is a different answer to "where does the knowledge come from?"</text>
<rect x="40" y="100" width="820" height="170" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="450.0" y="132" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="bold">Need external knowledge?</text>
<text x="60" y="162" text-anchor="start" font-size="13" fill="#1e293b">Static, known sources: RAG over your corpus</text>
<text x="60" y="189" text-anchor="start" font-size="13" fill="#1e293b">Live external data or actions: MCP server</text>
<text x="60" y="216" text-anchor="start" font-size="13" fill="#1e293b">A conversation users trust: a chat surface</text>
<text x="60" y="243" text-anchor="start" font-size="13" fill="#1e293b">High-stakes decisions: an agent with approvals</text>
<text x="450" y="320" text-anchor="middle" font-size="13" fill="#64748b">Hybrid answer when tools are real and knowledge is static: MCP tools for writes, RAG for retrieval.</text>
</svg>
