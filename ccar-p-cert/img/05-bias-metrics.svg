<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">You cannot fix what you do not measure: disaggregated evaluation</text><rect x="60" y="70" width="1000" height="80" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="560" y="104" font-size="14.5" fill="#1F5FBF" text-anchor="middle" font-weight="700">run the eval set, then cut results by group and compare</text><text x="560" y="132" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">disaggregated evaluation</text><rect x="30" y="180" width="340" height="270" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="210" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">DEMOGRAPHIC PARITY</text><text x="200.0" y="238" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">each group receives the positive</text><text x="200.0" y="258" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">outcome at similar rates;</text><text x="200.0" y="277" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">simple, can conflict with accuracy</text><rect x="393" y="180" width="340" height="270" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="210" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">EQUALIZED ODDS</text><text x="563.0" y="238" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">error rates (FP and FN) similar</text><text x="563.0" y="258" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">across groups; asks &quot;are we equally</text><text x="563.0" y="277" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">accurate for everyone?&quot;; usually</text><text x="563.0" y="297" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">the more defensible metric</text><rect x="756" y="180" width="340" height="270" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="210" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">FOUR-FIFTHS RULE</text><text x="926.0" y="238" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">a group&#x27;s selection rate must be</text><text x="926.0" y="258" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">at least 80% of the highest group&#x27;s;</text><text x="926.0" y="277" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">below that, the practice is flagged</text></svg>