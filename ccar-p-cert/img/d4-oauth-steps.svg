<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="460" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="458" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">MCP OAuth: the handshake in five steps</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">The server never sees the user password. Tokens do the talking.</text>
<rect x="40" y="100" width="40" height="40" rx="20" fill="#dbeafe" stroke="#2563eb"/>
<text x="60" y="126" text-anchor="middle" font-size="16" fill="#1e40af" font-weight="bold">1</text>
<rect x="100" y="100" width="760" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="120" y="122" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">client asks</text>
<text x="330" y="122" text-anchor="start" font-size="13" fill="#64748b">server: who are you?</text>
<line x1="60" y1="140" x2="60" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="168" width="40" height="40" rx="20" fill="#dbeafe" stroke="#2563eb"/>
<text x="60" y="194" text-anchor="middle" font-size="16" fill="#1e40af" font-weight="bold">2</text>
<rect x="100" y="168" width="760" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="120" y="190" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">redirect</text>
<text x="330" y="190" text-anchor="start" font-size="13" fill="#64748b">user approves at the provider</text>
<line x1="60" y1="208" x2="60" y2="236" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="236" width="40" height="40" rx="20" fill="#dbeafe" stroke="#2563eb"/>
<text x="60" y="262" text-anchor="middle" font-size="16" fill="#1e40af" font-weight="bold">3</text>
<rect x="100" y="236" width="760" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="120" y="258" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">code back</text>
<text x="330" y="258" text-anchor="start" font-size="13" fill="#64748b">short-lived grant, single use</text>
<line x1="60" y1="276" x2="60" y2="304" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="304" width="40" height="40" rx="20" fill="#dbeafe" stroke="#2563eb"/>
<text x="60" y="330" text-anchor="middle" font-size="16" fill="#1e40af" font-weight="bold">4</text>
<rect x="100" y="304" width="760" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="120" y="326" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">token swap</text>
<text x="330" y="326" text-anchor="start" font-size="13" fill="#64748b">code for access + refresh tokens</text>
<line x1="60" y1="344" x2="60" y2="372" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="372" width="40" height="40" rx="20" fill="#dbeafe" stroke="#2563eb"/>
<text x="60" y="398" text-anchor="middle" font-size="16" fill="#1e40af" font-weight="bold">5</text>
<rect x="100" y="372" width="760" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="120" y="394" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">scoped calls</text>
<text x="330" y="394" text-anchor="start" font-size="13" fill="#64748b">every call carries the token</text>
</svg>
