<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="498" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">The error classifier: three buckets, three responses</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Classify before you retry. Blind retries burn the turn budget.</text>
<rect x="40" y="100" width="820" height="116" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="450.0" y="132" text-anchor="middle" font-size="15" fill="#92400e" font-weight="bold">TRANSIENT</text>
<text x="60" y="162" text-anchor="start" font-size="13" fill="#64748b">429, 503, timeouts</text>
<text x="60" y="189" text-anchor="start" font-size="13" fill="#92400e">back off exponentially, then retry</text>
<rect x="40" y="222" width="820" height="116" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="450.0" y="254" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">PERMANENT</text>
<text x="60" y="284" text-anchor="start" font-size="13" fill="#64748b">400, 401, 403, bad schema</text>
<text x="60" y="311" text-anchor="start" font-size="13" fill="#991b1b">do NOT retry: fix the code</text>
<rect x="40" y="344" width="820" height="116" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="450.0" y="376" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">INSTRUCTIVE</text>
<text x="60" y="406" text-anchor="start" font-size="13" fill="#64748b">tool names the problem</text>
<text x="60" y="433" text-anchor="start" font-size="13" fill="#166534">correct the argument, retry exactly once</text>
</svg>
