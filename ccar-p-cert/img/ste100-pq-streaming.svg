<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="380" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Streaming: tokens as they arrive</text><rect x="90" y="90" width="440" height="190" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="310.0" y="119" font-size="15" text-anchor="middle" font-weight="700" fill="#1F5FBF">Default</text><text x="310.0" y="147" font-size="13" text-anchor="middle" fill="#24292F">wait for the full</text><text x="310.0" y="167" font-size="13" text-anchor="middle" fill="#24292F">response, then render</text><rect x="600" y="90" width="440" height="190" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="820.0" y="119" font-size="15" text-anchor="middle" font-weight="700" fill="#0E7C7B">Streaming (SSE)</text><text x="820.0" y="147" font-size="13" text-anchor="middle" fill="#24292F">tokens arrive as events</text><text x="820.0" y="167" font-size="13" text-anchor="middle" fill="#24292F">UI renders word by word</text><line x1="530" y1="185" x2="600" y2="185" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="330" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Streaming changes delivery, not cost or quality. Stream when a human is watching.</text></svg>