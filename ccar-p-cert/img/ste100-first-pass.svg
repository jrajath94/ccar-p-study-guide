<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="340" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">The two-pass method</text><rect x="50" y="80" width="300" height="180" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="200.0" y="109" font-size="15" text-anchor="middle" font-weight="700" fill="#1F5FBF">Pass 1: answer</text><text x="200.0" y="137" font-size="13" text-anchor="middle" fill="#24292F">answer what you</text><text x="200.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">know immediately</text><rect x="410" y="80" width="300" height="180" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="560.0" y="109" font-size="15" text-anchor="middle" font-weight="700" fill="#A15C07">Flag and move on</text><text x="560.0" y="137" font-size="13" text-anchor="middle" fill="#24292F">flag long scenarios</text><text x="560.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">and multi-response</text><text x="560.0" y="177" font-size="13" text-anchor="middle" fill="#24292F">items; return later</text><rect x="770" y="80" width="300" height="180" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="920.0" y="109" font-size="15" text-anchor="middle" font-weight="700" fill="#0E7C7B">Pass 2: flagged only</text><text x="920.0" y="137" font-size="13" text-anchor="middle" fill="#24292F">use the final</text><text x="920.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">10 minutes</text><line x1="350" y1="170" x2="410" y2="170" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="710" y1="170" x2="770" y2="170" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/></svg>