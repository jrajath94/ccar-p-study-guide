<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-label="The developer-productivity stack: three drags at the base, five layers climbing to fix them">
  <style>
    text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
    .small { font-size: 15px; fill: #a8a8a8; }
    .layer { font-size: 19px; font-weight: bold; }
    .drag { font-size: 16px; font-weight: bold; fill: #f0b429; }
  </style>
  <!-- the three drags -->
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold">What slows a 200-developer org down</text>
  <rect x="30" y="55" width="240" height="86" rx="8" fill="#1a1a1a" stroke="#a44141" stroke-width="1.5"/>
  <text x="150" y="88" text-anchor="middle" class="drag">DRIFT</text>
  <text x="150" y="112" text-anchor="middle" class="small">every setup behaves</text>
  <text x="150" y="132" text-anchor="middle" class="small">differently</text>
  <rect x="290" y="55" width="240" height="86" rx="8" fill="#1a1a1a" stroke="#a44141" stroke-width="1.5"/>
  <text x="410" y="88" text-anchor="middle" class="drag">UNSAFE SPEED</text>
  <text x="410" y="112" text-anchor="middle" class="small">AI writes faster than</text>
  <text x="410" y="132" text-anchor="middle" class="small">reviewers can read</text>
  <rect x="550" y="55" width="240" height="86" rx="8" fill="#1a1a1a" stroke="#a44141" stroke-width="1.5"/>
  <text x="670" y="88" text-anchor="middle" class="drag">INVISIBLE FAILURES</text>
  <text x="670" y="112" text-anchor="middle" class="small">LLM bugs no debugger</text>
  <text x="670" y="132" text-anchor="middle" class="small">can see</text>
  <!-- arrow down into the stack -->
  <line x1="410" y1="150" x2="410" y2="182" stroke="#a8a8a8" stroke-width="2"/>
  <polygon points="410,190 402,178 418,178" fill="#a8a8a8"/>
  <text x="410" y="172" text-anchor="middle" class="small" dy="-22"></text>
  <!-- the stack, bottom to top -->
  <g>
    <rect x="130" y="196" width="560" height="58" rx="8" fill="#141414" stroke="#f0b429" stroke-width="2"/>
    <text x="160" y="231" class="layer">Ch 2 &#183; Consistent environments</text>
    <text x="660" y="231" text-anchor="end" class="small">fixes drift</text>
    <rect x="130" y="262" width="560" height="58" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.5"/>
    <text x="160" y="297" class="layer">Ch 3&#8211;4 &#183; Guardrailed tools</text>
    <text x="660" y="297" text-anchor="end" class="small">shrinks blast radius</text>
    <rect x="130" y="328" width="560" height="58" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.5"/>
    <text x="160" y="363" class="layer">Ch 5&#8211;6 &#183; Gated workflows, guarded data</text>
    <text x="660" y="363" text-anchor="end" class="small">speed with gates</text>
    <rect x="130" y="394" width="560" height="58" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.5"/>
    <text x="160" y="429" class="layer">Ch 7 &#183; Debuggable systems</text>
    <text x="660" y="429" text-anchor="end" class="small">traces, not guessing</text>
    <rect x="130" y="460" width="560" height="58" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.5"/>
    <text x="160" y="495" class="layer">Ch 8 &#183; Runbooks</text>
    <text x="660" y="495" text-anchor="end" class="small">3am checklists</text>
  </g>
  <text x="410" y="548" text-anchor="middle" class="small">Each layer assumes the one below it. Read bottom to top.</text>
</svg>
