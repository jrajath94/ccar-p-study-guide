<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="380" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Tool errors: the instructive-error rule</text><rect x="80" y="90" width="440" height="190" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="300.0" y="120" font-size="16" text-anchor="middle" font-weight="700" fill="#0E7C7B">Instructive error</text><text x="300.0" y="148" font-size="13" text-anchor="middle" fill="#24292F">what failed,</text><text x="300.0" y="168" font-size="13" text-anchor="middle" fill="#24292F">why it failed,</text><text x="300.0" y="188" font-size="13" text-anchor="middle" fill="#24292F">what to try next</text><rect x="600" y="90" width="440" height="190" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/><text x="820.0" y="120" font-size="16" text-anchor="middle" font-weight="700" fill="#C0392B">"Tool execution failed"</text><text x="820.0" y="148" font-size="13" text-anchor="middle" fill="#24292F">the agent retries</text><text x="820.0" y="168" font-size="13" text-anchor="middle" fill="#24292F">the identical call</text><text x="820.0" y="188" font-size="13" text-anchor="middle" fill="#24292F">or gives up</text><text x="560.0" y="330" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">The model recovers when it can see the mismatch between what it asked and what the tool returned.</text></svg>