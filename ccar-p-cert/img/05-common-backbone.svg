<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The common backbone: GDPR, HIPAA, FedRAMP all demand the same architecture</text><rect x="20" y="70" width="256" height="330" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="148.0" y="100" font-size="13.5" fill="#1F5FBF" text-anchor="middle" font-weight="700">DATA RESIDENCY</text><text x="148.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">data stays in approved regions;</text><text x="148.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">choose provider regions explicitly</text><rect x="292" y="70" width="256" height="330" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="420.0" y="100" font-size="13.5" fill="#0E7C7B" text-anchor="middle" font-weight="700">RETENTION + DELETION</text><text x="420.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">defined periods, enforced deletion,</text><text x="420.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">proof it happened</text><rect x="564" y="70" width="256" height="330" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="692.0" y="100" font-size="13.5" fill="#A15C07" text-anchor="middle" font-weight="700">AUDIT TRAILS</text><text x="692.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">immutable logs of who accessed what;</text><text x="692.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">every prompt, tool call, override,</text><text x="692.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">with timestamps and identities</text><rect x="836" y="70" width="256" height="330" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="964.0" y="100" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="700">ACCESS CONTROLS</text><text x="964.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">authentication + authorization +</text><text x="964.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">least privilege on model endpoints,</text><text x="964.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">vector store, logs</text><line x1="276" y1="235" x2="292" y2="235" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="548" y1="235" x2="564" y2="235" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="820" y1="235" x2="836" y2="235" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="230" y="430" width="660" height="50" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="560" y="460" font-size="13.5" fill="#1A7F37" text-anchor="middle" font-weight="600">Zero Data Retention: nothing you send is kept. The strongest answer to a retention question.</text></svg>