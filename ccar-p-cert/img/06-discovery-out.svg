<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Discovery turns a wish list into signed, measurable requirements</text><rect x="60" y="70" width="480" height="300" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="300" y="102" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="700">UNSTRUCTURED KICKOFF</text><text x="300" y="150" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">one big meeting, no agenda</text><text x="300" y="190" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">produces a wish list:</text><text x="300" y="225" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="600">&quot;make it smart&quot;</text><text x="300" y="260" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="600">&quot;handle everything&quot;</text><text x="300" y="295" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="600">nothing testable</text><rect x="580" y="70" width="480" height="300" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="820" y="102" font-size="14" fill="#1A7F37" text-anchor="middle" font-weight="700">STRUCTURED DISCOVERY</text><text x="820" y="150" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">planned conversations + document reviews</text><text x="820" y="190" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">produces numbers and constraints:</text><text x="820" y="225" font-size="13.5" fill="#1A7F37" text-anchor="middle" font-weight="600">&quot;95% precision on termination clauses&quot;</text><text x="820" y="260" font-size="13.5" fill="#1A7F37" text-anchor="middle" font-weight="600">latency caps, cost ceilings, owners</text><text x="820" y="295" font-size="13.5" fill="#1A7F37" text-anchor="middle" font-weight="600">a signed, testable requirement set</text><line x1="540" y1="220" x2="580" y2="220" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="160" y="400" width="800" height="60" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="560" y="436" font-size="14" fill="#A15C07" text-anchor="middle" font-weight="600">If the stakeholder cannot name a number, the project is not ready for architecture.</text></svg>