<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Prompt caching under the hood: the stable prefix is hashed, stored, and reused</text><rect x="60" y="80" width="1000" height="120" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="560" y="112" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">prefix order is fixed:  tools  -&gt;  system  -&gt;  messages</text><text x="560" y="140" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">static content belongs early: that is where it caches best</text><text x="560" y="166" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">matching is exact-prefix: one changed byte before the breakpoint breaks the hit</text><rect x="60" y="240" width="470" height="200" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="295" y="272" font-size="15" fill="#0E7C7B" text-anchor="middle" font-weight="700">automatic caching</text><text x="295" y="300" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">one cache_control field</text><text x="295" y="320" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">at the top of the request;</text><text x="295" y="339" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">the breakpoint moves forward</text><text x="295" y="359" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">as the conversation grows</text><text x="295" y="410" font-size="13" fill="#0E7C7B" text-anchor="middle" font-weight="600">best for multi-turn chats</text><rect x="590" y="240" width="470" height="200" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="825" y="272" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">explicit breakpoints</text><text x="825" y="300" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">cache_control on individual</text><text x="825" y="320" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">content blocks, for fine control;</text><text x="825" y="339" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">up to 4 breakpoints per request</text><text x="825" y="359" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">(automatic uses one slot)</text><text x="560.0" y="506" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">The KV cache stores the model&#x27;s computed attention state for the prefix, so a hit skips reprocessing those tokens.</text></svg>