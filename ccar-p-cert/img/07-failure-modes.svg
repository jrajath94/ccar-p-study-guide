<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="780" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="778" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Five failure modes traditional runbooks never imagined</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Each needs its own runbook page. Detect first, then triage, then mitigate.</text>
<rect x="40" y="96" width="820" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="450.0" y="128" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="bold">Runaway agentic loops</text>
<text x="60" y="158" text-anchor="start" font-size="12" fill="#64748b">The agent calls tools forever.</text>
<text x="60" y="185" text-anchor="start" font-size="12" fill="#2563eb">Kill switch: disable the agent endpoint.</text>
<rect x="40" y="220" width="820" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="450.0" y="252" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="bold">Cost spikes</text>
<text x="60" y="282" text-anchor="start" font-size="12" fill="#64748b">A loop burns money while the app looks healthy.</text>
<text x="60" y="309" text-anchor="start" font-size="12" fill="#2563eb">Alert on spend per hour, not just uptime.</text>
<rect x="40" y="344" width="820" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="450.0" y="376" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="bold">Prompt-injection success</text>
<text x="60" y="406" text-anchor="start" font-size="12" fill="#64748b">A tool result smuggles instructions in.</text>
<text x="60" y="433" text-anchor="start" font-size="12" fill="#2563eb">Treat tool output as untrusted input.</text>
<rect x="40" y="468" width="820" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="450.0" y="500" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="bold">Confident wrong answers</text>
<text x="60" y="530" text-anchor="start" font-size="12" fill="#64748b">Cites sources, sounds right, is false.</text>
<text x="60" y="557" text-anchor="start" font-size="12" fill="#2563eb">Faithfulness evals, not vibes.</text>
<rect x="40" y="592" width="820" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="450.0" y="624" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="bold">Silent quality drift</text>
<text x="60" y="654" text-anchor="start" font-size="12" fill="#64748b">Scores decay 1 point a week, unnoticed.</text>
<text x="60" y="681" text-anchor="start" font-size="12" fill="#2563eb">Trend the judge scores, not just the level.</text>
</svg>
