<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="420" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker></defs><text x="560.0" y="34" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Prompt caching: the most valuable optimization</text><rect x="60" y="80" width="300" height="260" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="210.0" y="110" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">Full price</text><text x="210.0" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">$3 per million tokens</text><text x="210.0" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">every token, every request</text><text x="210.0" y="180" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">50k tokens = $0.15</text><rect x="410" y="80" width="300" height="260" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="560.0" y="110" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">Cached price</text><text x="560.0" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">$0.30 per million tokens</text><text x="560.0" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">10x cheaper</text><text x="560.0" y="180" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">same 50k tokens = $0.015</text><line x1="360" y1="210" x2="410" y2="210" stroke="#1A7F37" stroke-width="2" marker-end="url(#ahb)"/><rect x="760" y="80" width="300" height="260" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="910.0" y="110" font-size="15" fill="#0E7C7B" text-anchor="middle" font-weight="700">The math</text><text x="910.0" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">40k cached of 50k tokens</text><text x="910.0" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">$0.012 + $0.03 = $0.042</text><text x="910.0" y="180" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">saves 72% per request</text><line x1="710" y1="210" x2="760" y2="210" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="406" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">Cached tokens cost a fraction of full price. Stable prefixes print money.</text></svg>