<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="380" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="378" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">The exam move: constraint first, architecture second</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">The constraint is the scoring key. Good engineering that breaks it is a distractor.</text>
<rect x="30" y="130" width="199" height="130" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="129" y="174" text-anchor="middle" font-size="12" fill="#1e40af">Read the last</text>
<text x="129" y="196" text-anchor="middle" font-size="13" fill="#1e40af" font-weight="bold">sentence first</text>
<text x="129" y="228" text-anchor="middle" font-size="10.5" fill="#64748b">the actual ask</text>
<line x1="229" y1="190" x2="245" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="245" y="130" width="199" height="130" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="344" y="174" text-anchor="middle" font-size="12" fill="#92400e">Find the</text>
<text x="344" y="196" text-anchor="middle" font-size="13" fill="#92400e" font-weight="bold">constraint</text>
<text x="344" y="228" text-anchor="middle" font-size="10.5" fill="#64748b">cost, latency, safety, SLA</text>
<line x1="444" y1="190" x2="460" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="460" y="130" width="199" height="130" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="559" y="174" text-anchor="middle" font-size="12" fill="#991b1b">Judge each option</text>
<text x="559" y="196" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">against it</text>
<text x="559" y="228" text-anchor="middle" font-size="10.5" fill="#64748b">eliminate "technically possible but wrong"</text>
<line x1="659" y1="190" x2="675" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="675" y="130" width="199" height="130" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="774" y="174" text-anchor="middle" font-size="12" fill="#166534">Pick the simplest</text>
<text x="774" y="196" text-anchor="middle" font-size="13" fill="#166534" font-weight="bold">that satisfies it</text>
<text x="774" y="228" text-anchor="middle" font-size="10.5" fill="#64748b">never the bigger model as tiebreaker</text>
<text x="450.0" y="330" text-anchor="middle" font-size="12" fill="#94a3b8">Say the constraint in your head before you look at the options.</text>
</svg>
