<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="480" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1A7F37"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A15C07"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0E7C7B"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B3FA0"/></marker></defs><text x="560" y="38" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">SLA vs SLO: the promise and the early warning</text><rect x="30" y="70" width="520" height="240" rx="10" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="290" y="98" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">SLA: THE PROMISE</text><text x="290" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">to the stakeholder, with consequences</text><text x="290" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">example: 92% routing accuracy</text><text x="290" y="164" font-size="13.5" fill="#24292F" text-anchor="middle">breach it and the ROI evaporates</text><rect x="570" y="70" width="520" height="240" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="830" y="98" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">SLO: THE INTERNAL TARGET</text><text x="830" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">tighter than the SLA: say 94%</text><text x="830" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">gives warning before you breach</text><text x="830" y="164" font-size="13.5" fill="#24292F" text-anchor="middle">your tripwire, not the contract</text><rect x="160" y="350" width="800" height="90" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="560" y="378" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">MODEL BENCHMARKS ARE NOT SYSTEM SLAs</text><text x="560" y="402" font-size="13.5" fill="#24292F" text-anchor="middle">a benchmark scores the model; the SLA scores your whole system in production</text></svg>