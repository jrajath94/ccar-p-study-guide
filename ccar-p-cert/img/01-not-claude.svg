<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="470" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Three shapes where the model is the wrong tool</text><rect x="30" y="60" width="330" height="250" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="195.0" y="90" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">Perfect recall needed</text><text x="195.0" y="118" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">&quot;find the exact invoice</text><text x="195.0" y="138" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">from March&quot;</text><text x="195.0" y="157" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Use search / a database.</text><text x="195.0" y="177" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">The model only summarizes.</text><rect x="395" y="60" width="330" height="250" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="560.0" y="90" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">Guarantees needed</text><text x="560.0" y="118" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">&quot;never approve a refund</text><text x="560.0" y="138" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">over $500 without a manager&quot;</text><text x="560.0" y="157" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Policy gate in CODE.</text><text x="560.0" y="177" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Model may suggest; code enforces.</text><rect x="760" y="60" width="330" height="250" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="925.0" y="90" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">Cheap, simple, high-volume</text><text x="925.0" y="118" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">&quot;reformat these 2 million</text><text x="925.0" y="138" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">CSV rows&quot;</text><text x="925.0" y="157" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">A script. The model burns</text><text x="925.0" y="177" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">money for zero judgment.</text><rect x="160" y="340" width="800" height="80" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="560" y="372" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">The covering principle</text><text x="560" y="398" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Put deterministic code where determinism exists. Put the model where judgment is needed.</text><text x="560.0" y="456" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">Every model call should defend a decision point. A call defending nothing gets deleted.</text></svg>