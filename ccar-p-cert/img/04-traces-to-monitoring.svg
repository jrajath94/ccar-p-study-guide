<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">From traces to monitoring: three layers</text><text x="560" y="70" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">traces answer what happened in one request; monitoring answers whether the system is healthy right now</text><rect x="30" y="100" width="340" height="350" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="130" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">1. DASHBOARDS</text><text x="200.0" y="158" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">live views of the metric families:</text><text x="200.0" y="178" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">quality, p50/p95 latency, cost,</text><text x="200.0" y="197" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">safety, error rates</text><text x="200.0" y="217" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">segmented, always</text><rect x="393" y="100" width="340" height="350" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="130" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">2. ALERTS</text><text x="563.0" y="158" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">thresholds with owners;</text><text x="563.0" y="178" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">alert on symptom, not cause:</text><text x="563.0" y="197" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">&quot;p95 above 4s for 10 minutes&quot; pages</text><text x="563.0" y="217" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">every alert needs a runbook entry</text><rect x="756" y="100" width="340" height="350" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="130" font-size="16" fill="#1A7F37" text-anchor="middle" font-weight="700">3. PRODUCTION EVALS</text><text x="926.0" y="158" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">the loop never stops: sample live</text><text x="926.0" y="178" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">traffic, score with the judge,</text><text x="926.0" y="197" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">feed failures back into the</text><text x="926.0" y="217" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">golden dataset</text><line x1="370" y1="275" x2="393" y2="275" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="733" y1="275" x2="756" y2="275" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/></svg>