<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="420" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Sampling: temperature, top_p, top_k</text><rect x="80" y="110" width="440" height="16" rx="8" fill="#F2F3F5" stroke="#D0D4D9"/><rect x="80" y="110" width="440" height="16" rx="8" fill="#EAF0FA" stroke="none" opacity="0.55"/><circle cx="100" cy="118" r="12" fill="#1F5FBF"/><circle cx="500" cy="118" r="12" fill="#1F5FBF" opacity="0.35"/><text x="100" y="160" font-size="13" text-anchor="middle" font-weight="700" fill="#1F5FBF">0: deterministic</text><text x="500" y="160" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">1: creative</text><text x="300" y="190" font-size="12" text-anchor="middle" font-weight="400" fill="#5C6570">default 1.0; use 0 for facts, 0.7-1.0 for brainstorming</text><rect x="620" y="90" width="200" height="170" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="720.0" y="119" font-size="15" text-anchor="middle" font-weight="700" fill="#A15C07">top_p</text><text x="720.0" y="147" font-size="12" text-anchor="middle" fill="#24292F">samples from the</text><text x="720.0" y="167" font-size="12" text-anchor="middle" fill="#24292F">smallest set past</text><text x="720.0" y="187" font-size="12" text-anchor="middle" fill="#24292F">probability top_p</text><rect x="860" y="90" width="200" height="170" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="960.0" y="119" font-size="15" text-anchor="middle" font-weight="700" fill="#0E7C7B">top_k</text><text x="960.0" y="147" font-size="12" text-anchor="middle" fill="#24292F">cuts candidates</text><text x="960.0" y="167" font-size="12" text-anchor="middle" fill="#24292F">to the K most</text><text x="960.0" y="187" font-size="12" text-anchor="middle" fill="#24292F">likely tokens</text><text x="560.0" y="330" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Tune temperature or top_p, not both. For exams: temperature near 0 and a fixed seed.</text><text x="560.0" y="358" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">If temperature is high on a factual task, the same question gets a different answer every run.</text></svg>