<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="540" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The indexing pipeline: six stages, in order</text><text x="560" y="68" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">exam shape: a symptom names the stage; your job is to name the fix</text><rect x="20" y="100" width="166" height="340" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="103.0" y="130" font-size="12.5" fill="#B42318" text-anchor="middle" font-weight="700">1. INGEST + CLEAN</text><text x="103.0" y="158" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">strip boilerplate;</text><text x="103.0" y="175" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">dirty input is the #1</text><text x="103.0" y="192" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">cause of bad RAG</text><rect x="200" y="100" width="166" height="340" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="283.0" y="130" font-size="12.5" fill="#A15C07" text-anchor="middle" font-weight="700">2. CHUNK</text><text x="283.0" y="158" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">cut into pieces;</text><text x="283.0" y="175" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">strategies below</text><text x="283.0" y="192" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400"></text><rect x="380" y="100" width="166" height="340" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="463.0" y="130" font-size="12.5" fill="#0E7C7B" text-anchor="middle" font-weight="700">3. ENRICH</text><text x="463.0" y="158" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">attach metadata: title,</text><text x="463.0" y="175" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">section, date, permissions;</text><text x="463.0" y="192" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">enforces access at retrieval</text><rect x="560" y="100" width="166" height="340" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="643.0" y="130" font-size="12.5" fill="#1F5FBF" text-anchor="middle" font-weight="700">4. EMBED</text><text x="643.0" y="158" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">vectors per chunk;</text><text x="643.0" y="175" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">similar meaning =</text><text x="643.0" y="192" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">similar vectors</text><rect x="740" y="100" width="166" height="340" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="823.0" y="130" font-size="12.5" fill="#1A7F37" text-anchor="middle" font-weight="700">5. INDEX</text><text x="823.0" y="158" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">store vectors for</text><text x="823.0" y="175" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">fast search</text><text x="823.0" y="192" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400"></text><rect x="920" y="100" width="166" height="340" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="1003.0" y="130" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="700">6. SERVE</text><text x="1003.0" y="158" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">query pipeline:</text><text x="1003.0" y="175" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">question in, passages</text><text x="1003.0" y="192" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">+ answer out</text><line x1="186" y1="270" x2="200" y2="270" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="366" y1="270" x2="380" y2="270" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="546" y1="270" x2="560" y2="270" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="726" y1="270" x2="740" y2="270" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="906" y1="270" x2="920" y2="270" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="526" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">No chunking strategy fixes dirty input. Clean first, then cut.</text></svg>