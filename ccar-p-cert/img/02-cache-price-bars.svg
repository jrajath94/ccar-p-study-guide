<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="460" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Cached tokens cost a fraction of fresh ones: the price table, visualized</text><text x="200" y="100" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="600">input, full price</text><rect x="200" y="120" width="640" height="46" rx="10" fill="#D6E4F7" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="860" y="150" font-size="14" fill="#1F5FBF" text-anchor="middle" font-weight="700">1.0x</text><text x="200" y="210" font-size="14" fill="#1A7F37" text-anchor="middle" font-weight="600">input, cache read</text><rect x="200" y="230" width="64" height="46" rx="10" fill="#BFE3C9" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="284" y="260" font-size="14" fill="#1A7F37" text-anchor="middle" font-weight="700">0.1x</text><text x="200" y="320" font-size="14" fill="#A15C07" text-anchor="middle" font-weight="600">input, cache write</text><rect x="200" y="340" width="800" height="46" rx="10" fill="#F5DFB8" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="1020" y="370" font-size="14" fill="#A15C07" text-anchor="middle" font-weight="700">1.25x</text><rect x="160" y="410" width="800" height="34" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="560" y="432" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">The 76% worked example: most of