<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="420" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker></defs><text x="560.0" y="34" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Usage policy: three tiers</text><rect x="60" y="80" width="300" height="260" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="210.0" y="110" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">Allowed</text><text x="210.0" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">general Q&amp;A</text><text x="210.0" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">coding help</text><text x="210.0" y="180" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">summarization</text><rect x="400" y="80" width="300" height="260" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="550.0" y="110" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">Restricted</text><text x="550.0" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">medical, legal, financial</text><text x="550.0" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">advice + disclaimer</text><text x="550.0" y="180" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">human review advised</text><rect x="740" y="80" width="300" height="260" rx="10" fill="#F2F4F7" stroke="#B42318" stroke-width="1.5"/><text x="890.0" y="110" font-size="15" fill="#B42318" text-anchor="middle" font-weight="700">Prohibited</text><text x="890.0" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">weapons, cyberattacks</text><text x="890.0" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">CSAM, hate, fraud</text><text x="890.0" y="180" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">refuse, do not lecture</text><text x="560.0" y="406" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">Know which tier an ask falls in before you design the refusal.</text></svg>