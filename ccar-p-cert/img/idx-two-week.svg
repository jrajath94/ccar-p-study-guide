<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="560" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="558" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">The 2-week intensive plan: 60 hours, 4+ per day</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Week 1 builds judgment. Week 2 calibrates and hardens.</text>
<rect x="40" y="96" width="820" height="200" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="450" y="128" text-anchor="middle" font-size="15" fill="#1e40af" font-weight="bold">WEEK 1: BUILD JUDGMENT (days 1-7)</text>
<text x="70" y="162" text-anchor="start" font-size="12" fill="#1e293b">Day 1: Exam Guide + self-assessment + mistake log</text>
<text x="70" y="184" text-anchor="start" font-size="12" fill="#1e293b">Day 2: D1 patterns (augmented vs workflow vs agent)</text>
<text x="70" y="206" text-anchor="start" font-size="12" fill="#1e293b">Day 3: D2 model selection + caching experiment</text>
<text x="70" y="228" text-anchor="start" font-size="12" fill="#1e293b">Day 4-5: D3 RAG, then MCP and auth</text>
<text x="70" y="250" text-anchor="start" font-size="12" fill="#1e293b">Day 6: D4 eval harness + A/B setup</text>
<text x="70" y="272" text-anchor="start" font-size="12" fill="#1e293b">Day 7: timed mock 1, tag every miss</text>
<rect x="40" y="316" width="820" height="200" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="450" y="348" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">WEEK 2: CALIBRATE AND HARDEN (days 8-14)</text>
<text x="70" y="382" text-anchor="start" font-size="12" fill="#1e293b">Day 8: D5 guardrails + compliance constraints</text>
<text x="70" y="404" text-anchor="start" font-size="12" fill="#1e293b">Day 9: D6 stakeholder doc + feasibility verdict</text>
<text x="70" y="426" text-anchor="start" font-size="12" fill="#1e293b">Day 10: D7 + attack your two lowest domains</text>
<text x="70" y="448" text-anchor="start" font-size="12" fill="#1e293b">Day 11: timed mock 2, name the trap per miss</text>
<text x="70" y="470" text-anchor="start" font-size="12" fill="#1e293b">Day 12: reading drills (last sentence first)</text>
<text x="70" y="492" text-anchor="start" font-size="12" fill="#1e293b">Day 13: timed mock 3, full dress rehearsal</text>
</svg>
