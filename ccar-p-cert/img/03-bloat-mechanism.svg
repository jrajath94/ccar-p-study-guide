<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Three mechanisms punish bloat: the exam uses all three</text><rect x="30" y="70" width="340" height="380" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="100" font-size="14.5" fill="#B42318" text-anchor="middle" font-weight="700">1. TOKEN TAX ON EVERY TURN</text><text x="200.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">tool schemas travel in the system</text><text x="200.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">prompt of every request;</text><text x="200.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">200-500 tokens per schema;</text><text x="200.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">50 tools = 10,000-25,000 tokens</text><text x="200.0" y="206" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">on every single turn</text><rect x="393" y="70" width="340" height="380" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="100" font-size="14.5" fill="#A15C07" text-anchor="middle" font-weight="700">2. DECISION QUALITY FALLS</text><text x="563.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">tool selection is classification</text><text x="563.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">over the tool list;</text><text x="563.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">12 well-named tools: picked right</text><text x="563.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">almost every time;</text><text x="563.0" y="206" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">50 tools: wrong tool more often</text><rect x="756" y="70" width="340" height="380" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="100" font-size="14.5" fill="#0E7C7B" text-anchor="middle" font-weight="700">3. ATTACK SURFACE GROWS</text><text x="926.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">breaches come through tools</text><text x="926.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">granted too much and used</text><text x="926.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">too rarely to be noticed;</text><text x="926.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">least privilege is the fix</text></svg>