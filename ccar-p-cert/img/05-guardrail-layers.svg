<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="540" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Layered guardrails: each catches what the others miss</text><rect x="20" y="70" width="256" height="390" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="148.0" y="100" font-size="13.5" fill="#1F5FBF" text-anchor="middle" font-weight="700">INPUT FILTERING</text><text x="148.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">prompt scanned before the model:</text><text x="148.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">injection detectors, PII redaction,</text><text x="148.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">jailbreak patterns, rate limits</text><rect x="292" y="70" width="256" height="390" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="420.0" y="100" font-size="13.5" fill="#0E7C7B" text-anchor="middle" font-weight="700">CLASSIFIER GATES</text><text x="420.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">small fast classifier scores</text><text x="420.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">input and output: toxicity,</text><text x="420.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">self-harm, disallowed advice;</text><text x="420.0" y="180" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">probabilistic, cheap</text><rect x="564" y="70" width="256" height="390" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="692.0" y="100" font-size="13.5" fill="#A15C07" text-anchor="middle" font-weight="700">OUTPUT GUARDRAILS</text><text x="692.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">response scanned before the app:</text><text x="692.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">sensitive data, hallucinations,</text><text x="692.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">toxic language</text><rect x="836" y="70" width="256" height="390" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="964.0" y="100" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="700">HUMAN REVIEW</text><text x="964.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">people catch what machines miss;</text><text x="964.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">review-before-release for the</text><text x="964.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">irreversible actions</text><line x1="276" y1="265" x2="292" y2="265" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="548" y1="265" x2="564" y2="265" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="820" y1="265" x2="836" y2="265" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="526" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">An input filter cannot catch a hallucination. An output filter cannot stop an injection.</text></svg>