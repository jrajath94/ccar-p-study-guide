<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1A7F37"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A15C07"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0E7C7B"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B3FA0"/></marker></defs><text x="560" y="38" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Year-one math: the SLA is what protects the ROI</text><rect x="60" y="80" width="560" height="44" rx="6" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="68" y="107.0" font-size="13" fill="#24292F" text-anchor="start" font-weight="600">build: 3 engineer-weeks</text><text x="612" y="107.0" font-size="13" fill="#1F5FBF" text-anchor="end" font-weight="700">$30,000</text><rect x="60" y="140" width="300" height="44" rx="6" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="68" y="167.0" font-size="13" fill="#24292F" text-anchor="start" font-weight="600">run: 600 tickets/day</text><text x="352" y="167.0" font-size="13" fill="#1F5FBF" text-anchor="end" font-weight="700">$3,100/yr</text><rect x="60" y="200" width="380" height="44" rx="6" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="68" y="227.0" font-size="13" fill="#24292F" text-anchor="start" font-weight="600">maintenance + weekly eval</text><text x="432" y="227.0" font-size="13" fill="#1F5FBF" text-anchor="end" font-weight="700">$8,000/yr</text><text x="340" y="290" font-size="15" fill="#24292F" text-anchor="middle" font-weight="700">year-one total: about $41,000</text><rect x="60" y="330" width="700" height="44" rx="6" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="68" y="357.0" font-size="13" fill="#24292F" text-anchor="start" font-weight="600">value: 9.6 human-hours saved daily</text><text x="752" y="357.0" font-size="13" fill="#1A7F37" text-anchor="end" font-weight="700">$62,000/yr</text><text x="560" y="430" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">holds only at 92%+ routing accuracy: below it, misroutes eat the savings into rework</text></svg>