<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="440" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="438" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">D7 settings: which layer wins</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Enforcement at the top, personal preference at the bottom.</text>
<rect x="40" y="100" width="150" height="66" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="115" y="140" text-anchor="middle" font-size="14" fill="#991b1b" font-weight="bold">MANAGED</text>
<rect x="200" y="100" width="660" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="220" y="127" text-anchor="start" font-size="13" fill="#1e293b">fleet-wide enforcement (rollout deny lists, allowed servers)</text>
<text x="220" y="149" text-anchor="start" font-size="12" fill="#64748b">beats everything</text>
<rect x="40" y="178" width="150" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
<text x="115" y="218" text-anchor="middle" font-size="14" fill="#5b21b6" font-weight="bold">PROJECT</text>
<rect x="200" y="178" width="660" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="220" y="205" text-anchor="start" font-size="13" fill="#1e293b">committed team config: CLAUDE.md, project MCP servers, hooks</text>
<text x="220" y="227" text-anchor="start" font-size="12" fill="#64748b">beats local and user</text>
<rect x="40" y="256" width="150" height="66" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="115" y="296" text-anchor="middle" font-size="14" fill="#1e40af" font-weight="bold">LOCAL</text>
<rect x="200" y="256" width="660" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="220" y="283" text-anchor="start" font-size="13" fill="#1e293b">this checkout only, never committed</text>
<text x="220" y="305" text-anchor="start" font-size="12" fill="#64748b">beats user</text>
<rect x="40" y="334" width="150" height="66" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="115" y="374" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="bold">USER</text>
<rect x="200" y="334" width="660" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="220" y="361" text-anchor="start" font-size="13" fill="#1e293b">your personal preferences</text>
<text x="220" y="383" text-anchor="start" font-size="12" fill="#64748b">loses to everything above</text>
<text x="450.0" y="414" text-anchor="middle" font-size="12" fill="#94a3b8">A secret in project scope must live in an env var, never in the file.</text>
</svg>
