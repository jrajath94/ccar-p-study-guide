 text-anchor="middle" font-weight="400">step 3</text><line x1="648" y1="175" x2="678" y2="175" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="678" y="130" width="186" height="90" rx="8" fill="#FFFFFF" stroke="#5C6570" stroke-width="1.4"/><text x="771.0" y="169.0" font-size="14" fill="#24292F" text-anchor="middle" font-weight="700">Handoff</text><text x="771.0" y="191.0" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="400">step 4</text><line x1="864" y1="175" x2="894" y2="175" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="894" y="130" width="186" height="90" rx="8" fill="#FFFFFF" stroke="#5C6570" stroke-width="1.4"/><text x="987.0" y="169.0" font-size="14" fill="#24292F" text-anchor="middle" font-weight="700">Monitoring</text><text x="987.0" y="191.0" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="400">step 5</text><text x="560" y="300" font-size="14" fill="#B42318" text-anchor="middle" font-weight="600">Jumped from discovery to documentation? The right answer goes back to the decision.</text><text x="560.0" y="406" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">A team that jumps ahead must go back and do the skipped step.</text></svg>