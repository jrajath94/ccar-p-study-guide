<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="475" viewBox="0 0 1120 475" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="475" fill="#FFFFFF"/><text x="60" y="50" font-size="17" fill="#1F5FBF" text-anchor="start" font-weight="600">Availability SLA: 99.9% (is it up?)</text><rect x="60" y="70" width="1000" height="44" rx="8" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><rect x="60" y="70" width="4" height="44" rx="2" fill="#C0392B"/><text x="560" y="145" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">Downtime budget: 43 minutes per month. After that, the SLA is breached.</text><text x="60" y="200" font-size="17" fill="#A15C07" text-anchor="start" font-weight="600">Quality SLA: 95% correct (is it right?)</text><rect x="60" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="110" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="160" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="210" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="260" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="310" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="360" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="410" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="460" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="510" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="560" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="610" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="660" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="710" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="760" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="810" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="860" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="910" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="960" y="220" width="42" height="44" rx="6" fill="#2F7D32"/><rect x="1010" y="220" width="42" height="44" rx="6" fill="#C0392B"/><text x="560" y="295" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">1,000 sampled outputs per week. At most 50 may be wrong. One red cell = 50 wrong outputs.</text><rect x="60" y="330" width="1000" height="120" rx="10" fill="#FFFFFF" stroke="#163D7A" stroke-width="1.5"/><text x="560" y="366" font-size="16" fill="#163D7A" text-anchor="middle" font-weight="600">The contract needs both, measured separately</text><text x="560" y="400" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Availability is measured by uptime monitors. Quality is measured by human-graded eval samples.</text><text x="560" y="428" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">An availability SLA never covers quality. Promise only what you measure.</text></svg>