<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="498" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">How to read a question item</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Four labeled parts. Read them in this order, every time.</text>
<circle cx="90" cy="130" r="14" fill="#2563eb" opacity="0.15"/>
<text x="90" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">1</text>
<rect x="130" y="100" width="700" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="480.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">Scenario</text>
<text x="480.0" y="146" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">the story: who, what system, what happened</text>
<circle cx="90" cy="210" r="14" fill="#d97706" opacity="0.15"/>
<text x="90" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#d97706">2</text>
<rect x="130" y="180" width="700" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="480.0" y="204" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#d97706">Constraint</text>
<text x="480.0" y="226" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">the scoring key: must / must never / at 2am</text>
<circle cx="90" cy="290" r="14" fill="#16a34a" opacity="0.15"/>
<text x="90" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">3</text>
<rect x="130" y="260" width="700" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="480.0" y="284" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16a34a">Ask</text>
<text x="480.0" y="306" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">the exact question - first step? best control?</text>
<circle cx="90" cy="370" r="14" fill="#7c3aed" opacity="0.15"/>
<text x="90" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c3aed">4</text>
<rect x="130" y="340" width="700" height="60" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="480.0" y="364" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c3aed">Options</text>
<text x="480.0" y="386" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">A-D: eliminate against the constraint</text>
<text x="450.0" y="450" text-anchor="middle" font-size="13" font-weight="normal" fill="#64748b">Skipping the constraint box is the most expensive mistake in the bank.</text>
</svg>