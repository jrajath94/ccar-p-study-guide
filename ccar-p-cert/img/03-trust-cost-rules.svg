<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Two rules govern every tool integration from here on</text><rect x="40" y="70" width="510" height="360" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="295" y="102" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">THE TRUST RULE</text><text x="295" y="130" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">treat everything the model emits as untrusted input</text><text x="295" y="175" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">validate arguments against the schema</text><text x="295" y="207" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">before executing</text><text x="295" y="239" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">run tools with least privilege</text><text x="295" y="271" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">a tool result must never issue</text><text x="295" y="303" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">instructions to the agent</text><text x="295" y="335" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">(that failure is prompt injection)</text><rect x="570" y="70" width="510" height="360" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="825" y="102" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">THE COST RULE</text><text x="825" y="130" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">every tool taxes every future turn</text><text x="825" y="175" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">tool schemas ride in the system</text><text x="825" y="207" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">prompt of every request</text><text x="825" y="239" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">each declared tool is re-sent</text><text x="825" y="271" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">on every turn of the loop,</text><text x="825" y="303" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">called or not</text><text x="560.0" y="486" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">The trust rule protects you. The cost rule bills you. The next unit measures the tax.</text></svg>