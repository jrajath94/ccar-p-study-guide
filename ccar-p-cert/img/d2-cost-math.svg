<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Agent cost math: the loop multiplies everything</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">One turn is cheap. Ten turns with tool results is a different bill.</text>
<rect x="40" y="100" width="820" height="150" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="450" y="140" text-anchor="middle" font-size="14" fill="#1e293b">cost/turn = input tokens x price + output tokens x ~5x price</text>
<text x="450" y="172" text-anchor="middle" font-size="14" fill="#1e293b">cost/task = cost/turn x turns x (1 + tool-result overhead)</text>
<text x="450" y="212" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="bold">example: $0.02/turn x 8 turns = $0.16 per task; 10k tasks/day = $48k/month</text>
<text x="450" y="310" text-anchor="middle" font-size="13" fill="#64748b">Levers: cap MAX_TURNS, route easy tasks down, cache the system prompt, discipline output.</text>
</svg>
