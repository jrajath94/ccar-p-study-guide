<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker></defs><text x="560.0" y="34" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Revisit triggers: the calendar version of the loop</text><rect x="60" y="80" width="300" height="240" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="210.0" y="110" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">New model generation</text><text x="210.0" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">re-run the eval set</text><text x="210.0" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">re-check the trade-offs</text><rect x="400" y="80" width="300" height="240" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="550.0" y="110" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">Cost doubles</text><text x="550.0" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">re-open the budget</text><text x="550.0" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">cheaper tier or cache more</text><rect x="740" y="80" width="300" height="240" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="890.0" y="110" font-size="15" fill="#0E7C7B" text-anch