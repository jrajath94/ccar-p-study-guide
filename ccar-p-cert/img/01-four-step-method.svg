<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><rect x="20" y="60" width="245" height="220" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="142.5" y="90" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">1. Find the expensive loop</text><text x="142.5" y="118" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">repetition, backlogs,</text><text x="142.5" y="138" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">priced errors</text><text x="142.5" y="157" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Artifact: the loop to automate</text><rect x="287" y="60" width="245" height="220" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="409.5" y="90" font-size="15" fill="#0E7C7B" text-anchor="middle" font-weight="700">2. Write the success number</text><text x="409.5" y="118" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">baseline + target</text><text x="409.5" y="138" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">+ measurement instrument</text><text x="409.5" y="157" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Artifact: the number</text><rect x="554" y="60" width="245" height="220" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="676.5" y="90" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">3. Find the decision points</text><text x="676.5" y="118" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">judgment moments =</text><text x="676.5" y="138" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">model territory; rest = code</text><text x="676.5" y="157" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Artifact: the judgment map</text><rect x="821" y="60" width="245" height="220" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="943.5" y="90" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">4. Test &quot;AI-shaped?&quot;</text><text x="943.5" y="118" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">messy input? no if-statement?</text><text x="943.5" y="138" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">checkable cost? verifier?</text><text x="943.5" y="157" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Artifact: go / no-go</text><line x1="265" y1="170" x2="287" y2="170" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="532" y1="170" x2="554" y2="170" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="799" y1="170" x2="821" y2="170" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The translation method: four steps, in order, each producing one artifact</text><text x="560.0" y="386" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">Skip a step and the design rests on a slogan. The instrument in step 2 is what turns a target into a promise.</text></svg>