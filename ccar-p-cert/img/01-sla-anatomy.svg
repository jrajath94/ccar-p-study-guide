<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="480" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">A serious SLA has five parts: miss one and the promise is unenforceable</text><rect x="24" y="70" width="200" height="330" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="124.0" y="100" font-size="14" fill="#1F5FBF" text-anchor="middle" font-weight="700">1. METRIC</text><text x="124.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">accuracy, latency,</text><text x="124.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">availability, cost per unit</text><text x="124.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="124.0" y="180" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">&quot;routing accuracy&quot; =</text><text x="124.0" y="198" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">fraction the reviewer</text><text x="124.0" y="216" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">agrees was routed right</text><rect x="240" y="70" width="200" height="330" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="340.0" y="100" font-size="14" fill="#0E7C7B" text-anchor="middle" font-weight="700">2. THRESHOLD</text><text x="340.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">the number</text><text x="340.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="340.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">&quot;at least 92%&quot;;</text><text x="340.0" y="180" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">&quot;p95 under 5 seconds&quot;;</text><text x="340.0" y="198" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">never &quot;fast&quot;</text><rect x="456" y="70" width="200" height="330" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="556.0" y="100" font-size="14" fill="#B42318" text-anchor="middle" font-weight="700">3. SEGMENT</text><text x="556.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">per segment,</text><text x="556.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">not just overall</text><text x="556.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="556.0" y="180" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">the exam&#x27;s favorite trap:</text><text x="556.0" y="198" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">96% overall can hide</text><text x="556.0" y="216" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">one type at 80%</text><rect x="672" y="70" width="200" height="330" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="772.0" y="100" font-size="14" fill="#A15C07" text-anchor="middle" font-weight="700">4. METHOD</text><text x="772.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">how you check, how often,</text><text x="772.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">on what sample</text><text x="772.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="772.0" y="180" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">&quot;weekly, on 200 tickets,</text><text x="772.0" y="198" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">double-reviewed&quot;</text><rect x="888" y="70" width="200" height="330" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="988.0" y="100" font-size="14" fill="#1A7F37" text-anchor="middle" font-weight="700">5. CONSEQUENCE</text><text x="988.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">what happens on a miss:</text><text x="988.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">rollback, page,</text><text x="988.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">fall back, credit</text><text x="560.0" y="466" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">A metric without a method is a rumor. A threshold without a segment is a trap.</text></svg>