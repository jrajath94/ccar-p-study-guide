<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="440" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="438" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Tool schema anatomy: what the model actually sees</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">The description is the advertisement. Write it for the model, not for yourself.</text>
<rect x="150" y="100" width="600" height="250" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="450" y="132" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="bold">TOOL: file_ticket</text>
<text x="190" y="162" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">name:</text>
<text x="330" y="162" text-anchor="start" font-size="12" fill="#64748b">"file_ticket": one verb, one noun</text>
<text x="190" y="206" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">description:</text>
<text x="330" y="206" text-anchor="start" font-size="12" fill="#64748b">"Files a support ticket. Use when the issue needs tracking."</text>
<text x="190" y="250" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">input_schema:</text>
<text x="330" y="250" text-anchor="start" font-size="12" fill="#64748b">JSON Schema: order_id (string, required), priority (enum)</text>
<text x="190" y="294" text-anchor="start" font-size="13" fill="#2563eb" font-weight="bold">returns:</text>
<text x="330" y="294" text-anchor="start" font-size="12" fill="#64748b">result dict with is_error: the loop reads the field</text>
<text x="450.0" y="394" text-anchor="middle" font-size="12" fill="#94a3b8">Instructive errors in the return: name the problem and the next step.</text>
</svg>
