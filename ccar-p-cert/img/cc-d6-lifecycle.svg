<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Six phases, then the loop turns again</text>
  <g font-size="14">
    <rect x="30" y="70" width="120" height="56" rx="28" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="90" y="103" text-anchor="middle" font-weight="bold" fill="#1e40af">1 discover</text>
    <text x="172" y="103" font-size="20" fill="#64748b">&#8594;</text>
    <rect x="196" y="70" width="120" height="56" rx="28" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="256" y="103" text-anchor="middle" font-weight="bold" fill="#1e293b">2 design</text>
    <text x="338" y="103" font-size="20" fill="#64748b">&#8594;</text>
    <rect x="362" y="70" width="120" height="56" rx="28" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="422" y="103" text-anchor="middle" font-weight="bold" fill="#1e293b">3 build</text>
    <text x="504" y="103" font-size="20" fill="#64748b">&#8594;</text>
    <rect x="528" y="70" width="120" height="56" rx="28" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="588" y="103" text-anchor="middle" font-weight="bold" fill="#1e293b">4 hand off</text>
    <text x="588" y="160" font-size="22" fill="#64748b">&#8595;</text>
    <rect x="528" y="186" width="120" height="56" rx="28" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="588" y="219" text-anchor="middle" font-weight="bold" fill="#1e293b">6 iterate</text>
    <text x="504" y="219" font-size="20" fill="#64748b">&#8592;</text>
    <rect x="362" y="186" width="120" height="56" rx="28" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="422" y="219" text-anchor="middle" font-weight="bold" fill="#1e293b">5 monitor</text>
    <text x="200" y="270" font-size="20" fill="#64748b">&#8629;</text>
    <text x="120" y="292" font-size="13.5" fill="#475569">the eval set steers every loop:</text>
    <text x="120" y="312" font-size="13.5" fill="#475569">iterate on measured results, not opinions</text>
  </g>
  <rect x="230" y="252" width="400" height="62" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="430" y="276" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#78350f">Discovery fills five buckets first: success metrics, constraints,</text>
  <text x="430" y="296" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#78350f">data reality, risk tolerance, decision rights.</text>
</svg>
