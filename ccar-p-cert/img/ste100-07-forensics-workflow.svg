<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="480" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="478" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Debugging production Claude systems: trace forensics</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">No debugger exists for a conversation. The trace is the debugger.</text>
<rect x="35" y="100" width="195" height="210" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="132.5" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2563eb">1. Correlation ID</text>
<text x="132.5" y="146" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">tie every span</text>
<text x="132.5" y="165" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">to one run</text>
<rect x="250" y="100" width="195" height="210" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="347.5" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#16a34a">2. Stop reasons</text>
<text x="347.5" y="146" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">why the model</text>
<text x="347.5" y="165" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">stopped, not just</text>
<text x="347.5" y="184" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">that it stopped</text>
<rect x="465" y="100" width="195" height="210" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="562.5" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d97706">3. Tool pairs</text>
<text x="562.5" y="146" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">inspect tool_use /</text>
<text x="562.5" y="165" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">tool_result pairs -</text>
<text x="562.5" y="184" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">most bugs live here</text>
<rect x="680" y="100" width="195" height="210" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="777.5" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c3aed">4. Frozen replay</text>
<text x="777.5" y="146" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">re-run the exact</text>
<text x="777.5" y="165" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">inputs: same model,</text>
<text x="777.5" y="184" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">same prompt, same</text>
<text x="777.5" y="203" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">tool versions</text>
<line x1="230" y1="205" x2="250" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="445" y1="205" x2="465" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="660" y1="205" x2="680" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="230" y="350" width="440" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="450.0" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">The credited answer first checks</text>
<text x="450.0" y="396" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">the tool definitions and their recent change history (schema drift),</text>
<text x="450.0" y="415" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">then the tool results - before touching the prompt at all</text>
</svg>