<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="440" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Why decompose: the three enemies of one giant call</text><rect x="30" y="70" width="340" height="240" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="100" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">CONTEXT DILUTION</text><text x="200.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">long input: attention thins,</text><text x="200.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">the middle gets lost</text><text x="200.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">130K contract in one call =</text><text x="200.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">worse judgment per clause</text><rect x="390" y="70" width="340" height="240" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="560.0" y="100" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">ERROR COMPOUNDING</text><text x="560.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">one big call: an early misread</text><text x="560.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">poisons everything downstream,</text><text x="560.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">no checkpoint to catch it</text><rect x="750" y="70" width="340" height="240" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="920.0" y="100" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">INSTRUCTION OVERLOAD</text><text x="920.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">five jobs in one prompt:</text><text x="920.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">extract, flag, summarize,</text><text x="920.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">check, draft: each done worse</text><rect x="260" y="340" width="600" height="60" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="560" y="368" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">The decomposition principle</text><text x="560" y="392" font-size="14" fill="#24292F" text-anchor="middle" font-weight="600">one call, one decision, one checkable output</text></svg>