<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The system prompt: the model&#x27;s standing orders, sent with every request</text><rect x="60" y="70" width="440" height="360" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="280" y="102" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">system field</text><text x="280" y="126" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="400">dedicated field, stable across turns</text><rect x="90" y="150" width="380" height="62" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="280" y="176" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="700">who it is</text><text x="280" y="198" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="400">role and identity</text><rect x="90" y="222" width="380" height="62" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="280" y="248" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="700">what job it does</text><text x="280" y="270" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="400">the mission</text><rect x="90" y="294" width="380" height="62" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="280" y="320" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="700">what rules it follows</text><text x="280" y="342" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="400">policies, refusals</text><rect x="90" y="366" width="380" height="62" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="280" y="392" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="700">what answers look like</text><text x="280" y="414" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="400">format, tone</text><rect x="620" y="70" width="440" height="360" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="840" y="102" font-size="15" fill="#5C6570" text-anchor="middle" font-weight="700">messages list</text><text x="840" y="126" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="400">user and assistant turns</text><text x="840" y="200" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">the user never sees the</text><text x="840" y="221" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">system prompt, but it</text><text x="840" y="242" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">shapes every response</text><text x="840" y="300" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">why it exists: without it you</text><text x="840" y="320" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">would paste the same</text><text x="840" y="340" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">instructions into every message</text><text x="840" y="380" font-size="14" fill="#1A7F37" text-anchor="middle" font-weight="700">one versioned place</text><text x="840" y="402" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">for the constants</text></svg>