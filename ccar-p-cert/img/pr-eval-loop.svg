<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">The eval loop: the delta is the truth</text>
  <g font-size="13.5">
    <rect x="30" y="70" width="135" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="97" y="96" text-anchor="middle" font-weight="bold" fill="#1e40af">1 draft</text>
    <text x="97" y="118" text-anchor="middle" fill="#475569">the prompt</text>
    <text x="177" y="110" font-size="22" fill="#64748b">&#8594;</text>
    <rect x="201" y="70" width="135" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="268" y="96" text-anchor="middle" font-weight="bold" fill="#1e40af">2 build</text>
    <text x="268" y="118" text-anchor="middle" fill="#475569">dataset: inputs +</text>
    <text x="268" y="136" text-anchor="middle" fill="#475569">known-good outputs</text>
    <text x="348" y="110" font-size="22" fill="#64748b">&#8594;</text>
    <rect x="372" y="70" width="135" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="439" y="96" text-anchor="middle" font-weight="bold" fill="#1e40af">3 run</text>
    <text x="439" y="118" text-anchor="middle" fill="#475569">over the dataset</text>
    <text x="439" y="136" text-anchor="middle" fill="#475569">(Batches: half price)</text>
    <text x="519" y="110" font-size="22" fill="#64748b">&#8594;</text>
    <rect x="543" y="70" width="117" height="70" rx="10" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
    <text x="601" y="96" text-anchor="middle" font-weight="bold" fill="#064e3b">4 score</text>
    <text x="601" y="118" text-anchor="middle" fill="#475569">e.g. 82% &#8594; 91%</text>
  </g>
  <path d="M 601 140 C 601 200, 97 200, 97 150" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="196" text-anchor="middle" font-size="13.5" fill="#475569">change the prompt, run again, compare the delta</text>
  <rect x="60" y="218" width="560" height="66" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="340" y="244" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#78350f">Score with deterministic checks first (exact match, JSON parses),</text>
  <text x="340" y="266" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#78350f">then a model grader for the fuzzy parts. 50 to a few hundred examples beats vibes.</text>
</svg>
