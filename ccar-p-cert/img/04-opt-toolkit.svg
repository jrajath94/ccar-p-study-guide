<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="560" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Apply optimizations in this order; re-measure on evals between steps</text><rect x="20" y="70" width="200" height="400" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="120.0" y="100" font-size="12.5" fill="#1F5FBF" text-anchor="middle" font-weight="700">1. PROMPT CACHING</text><text x="120.0" y="128" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">near-free if prefixes repeat;</text><text x="120.0" y="145" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">check the trap: unique prefixes</text><text x="120.0" y="162" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">per request kill it</text><rect x="236" y="70" width="200" height="400" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="336.0" y="100" font-size="12.5" fill="#0E7C7B" text-anchor="middle" font-weight="700">2. OUTPUT + RETRIEVAL</text><text x="336.0" y="128" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">shorter outputs, right-sized</text><text x="336.0" y="145" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">retrieval; quality-neutral</text><text x="336.0" y="162" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">savings first</text><rect x="452" y="70" width="200" height="400" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="552.0" y="100" font-size="12.5" fill="#A15C07" text-anchor="middle" font-weight="700">3. MODEL ROUTING</text><text x="552.0" y="128" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">70-80% of traffic is easy;</text><text x="552.0" y="145" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">small model there cuts the bill</text><text x="552.0" y="162" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">in half or more</text><rect x="668" y="70" width="200" height="400" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="768.0" y="100" font-size="12.5" fill="#1A7F37" text-anchor="middle" font-weight="700">4. BATCHING</text><text x="768.0" y="128" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">non-urgent work at roughly</text><text x="768.0" y="145" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">half price, up to 24h turnaround;</text><text x="768.0" y="162" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">delay must be tolerated</text><rect x="884" y="70" width="200" height="400" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="984.0" y="100" font-size="12.5" fill="#B42318" text-anchor="middle" font-weight="700">5. MODEL DOWNGRADE</text><text x="984.0" y="128" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">last resort, validated on evals;</text><text x="984.0" y="145" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">never jump here first</text><text x="984.0" y="162" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="560.0" y="546" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">&quot;Optimization means the cheapest model&quot; is a distractor. A cheap model with a 30% retry rate can cost more than an expensive one that nails it first try.</text></svg>