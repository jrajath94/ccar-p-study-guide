<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="440" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="438" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">MCP anatomy: host, client, server</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Three roles. The host owns the policy, the server owns the tools.</text>
<rect x="40" y="110" width="240" height="170" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="160" y="150" text-anchor="middle" font-size="16" fill="#1e40af" font-weight="bold">HOST</text>
<text x="160" y="178" text-anchor="middle" font-size="12" fill="#64748b">Claude Code, your app</text>
<text x="160" y="202" text-anchor="middle" font-size="12" fill="#64748b">owns permissions</text>
<text x="160" y="224" text-anchor="middle" font-size="12" fill="#64748b">and approvals</text>
<rect x="330" y="110" width="240" height="170" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
<text x="450" y="150" text-anchor="middle" font-size="16" fill="#5b21b6" font-weight="bold">CLIENT</text>
<text x="450" y="178" text-anchor="middle" font-size="12" fill="#64748b">one per server</text>
<text x="450" y="202" text-anchor="middle" font-size="12" fill="#64748b">holds the connection</text>
<text x="450" y="224" text-anchor="middle" font-size="12" fill="#64748b">negotiates capabilities</text>
<rect x="620" y="110" width="240" height="170" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="740" y="150" text-anchor="middle" font-size="16" fill="#166534" font-weight="bold">SERVER</text>
<text x="740" y="178" text-anchor="middle" font-size="12" fill="#64748b">CRM, billing, docs</text>
<text x="740" y="202" text-anchor="middle" font-size="12" fill="#64748b">exposes tools</text>
<text x="740" y="224" text-anchor="middle" font-size="12" fill="#64748b">and resources</text>
<line x1="280" y1="195" x2="330" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="570" y1="195" x2="620" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<text x="450.0" y="380" text-anchor="middle" font-size="12" fill="#94a3b8">Trust boundary: the server never decides what the host may call.</text>
</svg>
