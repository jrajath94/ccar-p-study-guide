<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Constitutional AI: two training phases</text><rect x="60" y="70" width="490" height="360" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="305" y="102" font-size="13.5" fill="#1F5FBF" text-anchor="middle" font-weight="700">PHASE 1: SUPERVISED CRITIQUE + REVISION</text><text x="305" y="150" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">model generates a response</text><text x="305" y="182" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">then critiques its own draft against</text><text x="305" y="214" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">the constitution&#x27;s principles</text><text x="305" y="246" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">&quot;this draft is evasive; the constitution</text><text x="305" y="278" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">asks for honesty&quot;</text><text x="305" y="310" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">revision pairs become supervised data</text><text x="305" y="342" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">key: feedback is AI feedback,</text><text x="305" y="374" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">not human-written answers</text><rect x="570" y="70" width="490" height="360" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="815" y="102" font-size="13.5" fill="#0E7C7B" text-anchor="middle" font-weight="700">PHASE 2: PREFERENCE LEARNING (RLAIF)</text><text x="815" y="150" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">model generates pairs of responses</text><text x="815" y="182" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">then judges which better follows</text><text x="815" y="214" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">the constitution</text><text x="815" y="246" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">a preference model trains on those</text><text x="815" y="278" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">judgments</text><text x="815" y="310" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">then RL tunes the policy toward</text><text x="815" y="342" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">the preferred style</text><line x1="550" y1="250" x2="570" y2="250" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/></svg>