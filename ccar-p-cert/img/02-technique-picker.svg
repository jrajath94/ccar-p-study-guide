<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Match the technique to the task, not to habit</text><rect x="360" y="60" width="400" height="60" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="560" y="88" font-size="15" fill="#24292F" text-anchor="middle" font-weight="700">Look at the task</text><text x="560" y="110" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">what does it actually demand?</text><line x1="560" y1="120" x2="560" y2="158" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="194" y1="158" x2="920" y2="158" stroke="#5C6570" stroke-width="2"/><line x1="194" y1="158" x2="194" y2="213" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="24" y="215" width="340" height="230" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="194.0" y="245" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">ZERO-SHOT</text><text x="194.0" y="273" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">task is clear, pattern known</text><text x="194.0" y="293" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">cheapest: try this first</text><text x="194.0" y="312" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">classification, extraction,</text><text x="194.0" y="332" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">simple rewrites</text><line x1="557" y1="158" x2="557" y2="213" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="387" y="215" width="340" height="230" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="557.0" y="245" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">FEW-SHOT</text><text x="557.0" y="273" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">format or judgment non-obvious</text><text x="557.0" y="293" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">2-5 examples do it</text><text x="557.0" y="312" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">house style, edge-case rules,</text><text x="557.0" y="332" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">strict schemas</text><line x1="920" y1="158" x2="920" y2="213" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="750" y="215" width="340" height="230" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="920.0" y="245" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">CHAIN-OF-THOUGHT</text><text x="920.0" y="273" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">needs multi-step reasoning</text><text x="920.0" y="293" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">biggest quality gains</text><text x="920.0" y="312" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">math, planning, debugging,</text><text x="920.0" y="332" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">trade-off comparisons</text><text x="560.0" y="506" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">More examples have diminishing returns, and each one costs input tokens on every request. Chain-of-thought is where Fable earns its price.</text></svg>