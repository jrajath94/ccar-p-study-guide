<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="480" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">MCP: the USB-C of agent tools</text><text x="560" y="70" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">a server advertises tools as JSON schemas; clients list them; the model calls; results flow back structured</text><rect x="40" y="110" width="240" height="170" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="160.0" y="140" font-size="14" fill="#1F5FBF" text-anchor="middle" font-weight="700">server advertises</text><text x="160.0" y="168" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">tools, resources, prompts</text><rect x="303" y="110" width="240" height="170" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="423.0" y="140" font-size="14" fill="#0E7C7B" text-anchor="middle" font-weight="700">client lists</text><text x="423.0" y="168" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">discovers what exists</text><rect x="566" y="110" width="240" height="170" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="686.0" y="140" font-size="14" fill="#A15C07" text-anchor="middle" font-weight="700">model calls</text><text x="686.0" y="168" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">arguments match schema</text><rect x="829" y="110" width="240" height="170" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="949.0" y="140" font-size="14" fill="#1A7F37" text-anchor="middle" font-weight="700">results return</text><text x="949.0" y="168" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">structured content</text><line x1="280" y1="195" x2="303" y2="195" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="543" y1="195" x2="566" y2="195" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="806" y1="195" x2="829" y2="195" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="320" width="490" height="110" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="305" y="350" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="700">transports</text><text x="305" y="378" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">STDIO: local subprocess, pipes, no auth needed</text><text x="305" y="402" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">Streamable HTTP: remote, HTTPS, real auth</text><rect x="570" y="320" width="490" height="110" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="815" y="350" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="700">messages travel as JSON-RPC</text><text x="815" y="378" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">resources: read-only data to subscribe to</text><text x="815" y="402" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">prompts: reusable templates</text></svg>