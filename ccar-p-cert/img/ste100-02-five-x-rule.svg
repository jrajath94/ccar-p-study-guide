<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="470" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1A7F37"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A15C07"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0E7C7B"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B3FA0"/></marker></defs><text x="560" y="38" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The 5x rule: output tokens cost five times input tokens, on every model</text><rect x="60" y="70" width="480" height="170" rx="10" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="300" y="98" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">INPUT TOKENS</text><text x="300" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">$2 per million (Sonnet)</text><text x="300" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">everything you send in</text><rect x="580" y="70" width="480" height="170" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/><text x="820" y="98" font-size="15" fill="#B42318" text-anchor="middle" font-weight="700">OUTPUT TOKENS</text><text x="820" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">$10 per million (Sonnet)</text><text x="820" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">everything the model writes</text><text x="560" y="130" font-size="28" fill="#B42318" text-anchor="middle" font-weight="700">5x</text><rect x="160" y="290" width="800" height="130" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="560" y="318" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">THE CONSEQUENCE</text><text x="560" y="342" font-size="13.5" fill="#24292F" text-anchor="middle">anything that makes the model write more costs 5x:</text><text x="560" y="363" font-size="13.5" fill="#24292F" text-anchor="middle">long answers, chain-of-thought, verbose formats</text></svg>