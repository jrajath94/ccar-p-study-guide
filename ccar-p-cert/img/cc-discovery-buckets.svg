<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="428" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">The five discovery buckets: fill before any architecture</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">A scenario that jumps to design with none of these is the skip-discovery trap.</text>
<rect x="30" y="110" width="160" height="116" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="110.0" y="142" text-anchor="middle" font-size="15" fill="#1e40af" font-weight="bold">Success metrics</text>
<text x="50" y="172" text-anchor="start" font-size="11" fill="#64748b">numbers with dates</text>
<text x="50" y="199" text-anchor="start" font-size="11" fill="#64748b">"under 2 min by Q3"</text>
<rect x="200" y="110" width="160" height="116" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="280.0" y="142" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">Constraints</text>
<text x="220" y="172" text-anchor="start" font-size="11" fill="#64748b">latency caps, cost ceilings</text>
<text x="220" y="199" text-anchor="start" font-size="11" fill="#64748b">compliance rules</text>
<rect x="370" y="110" width="160" height="116" rx="10" fill="#ccfbf1" stroke="#0d9488"/>
<text x="450.0" y="142" text-anchor="middle" font-size="15" fill="#115e59" font-weight="bold">Data reality</text>
<text x="390" y="172" text-anchor="start" font-size="11" fill="#64748b">what exists, who owns it</text>
<text x="390" y="199" text-anchor="start" font-size="11" fill="#64748b">how fresh it is</text>
<rect x="540" y="110" width="160" height="116" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="620.0" y="142" text-anchor="middle" font-size="15" fill="#92400e" font-weight="bold">Risk tolerance</text>
<text x="560" y="172" text-anchor="start" font-size="11" fill="#64748b">cost of a wrong answer</text>
<text x="560" y="199" text-anchor="start" font-size="11" fill="#64748b">sets review budget</text>
<rect x="710" y="110" width="160" height="116" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
<text x="790.0" y="142" text-anchor="middle" font-size="15" fill="#5b21b6" font-weight="bold">Decision rights</text>
<text x="730" y="172" text-anchor="start" font-size="11" fill="#64748b">named people</text>
<text x="730" y="199" text-anchor="start" font-size="11" fill="#64748b">who sign off</text>
<text x="450" y="380" text-anchor="middle" font-size="13" fill="#64748b">Stakeholders describe solutions ("we want RAG"). Dig for the problem behind them.</text>
</svg>
