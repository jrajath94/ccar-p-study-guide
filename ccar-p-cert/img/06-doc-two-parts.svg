<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Documentation has two parts: why and how</text><rect x="60" y="70" width="490" height="380" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="305" y="102" font-size="14" fill="#1F5FBF" text-anchor="middle" font-weight="700">DECISION RECORDS: WHY</text><text x="305" y="132" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">ADR: title, context, decision,</text><text x="305" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">consequences, status</text><text x="305" y="205" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">live with the code</text><text x="305" y="237" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">never deleted</text><text x="305" y="269" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">superseded, not edited, when</text><text x="305" y="301" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">the decision changes</text><rect x="570" y="70" width="490" height="380" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="815" y="102" font-size="14" fill="#0E7C7B" text-anchor="middle" font-weight="700">IMPLEMENTATION GUIDANCE: HOW</text><text x="815" y="132" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">enough detail to build without you</text><text x="815" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">in the room</text><text x="815" y="205" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">not so much it rots when</text><text x="815" y="237" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">the code changes</text><text x="815" y="269" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">runbook: deploy, monitor,</text><text x="815" y="301" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">what to do when each alert fires</text></svg>