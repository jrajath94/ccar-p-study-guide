<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="535" viewBox="0 0 1120 535" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="535" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#163D7A"/></marker></defs><text x="250" y="40" font-size="17" fill="#A15C07" text-anchor="middle" font-weight="600">Business language</text><text x="870" y="40" font-size="17" fill="#1F5FBF" text-anchor="middle" font-weight="600">Technical requirement</text><rect x="20" y="70" width="460" height="82" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="250" y="118" font-size="15" fill="#24292F" text-anchor="middle" font-weight="400">Lawyers take 45 min per contract</text><rect x="640" y="70" width="460" height="82" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="870" y="118" font-size="15" fill="#24292F" text-anchor="middle" font-weight="400">p95 extraction time under 30 s</text><line x1="490" y1="111" x2="630" y2="111" stroke="#163D7A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="20" y="175" width="460" height="82" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="250" y="223" font-size="15" fill="#24292F" text-anchor="middle" font-weight="400">Clause X must be right</text><rect x="640" y="175" width="460" height="82" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="870" y="223" font-size="15" fill="#24292F" text-anchor="middle" font-weight="400">at least 95% precision, 5 clause types</text><line x1="490" y1="216" x2="630" y2="216" stroke="#163D7A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="20" y="280" width="460" height="82" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="250" y="328" font-size="15" fill="#24292F" text-anchor="middle" font-weight="400">We cannot overspend</text><rect x="640" y="280" width="460" height="82" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="870" y="328" font-size="15" fill="#24292F" text-anchor="middle" font-weight="400">at most $0.40 per contract</text><line x1="490" y1="321" x2="630" y2="321" stroke="#163D7A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="20" y="385" width="460" height="82" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="250" y="433" font-size="15" fill="#24292F" text-anchor="middle" font-weight="400">Legal owns the final call</text><rect x="640" y="385" width="460" height="82" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="870" y="433" font-size="15" fill="#24292F" text-anchor="middle" font-weight="400">human review queue for low confidence</text><line x1="490" y1="426" x2="630" y2="426" stroke="#163D7A" stroke-width="2.5" marker-end="url(#ah)"/><text x="560" y="510" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">Translation is the architect's core move: every business sentence becomes a measurable requirement.</text></svg>