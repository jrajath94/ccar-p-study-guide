<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="408" viewBox="0 0 1120 408" font-family="Anthropic Sans, Inter, 'Source Sans 3', sans-serif"><rect x="0" y="0" width="1120" height="408" fill="#F7F4EE"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6B7A"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1E4D8C"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#1B2838">Retrieval is two stages</text><rect x="50" y="100" width="300" height="170" rx="10" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/><text x="200.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#1E4D8C">Stage 1: wide net</text><text x="200.0" y="157" font-size="13" text-anchor="middle" fill="#1B2838">dense vector search</text><text x="200.0" y="177" font-size="13" text-anchor="middle" fill="#1B2838">high recall</text><rect x="410" y="100" width="300" height="170" rx="10" fill="#E6E2DA" stroke="#1F7A72" stroke-width="1.5"/><text x="560.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#1F7A72">Stage 2: re-rank</text><text x="560.0" y="157" font-size="13" text-anchor="middle" fill="#1B2838">precision on</text><text x="560.0" y="177" font-size="13" text-anchor="middle" fill="#1B2838">the short list</text><rect x="770" y="100" width="300" height="170" rx="10" fill="#F6E7A8" stroke="#C46B2C" stroke-width="1.5"/><text x="920.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#C46B2C">Exact identifiers</text><text x="920.0" y="157" font-size="13" text-anchor="middle" fill="#1B2838">error codes, SKUs:</text><text x="920.0" y="177" font-size="13" text-anchor="middle" fill="#1B2838">keyword match wins</text><line x1="350" y1="185" x2="410" y2="185" stroke="#5C6B7A" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="325" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6B7A">Wrong documents: fix chunking, embeddings, or the query. Never fix retrieval by stuffing more context.</text><text x="24" y="399" font-size="13" fill="#5C6B7A">Source: original</text></svg>