<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="380" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Retrieval is two stages</text><rect x="50" y="100" width="300" height="170" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="200.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#1F5FBF">Stage 1: wide net</text><text x="200.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">dense vector search</text><text x="200.0" y="177" font-size="13" text-anchor="middle" fill="#24292F">high recall</text><rect x="410" y="100" width="300" height="170" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="560.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#0E7C7B">Stage 2: re-rank</text><text x="560.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">precision on</text><text x="560.0" y="177" font-size="13" text-anchor="middle" fill="#24292F">the short list</text><rect x="770" y="100" width="300" height="170" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="920.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#A15C07">Exact identifiers</text><text x="920.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">error codes, SKUs:</text><text x="920.0" y="177" font-size="13" text-anchor="middle" fill="#24292F">keyword match wins</text><line x1="350" y1="185" x2="410" y2="185" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="325" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Wrong documents: fix chunking, embeddings, or the query. Never fix retrieval by stuffing more context.</text></svg>