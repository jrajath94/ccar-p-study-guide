<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="480" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="478" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Study-time allocation from domain weights</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Spend your hours where the items are.</text>
<rect x="40" y="100" width="400" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="240.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">Heavy (16-19%)</text>
<text x="240.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">D3 Integration ~19%</text>
<text x="240.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">D1 Solution design ~17%</text>
<text x="240.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">D4 Evaluation ~16%</text>
<text x="240.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">these three are half the exam</text>
<rect x="460" y="100" width="400" height="130" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="660.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#d97706">Medium (13-14%)</text>
<text x="660.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">D5 Governance ~14%</text>
<text x="660.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">D6 Stakeholders ~14%</text>
<text x="660.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">D2 Models/context ~13%</text>
<rect x="250" y="260" width="400" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="450.0" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">Light but not free (7%)</text>
<text x="450.0" y="306" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">D7 Productivity ~4 items</text>
<text x="450.0" y="325" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">cheap points: scenarios you already know</text>
<text x="450.0" y="410" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">One hour on D3 buys more than one hour on D7.</text>
<text x="450.0" y="440" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#64748b">Triage is a strategy, not a shortcut: cover everything, weight your effort.</text>
</svg>