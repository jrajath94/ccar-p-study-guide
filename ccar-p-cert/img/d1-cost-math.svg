<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Retrieval cost math: the monthly bill in one formula</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Tokens per query times queries per day times price: know it cold.</text>
<rect x="40" y="100" width="820" height="150" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="450" y="140" text-anchor="middle" font-size="14" fill="#1e293b">cost/query = (input tokens x input price) + (output tokens x output price)</text>
<text x="450" y="172" text-anchor="middle" font-size="14" fill="#1e293b">monthly = cost/query x queries/day x 30</text>
<text x="450" y="212" text-anchor="middle" font-size="13" fill="#1e40af" font-weight="bold">example: $0.004/query x 20,000/day x 30 = $2,400/month</text>
<text x="450" y="310" text-anchor="middle" font-size="13" fill="#64748b">Retrieval adds tokens: 10 chunks x 800 tokens = 8,000 extra input tokens per query.</text>
<text x="450.0" y="380" text-anchor="middle" font-size="12" fill="#94a3b8">The cheapest retrieval change that holds recall is a cost win, not a quality loss.</text>
</svg>
