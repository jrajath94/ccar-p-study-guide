<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Both are parallelization, but they buy different things</text><rect x="30" y="60" width="520" height="380" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="290" y="92" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">SECTIONING buys speed + focus</text><rect x="70" y="120" width="135" height="60" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="137" y="148" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">piece 1</text><text x="137" y="168" font-size="12" fill="#5C6570" text-anchor="middle" font-weight="400">independent</text><rect x="225" y="120" width="135" height="60" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="292" y="148" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">piece 2</text><text x="292" y="168" font-size="12" fill="#5C6570" text-anchor="middle" font-weight="400">independent</text><rect x="380" y="120" width="135" height="60" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="447" y="148" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">piece 3</text><text x="447" y="168" font-size="12" fill="#5C6570" text-anchor="middle" font-weight="400">independent</text><rect x="130" y="210" width="320" height="55" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="290" y="232" font-size="14" fill="#24292F" text-anchor="middle" font-weight="600">merge</text><text x="290" y="252" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="400">latency of the slowest piece</text><line x1="137" y1="180" x2="200" y2="208" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="292" y1="180" x2="260" y2="208" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="447" y1="180" x2="320" y2="208" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="290" y="300" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">Use when pieces do not</text><text x="290" y="322" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">depend on each other.</text><text x="290" y="360" font-size="13.5" fill="#1F5FBF" text-anchor="middle" font-weight="700">Cost: one pass.</text><rect x="570" y="60" width="520" height="380" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="830" y="92" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">VOTING buys reliability</text><rect x="600" y="120" width="80" height="55" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="640" y="148" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="600">same task</text><rect x="692" y="120" width="80" height="55" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="732" y="148" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="600">same task</text><rect x="784" y="120" width="80" height="55" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="824" y="148" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="600">same task</text><rect x="876" y="120" width="80" height="55" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="916" y="148" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="600">same task</text><rect x="968" y="120" width="80" height="55" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="1008" y="148" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="600">same task</text><rect x="700" y="205" width="260" height="55" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="830" y="228" font-size="14" fill="#24292F" text-anchor="middle" font-weight="600">majority / best-of-N wins</text><line x1="640" y1="175" x2="720" y2="203" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="732" y1="175" x2="742" y2="203" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="824" y1="175" x2="764" y2="203" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="916" y1="175" x2="786" y2="203" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="1008" y1="175" x2="808" y2="203" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="830" y="300" font-size="14" fill="#24292F" text-anchor="middle" font-weight="600">p = 0.80 -&gt; majority-of-5 ~= 0.94</text><text x="830" y="324" font-size="14" fill="#B42318" text-anchor="middle" font-weight="600">p = 0.55 -&gt; majority-of-5 ~= 0.59</text><text x="830" y="352" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">Voting amplifies a decent call;</text><text x="830" y="374" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">it does not rescue a bad one.</text><text x="560.0" y="486" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">Independence matters: if all 5 calls share the same flawed retrieved context, they fail together and the math collapses.</text></svg>