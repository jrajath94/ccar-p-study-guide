<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The $31,500 question: one million turns a month, four tiers</text><text x="560" y="72" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">2,000 input tokens + 300 output tokens per turn</text><text x="140" y="142" font-size="15" fill="#24292F" text-anchor="middle" font-weight="700">Haiku 4.5</text><rect x="280" y="110" width="42" height="44" rx="10" fill="#0E7C7B" opacity="0.75"/><text x="338" y="140" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">$0.0035 / turn  -&gt;  $3,500 / month</text><text x="140" y="204" font-size="15" fill="#24292F" text-anchor="middle" font-weight="700">Sonnet 5</text><rect x="280" y="172" width="84" height="44" rx="10" fill="#1F5FBF" opacity="0.75"/><text x="380" y="202" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">$0.0070 / turn  -&gt;  $7,000 / month</text><text x="140" y="266" font-size="15" fill="#24292F" text-anchor="middle" font-weight="700">Opus 5.5</text><rect x="280" y="234" width="168" height="44" rx="10" fill="#A15C07" opacity="0.75"/><text x="464" y="264" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">$0.0140 / turn  -&gt;  $14,000 / month</text><text x="140" y="328" font-size="15" fill="#24292F" text-anchor="middle" font-weight="700">Fable 5.1</text><rect x="280" y="296" width="420" height="44" rx="10" fill="#B42318" opacity="0.75"/><text x="716" y="326" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">$0.0350 / turn  -&gt;  $35,000 / month</text><rect x="160" y="380" width="800" height="90" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="560" y="412" font-size="15" fill="#B42318" text-anchor="middle" font-weight="700">If Haiku clears the quality bar, Fable burns $31,500 extra every month for nothing.</text><text x="560" y="442" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">The archetypal D2 trap: the biggest model feels safest, but the constraint points to a smaller tier.</text></svg>