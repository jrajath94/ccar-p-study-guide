<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="480" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Four tiers because intelligence costs compute: match the engine to the load</text><rect x="24" y="70" width="256" height="300" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="152.0" y="100" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">Haiku 4.5</text><text x="152.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">$1 in / $5 out</text><text x="152.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="152.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">high-volume simple work:</text><text x="152.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">classify, extract, format</text><text x="152.0" y="206" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="152.0" y="226" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">speed: fastest</text><rect x="296" y="70" width="256" height="300" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="424.0" y="100" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">Sonnet 5</text><text x="424.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">$2 in / $10 out</text><text x="424.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="424.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">the everyday default:</text><text x="424.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">best speed-intelligence</text><text x="424.0" y="206" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="424.0" y="226" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">speed: balance</text><rect x="568" y="70" width="256" height="300" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="696.0" y="100" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">Opus 5.5</text><text x="696.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">$4 in / $20 out</text><text x="696.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="696.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">sustained agentic coding</text><text x="696.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">and knowledge work</text><text x="696.0" y="206" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="696.0" y="226" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">speed: moderate speed</text><rect x="840" y="70" width="256" height="300" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="968.0" y="100" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">Fable 5.1</text><text x="968.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">$10 in / $50 out</text><text x="968.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="968.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">hardest reasoning,</text><text x="968.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">long-horizon agents</text><text x="968.0" y="206" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="968.0" y="226" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">speed: slowest</text><rect x="160" y="400" width="800" height="44" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="560" y="428" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="600">The D2 trap: bigger is not better on simple tasks. A small model with good prompting often matches the big one.</text></svg>