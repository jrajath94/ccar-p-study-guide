<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="518" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Secrets and data governance: four layers, in order</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Worked result: 200 developers, 34 paste attempts blocked in month one, down 80% in month two.</text>
<rect x="60" y="95" width="780" height="94" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="450.0" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">1. POLICY - the written rule</text>
<text x="450.0" y="141" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">what data classes may go to which tools</text>
<text x="450.0" y="160" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">customer PII and secrets: to no AI tool at all</text>
<text x="450.0" y="179" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">use zero-data-retention (ZDR) terms where available</text>
<rect x="60" y="201" width="780" height="94" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="450.0" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">2. PREVENTION - make the mistake hard</text>
<text x="450.0" y="247" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">PreToolUse hook scans for secret patterns (sk-..., AKIA..., PEM headers)</text>
<text x="450.0" y="266" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">blocks the call BEFORE the model sees anything</text>
<text x="450.0" y="285" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">reference secrets by name (&quot;use DB_PASSWORD&quot;), never by value</text>
<rect x="60" y="307" width="780" height="74" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="450.0" y="331" text-anchor="middle" font-size="13" font-weight="bold" fill="#d97706">3. DETECTION - catch what slipped through</text>
<text x="450.0" y="353" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">transcripts and logs are redacted before writing</text>
<text x="450.0" y="372" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">secret scanning runs over repos and logs</text>
<rect x="60" y="393" width="780" height="54" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="450.0" y="417" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">4. RESPONSE - the rotation runbook</text>
<text x="450.0" y="439" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">which credential, who owns it, how fast it rotates, who is notified</text>
</svg>