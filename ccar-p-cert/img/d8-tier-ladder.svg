<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="440" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="438" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">The model tier ladder: climb only on evidence</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Default to the cheapest tier that satisfies the binding constraint.</text>
<rect x="40" y="100" width="160" height="88" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="120" y="136" text-anchor="middle" font-size="16" fill="#166534" font-weight="bold">HAIKU</text>
<text x="120" y="160" text-anchor="middle" font-size="12" fill="#166534">fast tier</text>
<rect x="210" y="100" width="650" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="230" y="148" text-anchor="start" font-size="13" fill="#1e293b">triage, classification, simple extraction, high volume</text>
<line x1="450" y1="188" x2="450" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="200" width="160" height="88" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="120" y="236" text-anchor="middle" font-size="16" fill="#1e40af" font-weight="bold">SONNET</text>
<text x="120" y="260" text-anchor="middle" font-size="12" fill="#1e40af">balanced tier</text>
<rect x="210" y="200" width="650" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="230" y="248" text-anchor="start" font-size="13" fill="#1e293b">the default: agents, coding, reasoning, most production</text>
<line x1="450" y1="288" x2="450" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="300" width="160" height="88" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
<text x="120" y="336" text-anchor="middle" font-size="16" fill="#5b21b6" font-weight="bold">OPUS</text>
<text x="120" y="360" text-anchor="middle" font-size="12" fill="#5b21b6">flagship tier</text>
<rect x="210" y="300" width="650" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="230" y="348" text-anchor="start" font-size="13" fill="#1e293b">the hard slice: novel reasoning, evals as judge, last resort</text>
<text x="450.0" y="414" text-anchor="middle" font-size="12" fill="#94a3b8">Bigger is not better. Right-sized is better.</text>
</svg>
