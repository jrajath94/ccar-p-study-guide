<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Transparency: explain and reconstruct what the system did</text><rect x="30" y="70" width="340" height="380" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="100" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">DECISION LOGGING</text><text x="200.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">for every consequential output log:</text><text x="200.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">input, retrieved sources, model version,</text><text x="200.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">confidence, guardrail decisions,</text><text x="200.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">any human review;</text><text x="200.0" y="206" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">answers &quot;why did it do that?&quot;</text><text x="200.0" y="226" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">six months later</text><rect x="393" y="70" width="340" height="380" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="100" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">MODEL CARDS + DATA SHEETS</text><text x="563.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">standardized documents:</text><text x="563.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">what it is for, training data,</text><text x="563.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">known limitations, eval results</text><text x="563.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">by group; the artifact auditors</text><text x="563.0" y="206" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">ask for</text><rect x="756" y="70" width="340" height="380" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="100" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">USER-FACING DISCLOSURE</text><text x="926.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">tell users they are talking to AI,</text><text x="926.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">what data it uses, how to appeal;</text><text x="926.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">hidden AI decision-making is</text><text x="926.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">both an ethical and a legal risk</text></svg>