<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Progressive discovery: reveal tools in stages</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Dumping 200 tools into the prompt is how context dies.</text>
<rect x="40" y="120" width="240" height="140" rx="10" fill="#ffffff" stroke="#2563eb"/>
<text x="160" y="158" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="bold">1. list</text>
<text x="160" y="188" text-anchor="middle" font-size="13" fill="#1e293b">names only</text>
<text x="160" y="214" text-anchor="middle" font-size="12" fill="#64748b">cheap, always on</text>
<line x1="300" y1="190" x2="320" y2="190" stroke="#64748b" stroke-width="3" marker-end="url(#ah)"/>
<rect x="320" y="120" width="240" height="140" rx="10" fill="#ffffff" stroke="#d97706"/>
<text x="440" y="158" text-anchor="middle" font-size="15" fill="#d97706" font-weight="bold">2. describe</text>
<text x="440" y="188" text-anchor="middle" font-size="13" fill="#1e293b">schemas for the shortlist</text>
<text x="440" y="214" text-anchor="middle" font-size="12" fill="#64748b">on demand</text>
<line x1="580" y1="190" x2="600" y2="190" stroke="#64748b" stroke-width="3" marker-end="url(#ah)"/>
<rect x="600" y="120" width="240" height="140" rx="10" fill="#ffffff" stroke="#16a34a"/>
<text x="720" y="158" text-anchor="middle" font-size="15" fill="#16a34a" font-weight="bold">3. use</text>
<text x="720" y="188" text-anchor="middle" font-size="13" fill="#1e293b">full docs for the chosen tool</text>
<text x="720" y="214" text-anchor="middle" font-size="12" fill="#64748b">at call time</text>
<text x="450.0" y="380" text-anchor="middle" font-size="12" fill="#94a3b8">The model pulls detail when it needs it. The prompt stays lean.</text>
</svg>
