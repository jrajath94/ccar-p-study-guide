<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="460" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker></defs><text x="560.0" y="34" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Quadrant decides the cadence</text><rect x="20" y="80" width="253" height="300" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="146.5" y="110" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">Manage closely</text><text x="146.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">high influence, high interest</text><text x="146.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">weekly contact</text><text x="146.5" y="180" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">e.g. head of legal ops</text><rect x="293" y="80" width="253" height="300" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="419.5" y="110" font-size="15" fill="#0E7C7B" text-anchor="middle" font-weight="700">Keep satisfied</text><text x="419.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">high influence, low interest</text><text x="419.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">consult on risk, early</text><text x="419.5" y="180" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">e.g. general counsel</text><rect x="566" y="80" width="253" height="300" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="692.5" y="110" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">Keep informed</text><text x="692.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">low influence, high interest</text><text x="692.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">demos and updates</text><text x="692.5" y="180" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">e.g. the 12 lawyers</text><rect x="839" y="80" width="253" height="300" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="965.5" y="110" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">Monitor</text><text x="965.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">low influence, low interest</text><text x="965.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">light touch</text><text x="965.5" y="180" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">e.g. IT helpdesk</text><text x="560.0" y="446" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">Influence sets the row, interest sets the column, the quadrant sets your week.</text></svg>