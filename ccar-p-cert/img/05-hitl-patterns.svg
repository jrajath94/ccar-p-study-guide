<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="540" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Three human-oversight patterns, matched to the stakes</text><rect x="30" y="70" width="340" height="400" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="100" font-size="14" fill="#B42318" text-anchor="middle" font-weight="700">REVIEW-BEFORE-RELEASE</text><text x="200.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">100% human approval before acting;</text><text x="200.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">required when actions are</text><text x="200.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">irreversible, visible, or legally</text><text x="200.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">binding: payments, filings,</text><text x="200.0" y="206" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">medical, hiring</text><rect x="393" y="70" width="340" height="400" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="100" font-size="14" fill="#A15C07" text-anchor="middle" font-weight="700">RISK-GATED ROUTING</text><text x="563.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">score risk = impact x confidence;</text><text x="563.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">only risky outputs go to humans;</text><text x="563.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">the default architecture for scale:</text><text x="563.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">human attention where it matters</text><rect x="756" y="70" width="340" height="400" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="100" font-size="14" fill="#0E7C7B" text-anchor="middle" font-weight="700">SAMPLED AUDIT</text><text x="926.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">review 2-5% after the fact;</text><text x="926.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">does not prevent errors;</text><text x="926.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">measures the error rate and</text><text x="926.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">catches drift; complements the</text><text x="926.0" y="206" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">other two, never replaces them</text></svg>