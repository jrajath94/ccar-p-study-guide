<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Exam-day pacing: 63 items, 120 minutes</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">1 minute 54 seconds per item. Two passes, no rushing.</text>
<rect x="40" y="100" width="820" height="60" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="40" y="92" text-anchor="middle" font-size="11" fill="#94a3b8">0:00</text>
<text x="420" y="92" text-anchor="middle" font-size="11" fill="#94a3b8">1:00</text>
<text x="800" y="92" text-anchor="middle" font-size="11" fill="#94a3b8">2:00</text>
<rect x="40" y="120" width="560" height="22" rx="11" fill="#2563eb" opacity="0.8"/>
<rect x="600" y="120" width="220" height="22" rx="11" fill="#16a34a" opacity="0.8"/>
<text x="320" y="136" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">PASS 1</text>
<text x="710" y="136" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">PASS 2</text>
<circle cx="70" cy="204" r="14" fill="#2563eb" opacity="0.15"/>
<text x="70" y="209" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="bold">1</text>
<text x="100" y="202" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">Pass 1: answer what you know</text>
<text x="100" y="224" text-anchor="start" font-size="12" fill="#64748b">Flag long scenarios and multi-response items. Keep moving.</text>
<circle cx="70" cy="270" r="14" fill="#16a34a" opacity="0.15"/>
<text x="70" y="275" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="bold">2</text>
<text x="100" y="268" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">Pass 2: return to flagged items</text>
<text x="100" y="290" text-anchor="start" font-size="12" fill="#64748b">Read the selection count first. Select exactly that many.</text>
<circle cx="70" cy="336" r="14" fill="#d97706" opacity="0.15"/>
<text x="70" y="341" text-anchor="middle" font-size="14" fill="#d97706" font-weight="bold">3</text>
<text x="100" y="334" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">Review: change only with a reason</text>
<text x="100" y="356" text-anchor="start" font-size="12" fill="#64748b">If you cannot name the error, the first answer stands.</text>
</svg>
