<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="440" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker></defs><text x="560.0" y="34" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Exam drill: the decision matrix</text><text x="180" y="92" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="700">Scenario</text><text x="560" y="92" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="700">Constraint</text><text x="930" y="92" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="700">Credited move</text><rect x="40" y="110" width="1040" height="84" rx="8" fill="#FFFFFF" stroke="#D7DCE2" stroke-width="1.2"/><rect x="40" y="110" width="7" height="84" rx="3.5" fill="#1F5FBF"/><text x="180" y="144" font-size="13.5" fill="#1F5FBF" text-anchor="middle" font-weight="700">Hospital scribe with PHI</text><text x="560" y="144" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">HIPAA constraint</text><text x="930" y="144" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">BAA + minimum-necessary + human sign-off</text><line x1="560" y1="194" x2="560" y2="210" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="210" width="1040" height="84" rx="8" fill="#FFFFFF" stroke="#D7DCE2" stroke-width="1.2"/><rect x="40" y="210" width="7" height="84" rx="3.5" fill="#0E7C7B"/><text x="180" y="244" font-size="13.5" fill="#0E7C7B" text-anchor="middle" font-weight="700">Resume screener, 0.67 ratio</text><text x="560" y="244" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">Fairness constraint</text><text x="930" y="244" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">investigate proxies, rebalance, human review</text><line x1="560" y1="294" x2="560" y2="310" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="310" width="1040" height="84" rx="8" fill="#FFFFFF" stroke="#D7DCE2" stroke-width="1.2"/><rect x="40" y="310" width="7" height="84" rx="3.5" fill="#A15C07"/><text x="180" y="344" font-size="13.5" fill="#A15C07" text-anchor="middle" font-weight="700">Vendor trains on your data</text><text x="560" y="344" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">Confidentiality</text><text x="930" y="344" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">ZDR agreement or a private deployment</text><text x="560.0" y="426" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">Read the constraint first. The credited move always serves the constraint.</text></svg>