<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="360" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Multiple-response items: no partial credit</text><rect x="60" y="80" width="300" height="190" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="210.0" y="109" font-size="15" text-anchor="middle" font-weight="700" fill="#1F5FBF">Judge each option alone</text><text x="210.0" y="137" font-size="13" text-anchor="middle" fill="#24292F">every selection must</text><text x="210.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">survive on its own</text><rect x="410" y="80" width="300" height="190" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="560.0" y="109" font-size="15" text-anchor="middle" font-weight="700" fill="#0E7C7B">About a quarter</text><text x="560.0" y="137" font-size="13" text-anchor="middle" fill="#24292F">of the exam is</text><text x="560.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">multiple-response</text><rect x="760" y="80" width="300" height="190" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/><text x="910.0" y="109" font-size="15" text-anchor="middle" font-weight="700" fill="#C0392B">One wrong pick</text><text x="910.0" y="137" font-size="13" text-anchor="middle" fill="#24292F">sinks the whole item</text><text x="910.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">no partial credit</text><line x1="360" y1="175" x2="410" y2="175" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="710" y1="175" x2="760" y2="175" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">When unsure, select fewer. A wrong selection costs more than a missed one.</text></svg>