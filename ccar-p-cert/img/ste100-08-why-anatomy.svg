<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="498" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Anatomy of an explanation</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Every item hides the same three parts behind the expandable panel.</text>
<rect x="60" y="100" width="780" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="450.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16a34a">1. The verdict</text>
<text x="450.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">the credited answer, stated first - e.g. Answer: B</text>
<rect x="60" y="220" width="780" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="450.0" y="244" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">2. Why it is correct</text>
<text x="450.0" y="266" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">the mechanism, tied to the constraint</text>
<text x="450.0" y="285" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">names the rule from the scenario that the answer satisfies</text>
<rect x="60" y="350" width="780" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="450.0" y="374" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#dc2626">3. Why each distractor is wrong</text>
<text x="450.0" y="396" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">one reason per wrong option</text>
<text x="450.0" y="415" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">each reason names the trap: scope, cost, latency, over-engineering</text>
<line x1="450" y1="200" x2="450" y2="220" stroke="#16a34a" stroke-width="2" marker-end="url(#ahg)"/>
<line x1="450" y1="330" x2="450" y2="350" stroke="#2563eb" stroke-width="2" marker-end="url(#ahb)"/>
</svg>