<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="480" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1A7F37"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A15C07"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0E7C7B"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B3FA0"/></marker></defs><text x="560" y="38" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Two breakpoint recipes: automatic is easy, explicit is precise</text><rect x="30" y="70" width="520" height="250" rx="10" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="290" y="98" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">AUTOMATIC</text><text x="290" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">one cache_control field</text><text x="290" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">at the top level</text><text x="290" y="164" font-size="13.5" fill="#24292F" text-anchor="middle">breakpoint rides the last</text><text x="290" y="185" font-size="13.5" fill="#24292F" text-anchor="middle">cacheable block as chat grows</text><text x="290" y="206" font-size="13.5" fill="#24292F" text-anchor="middle">BEST FOR: multi-turn chats</text><rect x="570" y="70" width="520" height="250" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="830" y="98" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">EXPLICIT</text><text x="830" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">cache_control on individual</text><text x="830" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">content blocks</text><text x="830" y="164" font-size="13.5" fill="#24292F" text-anchor="middle">up to 4 breakpoints per request</text><text x="830" y="185" font-size="13.5" fill="#24292F" text-anchor="middle">(automatic consumes one slot)</text><text x="830" y="206" font-size="13.5" fill="#24292F" text-anchor="middle">BEST FOR: fine control</text><text x="560" y="380" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">warning: automatic targets the last cacheable block, which may be the changing one</text><text x="560" y="408" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">prefer an explicit breakpoint at the end of the static prefix</text></svg>