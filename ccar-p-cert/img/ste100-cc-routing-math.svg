<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="420" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Routing math: 50,000 queries a day</text><rect x="60" y="90" width="280" height="200" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="200.0" y="120" font-size="16" text-anchor="middle" font-weight="700" fill="#1F5FBF">Classifier</text><text x="200.0" y="148" font-size="13" text-anchor="middle" fill="#24292F">one cheap classifier</text><text x="200.0" y="168" font-size="13" text-anchor="middle" fill="#24292F">decides per query</text><rect x="420" y="60" width="300" height="140" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="570.0" y="90" font-size="16" text-anchor="middle" font-weight="700" fill="#0E7C7B">Fast tier: 85%</text><text x="570.0" y="118" font-size="13" text-anchor="middle" fill="#24292F">42,500 queries</text><text x="570.0" y="138" font-size="13" text-anchor="middle" fill="#24292F">cheap, already solved</text><rect x="420" y="230" width="300" height="140" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="570.0" y="260" font-size="16" text-anchor="middle" font-weight="700" fill="#A15C07">Top tier: 15%</text><text x="570.0" y="288" font-size="13" text-anchor="middle" fill="#24292F">7,500 hard queries</text><text x="570.0" y="308" font-size="13" text-anchor="middle" fill="#24292F">escalate only these</text><line x1="340" y1="160" x2="420" y2="130" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="340" y1="220" x2="420" y2="300" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="800" y="90" width="260" height="200" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/><text x="930.0" y="120" font-size="16" text-anchor="middle" font-weight="700" fill="#C0392B">The trap</text><text x="930.0" y="148" font-size="13" text-anchor="middle" fill="#24292F">upgrade ALL traffic</text><text x="930.0" y="168" font-size="13" text-anchor="middle" fill="#24292F">pays flagship prices</text><text x="930.0" y="188" font-size="13" text-anchor="middle" fill="#24292F">for solved queries</text><text x="560.0" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Routing beats a single model at scale. The classifier is the single point of failure.</text></svg>