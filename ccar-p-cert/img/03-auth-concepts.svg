<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Authentication asks who. Authorization asks what is allowed.</text><rect x="60" y="70" width="490" height="200" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="305" y="102" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">AUTHENTICATION</text><text x="305" y="132" font-size="14" fill="#24292F" text-anchor="middle" font-weight="600">&quot;who is calling?&quot;</text><text x="305" y="162" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">identity: API keys, OAuth,</text><text x="305" y="186" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">tokens, certificates</text><rect x="570" y="70" width="490" height="200" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="815" y="102" font-size="15" fill="#0E7C7B" text-anchor="middle" font-weight="700">AUTHORIZATION</text><text x="815" y="132" font-size="14" fill="#24292F" text-anchor="middle" font-weight="600">&quot;what are they allowed to do?&quot;</text><text x="815" y="162" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">permissions: scopes, roles,</text><text x="815" y="186" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">allow-lists per tool call</text><text x="560" y="310" font-size="15" fill="#24292F" text-anchor="middle" font-weight="700">Both questions apply at three layers</text><rect x="60" y="330" width="320" height="70" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="220" y="372" font-size="14" fill="#1F5FBF" text-anchor="middle" font-weight="700">user -&gt; your app</text><rect x="400" y="330" width="320" height="70" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="560" y="372" font-size="14" fill="#A15C07" text-anchor="middle" font-weight="700">your app -&gt; model API</text><rect x="740" y="330" width="320" height="70" rx="10" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="900" y="372" font-size="14" fill="#B42318" text-anchor="middle" font-weight="700">agent -&gt; tools and data</text><rect x="160" y="425" width="800" height="50" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="560" y="456" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="600">A text-only chatbot can leak information. An agent with tools can move money, delete data, email customers.</text></svg>