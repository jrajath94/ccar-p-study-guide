<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<rect width="900" height="440" rx="14" fill="#1e293b"/>
<text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#e8e6e1">Budget the window like money: input plus max output</text>
<text x="450" y="62" text-anchor="middle" font-size="13" fill="#9fb0c3">Fable 5.1, 1,000,000-token window. One change breaks the budget.</text>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="aht" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#0d9488"/></marker></defs>
<rect x="24" y="88" width="392" height="296" rx="10" fill="#28303d" stroke="#0d9488" stroke-width="1.5"/>
<text x="220" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#7ee0d2">Before: fits</text>
<rect x="56" y="176" width="328" height="40" fill="none" stroke="#64748b" stroke-width="1.5"/>
<rect x="56" y="176" width="196" height="40" fill="#0d9488"/>
<text x="154" y="202" text-anchor="middle" font-size="12" fill="#1e293b">600K input</text>
<rect x="252" y="176" width="41" height="40" fill="#2563eb"/>
<text x="272" y="202" text-anchor="middle" font-size="10" fill="#1e293b">128K</text>
<text x="56" y="242" font-size="12.5" fill="#9fb0c3">window: 1,000,000 tokens</text>
<text x="56" y="272" font-size="12.5" fill="#0d9488">728,000 total. 272,000 headroom.</text>
<text x="56" y="292" font-size="12.5" fill="#0d9488">Check passes.</text>
<text x="458" y="206" text-anchor="middle" font-size="12" fill="#d97706">+400K docs</text>
<line x1="440" y1="240" x2="476" y2="240" stroke="#d97706" stroke-width="2" marker-end="url(#ah)"/>
<rect x="500" y="88" width="376" height="296" rx="10" fill="#28303d" stroke="#dc2626" stroke-width="1.5"/>
<text x="688" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#fca5a5">After: fails</text>
<rect x="532" y="176" width="300" height="40" fill="none" stroke="#64748b" stroke-width="1.5"/>
<rect x="532" y="176" width="300" height="40" fill="#0d9488"/>
<rect x="832" y="176" width="36" height="40" fill="#dc2626"/>
<text x="850" y="202" text-anchor="middle" font-size="10" fill="#e8e6e1">128K over</text>
<text x="532" y="242" font-size="12.5" fill="#9fb0c3">window: 1,000,000 tokens</text>
<text x="532" y="272" font-size="12.5" fill="#dc2626">1,128,000 exceeds the window. Fails.</text>
<text x="532" y="298" font-size="12.5" fill="#9fb0c3">Fix: summarize history, drop stale</text>
<text x="532" y="318" font-size="12.5" fill="#9fb0c3">tool results, or lower max output.</text>
</svg>