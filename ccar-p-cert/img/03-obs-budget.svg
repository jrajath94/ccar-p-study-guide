<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The observability budget: full retention is 200 GB a month; sampling keeps 6 GB</text><rect x="60" y="70" width="1000" height="80" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="560" y="104" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">storage = requests x bytes per trace x retention days</text><text x="560" y="130" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">5,000,000 turns x 40 KB x 30 days = 200 GB per month at full retention</text><rect x="60" y="180" width="480" height="260" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="300" y="212" font-size="15" fill="#B42318" text-anchor="middle" font-weight="700">FULL RETENTION</text><text x="300" y="250" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">200 GB / month</text><text x="300" y="271" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">every trace kept</text><text x="300" y="292" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">debugging power: total</text><text x="300" y="360" font-size="14" fill="#B42318" text-anchor="middle" font-weight="700">storage bill: painful</text><rect x="580" y="180" width="480" height="260" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="820" y="212" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">TAIL-BASED SAMPLING</text><text x="820" y="250" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">keep all errors + slow requests (~2%)</text><text x="820" y="271" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">plus 1% of the rest: ~3% of traces</text><text x="820" y="292" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">3% of 200 GB ~= 6 GB</text><text x="820" y="390" font-size="14" fill="#1A7F37" text-anchor="middle" font-weight="700">same power on failures, 1/33 of the storage</text></svg>