<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Cache economics: 1,000-token prefix, 50 requests, Sonnet 5</text><rect x="80" y="80" width="440" height="200" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/><text x="300.0" y="112" font-size="18" text-anchor="middle" font-weight="700" fill="#C0392B">No cache: $0.10</text><text x="300.0" y="140" font-size="13" text-anchor="middle" fill="#24292F">50 x 1,000 tokens</text><text x="300.0" y="160" font-size="13" text-anchor="middle" fill="#24292F">x $2 per million</text><rect x="600" y="80" width="440" height="200" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="820.0" y="112" font-size="18" text-anchor="middle" font-weight="700" fill="#0E7C7B">Cached: $0.0125</text><text x="820.0" y="140" font-size="13" text-anchor="middle" fill="#24292F">1 write x $2.50/M</text><text x="820.0" y="160" font-size="13" text-anchor="middle" fill="#24292F">+ 50 reads x $0.20/M</text><text x="560.0" y="330" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Write 1.25x base input. Read 0.10x. The write is repaid after the first cache hit.</text></svg>