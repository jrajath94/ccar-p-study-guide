<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="580" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Five failure modes, each with its own fix family</text><rect x="20" y="70" width="200" height="430" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="120.0" y="100" font-size="13" fill="#B42318" text-anchor="middle" font-weight="700">HALLUCINATION</text><text x="120.0" y="128" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">states false things confidently</text><text x="120.0" y="145" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">ground answers in retrieved sources;</text><text x="120.0" y="162" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">never answer factual questions</text><text x="120.0" y="178" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">from memory alone in high stakes</text><rect x="236" y="70" width="200" height="430" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="336.0" y="100" font-size="13" fill="#A15C07" text-anchor="middle" font-weight="700">PROMPT INJECTION</text><text x="336.0" y="128" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">attacker text treated as commands</text><text x="336.0" y="145" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">direct: from the user;</text><text x="336.0" y="162" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">indirect: from retrieved content;</text><text x="336.0" y="178" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">highest-severity agentic risk</text><rect x="452" y="70" width="200" height="430" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="552.0" y="100" font-size="13" fill="#0E7C7B" text-anchor="middle" font-weight="700">JAILBREAK</text><text x="552.0" y="128" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">crafted prompt bypasses refusals</text><text x="552.0" y="145" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">backstop the model&#x27;s own refusals</text><text x="552.0" y="162" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">with output filters</text><text x="552.0" y="178" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400"></text><rect x="668" y="70" width="200" height="430" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="768.0" y="100" font-size="13" fill="#1F5FBF" text-anchor="middle" font-weight="700">DATA LEAK</text><text x="768.0" y="128" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">sensitive data escapes the system</text><text x="768.0" y="145" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">redact at collection; audit what</text><text x="768.0" y="162" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">the model can see and emit</text><text x="768.0" y="178" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400"></text><rect x="884" y="70" width="200" height="430" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="984.0" y="100" font-size="13" fill="#1A7F37" text-anchor="middle" font-weight="700">TOOL MISUSE</text><text x="984.0" y="128" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">wrong tool, attacker args,</text><text x="984.0" y="145" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">unauthorized chains</text><text x="984.0" y="162" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">missing authorization design is</text><text x="984.0" y="178" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">a plumbing bug, not a model bug</text><text x="560.0" y="566" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">Three are adversarial (injection, jailbreak, tool misuse). Two happen with no attacker at all.</text></svg>