<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<rect width="960" height="620" rx="14" fill="#1e293b"/>
<text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#e8e6e1">Three ways to connect: pick by constraint</text>
<text x="480" y="62" text-anchor="middle" font-size="13" fill="#9fb0c3">MCP, direct API, agent-to-agent. Same job, different bills.</text>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="aht" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#0d9488"/></marker><marker id="aha" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#d97706"/></marker></defs>
<rect x="216" y="88" width="232" height="44" rx="10" fill="#28303d" stroke="#0d9488" stroke-width="1.5"/>
<text x="332" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#e8e6e1">MCP</text>
<rect x="460" y="88" width="232" height="44" rx="10" fill="#28303d" stroke="#2563eb" stroke-width="1.5"/>
<text x="576" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#e8e6e1">Direct API</text>
<rect x="704" y="88" width="232" height="44" rx="10" fill="#28303d" stroke="#d97706" stroke-width="1.5"/>
<text x="820" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#e8e6e1">Agent-to-agent</text>
<text x="200" y="182" text-anchor="end" font-size="13" font-weight="bold" fill="#9fb0c3">Best when</text>
<rect x="216" y="148" width="232" height="64" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="332" y="175" text-anchor="middle" font-size="12.5" fill="#e8e6e1">a server already exists</text>
<rect x="460" y="148" width="232" height="64" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="576" y="175" text-anchor="middle" font-size="12.5" fill="#e8e6e1">you need full control</text>
<rect x="704" y="148" width="232" height="64" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="820" y="175" text-anchor="middle" font-size="12.5" fill="#e8e6e1">across org boundaries</text>
<text x="200" y="258" text-anchor="end" font-size="13" font-weight="bold" fill="#9fb0c3">Auth</text>
<rect x="216" y="224" width="232" height="64" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="332" y="246" text-anchor="middle" font-size="12.5" fill="#e8e6e1">OAuth 2.1 remote</text>
<text x="332" y="264" text-anchor="middle" font-size="12.5" fill="#e8e6e1">OS boundary local</text>
<rect x="460" y="224" width="232" height="64" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="576" y="246" text-anchor="middle" font-size="12.5" fill="#e8e6e1">whatever you build</text>
<text x="576" y="264" text-anchor="middle" font-size="12.5" fill="#e8e6e1">keys, IAM, mTLS</text>
<rect x="704" y="224" width="232" height="64" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="820" y="246" text-anchor="middle" font-size="12.5" fill="#e8e6e1">per-agent identity</text>
<text x="820" y="264" text-anchor="middle" font-size="12.5" fill="#e8e6e1">task-level auth</text>
<text x="200" y="334" text-anchor="end" font-size="13" font-weight="bold" fill="#9fb0c3">Latency</text>
<rect x="216" y="300" width="232" height="64" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="332" y="327" text-anchor="middle" font-size="12.5" fill="#e8e6e1">+1 hop for remote</text>
<rect x="460" y="300" width="232" height="64" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="576" y="327" text-anchor="middle" font-size="12.5" fill="#e8e6e1">minimal: your path</text>
<rect x="704" y="300" width="232" height="64" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="820" y="322" text-anchor="middle" font-size="12.5" fill="#e8e6e1">highest: negotiation</text>
<text x="820" y="340" text-anchor="middle" font-size="12.5" fill="#e8e6e1">+ the remote loop</text>
<text x="200" y="410" text-anchor="end" font-size="13" font-weight="bold" fill="#9fb0c3">Failure owner</text>
<rect x="216" y="376" width="232" height="64" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="332" y="403" text-anchor="middle" font-size="12.5" fill="#e8e6e1">the server owner</text>
<rect x="460" y="376" width="232" height="64" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="576" y="403" text-anchor="middle" font-size="12.5" fill="#e8e6e1">you</text>
<rect x="704" y="376" width="232" height="64" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="820" y="403" text-anchor="middle" font-size="12.5" fill="#e8e6e1">shared</text>
<text x="200" y="486" text-anchor="end" font-size="13" font-weight="bold" fill="#9fb0c3">Ship speed</text>
<rect x="216" y="452" width="232" height="64" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="332" y="479" text-anchor="middle" font-size="12.5" fill="#e8e6e1">fast if a server exists</text>
<rect x="460" y="452" width="232" height="64" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="576" y="479" text-anchor="middle" font-size="12.5" fill="#e8e6e1">slowest: all custom</text>
<rect x="704" y="452" width="232" height="64" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="820" y="479" text-anchor="middle" font-size="12.5" fill="#e8e6e1">fast across boundaries</text>
<text x="480" y="600" text-anchor="middle" font-size="12.5" fill="#dc2626">The trap: MCP for everything. The hop is a latency tax; pay it only when a server already exists.</text>
</svg>