<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Your first API call: the Messages API</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">One endpoint. Three inputs in, text plus bookkeeping out.</text>
<rect x="40" y="110" width="380" height="143" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="230.0" y="142" text-anchor="middle" font-size="15" fill="#1e40af" font-weight="bold">REQUEST</text>
<text x="60" y="172" text-anchor="start" font-size="13" fill="#1e293b">model: which model answers</text>
<text x="60" y="199" text-anchor="start" font-size="13" fill="#1e293b">max_tokens: hard cap on reply length</text>
<text x="60" y="226" text-anchor="start" font-size="13" fill="#1e293b">messages: the conversation so far</text>
<rect x="480" y="110" width="380" height="143" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="670.0" y="142" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">RESPONSE</text>
<text x="500" y="172" text-anchor="start" font-size="13" fill="#1e293b">text: the reply</text>
<text x="500" y="199" text-anchor="start" font-size="13" fill="#1e293b">stop_reason: why it stopped</text>
<text x="500" y="226" text-anchor="start" font-size="13" fill="#1e293b">usage: input/output token counts</text>
<line x1="420" y1="175" x2="480" y2="175" stroke="#2563eb" stroke-width="3" marker-end="url(#ahb)"/>
<text x="450" y="300" text-anchor="middle" font-size="13" fill="#64748b">stop_reason values you will read daily: end_turn (answered), max_tokens (cut off), tool_use (wants to act).</text>
<text x="450.0" y="370" text-anchor="middle" font-size="12" fill="#94a3b8">model, max_tokens, messages in. Text, stop reason, usage out.</text>
</svg>
