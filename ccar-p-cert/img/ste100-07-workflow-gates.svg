<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="498" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">AI-assisted workflow: draft with AI, verify with determinism</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">The AI drafts. Deterministic gates verify. Humans decide at the gates.</text>
<rect x="40" y="100" width="240" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="160.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">1. Draft (AI)</text>
<text x="160.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">generate code,</text>
<text x="160.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">tests, docs</text>
<text x="160.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="160.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">fast, fluent,</text>
<text x="160.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">possibly wrong</text>
<rect x="330" y="100" width="240" height="150" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="450.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#d97706">2. Verify (deterministic)</text>
<text x="450.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">compiler, type checker</text>
<text x="450.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">test suite</text>
<text x="450.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">spec assertions</text>
<text x="450.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="450.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">no judgment needed</text>
<rect x="620" y="100" width="240" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="740.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16a34a">3. Gate (human)</text>
<text x="740.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">review the diff</text>
<text x="740.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">check the spec</text>
<text x="740.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">approve</text>
<text x="740.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="740.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">judgment lives here</text>
<line x1="280" y1="175" x2="330" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="570" y1="175" x2="620" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="180" y="300" width="540" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="450.0" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">The trap this kills</text>
<text x="450.0" y="346" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">&quot;The AI wrote tests, so the change is tested.&quot;</text>
<text x="450.0" y="365" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">Generated tests can encode the SAME misunderstanding as the code.</text>
<text x="450.0" y="384" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">Ask: do the tests assert the specified behavior? Who verified the spec?</text>
<line x1="450" y1="250" x2="450" y2="300" stroke="#dc2626" stroke-width="2" marker-end="url(#ahr)"/>
</svg>