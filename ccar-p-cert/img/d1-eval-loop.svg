<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 482" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="482" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="480" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Evaluate every retrieval change on a golden set</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Recall@k before, recall@k after. The change that does not move the number does not ship.</text>
<rect x="40" y="100" width="820" height="70" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="450" y="136" text-anchor="middle" font-size="14" fill="#1e293b">baseline: chunk 1000, top-k 10  --&gt;  recall@10 = 0.78</text>
<rect x="40" y="190" width="820" height="116" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="450.0" y="222" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">change: chunk 500, top-k 20</text>
<text x="60" y="252" text-anchor="start" font-size="13" fill="#64748b">recall@20 = 0.84</text>
<text x="60" y="279" text-anchor="start" font-size="13" fill="#166534">improvement: ship it</text>
<rect x="40" y="312" width="820" height="116" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="450.0" y="344" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">change: chunk 2000, top-k 5</text>
<text x="60" y="374" text-anchor="start" font-size="13" fill="#64748b">recall@5 = 0.71</text>
<text x="60" y="401" text-anchor="start" font-size="13" fill="#991b1b">regression: revert it</text>
<text x="450.0" y="452" text-anchor="middle" font-size="12" fill="#94a3b8">Golden set: 50-200 query/document pairs with known-good answers.</text>
</svg>
