<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Multi-agent: more than one model-driven actor, one goal, defined roles and paths</text><rect x="430" y="70" width="260" height="70" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="560" y="100" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">main agent</text><text x="560" y="124" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">&quot;research 50 vendors, one ranked list&quot;</text><rect x="60" y="190" width="320" height="110" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="220" y="222" font-size="14" fill="#1F5FBF" text-anchor="middle" font-weight="700">subagent A: vendors 1-17</text><text x="220" y="248" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">own window, own tools,</text><text x="220" y="268" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">narrow assignment</text><line x1="560" y1="140" x2="220" y2="188" stroke="#1F5FBF" stroke-width="1.8" marker-end="url(#ahb)"/><line x1="220" y1="300" x2="560" y2="342" stroke="#5C6570" stroke-width="1.4" stroke-dasharray="7,5" marker-end="url(#ah)"/><rect x="413" y="190" width="320" height="110" rx="10" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="573" y="222" font-size="14" fill="#0E7C7B" text-anchor="middle" font-weight="700">subagent B: vendors 18-34</text><text x="573" y="248" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">own window, own tools,</text><text x="573" y="268" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">narrow assignment</text><line x1="560" y1="140" x2="573" y2="188" stroke="#1F5FBF" stroke-width="1.8" marker-end="url(#ahb)"/><line x1="573" y1="300" x2="560" y2="342" stroke="#5C6570" stroke-width="1.4" stroke-dasharray="7,5" marker-end="url(#ah)"/><rect x="766" y="190" width="320" height="110" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="926" y="222" font-size="14" fill="#A15C07" text-anchor="middle" font-weight="700">subagent C: vendors 35-50</text><text x="926" y="248" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">own window, own tools,</text><text x="926" y="268" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">narrow assignment</text><line x1="560" y1="140" x2="926" y2="188" stroke="#1F5FBF" stroke-width="1.8" marker-end="url(#ahb)"/><line x1="926" y1="300" x2="560" y2="342" stroke="#5C6570" stroke-width="1.4" stroke-dasharray="7,5" marker-end="url(#ah)"/><text x="560" y="366" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">workers return summaries; the main agent synthesizes the shortlist</text><rect x="60" y="388" width="1000" height="88" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="560" y="414" font-size="14" fill="#1A7F37" text-anchor="middle" font-weight="700">Why it exists: three pressures one agent cannot solve</text><text x="560" y="440" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">context pressure (window fills, middle is lost)  |  parallelism pressure (independent work runs together)</text><text x="560" y="460" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">specialization pressure (one prompt dilutes each job)</text></svg>