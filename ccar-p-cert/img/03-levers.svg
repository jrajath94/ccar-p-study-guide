<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="600" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Four levers, each trading accuracy, latency, and cost differently</text><rect x="40" y="70" width="500" height="225" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="290.0" y="100" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">1. MODEL SELECTION</text><text x="290.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">price ladder: $1 / $2 / $4 per MTok;</text><text x="290.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">each tier ~2-2.5x more;</text><text x="290.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">cache writes +25%, cache reads -90%</text><rect x="580" y="70" width="500" height="225" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="830.0" y="100" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">2. REASONING BUDGETS</text><text x="830.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">thinking tokens billed as output;</text><text x="830.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">budget caps the spend (e.g. 10K);</text><text x="830.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">interleaved thinking helps multi-step loops</text><rect x="40" y="320" width="500" height="225" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="290.0" y="350" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">3. ROUTING</text><text x="290.0" y="378" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">small model first, big on demand;</text><text x="290.0" y="398" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">escalate when unsure or verifier flags;</text><text x="290.0" y="417" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">80% small + 20% big ~= big accuracy</text><rect x="580" y="320" width="500" height="225" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="830.0" y="350" font-size="16" fill="#1A7F37" text-anchor="middle" font-weight="700">4. STREAMING + PARALLELISM</text><text x="830.0" y="378" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">streaming cuts TTFT, not total time;</text><text x="830.0" y="398" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">parallel tool calls and subagents;</text><text x="830.0" y="417" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">the loop waits for the slowest, not the sum</text></svg>