"/><text x="840" y="140" font-size="13.5" fill="#24292F" text-anchor="middle">novel multi-step reasoning + quality bar</text><text x="840" y="160" font-size="13.5" fill="#24292F" text-anchor="middle">CoT or extended thinking, stronger model</text><rect x="40" y="270" width="1040" height="120" rx="10" fill="#F3F4F6" stroke="#5C6570" stroke-width="1.5"/><text x="560" y="298" font-size="15" fill="#5C6570" text-anchor="middle" font-weight="700">TOKEN ECONOMICS</text><text x="560" y="322" font-size="13.5" fill="#24292F" text-anchor="middle">few-shot costs input tokens: cheap and cacheable</text><text x="560" y="343" font-size="13.5" fill="#24292F" text-anchor="middle">CoT costs output tokens: the 5x rate</text><text x="560" y="440" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">the exam tests whether the technique earns its tokens against the constraint</text></svg>