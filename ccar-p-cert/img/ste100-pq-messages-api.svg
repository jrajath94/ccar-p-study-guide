<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="480" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">The Messages API: request and response</text><rect x="80" y="50" width="440" height="336" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="300" y="80" font-size="14" text-anchor="middle" font-weight="700" fill="#1F5FBF">REQUEST</text><text x="110" y="120" font-size="14" text-anchor="start" font-weight="700" fill="#24292F">model</text><text x="280" y="120" font-size="12" text-anchor="start" font-weight="400" fill="#5C6570">which Claude answers</text><text x="110" y="176" font-size="14" text-anchor="start" font-weight="700" fill="#24292F">system</text><text x="280" y="176" font-size="12" text-anchor="start" font-weight="400" fill="#5C6570">the rules behind the curtain</text><text x="110" y="232" font-size="14" text-anchor="start" font-weight="700" fill="#24292F">messages</text><text x="280" y="232" font-size="12" text-anchor="start" font-weight="400" fill="#5C6570">the conversation so far</text><text x="110" y="288" font-size="14" text-anchor="start" font-weight="700" fill="#24292F">max_tokens</text><text x="280" y="288" font-size="12" text-anchor="start" font-weight="400" fill="#5C6570">cap on reply length</text><text x="110" y="344" font-size="14" text-anchor="start" font-weight="700" fill="#24292F">tools</text><text x="280" y="344" font-size="12" text-anchor="start" font-weight="400" fill="#5