<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="498" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Design 3: topologies - pick by task shape</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">One agent, many agents, or a pipeline? The task shape decides.</text>
<rect x="40" y="100" width="250" height="180" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="165.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">Single agent</text>
<text x="165.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">one task,</text>
<text x="165.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">one context</text>
<text x="165.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="165.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">simplest that</text>
<text x="165.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">can work</text>
<rect x="325" y="100" width="250" height="180" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="450.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16a34a">Supervisor</text>
<text x="450.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">fan out, then</text>
<text x="450.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">synthesize</text>
<text x="450.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="450.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">parallelizable</text>
<text x="450.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">subtasks</text>
<rect x="610" y="100" width="250" height="180" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="735.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#d97706">Pipeline</text>
<text x="735.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">fixed stages,</text>
<text x="735.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">typed handoffs</text>
<text x="735.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="735.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">strict order,</text>
<text x="735.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">auditable</text>
<rect x="180" y="330" width="540" height="110" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="450.0" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">The rule for all three</text>
<text x="450.0" y="376" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">each subagent gets its own context window</text>
<text x="450.0" y="395" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">share nothing by default - pass explicit handoffs</text>
<text x="450.0" y="414" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">isolation is what keeps multi-agent systems debuggable</text>
<line x1="450" y1="280" x2="450" y2="330" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahp)"/>
</svg>