<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Two coordination philosophies: pick one on purpose</text><rect x="30" y="60" width="520" height="400" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="290" y="92" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">HARNESS (top-down, the default)</text><rect x="230" y="120" width="120" height="60" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="290" y="146" font-size="14" fill="#24292F" text-anchor="middle" font-weight="600">orchestrator</text><text x="290" y="168" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="400">holds global state</text><rect x="90" y="230" width="110" height="60" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="145" y="256" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">worker A</text><text x="145" y="276" font-size="11.5" fill="#5C6570" text-anchor="middle" font-weight="400">sees only its</text><text x="145" y="292" font-size="11.5" fill="#5C6570" text-anchor="middle" font-weight="400">assignment</text><line x1="290" y1="180" x2="145" y2="228" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="230" y="230" width="110" height="60" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="285" y="256" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">worker B</text><text x="285" y="276" font-size="11.5" fill="#5C6570" text-anchor="middle" font-weight="400">sees only its</text><text x="285" y="292" font-size="11.5" fill="#5C6570" text-anchor="middle" font-weight="400">assignment</text><line x1="290" y1="180" x2="285" y2="228" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="370" y="230" width="110" height="60" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="425" y="256" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">worker C</text><text x="425" y="276" font-size="11.5" fill="#5C6570" text-anchor="middle" font-weight="400">sees only its</text><text x="425" y="292" font-size="11.5" fill="#5C6570" text-anchor="middle" font-weight="400">assignment</text><line x1="290" y1="180" x2="425" y2="228" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="290" y="330" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">one planner, many focused workers</text><text x="290" y="349" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">debuggable: every decision visible</text><text x="290" y="368" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">in one place</text><rect x="570" y="60" width="520" height="400" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="830" y="92" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">SWARM (bottom-up, the exception)</text><rect x="645" y="135" width="110" height="55" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="700" y="165" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">agent A</text><rect x="905" y="135" width="110" height="55" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="960" y="165" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">agent B</text><rect x="645" y="265" width="110" height="55" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="700" y="295" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">agent C</text><rect x="905" y="265" width="110" height="55" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="960" y="295" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">agent D</text><line x1="700" y1="160" x2="960" y2="160" stroke="#A15C07" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.7"/><line x1="700" y1="160" x2="700" y2="290" stroke="#A15C07" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.7"/><line x1="700" y1="160" x2="960" y2="290" stroke="#A15C07" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.7"/><line x1="960" y1="160" x2="700" y2="290" stroke="#A15C07" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.7"/><line x1="960" y1="160" x2="960" y2="290" stroke="#A15C07" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.7"/><line x1="700" y1="290" x2="960" y2="290" stroke="#A15C07" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.7"/><text x="830" y="360" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">no center: peers hand off directly</text><text x="830" y="379" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">flexible when nobody knows the</text><text x="830" y="398" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">right structure in advance</text><text x="830" y="420" font-size="14" fill="#B42318" text-anchor="middle" font-weight="700">coordination grows as n(n-1)/2</text><text x="560.0" y="506" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">Default to the harness. Reach for the swarm only when the structure itself must be discovered.</text></svg>