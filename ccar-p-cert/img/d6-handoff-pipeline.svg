<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="435" viewBox="0 0 1120 435" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="435" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#163D7A"/></marker></defs><rect x="20" y="60" width="196" height="150" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="118" y="112" font-size="16" fill="#24292F" text-anchor="middle" font-weight="600">Architecture</text><text x="118" y="136" font-size="16" fill="#24292F" text-anchor="middle" font-weight="600">diagram</text><text x="118" y="182" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">the map</text><line x1="216" y1="135" x2="236" y2="135" stroke="#163D7A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="236" y="60" width="196" height="150" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="334" y="112" font-size="16" fill="#24292F" text-anchor="middle" font-weight="600">Decision</text><text x="334" y="136" font-size="16" fill="#24292F" text-anchor="middle" font-weight="600">records</text><text x="334" y="182" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">the why</text><line x1="432" y1="135" x2="452" y2="135" stroke="#163D7A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="452" y="60" width="196" height="150" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="550" y="112" font-size="16" fill="#24292F" text-anchor="middle" font-weight="600">Eval set</text><text x="550" y="136" font-size="16" fill="#24292F" text-anchor="middle" font-weight="600">+ runner</text><text x="550" y="182" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">the proof</text><line x1="648" y1="135" x2="668" y2="135" stroke="#163D7A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="668" y="60" width="196" height="150" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="766" y="112" font-size="16" fill="#24292F" text-anchor="middle" font-weight="600">Runbook</text><text x="766" y="182" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">the playbook</text><line x1="864" y1="135" x2="884" y2="135" stroke="#163D7A" stroke-width="2.5" marker-end="url(#ah)"/><rect x="884" y="60" width="196" height="150" rx="10" fill="#E8F3E8" stroke="#2F7D32" stroke-width="1.5"/><text x="982" y="112" font-size="16" fill="#24292F" text-anchor="middle" font-weight="600">Named</text><text x="982" y="136" font-size="16" fill="#24292F" text-anchor="middle" font-weight="600">owners</text><text x="982" y="182" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">the people</text><rect x="20" y="260" width="1080" height="110" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/><text x="560" y="300" font-size="16" fill="#C0392B" text-anchor="middle" font-weight="600">The most common handoff failure</text><text x="560" y="332" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">No named owner for the evals. The eval set rots, quality drifts, nobody notices for months.</text><text x="560" y="410" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">A handoff is not a document dump. It is a transfer of ownership, with names and dates.</text></svg>