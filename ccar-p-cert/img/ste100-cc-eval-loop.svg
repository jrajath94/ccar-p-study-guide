<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">The eval loop: measure, then trust</text><rect x="40" y="100" width="230" height="170" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="155.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#1F5FBF">Held-out set</text><text x="155.0" y="157" font-size="12" text-anchor="middle" fill="#24292F">never used for tuning</text><text x="155.0" y="177" font-size="12" text-anchor="middle" fill="#24292F">shaped like production</text><rect x="310" y="100" width="230" height="170" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="425.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#0E7C7B">CI gate</text><text x="425.0" y="157" font-size="12" text-anchor="middle" fill="#24292F">90% faithfulness floor;</text><text x="425.0" y="177" font-size="12" text-anchor="middle" fill="#24292F">max ~2 pt slice drop</text><rect x="580" y="100" width="230" height="170" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="695.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#A15C07">Sample 5%</text><text x="695.0" y="157" font-size="12" text-anchor="middle" fill="#24292F">score nightly,</text><text x="695.0" y="177" font-size="12" text-anchor="middle" fill="#24292F">watch the trend</text><rect x="850" y="100" width="230" height="170" rx="10" fill="#F3E8F7" stroke="#7B2D8E" stroke-width="1.5"/><text x="965.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#7B2D8E">Refresh</text><text x="965.0" y="157" font-size="12" text-anchor="middle" fill="#24292F">traffic drifts;</text><text x="965.0" y="177" font-size="12" text-anchor="middle" fill="#24292F">add new formats</text><line x1="270" y1="185" x2="310" y2="185" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="540" y1="185" x2="580" y2="185" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="810" y1="185" x2="850" y2="185" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="965" y1="300" x2="155" y2="300" stroke="#5C6570" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ah)"/><text x="560.0" y="355" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">A tuned-on test set measures nothing. The steering wheel for every loop is the eval set.</text></svg>