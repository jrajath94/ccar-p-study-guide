<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="460" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">The five prompt moves</text><rect x="40" y="100" width="192" height="200" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="136.0" y="128" font-size="14" text-anchor="middle" font-weight="700" fill="#1F5FBF">1. Be specific</text><text x="136.0" y="156" font-size="12" text-anchor="middle" fill="#24292F">name the task, the input,</text><text x="136.0" y="176" font-size="12" text-anchor="middle" fill="#24292F">the bar for done</text><line x1="234" y1="200" x2="250" y2="200" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="252" y="100" width="192" height="200" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="348.0" y="128" font-size="14" text-anchor="middle" font-weight="700" fill="#0E7C7B">2. Show one example</text><text x="348.0" y="156" font-size="12" text-anchor="middle" fill="#24292F">one input-output pair beats</text><text x="348.0" y="176" font-size="12" text-anchor="middle" fill="#24292F">three paragraphs</text><line x1="446" y1="200" x2="462" y2="200" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="464" y="100" width="192" height="200" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="560.0" y="128" font-size="14" text-anchor="middle" font-weight="700" fill="#A15C07">3. Constrain output</text><text x="560.0" y="156" font-size="12" text-anchor="middle" fill="#24292F">format, length, what</text><text x="560.0" y="176" font-size="12" text-anchor="middle" fill="#24292F">to leave out</text><line x1="658" y1="200" x2="674" y2="200" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="676" y="100" width="192" height="200" rx="10" fill="#F3E8F7" stroke="#7B2D8E" stroke-width="1.5"/><text x="772.0" y="128" font-size="14" text-anchor="middle" font-weight="700" fill="#7B2D8E">4. Name the audience</text><text x="772.0" y="156" font-size="12" text-anchor="middle" fill="#24292F">a junior dev needs different</text><text x="772.0" y="176" font-size="12" text-anchor="middle" fill="#24292F">words than a staff engineer</text><line x1="870" y1="200" x2="886" y2="200" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="888" y="100" width="192" height="200" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/><text x="984.0" y="128" font-size="14" text-anchor="middle" font-weight="700" fill="#C0392B">5. Demand the steps</text><text x="984.0" y="156" font-size="12" text-anchor="middle" fill="#24292F">ask for the reasoning,</text><text x="984.0" y="176" font-size="12" text-anchor="middle" fill="#24292F">not just the answer</text><text x="560.0" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">"Summarize this" is a wish. "Three bullets, under 40 words, for a busy exec" is an instruction.</text><text x="560.0" y="390" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">If the output format is unconstrained, the model invents one and your parser meets it in production.</text></svg>