 fill="#24292F" text-anchor="middle" font-weight="400">and strictly more latency and cost</text><rect x="160" y="280" width="800" height="150" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="560" y="308" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">TWO FACTS</text><text x="560" y="332" font-size="13.5" fill="#24292F" text-anchor="middle">thinking tokens are billed as output tokens</text><text x="560" y="353" font-size="13.5" fill="#24292F" text-anchor="middle">interleaved thinking: think between tool calls in an agent loop</text></svg>