<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="520" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="518" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">When you are stuck: the protocol</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Half of all stuck moments resolve at the constraint box.</text>
<rect x="120" y="95" width="660" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="450.0" y="119" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">1. Re-read the constraint box</text>
<text x="450.0" y="141" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">do not re-read the options</text>
<text x="450.0" y="160" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">the rule you missed is usually here</text>
<circle cx="70" cy="135.0" r="14" fill="#2563eb" opacity="0.15"/>
<text x="70" y="140.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">1</text>
<rect x="120" y="189" width="660" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="450.0" y="213" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16a34a">2. Name what you optimized for</text>
<text x="450.0" y="235" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">half of stuck moments: you optimized for the wrong thing</text>
<text x="450.0" y="254" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">speed? elegance? the constraint says what matters</text>
<circle cx="70" cy="229.0" r="14" fill="#16a34a" opacity="0.15"/>
<text x="70" y="234.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">2</text>
<rect x="120" y="283" width="660" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="450.0" y="307" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#d97706">3. Eliminate two distractors</text>
<text x="450.0" y="329" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">find the trap pattern (absolute words, scope creep)</text>
<text x="450.0" y="348" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">two confident eliminations beat one shaky pick</text>
<circle cx="70" cy="323.0" r="14" fill="#d97706" opacity="0.15"/>
<text x="70" y="328.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#d97706">3</text>
<rect x="120" y="377" width="660" height="80" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="450.0" y="401" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c3aed">4. Guess and flag, move on</text>
<text x="450.0" y="423" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">no negative marking - never leave it blank</text>
<text x="450.0" y="442" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">return with time left</text>
<circle cx="70" cy="417.0" r="14" fill="#7c3aed" opacity="0.15"/>
<text x="70" y="422.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c3aed">4</text>
</svg>