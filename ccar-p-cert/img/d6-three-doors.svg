<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="440" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="438" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">The feasibility verdict: three doors</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">D6 rewards the honest "no" over the doomed "yes".</text>
<rect x="40" y="100" width="820" height="89" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="450.0" y="132" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">BUILD  |  in-house</text>
<text x="60" y="162" text-anchor="start" font-size="13" fill="#64748b">core differentiator, team has the skill, timeline fits</text>
<rect x="40" y="200" width="820" height="89" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="450.0" y="232" text-anchor="middle" font-size="15" fill="#1e40af" font-weight="bold">BUY  |  vendor solution</text>
<text x="60" y="262" text-anchor="start" font-size="13" fill="#64748b">commodity capability, vendor owns the roadmap</text>
<rect x="40" y="300" width="820" height="89" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="450.0" y="332" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">DECLINE  |  say no</text>
<text x="60" y="362" text-anchor="start" font-size="13" fill="#64748b">no viable path: constraints contradict, data absent, ROI negative</text>
<text x="450.0" y="414" text-anchor="middle" font-size="12" fill="#94a3b8">A verdict without a reason is a guess. Name the constraint that decides.</text>
</svg>
