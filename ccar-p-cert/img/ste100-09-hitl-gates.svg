<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="480" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="478" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Design 2: HITL gates - where humans decide</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Approval follows the stakes. Read-only is free; irreversible costs a human.</text>
<rect x="40" y="100" width="200" height="160" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="140.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16a34a">No gate</text>
<text x="140.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">read-only calls</text>
<text x="140.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">search, read file</text>
<text x="140.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="140.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">reversible, cheap</text>
<rect x="280" y="100" width="200" height="160" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="380.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#d97706">Approval gate</text>
<text x="380.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">writes, sends,</text>
<text x="380.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">refunds</text>
<text x="380.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="380.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">human approves</text>
<text x="380.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">each one</text>
<rect x="520" y="100" width="200" height="160" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="620.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#dc2626">Hard gate</text>
<text x="620.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">destructive,</text>
<text x="620.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">irreversible,</text>
<text x="620.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">regulated</text>
<text x="620.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="620.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">two humans,</text>
<text x="620.0" y="241" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">full audit</text>
<rect x="760" y="100" width="100" height="160" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="810.0" y="124" text-anchor="middle" font-size="1" font-weight="bold" fill="#64748b"></text>
<text x="810" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748b">deny</text>
<text x="810" y="185" text-anchor="middle" font-size="12" font-weight="normal" fill="#64748b">list</text>
<line x1="240" y1="180" x2="280" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="480" y1="180" x2="520" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="720" y1="180" x2="760" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<text x="450.0" y="310" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">The trap to retire: HITL does not mean a human watches every step.</text>
<rect x="230" y="340" width="440" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="450.0" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">Design rule</text>
<text x="450.0" y="386" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">let the agent draft freely</text>
<text x="450.0" y="405" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">put the send and the refund behind a gate</text>
</svg>