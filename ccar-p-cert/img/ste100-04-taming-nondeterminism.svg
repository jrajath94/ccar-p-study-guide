<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker></defs><text x="560.0" y="34" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Taming nondeterminism in evals</text><rect x="20" y="80" width="253" height="240" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="146.5" y="110" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">Temperature 0</text><text x="146.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">greedy decoding</text><text x="146.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">kills sampling noise</text><rect x="293" y="80" width="253" height="240" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="419.5" y="110" font-size="15" fill="#0E7C7B" text-anchor="middle" font-weight="700">Fixed seed</text><text x="419.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">set the random seed</text><text x="419.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">same seed, same run</text><rect x="566" y="80" width="253" height="240" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="692.5" y="110" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">N runs, aggregate</text><text x="692.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">run 3-5 times</text><text x="692.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">majority vote or mean</text><rect x="839" y="80" width="253" height="240" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="965.5" y="110" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">Freeze the prompt</text><text x="965.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">version every template</text><text x="965.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">no silent edits mid-eval</text><text x="560.0" y="386" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">Same prompt must mean same score. Lock down every source of randomness.</text></svg>