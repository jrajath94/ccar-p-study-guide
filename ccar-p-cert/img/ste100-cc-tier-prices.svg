<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="460" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Model tiers: price per million tokens</text><text x="150" y="92" font-size="14" text-anchor="start" font-weight="600" fill="#24292F">Fable 5.1 (top reasoning)</text><text x="150" y="112" font-size="12" text-anchor="start" font-weight="400" fill="#5C6570">last resort</text><rect x="430" y="84" width="420" height="24" rx="6" fill="#F2F3F5" stroke="#D0D4D9"/><rect x="430" y="84" width="420.0" height="24" rx="6" fill="#EAF0FA" stroke="#1F5FBF"/><text x="858" y="101.0" font-size="13" fill="#24292F">$10 in / $50 out</text><text x="150" y="154" font-size="14" text-anchor="start" font-weight="600" fill="#24292F">Opus 5.5 (top capability)</text><text x="150" y="174" font-size="12" text-anchor="start" font-weight="400" fill="#5C6570">agentic coding</text><rect x="430" y="146" width="420" height="24" rx="6" fill="#F2F3F5" stroke="#D0D4D9"/><rect x="430" y="146" width="168.0" height="24" rx="6" fill="#EFF0EA" stroke="#0E7C7B"/><text x="858" y="163.0" font-size="13" fill="#24292F">$4 in / $20 out</text><text x="150" y="216" font-size="14" text-anchor="start" font-weight="600" fill="#24292F">Sonnet 5 (balanced)</text><text x="150" y="236" font-size="12" text-anchor="start" font-weight="400" fill="#5C6570">production default</text><rect x="430" y="208" width="420" height="24" rx="6" fill="#F2F3F5" stroke="#D0D4D9"/><rect x="430" y="208" width="84.0" height="24" rx="6" fill="#FFF6E6" stroke="#A15C07"/><text x="858" y="225.0" font-size="13" fill="#24292F">$2 in / $10 out</text><text x="150" y="278" font-size="14" text-anchor="start" font-weight="600" fill="#24292F">Haiku 4.5 (fast)</text><text x="150" y="298" font-size="12" text-anchor="start" font-weight="400" fill="#5C6570">high volume</text><rect x="430" y="270" width="420" height="24" rx="6" fill="#F2F3F5" stroke="#D0D4D9"/><rect x="430" y="270" width="42.0" height="24" rx="6" fill="#E8F4F8" stroke="#2471A3"/><text x="858" y="287.0" font-size="13" fill="#24292F">$1 in / $5 out</text><text x="560.0" y="358" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Output costs exactly 5x input on every tier. Reason by tier, not by model name.</text></svg>