<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Charis SIL, Georgia, serif">
  <rect x="0" y="0" width="960" height="620" rx="10" fill="#0d0d0d"/>
  <text x="30" y="42" font-size="24" fill="#ececec" font-weight="bold">The closed loop: measure, diagnose, fix, re-measure</text>
  <!-- center loop boxes -->
  <rect x="330" y="80" width="300" height="80" rx="8" fill="#111111" stroke="#f0b429" stroke-width="2"/>
  <text x="352" y="112" font-size="15" fill="#f0b429" font-weight="bold">1 · DEFINE METRICS</text>
  <text x="352" y="138" font-size="13" fill="#a8a8a8">task-fit metrics, sliced per segment</text>
  <rect x="330" y="200" width="300" height="80" rx="8" fill="#111111" stroke="#f0b429" stroke-width="2"/>
  <text x="352" y="232" font-size="15" fill="#f0b429" font-weight="bold">2 · BUILD GOLDEN SET</text>
  <text x="352" y="258" font-size="13" fill="#a8a8a8">sampled real inputs, human labels</text>
  <rect x="330" y="320" width="300" height="96" rx="8" fill="#111111" stroke="#6cb2ff" stroke-width="2"/>
  <text x="352" y="352" font-size="15" fill="#6cb2ff" font-weight="bold">3 · RUN THE HARNESS</text>
  <text x="352" y="378" font-size="13" fill="#a8a8a8">rule checks → LLM judge → human audit</text>
  <text x="352" y="398" font-size="13" fill="#a8a8a8">side-by-side version diffs</text>
  <rect x="330" y="456" width="300" height="80" rx="8" fill="#111111" stroke="#f0b429" stroke-width="2"/>
  <text x="352" y="488" font-size="15" fill="#f0b429" font-weight="bold">4 · DIAGNOSE + FIX</text>
  <text x="352" y="514" font-size="13" fill="#a8a8a8">bucket failures, change one thing</text>
  <!-- loop arrows on left side -->
  <polygon points="330,110 306,110 306,100 290,120 306,140 306,130 330,130" fill="#a8a8a8"/>
  <polygon points="330,230 306,230 306,220 290,240 306,260 306,250 330,250" fill="#a8a8a8"/>
  <polygon points="330,360 306,360 306,350 290,370 306,390 306,380 330,380" fill="#a8a8a8"/>
  <polygon points="330,486 306,486 306,476 290,496 306,516 306,506 330,506" fill="#a8a8a8"/>
  <path d="M 290 516 L 120 516 L 120 120 L 290 120" fill="none" stroke="#a8a8a8" stroke-width="2"/>
  <text x="140" y="310" font-size="14" fill="#ececec" transform="rotate(-90 140 310)">re-run after every change</text>
  <!-- guardrails side box -->
  <rect x="680" y="200" width="250" height="216" rx="8" fill="#111111" stroke="#262626" stroke-width="2"/>
  <text x="702" y="232" font-size="15" fill="#ececec" font-weight="bold">GUARDRAILS</text>
  <text x="702" y="260" font-size="13" fill="#a8a8a8">must hold on every loop:</text>
  <text x="702" y="288" font-size="14" fill="#ececec">• safety refusal rate</text>
  <text x="702" y="314" font-size="14" fill="#ececec">• p95 latency</text>
  <text x="702" y="340" font-size="14" fill="#ececec">• cost per request</text>
  <text x="702" y="372" font-size="13" fill="#a8a8a8">A primary-metric win that trips</text>
  <text x="702" y="392" font-size="13" fill="#a8a8a8">a guardrail does not ship.</text>
  <line x1="630" y1="280" x2="680" y2="280" stroke="#a8a8a8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="630" y1="340" x2="680" y2="340" stroke="#a8a8a8" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- production ring -->
  <rect x="30" y="560" width="900" height="40" rx="8" fill="none" stroke="#262626" stroke-width="1"/>
  <text x="52" y="586" font-size="13" fill="#a8a8a8">In production the same loop runs as A/B tests on live traffic plus scheduled production evals watching for drift.</text>
</svg>
