<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Speak in business terms: stakeholders judge what they can understand</text><rect x="60" y="70" width="490" height="180" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="305" y="102" font-size="14" fill="#B42318" text-anchor="middle" font-weight="700">NOT THIS</text><text x="305" y="145" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">&quot;we will use a reranker over</text><text x="305" y="175" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">the top 50 chunks&quot;</text><text x="305" y="210" font-size="13" fill="#B42318" text-anchor="middle" font-weight="600">the stakeholder cannot judge it</text><rect x="570" y="70" width="490" height="180" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="815" y="102" font-size="14" fill="#1A7F37" text-anchor="middle" font-weight="700">THIS</text><text x="815" y="145" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">&quot;Option A costs 3x more per request</text><text x="815" y="175" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">but halves the error rate, saving</text><text x="815" y="205" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">an estimated $40,000 a month in rework&quot;</text><line x1="550" y1="160" x2="570" y2="160" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="280" width="1000" height="180" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="560" y="312" font-size="14" fill="#24292F" text-anchor="middle" font-weight="700">a trade-off is a choice where improving one dimension costs you another</text><text x="560" y="350" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">accuracy, latency, and cost are the classic three</text><text x="560" y="390" font-size="13" fill="#B42318" text-anchor="middle" font-weight="400">failure mode: the black-box decision. The architect picks, the stakeholder nods, and six months later the bill arrives.</text></svg>