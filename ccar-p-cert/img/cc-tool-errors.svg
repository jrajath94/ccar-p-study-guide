<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Instructive errors: the tool must say what went wrong</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">The fix is in the tool, not the prompt.</text>
<rect x="40" y="100" width="400" height="240" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="240" y="132" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">GENERIC error</text>
<text x="240" y="164" text-anchor="middle" font-size="14" fill="#1e293b">"Tool execution failed"</text>
<text x="240" y="200" text-anchor="middle" font-size="12" fill="#64748b">agent retries the identical call</text>
<text x="240" y="224" text-anchor="middle" font-size="12" fill="#64748b">until it hits the turn limit,</text>
<text x="240" y="248" text-anchor="middle" font-size="12" fill="#64748b">or escalates without trying alternatives</text>
<rect x="460" y="100" width="400" height="240" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="660" y="132" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">INSTRUCTIVE error</text>
<text x="660" y="164" text-anchor="middle" font-size="14" fill="#1e293b">"order_id must look like E12345"</text>
<text x="660" y="200" text-anchor="middle" font-size="12" fill="#64748b">names the problem AND the next step</text>
<text x="660" y="224" text-anchor="middle" font-size="12" fill="#64748b">agent corrects and retries</text>
<text x="660" y="248" text-anchor="middle" font-size="12" fill="#64748b">exactly once, with a valid argument</text>
<line x1="440" y1="220" x2="460" y2="220" stroke="#64748b" stroke-width="3" marker-end="url(#ah)"/>
<text x="450.0" y="380" text-anchor="middle" font-size="12" fill="#94a3b8">Return a result dict with is_error: the loop reads the field, not the prose.</text>
</svg>
