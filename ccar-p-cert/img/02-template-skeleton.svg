<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="460" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">A prompt template: one reviewed prompt, many configurations, no copy-paste drift</text><rect x="160" y="70" width="800" height="200" rx="10" fill="#F6F8FA" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="200" y="120" font-size="15" fill="#24292F" font-family="monospace">You are a support agent for {{customer_tier}} customers.</text><text x="200" y="152" font-size="15" fill="#24292F" font-family="monospace">Follow policy version {{policy_version}}.</text><text x="200" y="184" font-size="15" fill="#24292F" font-family="monospace">Answer in {{output_language}}. Never reveal internal tools.</text><text x="200" y="230" font-size="13" fill="#5C6570">slots filled per request or per deployment</text><rect x="160" y="300" width="380" height="110" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="350" y="330" font-size="14" fill="#1A7F37" text-anchor="middle" font-weight="700">Treat like code</text><text x="350" y="356" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">version it, review changes,</text><text x="350" y="378" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">test the rendered prompt</text><rect x="580" y="300" width="380" height="110" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="770" y="330" font-size="14" fill="#B42318" text-anchor="middle" font-weight="700">Cache caution</text><text x="770" y="356" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">a per-request slot (timestamp,</text><text x="770" y="378" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">user ID) kills the cache: put</text><text x="770" y="400" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">volatile slots at the end</text></svg>