<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="A vague business ask becomes a clear spec through clarifying questions">
  <rect width="900" height="330" fill="none"/>
  <text x="450" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#a8a8a8">Clarify first: the answers become your constraints</text>
  <g font-family="sans-serif">
    <rect x="20" y="110" width="220" height="110" rx="14" fill="#0d0d0d" stroke="#f0b429" stroke-width="2"/>
    <text x="130" y="148" text-anchor="middle" font-size="14" fill="#ececec">"our support team is</text>
    <text x="130" y="170" text-anchor="middle" font-size="14" fill="#ececec">drowning, can Claude</text>
    <text x="130" y="192" text-anchor="middle" font-size="14" fill="#ececec">fix it?"</text>
    <text x="130" y="245" text-anchor="middle" font-size="12" fill="#a8a8a8">the vague ask</text>
    <path d="M240 165 H285" stroke="#f0b429" stroke-width="2"/>
    <rect x="285" y="60" width="270" height="52" rx="10" fill="#0d0d0d" stroke="#262626" stroke-width="2"/>
    <text x="420" y="83" text-anchor="middle" font-size="13" fill="#ececec">What hurts, and who feels it?</text>
    <text x="420" y="101" text-anchor="middle" font-size="11" fill="#a8a8a8">pain + volume</text>
    <rect x="285" y="124" width="270" height="52" rx="10" fill="#0d0d0d" stroke="#262626" stroke-width="2"/>
    <text x="420" y="147" text-anchor="middle" font-size="13" fill="#ececec">What does "fixed" look like?</text>
    <text x="420" y="165" text-anchor="middle" font-size="11" fill="#a8a8a8">target number</text>
    <rect x="285" y="188" width="270" height="52" rx="10" fill="#0d0d0d" stroke="#262626" stroke-width="2"/>
    <text x="420" y="211" text-anchor="middle" font-size="13" fill="#ececec">What are the hard limits?</text>
    <text x="420" y="229" text-anchor="middle" font-size="11" fill="#a8a8a8">budget, latency, compliance</text>
    <rect x="285" y="252" width="270" height="52" rx="10" fill="#0d0d0d" stroke="#262626" stroke-width="2"/>
    <text x="420" y="275" text-anchor="middle" font-size="13" fill="#ececec">What if we do nothing?</text>
    <text x="420" y="293" text-anchor="middle" font-size="11" fill="#a8a8a8">is it worth building?</text>
    <path d="M555 165 H600" stroke="#f0b429" stroke-width="2"/>
    <rect x="600" y="110" width="280" height="110" rx="14" fill="#0d0d0d" stroke="#f0b429" stroke-width="2"/>
    <text x="740" y="142" text-anchor="middle" font-size="14" fill="#ececec">clear spec</text>
    <text x="740" y="168" text-anchor="middle" font-size="12" fill="#a8a8a8">pain, volume, target,</text>
    <text x="740" y="188" text-anchor="middle" font-size="12" fill="#a8a8a8">limits, cost of inaction</text>
    <text x="740" y="245" text-anchor="middle" font-size="12" fill="#a8a8a8">design starts here</text>
  </g>
</svg>
