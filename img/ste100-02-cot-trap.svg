uracy: 99.1% with CoT</text><text x="290" y="164" font-size="13.5" fill="#24292F" text-anchor="middle">accuracy: 99.1% without CoT</text><line x1="550" y1="170" x2="610" y2="170" stroke="#B42318" stroke-width="2" marker-end="url(#ahr)"/><rect x="610" y="70" width="480" height="200" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/><text x="850" y="98" font-size="15" fill="#B42318" text-anchor="middle" font-weight="700">THE BILL TRIPLED</text><text x="850" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">reasoning is output tokens</text><text x="850" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">at the 5x rate</text><text x="850" y="164" font-size="13.5" fill="#24292F" text-anchor="middle">caching cannot discount output</text><rect x="160" y="320" width="800" height="130" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="560" y="348" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">THE CREDITED MOVE</text><text x="560" y="372" font-size="13.5" fill="#24292F" text-anchor="middle">drop CoT (it adds no accuracy here)</text><text x="560" y="393" font-size="13.5" fill="#24292F" text-anchor="middle">verify with the eval</text></svg>