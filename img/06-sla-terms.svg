<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">SLA, SLI, SLO: three terms, one contract</text><rect x="30" y="70" width="340" height="280" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="100" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">SLI</text><text x="200.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">service level indicator</text><text x="200.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">the thing you measure:</text><text x="200.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">&quot;fraction of successful requests&quot;</text><rect x="393" y="70" width="340" height="280" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="100" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">SLO</text><text x="563.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">service level objective</text><text x="563.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">the target you set for it:</text><text x="563.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">&quot;99.9%&quot;</text><rect x="756" y="70" width="340" height="280" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="100" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">SLA</text><text x="926.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">service level agreement</text><text x="926.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">the contract that references the SLO</text><text x="926.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">and adds the remedy</text><line x1="370" y1="210" x2="393" y2="210" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="733" y1="210" x2="756" y2="210" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="160" y="380" width="800" height="80" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="560" y="410" font-size="14" fill="#A15C07" text-anchor="middle" font-weight="700">the feedback loop keeps the SLA honest after signing day</text><text x="560" y="438" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">weekly eval reviews with the product owner, monthly business reviews with executives</text></svg>