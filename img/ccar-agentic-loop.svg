<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<rect width="960" height="580" rx="14" fill="#1e293b"/>
<text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#e8e6e1">The agentic loop: capped, traced, streamed only for humans</text>
<text x="480" y="62" text-anchor="middle" font-size="13" fill="#9fb0c3">One loop, three guardrails. The exam tests all three.</text>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="aht" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#0d9488"/></marker><marker id="aha" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#d97706"/></marker></defs>
<rect x="40" y="100" width="180" height="110" rx="10" fill="#28303d" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">Request</text>
<text x="130" y="152" text-anchor="middle" font-size="12.5" fill="#9fb0c3">user goal,</text>
<text x="130" y="172" text-anchor="middle" font-size="12.5" fill="#9fb0c3">constraints</text>
<rect x="260" y="100" width="180" height="110" rx="10" fill="#28303d" stroke="#2563eb" stroke-width="1.5"/>
<text x="350" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">Plan</text>
<text x="350" y="152" text-anchor="middle" font-size="12.5" fill="#9fb0c3">model picks the</text>
<text x="350" y="172" text-anchor="middle" font-size="12.5" fill="#9fb0c3">next tool</text>
<rect x="480" y="100" width="180" height="110" rx="10" fill="#28303d" stroke="#0d9488" stroke-width="1.5"/>
<text x="570" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#7ee0d2">tool_use</text>
<text x="570" y="152" text-anchor="middle" font-size="12.5" fill="#9fb0c3">one call,</text>
<text x="570" y="172" text-anchor="middle" font-size="12.5" fill="#9fb0c3">tight schema</text>
<rect x="700" y="100" width="180" height="110" rx="10" fill="#28303d" stroke="#0d9488" stroke-width="1.5"/>
<text x="790" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#7ee0d2">tool_result</text>
<text x="790" y="152" text-anchor="middle" font-size="12.5" fill="#9fb0c3">evidence back</text>
<text x="790" y="172" text-anchor="middle" font-size="12.5" fill="#9fb0c3">into context</text>
<line x1="220" y1="155" x2="260" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="440" y1="155" x2="480" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="660" y1="155" x2="700" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="790,280 870,330 790,380 710,330" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="790" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#e8e6e1">Done?</text>
<text x="790" y="344" text-anchor="middle" font-size="11" fill="#9fb0c3">or cap hit</text>
<line x1="790" y1="210" x2="790" y2="280" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 710 330 L 350 330 L 350 210" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#aha)"/>
<text x="480" y="318" text-anchor="middle" font-size="12" fill="#d97706">loop back, max N turns</text>
<rect x="700" y="420" width="180" height="90" rx="10" fill="#28303d" stroke="#16a34a" stroke-width="1.5"/>
<text x="790" y="450" text-anchor="middle" font-size="15" font-weight="bold" fill="#bbf7d0">Final answer</text>
<text x="790" y="472" text-anchor="middle" font-size="12.5" fill="#9fb0c3">synthesized,</text>
<text x="790" y="492" text-anchor="middle" font-size="12.5" fill="#9fb0c3">cited</text>
<line x1="790" y1="380" x2="790" y2="420" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="280" width="300" height="130" rx="10" fill="#28303d" stroke="#dc2626" stroke-width="1.5"/>
<text x="190" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#fca5a5">Guardrail 1: iteration cap</text>
<text x="190" y="332" text-anchor="middle" font-size="12.5" fill="#9fb0c3">No cap, no ship. A loop with</text>
<text x="190" y="352" text-anchor="middle" font-size="12.5" fill="#9fb0c3">no exit is a 2 AM spend spike.</text>
<rect x="40" y="430" width="300" height="110" rx="10" fill="#28303d" stroke="#dc2626" stroke-width="1.5"/>
<text x="190" y="460" text-anchor="middle" font-size="15" font-weight="bold" fill="#fca5a5">Guardrail 2: stop reasons</text>
<text x="190" y="482" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Finished, max turns, budget,</text>
<text x="190" y="502" text-anchor="middle" font-size="12.5" fill="#9fb0c3">denied. Read it first.</text>
<rect x="370" y="430" width="300" height="110" rx="10" fill="#28303d" stroke="#d97706" stroke-width="1.5"/>
<text x="520" y="460" text-anchor="middle" font-size="15" font-weight="bold" fill="#fde68a">Guardrail 3: streaming rule</text>
<text x="520" y="482" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Stream only when a human</text>
<text x="520" y="502" text-anchor="middle" font-size="12.5" fill="#9fb0c3">watches. Never stream a</text>
<text x="520" y="522" text-anchor="middle" font-size="12.5" fill="#9fb0c3">tool_use before executing.</text>
</svg>