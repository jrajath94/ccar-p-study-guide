nt-size="14" fill="#1A7F37" text-anchor="middle" font-weight="700">segment</text><text x="820" y="172" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">contract type, language,</text><text x="820" y="190" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">difficulty tags</text><rect x="60" y="250" width="1000" height="210" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="560" y="282" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="700">hygiene rules</text><text x="560" y="316" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">label quality beats size: one wrong expected answer poisons every comparison</text><text x="560" y="350" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">second-person spot checks, track inter-rater agreement</text><text x="560" y="384" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">a few hundred well-chosen cases beat ten thousand near-duplicates</text><text x="560" y="418" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">coverage across segments: every contract type, language, easy and adversarial</text></svg>