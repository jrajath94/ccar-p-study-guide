<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="600" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Seven demands you design for, not memorize</text><rect x="30" y="70" width="256" height="215" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="158.0" y="100" font-size="13" fill="#1F5FBF" text-anchor="middle" font-weight="700">1. LAWFUL BASIS</text><text x="158.0" y="128" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">named legal reason + stated purpose;</text><text x="158.0" y="145" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">no quiet reuse</text><rect x="302" y="70" width="256" height="215" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="430.0" y="100" font-size="13" fill="#0E7C7B" text-anchor="middle" font-weight="700">2. MINIMIZATION</text><text x="430.0" y="128" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">collect and keep only what</text><text x="430.0" y="145" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">the purpose needs; strip PII</text><rect x="574" y="70" width="256" height="215" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="702.0" y="100" font-size="13" fill="#A15C07" text-anchor="middle" font-weight="700">3. SUBJECT RIGHTS</text><text x="702.0" y="128" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">access, rectify, erase, port,</text><text x="702.0" y="145" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">halt: find one person&#x27;s data</text><text x="702.0" y="162" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">everywhere, incl. vector stores</text><rect x="846" y="70" width="256" height="215" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="974.0" y="100" font-size="13" fill="#1A7F37" text-anchor="middle" font-weight="700">4. RETENTION</text><text x="974.0" y="128" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">delete when the purpose ends;</text><text x="974.0" y="145" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">enforced by code, not intention</text><rect x="30" y="310" width="256" height="215" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="158.0" y="340" font-size="13" fill="#B42318" text-anchor="middle" font-weight="700">5. BREACH NOTICE</text><text x="158.0" y="368" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">report to the regulator within</text><text x="158.0" y="385" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">72 hours of discovery</text><rect x="302" y="310" width="256" height="215" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="430.0" y="340" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="700">6. DPIA</text><text x="430.0" y="368" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">impact assessment before high-risk</text><text x="430.0" y="385" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">processing at scale</text><rect x="574" y="310" width="256" height="215" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="702.0" y="340" font-size="13" fill="#1F5FBF" text-anchor="middle" font-weight="700">7. TRANSFERS</text><text x="702.0" y="368" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">cross-border moves need</text><text x="702.0" y="385" font-size="12" fill="#24292F" text-anchor="middle" font-weight="400">safeguards (SCCs)</text></svg>