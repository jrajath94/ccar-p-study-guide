<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<rect width="960" height="600" rx="14" fill="#1e293b"/>
<text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#e8e6e1">The $31,500 question: the cheapest model that clears the bar wins</text>
<text x="480" y="62" text-anchor="middle" font-size="13" fill="#9fb0c3">1M turns a month. The gap between Haiku and Fable is $31,500 a month.</text>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="aht" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#0d9488"/></marker><marker id="aha" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#d97706"/></marker></defs>
<text x="40" y="100" font-size="13" font-weight="bold" fill="#9fb0c3">MONTHLY COST AT 1M TURNS</text>
<text x="40" y="136" font-size="14" fill="#e8e6e1">Haiku</text>
<rect x="140" y="120" width="30" height="24" rx="5" fill="#0d9488" opacity="0.85"/>
<text x="180" y="137" font-size="13" fill="#9fb0c3">$3.5K</text>
<text x="40" y="180" font-size="14" fill="#e8e6e1">Sonnet</text>
<rect x="140" y="164" width="60" height="24" rx="5" fill="#2563eb" opacity="0.85"/>
<text x="210" y="181" font-size="13" fill="#9fb0c3">$7K</text>
<text x="40" y="224" font-size="14" fill="#e8e6e1">Opus</text>
<rect x="140" y="208" width="120" height="24" rx="5" fill="#d97706" opacity="0.85"/>
<text x="270" y="225" font-size="13" fill="#9fb0c3">$14K</text>
<text x="40" y="268" font-size="14" fill="#e8e6e1">Fable</text>
<rect x="140" y="252" width="300" height="24" rx="5" fill="#dc2626" opacity="0.85"/>
<text x="450" y="269" font-size="13" fill="#9fb0c3">$35K</text>
<text x="40" y="304" font-size="12.5" fill="#dc2626">The trap: defaulting to the biggest model.</text>
<text x="40" y="326" font-size="12.5" fill="#9fb0c3">The bar is a number, not a vibe.</text>
<text x="520" y="100" font-size="13" font-weight="bold" fill="#9fb0c3">THE SELECTION LADDER</text>
<rect x="520" y="120" width="400" height="104" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="720" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">1. Write the bar</text>
<text x="720" y="172" text-anchor="middle" font-size="12.5" fill="#9fb0c3">quality number plus</text>
<text x="720" y="192" text-anchor="middle" font-size="12.5" fill="#9fb0c3">the instrument that</text>
<text x="720" y="212" text-anchor="middle" font-size="12.5" fill="#9fb0c3">measures it</text>
<rect x="520" y="232" width="400" height="104" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="720" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">2. Prototype on Haiku</text>
<text x="720" y="284" text-anchor="middle" font-size="12.5" fill="#9fb0c3">cheapest first;</text>
<text x="720" y="304" text-anchor="middle" font-size="12.5" fill="#9fb0c3">most tasks clear</text>
<text x="720" y="324" text-anchor="middle" font-size="12.5" fill="#9fb0c3">the bar here</text>
<line x1="720" y1="224" x2="720" y2="232" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="520" y="344" width="400" height="104" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="720" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">3. Climb only on evidence</text>
<text x="720" y="396" text-anchor="middle" font-size="12.5" fill="#9fb0c3">a failing slice,</text>
<text x="720" y="416" text-anchor="middle" font-size="12.5" fill="#9fb0c3">not a feeling;</text>
<text x="720" y="436" text-anchor="middle" font-size="12.5" fill="#9fb0c3">re-route the slice</text>
<line x1="720" y1="336" x2="720" y2="344" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="520" y="456" width="400" height="104" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="720" y="486" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">4. Re-run quarterly</text>
<text x="720" y="508" text-anchor="middle" font-size="12.5" fill="#9fb0c3">prices move, models</text>
<text x="720" y="528" text-anchor="middle" font-size="12.5" fill="#9fb0c3">move; the answer</text>
<text x="720" y="548" text-anchor="middle" font-size="12.5" fill="#9fb0c3">expires</text>
<line x1="720" y1="448" x2="720" y2="456" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>