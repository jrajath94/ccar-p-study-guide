<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">CI gates: the four rules that block a bad merge</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Evals are code. They block merges like tests do.</text>
<rect x="40" y="100" width="14" height="62" rx="7" fill="#2563eb"/>
<rect x="70" y="100" width="790" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="92" y="126" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">Accuracy floor</text>
<text x="92" y="148" text-anchor="start" font-size="12" fill="#64748b">overall score stays above the committed threshold (e.g. 90% faithfulness)</text>
<rect x="40" y="176" width="14" height="62" rx="7" fill="#dc2626"/>
<rect x="70" y="176" width="790" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="92" y="202" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">Per-segment, no drops</text>
<text x="92" y="224" text-anchor="start" font-size="12" fill="#64748b">no doc type, tool, or category drops more than ~2 points, even if overall holds</text>
<rect x="40" y="252" width="14" height="62" rx="7" fill="#d97706"/>
<rect x="70" y="252" width="790" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="92" y="278" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">Latency ceiling</text>
<text x="92" y="300" text-anchor="start" font-size="12" fill="#64748b">p95 on the eval set stays under the SLA; 2 points more accurate but 3x slower fails</text>
<rect x="40" y="328" width="14" height="62" rx="7" fill="#16a34a"/>
<rect x="70" y="328" width="790" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="92" y="354" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">Safety slice</text>
<text x="92" y="376" text-anchor="start" font-size="12" fill="#64748b">adversarial cases pass at 100%, binary, never averaged</text>
</svg>
