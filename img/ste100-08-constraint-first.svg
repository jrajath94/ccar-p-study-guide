<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="480" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="478" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">The constraint-first method</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Find the rule in the scenario before you read the options.</text>
<rect x="40" y="100" width="190" height="180" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="135.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">1. Scenario</text>
<text x="135.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">read the story</text>
<text x="135.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="135.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">who, what,</text>
<text x="135.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">which system</text>
<rect x="270" y="100" width="190" height="180" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="365.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#d97706">2. Constraint</text>
<text x="365.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">find the rule:</text>
<text x="365.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="365.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">&quot;must never&quot;</text>
<text x="365.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">&quot;at 2am&quot;</text>
<text x="365.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">&quot;even if...&quot;</text>
<rect x="500" y="100" width="170" height="180" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="585.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16a34a">3. Ask</text>
<text x="585.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">what is the</text>
<text x="585.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">question</text>
<text x="585.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">really asking?</text>
<rect x="710" y="100" width="150" height="180" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="785.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c3aed">4. Options</text>
<text x="785.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">eliminate</text>
<text x="785.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">against the</text>
<text x="785.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">constraint</text>
<line x1="230" y1="190" x2="270" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="460" y1="190" x2="500" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="670" y1="190" x2="710" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="180" y="320" width="540" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="450.0" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">Why this order works</text>
<text x="450.0" y="366" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">the constraint is the scoring key</text>
<text x="450.0" y="385" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">several options will be partly correct</text>
<text x="450.0" y="404" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">the credited answer best satisfies the stated constraint</text>
</svg>