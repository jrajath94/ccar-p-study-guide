<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="480" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker></defs><text x="560.0" y="34" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The five D6 exam rules</text><rect x="180" y="70" width="760" height="62" rx="8" fill="#FFFFFF" stroke="#D7DCE2" stroke-width="1.2"/><rect x="180" y="70" width="7" height="62" rx="3.5" fill="#1F5FBF"/><text x="205" y="109" font-size="15" fill="#1F5FBF" text-anchor="start" font-weight="700">1. Constraint-first</text><text x="935" y="109" font-size="13.5" fill="#24292F" text-anchor="end" font-weight="400">stakeholders, numbers, missing pieces</text><rect x="180" y="148" width="760" height="62" rx="8" fill="#FFFFFF" stroke="#D7DCE2" stroke-width="1.2"/><rect x="180" y="148" width="7" height="62" rx="3.5" fill="#0E7C7B"/><text x="205" y="187" font-size="15" fill="#0E7C7B" text-anchor="start" font-weight="700">2. Skipped step</text><text x="935" y="187" font-size="13.5" fill="#24292F" text-anchor="end" font-weight="400">the answer is the step they skipped</text><rect x="180" y="226" width="760" height="62" rx="8" fill="#FFFFFF" stroke="#D7DCE2" stroke-width="1.2"/><rect x="180" y="226" width="7" height="62" rx="3.5" fill="#A15C07"/><text x="205" y="265" font-size="15" fill="#A15C07" text-anchor="start" font-weight="700">3. Split absolutes</text><text x="935" y="265" font-size="13.5" fill="#24292F" text-anchor="end" font-weight="400">"100%" becomes a measured rate + safety net</text><rect x="180" y="304" width="760" height="62" rx="8" fill="#FFFFFF" stroke="#D7DCE2" stroke-width="1.2"/><rect x="180" y="304" width="7" height="62" rx="3.5" fill="#1A7F37"/><text x="205" y="343" font-size="15" fill="#1A7F37" text-anchor="start" font-weight="700">4. Name the owner</text><text x="935" y="343" font-size="13.5" fill="#24292F" text-anchor="end" font-weight="400">evals, quality, and decisions need names</text><rect x="180" y="382" width="760" height="62" rx="8" fill="#FFFFFF" stroke="#D7DCE2" stroke-width="1.2"/><rect x="180" y="382" width="7" height="62" rx="3.5" fill="#1F5FBF"/><text x="205" y="421" font-size="15" fill="#1F5FBF" text-anchor="start" font-weight="700">5. Recommend</text><text x="935" y="421" font-size="13.5" fill="#24292F" text-anchor="end" font-weight="400">options + tripwire; do not decree</text><text x="560.0" y="466" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">Five moves that turn every D6 scenario into a checkable answer.</text></svg>