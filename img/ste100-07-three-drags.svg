<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="468" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">The three drags on developer productivity</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">One developer with AI tools is a preference. Two hundred is an operations problem.</text>
<rect x="30" y="90" width="270" height="250" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="165.0" y="114" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#dc2626">1. Drift</text>
<text x="165.0" y="136" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">every machine behaves</text>
<text x="165.0" y="155" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">differently</text>
<text x="165.0" y="174" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="165.0" y="193" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">same prompt,</text>
<text x="165.0" y="212" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">different code</text>
<text x="165.0" y="231" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="165.0" y="250" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">debugging becomes</text>
<text x="165.0" y="269" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">guesswork</text>
<rect x="315" y="90" width="270" height="250" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="450.0" y="114" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#d97706">2. Unsafe speed</text>
<text x="450.0" y="136" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">AI writes faster than</text>
<text x="450.0" y="155" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">reviewers can read</text>
<text x="450.0" y="174" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="450.0" y="193" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">defects ship at</text>
<text x="450.0" y="212" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">machine speed</text>
<text x="450.0" y="231" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="450.0" y="250" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">unless gates catch them</text>
<rect x="600" y="90" width="270" height="250" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="735.0" y="114" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c3aed">3. Invisible failures</text>
<text x="735.0" y="136" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">production LLM systems</text>
<text x="735.0" y="155" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">fail in ways no</text>
<text x="735.0" y="174" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">debugger shows</text>
<text x="735.0" y="193" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="735.0" y="212" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">without traces and</text>
<text x="735.0" y="231" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">runbooks, on-call</text>
<text x="735.0" y="250" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">is blind</text>
<text x="450.0" y="375" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">The stack in this volume fixes all three, bottom to top:</text>
<rect x="60" y="395" width="240" height="55" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="180.0" y="419" text-anchor="middle" font-size="1" font-weight="bold" fill="#64748b"></text>
<text x="180" y="418" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">consistent</text>
<text x="180" y="436" text-anchor="middle" font-size="12" font-weight="normal" fill="#64748b">environments</text>
<rect x="330" y="395" width="240" height="55" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="450.0" y="419" text-anchor="middle" font-size="1" font-weight="bold" fill="#64748b"></text>
<text x="450" y="418" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">guardrailed tools,</text>
<text x="450" y="436" text-anchor="middle" font-size="12" font-weight="normal" fill="#64748b">gated workflows</text>
<rect x="600" y="395" width="240" height="55" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="720.0" y="419" text-anchor="middle" font-size="1" font-weight="bold" fill="#64748b"></text>
<text x="720" y="418" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">debuggable systems</text>
<text x="720" y="436" text-anchor="middle" font-size="12" font-weight="normal" fill="#64748b">+ runbooks</text>
</svg>