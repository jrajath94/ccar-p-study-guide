<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="540" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="538" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Capstone: one production app, climbed rung by rung</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">The whole volume as one ladder. Each rung adds exactly one layer of reality.</text>
<rect x="40" y="100" width="820" height="89" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="450.0" y="132" text-anchor="middle" font-size="15" fill="#1e40af" font-weight="bold">RUNG 1: The simplest app that works</text>
<text x="60" y="162" text-anchor="start" font-size="12" fill="#64748b">chat UI -&gt; your app -&gt; Messages API -&gt; answer text</text>
<line x1="450" y1="228" x2="450" y2="238" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="238" width="820" height="89" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
<text x="450.0" y="270" text-anchor="middle" font-size="15" fill="#5b21b6" font-weight="bold">RUNG 2: It gets real</text>
<text x="60" y="300" text-anchor="start" font-size="12" fill="#64748b">stateless: you own messages[]  |  streaming SSE  |  client tool: your code runs  |  Haiku triages, Sonnet answers</text>
<line x1="450" y1="366" x2="450" y2="376" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="376" width="820" height="89" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="450.0" y="408" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">RUNG 3: Full production picture</text>
<text x="60" y="438" text-anchor="start" font-size="12" fill="#64748b">cached system prompt  |  MCP CRM connector  |  Opus thinking on hard tickets  |  429 backoff  |  nightly batches  |  guardrails</text>
<text x="450.0" y="514" text-anchor="middle" font-size="12" fill="#94a3b8">Watch a support copilot grow from one call to the full production picture.</text>
</svg>
