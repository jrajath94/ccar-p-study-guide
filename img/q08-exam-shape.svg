<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="460" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="458" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">What 63 items in 120 minutes demands</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Scoring rewards knowledge spread wide, not deep mastery of one domain.</text>
<rect x="40" y="100" width="820" height="60" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<rect x="60" y="118" width="456" height="24" rx="6" fill="#2563eb" opacity="0.85"/>
<rect x="516" y="118" width="190" height="24" rx="6" fill="#d97706" opacity="0.85"/>
<rect x="706" y="118" width="176" height="24" rx="6" fill="#7c3aed" opacity="0.85"/>
<text x="288" y="135" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">~35 single-choice</text>
<text x="611" y="135" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">~14 multi</text>
<text x="794" y="135" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">13 scenario</text>
<circle cx="70" cy="204" r="14" fill="#2563eb" opacity="0.15"/>
<text x="70" y="209" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="bold">1</text>
<text x="100" y="202" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">Two passes, not one sprint</text>
<text x="100" y="224" text-anchor="start" font-size="12" fill="#64748b">Answer what you know; flag the long scenarios. Return with time left.</text>
<circle cx="70" cy="270" r="14" fill="#d97706" opacity="0.15"/>
<text x="70" y="275" text-anchor="middle" font-size="14" fill="#d97706" font-weight="bold">2</text>
<text x="100" y="268" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">1:54 per item is a budget</text>
<text x="100" y="290" text-anchor="start" font-size="12" fill="#64748b">A "first step" stem means name the very first action, not the best tool.</text>
<circle cx="70" cy="336" r="14" fill="#16a34a" opacity="0.15"/>
<text x="70" y="341" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="bold">3</text>
<text x="100" y="334" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">Multi-response: read the count</text>
<text x="100" y="356" text-anchor="start" font-size="12" fill="#64748b">Each item tells you how many to select. Select exactly that many.</text>
<circle cx="70" cy="402" r="14" fill="#7c3aed" opacity="0.15"/>
<text x="70" y="407" text-anchor="middle" font-size="14" fill="#7c3aed" font-weight="bold">4</text>
<text x="100" y="400" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">No negative marking</text>
<text x="100" y="422" text-anchor="start" font-size="12" fill="#64748b">Never leave an item blank; a guess on a flagged item is still a chance.</text>
</svg>
