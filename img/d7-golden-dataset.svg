<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="440" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="438" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">The golden dataset recipe</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">50-200 pairs. Coverage over volume. Refresh on every real failure.</text>
<rect x="40" y="100" width="220" height="66" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="150" y="140" text-anchor="middle" font-size="13" fill="#1e40af" font-weight="bold">50-200 pairs</text>
<rect x="270" y="100" width="590" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="290" y="140" text-anchor="start" font-size="13" fill="#1e293b">enough to see patterns, small enough to curate by hand</text>
<rect x="40" y="178" width="220" height="66" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="150" y="218" text-anchor="middle" font-size="13" fill="#166534" font-weight="bold">COVERAGE</text>
<rect x="270" y="178" width="590" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="290" y="218" text-anchor="start" font-size="13" fill="#1e293b">every doc type, every tool, every known failure mode</text>
<rect x="40" y="256" width="220" height="66" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="150" y="296" text-anchor="middle" font-size="13" fill="#92400e" font-weight="bold">KNOWN-GOOD ANSWERS</text>
<rect x="270" y="256" width="590" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="290" y="296" text-anchor="start" font-size="13" fill="#1e293b">written or verified by a human, not the model</text>
<rect x="40" y="334" width="220" height="66" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="150" y="374" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">REFRESH RULE</text>
<rect x="270" y="334" width="590" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="290" y="374" text-anchor="start" font-size="13" fill="#1e293b">every production failure the set missed becomes a new pair</text>
<text x="450.0" y="414" text-anchor="middle" font-size="12" fill="#94a3b8">A golden set that never grows is a museum, not a harness.</text>
</svg>
