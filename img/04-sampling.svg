<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Sampling: you cannot keep everything</text><rect x="60" y="70" width="490" height="340" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="305" y="102" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">HEAD-BASED</text><text x="305" y="130" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">decide at request start</text><text x="305" y="175" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">keep 1 in 100</text><text x="305" y="211" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">cheap</text><text x="305" y="247" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">but misses rare failures</text><rect x="570" y="70" width="490" height="340" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="815" y="102" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">TAIL-BASED</text><text x="815" y="130" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">decide after seeing the outcome</text><text x="815" y="175" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">keep all errors and slow requests,</text><text x="815" y="211" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">sample the successes</text><text x="815" y="247" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">best signal per dollar</text><rect x="160" y="435" width="800" height="44" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="560" y="463" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">Always keep aggregates: unsampled requests still feed counters and histograms, so dashboards stay complete.</text></svg>