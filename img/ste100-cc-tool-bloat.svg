<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="Anthropic Sans, Inter, 'Source Sans 3', sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Capability bloat: the exam's favorite D3 diagnosis</text><rect x="60" y="90" width="300" height="200" rx="10" fill="#F2F3F5" stroke="#8A94A0" stroke-width="1.5"/><text x="210.0" y="120" font-size="16" text-anchor="middle" font-weight="700" fill="#8A94A0">Before</text><text x="210.0" y="148" font-size="13" text-anchor="middle" fill="#24292F">6 tools</text><text x="210.0" y="168" font-size="13" text-anchor="middle" fill="#24292F">accuracy 91%</text><rect x="410" y="90" width="300" height="200" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/><text x="560.0" y="120" font-size="16" text-anchor="middle" font-weight="700" fill="#C0392B">Bloat</text><text x="560.0" y="148" font-size="13" text-anchor="middle" fill="#24292F">34 tools</text><text x="560.0" y="168" font-size="13" text-anchor="middle" fill="#24292F">accuracy 91% to 78%</text><text x="560.0" y="188" font-size="13" text-anchor="middle" fill="#24292F">latency +2.3 s</text><rect x="760" y="90" width="300" height="200" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="910.0" y="120" font-size="16" text-anchor="middle" font-weight="700" fill="#0E7C7B">Fix: decompose</text><text x="910.0" y="148" font-size="13" text-anchor="middle" fill="#24292F">split by workflow</text><text x="910.0" y="168" font-size="13" text-anchor="middle" fill="#24292F">domain</text><text x="910.0" y="188" font-size="13" text-anchor="middle" fill="#24292F">scope tools</text><line x1="360" y1="190" x2="410" y2="190" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="710" y1="190" x2="760" y2="190" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Signs: tool counts far beyond the task, overlapping descriptions. A router on top adds a call without fixing bloat.</text></svg>