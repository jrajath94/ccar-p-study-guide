<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="440" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="438" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Caching decisions: the evaluation order</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">The first "no" ends the analysis. Never start with the model.</text>
<rect x="40" y="100" width="52" height="52" rx="26" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="66" y="133" text-anchor="middle" font-size="18" fill="#dc2626" font-weight="bold">1</text>
<rect x="110" y="100" width="750" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="130" y="126" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">Reuse: same prefix read often enough to beat the 1.25x write?</text>
<text x="130" y="148" text-anchor="start" font-size="12" fill="#64748b">no: caching cannot win</text>
<rect x="40" y="178" width="52" height="52" rx="26" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="66" y="211" text-anchor="middle" font-size="18" fill="#d97706" font-weight="bold">2</text>
<rect x="110" y="178" width="750" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="130" y="204" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">Length: prefix of 512+ tokens (1024+ Sonnet/Opus)?</text>
<text x="130" y="226" text-anchor="start" font-size="12" fill="#64748b">no: below the minimum</text>
<rect x="40" y="256" width="52" height="52" rx="26" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<text x="66" y="289" text-anchor="middle" font-size="18" fill="#7c3aed" font-weight="bold">3</text>
<rect x="110" y="256" width="750" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="130" y="282" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">Stability: does the prefix survive minutes, not seconds?</text>
<text x="130" y="304" text-anchor="start" font-size="12" fill="#64748b">no: volatility kills payback</text>
<rect x="40" y="334" width="52" height="52" rx="26" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<text x="66" y="367" text-anchor="middle" font-size="18" fill="#0d9488" font-weight="bold">4</text>
<rect x="110" y="334" width="750" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="130" y="360" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">TTL fit: does reuse fit inside 5 minutes?</text>
<text x="130" y="382" text-anchor="start" font-size="12" fill="#64748b">no: expires before it pays</text>
</svg>
