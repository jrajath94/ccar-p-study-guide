<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="480" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="478" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Design 8: the cost / latency / quality triangle</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Every design in this guide is a point inside this triangle.</text>
<polygon points="450,110 180,380 720,380" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="450" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">QUALITY</text>
<text x="150" y="400" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">COST</text>
<text x="750" y="400" text-anchor="middle" font-size="15" font-weight="bold" fill="#d97706">LATENCY</text>
<text x="450" y="250" text-anchor="middle" font-size="12" font-weight="normal" fill="#64748b">cheaper model</text>
<text x="450" y="275" text-anchor="middle" font-size="12" font-weight="normal" fill="#64748b">moves you here</text>
<circle cx="380" cy="320" r="8" fill="#7c3aed"/>
<text x="400" y="325" text-anchor="start" font-size="12" font-weight="bold" fill="#7c3aed">your design</text>
<text x="450" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Push one corner and the other two push back.</text>
<text x="450" y="445" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#64748b">The master framework: name the binding constraint first.</text>
</svg>