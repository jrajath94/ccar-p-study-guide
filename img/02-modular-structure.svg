<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Modules: stable up front, volatile last, each small and single-purpose</text><rect x="40" y="90" width="190" height="120" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="135" y="130" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">role</text><text x="135" y="158" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">stable</text><rect x="248" y="90" width="190" height="120" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="343" y="130" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">policy</text><text x="343" y="158" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">stable</text><line x1="240" y1="150" x2="246" y2="150" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="456" y="90" width="190" height="120" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="551" y="130" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">format</text><text x="551" y="158" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">stable</text><line x1="448" y1="150" x2="454" y2="150" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="664" y="90" width="190" height="120" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="759" y="130" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">domain</text><text x="759" y="158" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">varies</text><line x1="656" y1="150" x2="662" y2="150" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="872" y="90" width="190" height="120" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="967" y="130" font-size="15" fill="#B42318" text-anchor="middle" font-weight="700">per-request</text><text x="967" y="158" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">volatile</text><line x1="864" y1="150" x2="870" y2="150" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="40" y1="245" x2="1060" y2="245" stroke="#1A7F37" stroke-width="2"/><text x="560" y="268" font-size="13.5" fill="#1A7F37" text-anchor="middle" font-weight="600">cached static prefix lives here: put stable modules first</text><rect x="160" y="300" width="800" height="150" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="560" y="330" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="700">The rules</text><text x="560" y="360" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">version like code: modules live in source control with change review</text><text x="560" y="388" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">a prompt change is a deployment: test the rendered prompt on evals first</text><text x="560" y="416" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">keep modules small and single-purpose, or the module becomes the mega-prompt</text></svg>