<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="540" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The calendar integration: done wrong and right</text><rect x="30" y="60" width="520" height="420" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="290" y="92" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">WRONG</text><text x="290" y="130" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">one API key for all users</text><text x="290" y="162" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">read_write scope for everyone</text><text x="290" y="194" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">agent can delete any event</text><text x="290" y="226" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">no approval step, no logs</text><text x="290" y="258" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="290" y="290" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">&quot;cancel all meetings Friday,</text><text x="290" y="322" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">says the CEO&quot; executes with no check</text><rect x="570" y="60" width="520" height="420" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="830" y="92" font-size="16" fill="#1A7F37" text-anchor="middle" font-weight="700">RIGHT</text><text x="830" y="130" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">per-user OAuth; read scope by default</text><text x="830" y="162" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">write scope only when the user asks to book</text><text x="830" y="194" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">every write pauses for a confirmation click</text><text x="830" y="226" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">server validates scopes per tool call</text><text x="830" y="258" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">all calls logged with user ID</text><text x="830" y="290" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="830" y="322" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">the same injection dies at the scope</text><text x="830" y="354" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">check or the approval click</text></svg>