<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" aria-label="Seven common trap patterns: aggregate, prompt-plea, bigger-model, demo, good-engineering, fan-out, retry-storm">
  <style>
    text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
    .small { font-size: 14px; fill: #a8a8a8; }
    .lbl { font-size: 16px; font-weight: bold; fill: #f0b429; }
  </style>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="bold">Seven trap patterns (and their antidotes)</text>
  <g>
    <rect x="20" y="55" width="380" height="88" rx="8" fill="#141414" stroke="#333" stroke-width="1"/>
    <text x="40" y="82" class="lbl">1. The aggregate trap</text>
    <text x="40" y="104" class="small">Overall metrics hiding per-segment failures.</text>
    <text x="40" y="124" class="small">Antidote: check per-type, per-category numbers.</text>
    <rect x="420" y="55" width="380" height="88" rx="8" fill="#141414" stroke="#333" stroke-width="1"/>
    <text x="440" y="82" class="lbl">2. The prompt-plea trap</text>
    <text x="440" y="104" class="small">"Add it to the system prompt" as the safety fix.</text>
    <text x="440" y="124" class="small">Antidote: prompts are bypassable; pick structure.</text>
    <rect x="20" y="155" width="380" height="88" rx="8" fill="#141414" stroke="#333" stroke-width="1"/>
    <text x="40" y="182" class="lbl">3. The bigger-model trap</text>
    <text x="40" y="204" class="small">Upgrading the model to fix retrieval or tool bloat.</text>
    <text x="40" y="224" class="small">Antidote: the failure is architectural, not capacity.</text>
    <rect x="420" y="155" width="380" height="88" rx="8" fill="#141414" stroke="#333" stroke-width="1"/>
    <text x="440" y="182" class="lbl">4. The demo trap</text>
    <text x="440" y="204" class="small">Judging by the happy path.</text>
    <text x="440" y="224" class="small">Antidote: demos impress; eval sets decide.</text>
    <rect x="20" y="255" width="380" height="88" rx="8" fill="#141414" stroke="#333" stroke-width="1"/>
    <text x="40" y="282" class="lbl">5. The good-engineering trap</text>
    <text x="40" y="304" class="small">Sensible in general, violates this constraint.</text>
    <text x="40" y="324" class="small">Antidote: re-check the constraint last.</text>
    <rect x="420" y="255" width="380" height="88" rx="8" fill="#141414" stroke="#333" stroke-width="1"/>
    <text x="440" y="282" class="lbl">6. The fan-out trap</text>
    <text x="440" y="304" class="small">Parallelizing work that is actually sequential.</text>
    <text x="440" y="324" class="small">Antidote: fan-out only helps independent subtasks.</text>
    <rect x="20" y="355" width="780" height="88" rx="8" fill="#141414" stroke="#333" stroke-width="1"/>
    <text x="40" y="382" class="lbl">7. The retry-storm trap</text>
    <text x="40" y="404" class="small">Answering a degraded dependency with more retries instead of timeouts, bulkheads, and circuit breakers.</text>
    <text x="40" y="424" class="small">Antidote: retries deepen the overload they are meant to fix.</text>
  </g>
</svg>
