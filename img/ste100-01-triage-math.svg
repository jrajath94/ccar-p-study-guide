<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1A7F37"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A15C07"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0E7C7B"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B3FA0"/></marker></defs><text x="560" y="38" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The triage math: measurement picks the pattern (routing workflow, small model)</text><rect x="30" y="70" width="340" height="180" rx="10" fill="#F3F4F6" stroke="#5C6570" stroke-width="1.5"/><text x="200" y="98" font-size="15" fill="#5C6570" text-anchor="middle" font-weight="700">TODAY (BASELINE)</text><text x="200" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">600 tickets / day</text><text x="200" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">2 min human reading + routing each</text><text x="200" y="164" font-size="13.5" fill="#24292F" text-anchor="middle">18% misrouted x 8 min re-handling</text><line x1="370" y1="160" x2="420" y2="160" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="420" y="70" width="340" height="180" rx="10" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="590" y="98" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">TARGET</text><text x="590" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">routing accuracy at least 92%</text><text x="590" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">(up from 82%)</text><text x="590" y="164" font-size="13.5" fill="#24292F" text-anchor="middle">human time under 30 s per ticket</text><text x="590" y="185" font-size="13.5" fill="#24292F" text-anchor="middle">measured weekly on 200 samples</text><line x1="760" y1="160" x2="810" y2="160" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="810" y="70" width="280" height="180" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="950" y="98" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">PAYOFF AT 94%</text><text x="950" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">misroutes fall 18% -> 6%</text><text x="950" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">the numbers chose the pattern:</text><text x="950" y="164" font-size="13.5" fill="#24292F" text-anchor="middle">routing workflow, small model</text><rect x="160" y="300" width="800" height="150" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="560" y="328" font-size="15" fill="#0E7C7B" text-anchor="middle" font-weight="700">SUCCESS NUMBER = BASELINE + TARGET + INSTRUMENT</text><text x="560" y="352" font-size="13.5" fill="#24292F" text-anchor="middle">"Triage costs 2 minutes of human time per ticket today.</text><text x="560" y="373" font-size="13.5" fill="#24292F" text-anchor="middle">