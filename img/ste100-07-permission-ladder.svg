<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="480" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="478" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Permissions: allow, ask, deny - plus hooks</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Every tool call is pattern-matched. Deny beats allow at any level.</text>
<rect x="40" y="100" width="230" height="200" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="155.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16a34a">ALLOW</text>
<text x="155.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">safe, routine calls</text>
<text x="155.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="155.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">read files</text>
<text x="155.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">run tests</text>
<text x="155.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">list directories</text>
<rect x="335" y="100" width="230" height="200" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="450.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#d97706">ASK</text>
<text x="450.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">needs human approval</text>
<text x="450.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="450.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">write production</text>
<text x="450.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">code</text>
<text x="450.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">spend money</text>
<rect x="630" y="100" width="230" height="200" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="745.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#dc2626">DENY</text>
<text x="745.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">never permitted</text>
<text x="745.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="745.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">exfiltrate secrets</text>
<text x="745.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">disable guardrails</text>
<text x="745.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">harmful actions</text>
<line x1="270" y1="200" x2="335" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="565" y1="200" x2="630" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="250" y="340" width="400" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="450.0" y="364" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">Hooks: the extra gate</text>
<text x="450.0" y="386" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">PreToolUse scans the call BEFORE it runs</text>
<text x="450.0" y="405" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">blocks secret patterns, enforces policy</text>
<line x1="450" y1="300" x2="450" y2="340" stroke="#2563eb" stroke-width="2" marker-end="url(#ahb)"/>
<text x="450.0" y="465" text-anchor="middle" font-size="13" font-weight="normal" fill="#64748b">If deny rules are missing, dangerous calls have no backstop.</text>
</svg>