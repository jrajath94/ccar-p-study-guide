<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<rect width="960" height="580" rx="14" fill="#1e293b"/>
<text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#e8e6e1">Five doors, each at the failure location</text>
<text x="480" y="62" text-anchor="middle" font-size="13" fill="#9fb0c3">Match the door to where the failure happens, not to the symptom.</text>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="aht" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#0d9488"/></marker><marker id="aha" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#d97706"/></marker></defs>
<rect x="16" y="96" width="176" height="170" rx="10" fill="#28303d" stroke="#2563eb" stroke-width="1.5"/>
<text x="104" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">Input</text>
<text x="104" y="148" text-anchor="middle" font-size="12" fill="#9fb0c3">PII, injection</text>
<text x="104" y="168" text-anchor="middle" font-size="12" fill="#9fb0c3">patterns in</text>
<text x="104" y="188" text-anchor="middle" font-size="12" fill="#9fb0c3">user input</text>
<rect x="204" y="96" width="176" height="170" rx="10" fill="#28303d" stroke="#d97706" stroke-width="1.5"/>
<text x="292" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">Classifier</text>
<text x="292" y="148" text-anchor="middle" font-size="12" fill="#9fb0c3">jailbreak style,</text>
<text x="292" y="168" text-anchor="middle" font-size="12" fill="#9fb0c3">social-engineering</text>
<text x="292" y="188" text-anchor="middle" font-size="12" fill="#9fb0c3">probes</text>
<rect x="392" y="96" width="176" height="170" rx="10" fill="#28303d" stroke="#dc2626" stroke-width="1.5"/>
<text x="480" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">Policy engine</text>
<text x="480" y="148" text-anchor="middle" font-size="12" fill="#9fb0c3">rules that must</text>
<text x="480" y="168" text-anchor="middle" font-size="12" fill="#9fb0c3">never bend: SSN,</text>
<text x="480" y="188" text-anchor="middle" font-size="12" fill="#9fb0c3">deny-list topics</text>
<rect x="580" y="96" width="176" height="170" rx="10" fill="#28303d" stroke="#0d9488" stroke-width="1.5"/>
<text x="668" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">Output</text>
<text x="668" y="148" text-anchor="middle" font-size="12" fill="#9fb0c3">leakage, tone,</text>
<text x="668" y="168" text-anchor="middle" font-size="12" fill="#9fb0c3">ungrounded claims</text>
<text x="668" y="188" text-anchor="middle" font-size="12" fill="#9fb0c3">in the answer</text>
<rect x="768" y="96" width="176" height="170" rx="10" fill="#28303d" stroke="#dc2626" stroke-width="1.5"/>
<text x="856" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">Tool controls</text>
<text x="856" y="148" text-anchor="middle" font-size="12" fill="#9fb0c3">irreversible calls:</text>
<text x="856" y="168" text-anchor="middle" font-size="12" fill="#9fb0c3">confirm or deny</text>
<text x="856" y="188" text-anchor="middle" font-size="12" fill="#9fb0c3">before executing</text>
<line x1="192" y1="181" x2="204" y2="181" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="380" y1="181" x2="392" y2="181" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="568" y1="181" x2="580" y2="181" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="756" y1="181" x2="768" y2="181" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="16" y="300" width="928" height="110" rx="10" fill="#28303d" stroke="#dc2626" stroke-width="1.5"/>
<text x="480" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#fca5a5">The trap</text>
<text x="480" y="352" text-anchor="middle" font-size="12.5" fill="#9fb0c3">A prompt instruction for a rule that must never bend. Prompts persuade; policy engines enforce.</text>
<text x="480" y="372" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Put the rule in the enforcement layer.</text>
<rect x="16" y="430" width="928" height="110" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="480" y="460" text-anchor="middle" font-size="15" font-weight="bold" fill="#e8e6e1">Ask vs deny</text>
<text x="480" y="482" text-anchor="middle" font-size="12.5" fill="#9fb0c3">"Ask" is a speed bump: the user can approve. "Deny" is the only hard control.</text>
<text x="480" y="502" text-anchor="middle" font-size="12.5" fill="#9fb0c3">For destructive actions, deny is the default.</text>
</svg>