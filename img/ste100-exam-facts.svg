<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="330" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">CCAR-P exam facts at a glance</text><rect x="22.0" y="70" width="196" height="200" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="120.0" y="110" font-size="26" text-anchor="middle" font-weight="700" fill="#1F5FBF">63</text><text x="120.0" y="138" font-size="13" text-anchor="middle" fill="#24292F">items</text><text x="120.0" y="158" font-size="13" text-anchor="middle" fill="#24292F">multiple choice and</text><text x="120.0" y="178" font-size="13" text-anchor="middle" fill="#24292F">multiple response</text><rect x="242.0" y="70" width="196" height="200" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="340.0" y="110" font-size="26" text-anchor="middle" font-weight="700" fill="#0E7C7B">120</text><text x="340.0" y="138" font-size="13" text-anchor="middle" fill="#24292F">minutes</text><text x="340.0" y="158" font-size="13" text-anchor="middle" fill="#24292F">about 1 minute 54</text><text x="340.0" y="178" font-size="13" text-anchor="middle" fill="#24292F">seconds per item</text><rect x="462.0" y="70" width="196" height="200" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="560.0" y="110" font-size="26" text-anchor="middle" font-weight="700" fill="#A15C07">720 / 1000</text><text x="560.0" y="138" font-size="13" text-anchor="middle" fill="#24292F">to pass</text><text x="560.0" y="158" font-size="13" text-anchor="middle" fill="#24292F">scaled score, not</text><text x="560.0" y="178" font-size="13" text-anchor="middle" fill="#24292F">a raw percent</text><rect x="682.0" y="70" width="196" height="200" rx="10" fill="#F3E8F7" stroke="#7B2D8E" stroke-width="1.5"/><text x="780.0" y="110" font-size="26" text-anchor="middle" font-weight="700" fill="#7B2D8E">$175</text><text x="780.0" y="138" font-size="13" text-anchor="middle" fill="#24292F">exam fee</text><text x="780.0" y="158" font-size="13" text-anchor="middle" fill="#24292F">paid at scheduling</text><rect x="902.0" y="70" width="196" height="200" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/><text x="1000.0" y="110" font-size="26" text-anchor="middle" font-weight="700" fill="#C0392B">Pearson VUE</text><text x="1000.0" y="138" font-size="13" text-anchor="middle" fill="#24292F">test vendor</text><text x="1000.0" y="158" font-size="13" text-anchor="middle" fill="#24292F">online proctored</text><text x="1000.0" y="178" font-size="13" text-anchor="middle" fill="#24292F">or test center</text><text x="560.0" y="305" font-size="12" text-anchor="middle" font-weight="400" fill="#5C6570">Source: CCAR-P Exam Guide v1.0 (July 2026). Verify fees and format at docs.anthropic.com before exam day.</text></svg>