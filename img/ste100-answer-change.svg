<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="340" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Change an answer only when you can name the error</text><rect x="130" y="80" width="400" height="180" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/><text x="330.0" y="109" font-size="15" text-anchor="middle" font-weight="700" fill="#C0392B">Do NOT change</text><text x="330.0" y="137" font-size="13" text-anchor="middle" fill="#24292F">on a "feeling"</text><text x="330.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">feelings lose points</text><rect x="590" y="80" width="400" height="180" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="790.0" y="109" font-size="15" text-anchor="middle" font-weight="700" fill="#0E7C7B">DO change</text><text x="790.0" y="137" font-size="13" text-anchor="middle" fill="#24292F">when you can name</text><text x="790.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">the exact error</text><text x="790.0" y="177" font-size="13" text-anchor="middle" fill="#24292F">misread stem, wrong rule</text><text x="560.0" y="305" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">First instincts beat second guesses unless you find a concrete mistake.</text></svg>