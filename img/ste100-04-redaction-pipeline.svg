<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker></defs><text x="560.0" y="34" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">PII redaction and log hygiene</text><rect x="30" y="90" width="220" height="210" rx="10" fill="#F2F4F7" stroke="#B42318" stroke-width="1.5"/><text x="140.0" y="120" font-size="15" fill="#B42318" text-anchor="middle" font-weight="700">Raw log</text><text x="140.0" y="146" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">user text with PII</text><text x="140.0" y="168" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">names, emails, IDs</text><rect x="310" y="90" width="220" height="210" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="420.0" y="120" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">Detect PII</text><text x="420.0" y="146" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">regex + classifier</text><text x="420.0" y="168" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">tag each span</text><rect x="590" y="90" width="220" height="210" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="700.0" y="120" font-size="15" fill="#0E7C7B" text-anchor="middle" font-weight="700">Redact / mask</text><text x="700.0" y="146" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">replace with [NAME]</text><text x="700.0" y="168" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">keep format, drop value</text><rect x="870" y="90" width="220" height="210" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="980.0" y="120" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">Safe to store</text><text x="980.0" y="146" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">no raw PII at rest</text><text x="980.0" y="168" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">audits pass</text><line x1="250" y1="195" x2="310" y2="195" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="530" y1="195" x2="590" y2="195" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="810" y1="195" x2="870" y2="195" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560" y="350" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="600">Never store the raw log. Retention clocks start after redaction.</text><text x="560.0" y="386" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">Redact before storage. Raw PII in logs is a breach waiting for an audit.</text></svg>