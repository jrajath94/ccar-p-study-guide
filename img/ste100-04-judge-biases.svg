<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker></defs><text x="560.0" y="34" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">LLM judge failure modes</text><rect x="20" y="70" width="253" height="250" rx="8" fill="#FFFFFF" stroke="#D7DCE2" stroke-width="1.2"/><rect x="20" y="70" width="7" height="250" rx="3.5" fill="#1F5FBF"/><text x="40" y="98" font-size="14" fill="#1F5FBF" text-anchor="start" font-weight="700">Position bias</text><text x="40" y="122" font-size="13" fill="#24292F" text-anchor="start" font-weight="400">prefers the answer shown first</text><text x="40" y="143" font-size="13" fill="#24292F" text-anchor="start" font-weight="400">fix: swap order, average</text><text x="40" y="164" font-size="13" fill="#24292F" text-anchor="start" font-weight="400">both orders must agree</text><rect x="293" y="70" width="253" height="250" rx="8" fill="#FFFFFF" stroke="#D7DCE2" stroke-width="1.2"/><rect x="293" y="70" width="7" height="250" rx="3.5" fill="#0E7C7B"/><text x="313" y="98" font-size="14" fill="#0E7C7B" text-anchor="start" font-weight="700">Verbosity bias</text><text x="313" y="122" font-size="13" fill="#24292F" text-anchor="start" font-weight="400">prefers longer answers</text><text x="313" y="143" font-size="13" fill="#24292F" text-anchor="start" font-weight="400">fix: cap length, penalize fluff</text><text x="313" y="164" font-size="13" fill="#24292F" text-anchor="start" font-weight="400">length is not quality</text><rect x="566" y="70" width="253" height="250" rx="8" fill="#FFFFFF" stroke="#D7DCE2" stroke-width="1.2"/><rect x="566" y="70" width="7" height="250" rx="3.5" fill="#A15C07"/><text x="586" y="98" font-size="14" fill="#A15C07" text-anchor="start" font-weight="700">Self-preference</text><text x="586" y="122" font-size="13" fill="#24292F" text-anchor="start" font-weight="400">prefers its own model family</text><text x="586" y="143" font-size="13" fill="#24292F" text-anchor="start" font-weight="400">fix: blind the judge to source</text><text x="586" y="164" font-size="13" fill="#24292F" text-anchor="start" font-weight="400">hide who wrote it</text><rect x="839" y="70" width="253" height="250" rx="8" fill="#FFFFFF" stroke="#D7DCE2" stroke-width="1.2"/><rect x="839" y="70" width="7" height="250" rx="3.5" fill="#1A7F37"/><text x="859" y="98" font-size="14" fill="#1A7F37" text-anchor="start" font-weight="700">Harshness drift</text><text x="859" y="122" font-size="13" fill="#24292F" text-anchor="start" font-weight="400">scores drift across a long run</text><text x="859" y="143" font-size="13" fill="#24292F" text-anchor="start" font-weight="400">fix: shuffle, re-anchor often</text><text x="859" y="164" font-size="13" fill="#24292F" text-anchor="start" font-weight="400">recalibrate mid-run</text><text x="560.0" y="386" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">The exam loves these. Name the bias, then name the fix.</text></svg>