00" height="80" rx="10" fill="#F3F4F6" stroke="#5C6570" stroke-width="1.5"/><text x="280" y="194" font-size="13.5" fill="#24292F" text-anchor="middle">span: LLM call 1</text><text x="280" y="216" font-size="13.5" fill="#24292F" text-anchor="middle">1.2 s</text><rect x="460" y="160" width="200" height="80" rx="10" fill="#F3F4F6" stroke="#5C6570" stroke-width="1.5"/><text x="560" y="194" font-size="13.5" fill="#24292F" text-anchor="middle">span: tool search_docs</text><text x="560" y="216" font-size="13.5" fill="#24292F" text-anchor="middle">0.9 s</text><rect x="740" y="160" width="200" height="80" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/><text x="840" y="194" font-size="13.5" fill="#24292F" text-anchor="middle">span: LLM call 2</text><text x="840" y="216" font-size="13.5" fill="#24292F" text-anchor="middle">1.8 s: the slow bar</text><line x1="560" y1="130" x2="560" y2="160" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="460" y="270" width="200" height="80" rx="10" fill="#F3F4F6" stroke="#5C6570" stroke-width="1.5"/><text x="560" y="304" font-size="13.5" fill="#24292F" text-anchor="middle">span: tool: get_rows</text><text x="560" y="326" font-size="13.5" fill="#24292F" text-anchor="middle">0.3 s</text><line x1="560" y1="240" x2="560" y2="270" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="160" y="390" width="800" height="90" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="560" y="418" font-size="15" fill="#0E7C7B" text-anchor="middle" font-weight="700">THE DIAGNOSIS</text><text x="560" y="442" font-size="13.5" fill="#24292F" text-anchor="middle">a slow request is diagnosed by reading the span tree and finding the longest bar</text></svg>