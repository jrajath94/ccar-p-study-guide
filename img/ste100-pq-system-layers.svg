<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">System prompt: the stable contract</text><rect x="120" y="90" width="420" height="200" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="330.0" y="120" font-size="16" text-anchor="middle" font-weight="700" fill="#0E7C7B">System: stable</text><text x="330.0" y="148" font-size="13" text-anchor="middle" fill="#24292F">persona, global rules</text><text x="330.0" y="168" font-size="13" text-anchor="middle" fill="#24292F">almost never changes</text><text x="330.0" y="188" font-size="13" text-anchor="middle" fill="#24292F">stays cacheable</text><rect x="600" y="90" width="420" height="200" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/><text x="810.0" y="120" font-size="16" text-anchor="middle" font-weight="700" fill="#C0392B">Messages: volatile</text><text x="810.0" y="148" font-size="13" text-anchor="middle" fill="#24292F">dates, names, request ids</text><text x="810.0" y="168" font-size="13" text-anchor="middle" fill="#24292F">changes every call</text><text x="810.0" y="188" font-size="13" text-anchor="middle" fill="#24292F">kills the cache hit rate</text><line x1="540" y1="190" x2="600" y2="190" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Stable first, variable last. Never put volatile fields inside the cached prefix.</text></svg>