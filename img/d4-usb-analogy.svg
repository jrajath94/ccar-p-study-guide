<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">MCP is USB for AI: N+M beats N x M</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Before the standard, every model needed a custom driver for every tool.</text>
<rect x="40" y="100" width="380" height="130" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="230" y="138" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">BEFORE: N x M</text>
<text x="230" y="168" text-anchor="middle" font-size="13" fill="#64748b">3 models x 4 tools = 12 integrations</text>
<text x="230" y="194" text-anchor="middle" font-size="12" fill="#64748b">each one custom, each one rotting</text>
<rect x="480" y="100" width="380" height="130" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="670" y="138" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">AFTER: N + M</text>
<text x="670" y="168" text-anchor="middle" font-size="13" fill="#64748b">3 models + 4 servers = 7 connections</text>
<text x="670" y="194" text-anchor="middle" font-size="12" fill="#64748b">one open protocol, tools reused</text>
<line x1="420" y1="165" x2="480" y2="165" stroke="#64748b" stroke-width="3" marker-end="url(#ah)"/>
<text x="450" y="300" text-anchor="middle" font-size="13" fill="#64748b">The exam asks: why does a standard beat point-to-point? Maintenance cost.</text>
</svg>
