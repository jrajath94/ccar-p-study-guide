<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="408" viewBox="0 0 1120 408" font-family="Anthropic Sans, Inter, 'Source Sans 3', sans-serif"><rect x="0" y="0" width="1120" height="408" fill="#F7F4EE"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6B7A"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1E4D8C"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#1B2838">Human-in-the-loop tiers: place humans by risk</text><rect x="50" y="90" width="310" height="190" rx="10" fill="#E6E2DA" stroke="#1F7A72" stroke-width="1.5"/><text x="205.0" y="120" font-size="16" text-anchor="middle" font-weight="700" fill="#1F7A72">Read-only</text><text x="205.0" y="148" font-size="13" text-anchor="middle" fill="#1B2838">no approval</text><text x="205.0" y="168" font-size="13" text-anchor="middle" fill="#1B2838">just log</text><rect x="405" y="90" width="310" height="190" rx="10" fill="#F6E7A8" stroke="#C46B2C" stroke-width="1.5"/><text x="560.0" y="120" font-size="16" text-anchor="middle" font-weight="700" fill="#C46B2C">Reversible writes</text><text x="560.0" y="148" font-size="13" text-anchor="middle" fill="#1B2838">file a ticket,</text><text x="560.0" y="168" font-size="13" text-anchor="middle" fill="#1B2838">update a status</text><text x="560.0" y="188" font-size="13" text-anchor="middle" fill="#1B2838">show it, offer undo</text><rect x="760" y="90" width="310" height="190" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/><text x="915.0" y="120" font-size="16" text-anchor="middle" font-weight="700" fill="#C0392B">Destructive or sensitive</text><text x="915.0" y="148" font-size="13" text-anchor="middle" fill="#1B2838">reset a password,</text><text x="915.0" y="168" font-size="13" text-anchor="middle" fill="#1B2838">move money</text><text x="915.0" y="188" font-size="13" text-anchor="middle" fill="#1B2838">human reviews first</text><line x1="360" y1="185" x2="405" y2="185" stroke="#5C6B7A" stroke-width="2" marker-end="url(#ah)"/><line x1="715" y1="185" x2="760" y2="185" stroke="#5C6B7A" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="330" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6B7A">Sampling measures; it does not prevent. Irreversible means human review.</text><text x="24" y="399" font-size="13" fill="#5C6B7A">Source: original</text></svg>