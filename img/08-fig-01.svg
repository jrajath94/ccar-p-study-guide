<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Exam time budget: 120 minutes split into a 95 minute first pass and a 25 minute second pass">
  <style>
    text { font-family: "Charis SIL", Georgia, serif; fill: #ececec; }
    .small { font-size: 15px; fill: #a8a8a8; }
    .lbl { font-size: 18px; font-weight: bold; }
  </style>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="bold">120 minutes, 63 items: the two-pass budget</text>
  <!-- bar -->
  <rect x="40" y="70" width="620" height="64" rx="8" fill="#141414" stroke="#f0b429" stroke-width="1.5"/>
  <rect x="160" y="70" width="620" height="64" rx="8" fill="none" stroke="#6cb2ff" stroke-width="1.5"/>
  <line x1="160" y1="70" x2="160" y2="134" stroke="#a8a8a8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="100" y="98" text-anchor="middle" class="lbl">Pass 1</text>
  <text x="100" y="120" text-anchor="middle" class="small">~95 min</text>
  <text x="470" y="98" text-anchor="middle" class="lbl">Pass 2</text>
  <text x="470" y="120" text-anchor="middle" class="small">~25 min reserve</text>
  <!-- labels -->
  <text x="40" y="170" class="small">Answer everything you can at ~90 seconds per item. Flag and move on the moment you re-read a scenario a third time.</text>
  <text x="40" y="196" class="small">Second pass: flagged items only. Multiple-response items borrow time from here, never from the first pass.</text>
  <!-- per-item math -->
  <rect x="40" y="220" width="740" height="56" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <text x="410" y="243" text-anchor="middle" font-size="17">120 min &#247; 63 items = <tspan font-weight="bold" fill="#f0b429">1 min 54 s per item</tspan></text>
  <text x="410" y="266" text-anchor="middle" class="small">A stuck item costs you two easy items elsewhere.</text>
</svg>
