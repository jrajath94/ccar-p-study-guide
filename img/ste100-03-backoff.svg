<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="480" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1A7F37"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A15C07"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0E7C7B"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B3FA0"/></marker></defs><text x="560" y="38" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Exponential backoff: the standard retry rhythm</text><text x="60" y="110" font-size="14" fill="#24292F" text-anchor="start" font-weight="400">attempt 1 fails (429 / 5xx)</text><rect x="60" y="130" width="130" height="60" rx="10" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="125" y="165" font-size="13.5" fill="#24292F" text-anchor="middle">retry 1</text><text x="125" y="225" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">wait 1 s</text><line x1="190" y1="160" x2="260" y2="160" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="260" y="130" width="130" height="60" rx="10" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="325" y="165" font-size="13.5" fill="#24292F" text-anchor="middle">retry 2</text><text x="325" y="225" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">wait 2 s</text><line x1="390" y1="160" x2="460" y2="160" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="460" y="130" width="130" height="60" rx="10" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="525" y="165" font-size="13.5" fill="#24292F" text-anchor="middle">retry 3</text><text x="525" y="225" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">wait 4 s</text><line x1="590" y1="160" x2="660" y2="160" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="660" y="130" width="130" height="60" rx="10" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="725" y="165" font-size="13.5" fill="#24292F" text-anchor="middle">retry 4</text><text x="725" y="225" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">wait 8 s</text><rect x="60" y="270" width="1000" height="160" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="560" y="298" font-size="15" fill="#0E7C7B" text-anchor="middle" font-weight="700">TWO RULES</text><text x="560" y="322" font-size="13.5" fill="#24292F" text-anchor="middle">add jitter (a small random delay): a fleet of servers must not retry in lockstep</text><text x="560" y="343" font-size="13.5" fill="#24292F" text-anchor="middle">retry only 429s and 5xx. When a retry could repeat a side effect, send an idempotency key</text></svg>