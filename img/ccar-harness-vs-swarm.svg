<text x="744" y="314" text-anchor="middle" font-size="12" fill="#0d9488">capped fan-out</text>
<rect x="24" y="336" width="852" height="100" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="450" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#e8e6e1">How to read this figure</text>
<text x="450" y="390" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Giant agent: the middle of long contexts gets skimmed.</text>
<text x="450" y="410" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Swarm: dashed channels connect every peer to every peer.</text>
