<rect x="104" y="196" width="104" height="12" fill="none" stroke="#64748b" stroke-width="1.5"/>
<text x="52" y="207" text-anchor="middle" font-size="11" fill="#9fb0c3">context</text>
<rect x="104" y="196" width="104" height="12" fill="#dc2626"/>
<text x="156" y="230" text-anchor="middle" font-size="12" fill="#dc2626">bloated: quality drops</text>
<text x="156" y="250" text-anchor="middle" font-size="12" fill="#dc2626">as the run continues</text>
<rect x="312" y="88" width="276" height="80" rx="10" fill="#28303d" stroke="#dc2626" stroke-width="1.5"/>
<text x="450" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#fca5a5">TRAP: the swarm</text>
<text x="450" y="140" text-anchor="middle" font-size="12.5" fill="#9fb0c3">peer-to-peer, no controller</text>
