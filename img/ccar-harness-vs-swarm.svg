<text x="450" y="276" text-anchor="middle" font-size="12" fill="#dc2626">n agents: n(n-1)/2 channels</text>
<rect x="612" y="88" width="264" height="80" rx="10" fill="#28303d" stroke="#0d9488" stroke-width="1.5"/>
<text x="744" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#7ee0d2">CREDITED: orchestrator-workers</text>
