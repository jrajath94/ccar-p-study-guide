<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Four tiers, cheapest to dearest: route by task, not prestige</text>
  <g font-size="13.5">
    <rect x="60" y="60" width="560" height="52" rx="8" fill="#d1fae5" stroke="#047857"/>
    <text x="100" y="92" font-weight="bold" fill="#064e3b">Haiku 4.5</text>
    <text x="230" y="92" fill="#475569">$1 / $5 per MTok</text>
    <text x="420" y="92" fill="#475569">fast, cheap, bulk: classification, extraction</text>
    <rect x="60" y="122" width="560" height="52" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="100" y="154" font-weight="bold" fill="#1e40af">Sonnet 5</text>
    <text x="230" y="154" fill="#475569">$2 / $10 per MTok</text>
    <text x="420" y="154" fill="#475569">the workhorse: most production traffic</text>
    <rect x="60" y="184" width="560" height="52" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="100" y="216" font-weight="bold" fill="#78350f">Opus 5.5</text>
    <text x="230" y="216" fill="#475569">$4 / $20 per MTok</text>
    <text x="420" y="216" fill="#475569">complex agents, high-stakes decisions</text>
    <rect x="60" y="246" width="560" height="52" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="100" y="278" font-weight="bold" fill="#7f1d1d">Fable 5.1</text>
    <text x="230" y="278" fill="#475569">$10 / $50 per MTok</text>
    <text x="420" y="278" fill="#475569">hardest reasoning, always-on thinking</text>
  </g>
  <text x="340" y="322" text-anchor="middle" font-size="13.5" fill="#475569">MTok = millions of tokens. Output costs 5x input on every tier.</text>
</svg>
