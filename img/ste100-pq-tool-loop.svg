<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="420" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Tool use: giving Claude hands</text><rect x="60" y="140" width="240" height="140" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="180.0" y="169" font-size="15" text-anchor="middle" font-weight="700" fill="#1F5FBF">Claude</text><text x="180.0" y="197" font-size="13" text-anchor="middle" fill="#24292F">decides it needs</text><text x="180.0" y="217" font-size="13" text-anchor="middle" fill="#24292F">a tool</text><rect x="880" y="140" width="180" height="140" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="970.0" y="169" font-size="15" text-anchor="middle" font-weight="700" fill="#0E7C7B">You</text><text x="970.0" y="197" font-size="13" text-anchor="middle" fill="#24292F">run the tool</text><text x="970.0" y="217" font-size="13" text-anchor="middle" fill="#24292F">return the result</text><rect x="420" y="60" width="280" height="110" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="560.0" y="89" font-size="15" text-anchor="middle" font-weight="700" fill="#A15C07">tool_use block</text><text x="560.0" y="117" font-size="12" text-anchor="middle" fill="#24292F">name + input</text><rect x="420" y="250" width="280" height="110" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="560.0" y="279" font-size="15" text-anchor="middle" font-weight="700" fill="#A15C07">tool_result block</text><text x="560.0" y="307" font-size="12" text-anchor="middle" fill="#24292F">the output</text><line x1="300" y1="175" x2="420" y2="115" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="700" y1="115" x2="880" y2="175" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="880" y1="245" x2="700" y2="305" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="420" y1="305" x2="300" y2="225" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="390" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">The loop repeats until Claude answers without a tool call.</text></svg>