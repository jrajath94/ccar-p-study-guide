<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="480" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1A7F37"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A15C07"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0E7C7B"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B3FA0"/></marker></defs><text x="560" y="38" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Evaluator-optimizer: generate, check, repeat (only when checking is easier than doing)</text><rect x="40" y="100" width="200" height="110" rx="10" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="140" y="150" font-size="13.5" fill="#24292F" text-anchor="middle">GENERATE</text><text x="140" y="170" font-size="13.5" fill="#24292F" text-anchor="middle">one model writes</text><line x1="240" y1="155" x2="310" y2="155" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="310" y="100" width="220" height="110" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="420" y="139" font-size="13.5" fill="#24292F" text-anchor="middle">EVALUATE</text><text x="420" y="160" font-size="13.5" fill="#24292F" text-anchor="middle">rubric, test suite,</text><text x="420" y="181" font-size="13.5" fill="#24292F" text-anchor="middle">or checklist</text><line x1="530" y1="155" x2="600" y2="155" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="600" y="100" width="180" height="110" rx="10" fill="#F3F4F6" stroke="#5C6570" stroke-width="1.5"/><text x="690" y="150" font-size="13.5" fill="#24292F" text-anchor="middle">pass?</text><text x="690" y="170" font-size="13.5" fill="#24292F" text-anchor="middle">quality gate</text><line x1="780" y1="155" x2="860" y2="155" stroke="#1A7F37" stroke-width="2" marker-end="url(#ahg)"/><rect x="860" y="100" width="200" height="110" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="960" y="160" font-size="13.5" fill="#24292F" text-anchor="middle">SHIP IT</text><line x1="420" y1="210" x2="420" y2="280" stroke="#B42318" stroke-width="2" marker-end="url(#ahr)"/><line x1="120" y1="280" x2="420" y2="280" stroke="#B42318" stroke-width="2" stroke-dasharray="7,5"/><line x1="120" y1="280" x2="120" y2="215" stroke="#B42318" stroke-width="2" marker-end="url(#ahr)"/><text x="270" y="305" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="400">rejected: returns with the evaluator's feedback attached</text><rect x="40" y="340" width="1020" height="100" rx="10" fill="#F3F4F6" stroke="#5C6570" stroke-width="1.5"/><text x="550" y="368" font-size="15" fill="#5C6570" text-anchor="middle" font-weight="700">STOP CONDITION + CAP</text><text x="550" y="392" font-size="13.5" fill="#24292F" text-anchor="middle">a clear pass/fail criterion, plus a maximum iteration cap (say 5): typical loops converge in 2-4 rounds</text></svg>