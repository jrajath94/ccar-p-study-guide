<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="540" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Five rules that answer most D6 questions</text><rect x="30" y="70" width="340" height="205" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="100" font-size="13" fill="#1F5FBF" text-anchor="middle" font-weight="700">1. CONSTRAINT-FIRST READING</text><text x="200.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">before the options, write down the</text><text x="200.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">stakeholders, the numbers, the missing</text><text x="200.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">pieces; the trap ignores one of them</text><rect x="393" y="70" width="340" height="205" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="100" font-size="13" fill="#0E7C7B" text-anchor="middle" font-weight="700">2. THE SKIPPED STEP IS THE ANSWER</text><text x="563.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">discovery before architecture;</text><text x="563.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">measurement before promises;</text><text x="563.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">diagnosis before fixes;</text><text x="563.0" y="180" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">ownership before handoff</text><rect x="756" y="70" width="340" height="205" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="100" font-size="13" fill="#A15C07" text-anchor="middle" font-weight="700">3. SPLIT EVERY ABSOLUTE PROMISE</text><text x="926.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">&quot;100% accurate&quot; becomes a measured</text><text x="926.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">quality rate with a safety net;</text><text x="926.0" y="163" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">&quot;99.9% uptime&quot; never covers correctness</text><rect x="60" y="300" width="500" height="205" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="310.0" y="330" font-size="13" fill="#B42318" text-anchor="middle" font-weight="700">4. NAME THE OWNER</text><text x="310.0" y="358" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">drifting quality with no named eval</text><text x="310.0" y="376" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">owner: the answer is the missing owner</text><rect x="580" y="300" width="500" height="205" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="830.0" y="330" font-size="13" fill="#1A7F37" text-anchor="middle" font-weight="700">5. ALIGNMENT IS A LOOP</text><text x="830.0" y="358" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">the feedback loop is what keeps the</text><text x="830.0" y="376" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">SLA honest after signing day</text></svg>