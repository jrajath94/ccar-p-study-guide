<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Context isolation: each server sees only its own tools</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Least privilege is a wiring decision, not a policy document.</text>
<rect x="40" y="110" width="240" height="160" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="160" y="150" text-anchor="middle" font-size="14" fill="#1e40af" font-weight="bold">CRM server</text>
<text x="160" y="180" text-anchor="middle" font-size="12" fill="#64748b">lookup_account, update_ticket</text>
<text x="160" y="206" text-anchor="middle" font-size="11" fill="#94a3b8">its own OAuth scope</text>
<rect x="320" y="110" width="240" height="160" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="440" y="150" text-anchor="middle" font-size="14" fill="#92400e" font-weight="bold">Billing server</text>
<text x="440" y="180" text-anchor="middle" font-size="12" fill="#64748b">issue_refund (approval-gated)</text>
<text x="440" y="206" text-anchor="middle" font-size="11" fill="#94a3b8">its own OAuth scope</text>
<rect x="600" y="110" width="240" height="160" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="720" y="150" text-anchor="middle" font-size="14" fill="#166534" font-weight="bold">Docs server</text>
<text x="720" y="180" text-anchor="middle" font-size="12" fill="#64748b">search_kb (read-only)</text>
<text x="720" y="206" text-anchor="middle" font-size="11" fill="#94a3b8">its own OAuth scope</text>
<text x="450" y="330" text-anchor="middle" font-size="13" fill="#64748b">One compromised server cannot reach the others. Blast radius stays small.</text>
<text x="450.0" y="380" text-anchor="middle" font-size="12" fill="#94a3b8">Separate servers, separate scopes, separate credentials.</text>
</svg>
