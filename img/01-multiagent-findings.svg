<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="440" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">What Anthropic&#x27;s multi-agent research found (their engineering blog)</text><rect x="330" y="60" width="460" height="90" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="560" y="92" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">Headline result</text><text x="560" y="120" font-size="14" fill="#24292F" text-anchor="middle" font-weight="600">multi-agent beat single-agent Opus 4 by 90.2% on their research eval</text><rect x="30" y="180" width="340" height="190" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="210" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">One-shot delegation</text><text x="200.0" y="238" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">complete, self-contained</text><text x="200.0" y="258" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">assignments; chatty</text><text x="200.0" y="277" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">coordination drags</text><rect x="393" y="180" width="340" height="190" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="210" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">Parallel tool use</text><text x="563.0" y="238" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">subagents acting at once</text><text x="563.0" y="258" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">explore far more ground</text><text x="563.0" y="277" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">per minute</text><rect x="756" y="180" width="340" height="190" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="210" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">Synthesis bottleneck</text><text x="926.0" y="238" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">ten great researchers,</text><text x="926.0" y="258" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">one weak synthesizer =</text><text x="926.0" y="277" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">weak result</text><text x="560.0" y="426" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">Exam shape: parallel exploration + context isolation are why it wins; the orchestrator is where quality is won or lost.</text></svg>