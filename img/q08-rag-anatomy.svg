<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="440" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="438" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">RAG anatomy: seven steps, in order</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Every RAG scenario question tests a step in this chain.</text>
<rect x="30" y="120" width="108" height="100" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="84" y="154" text-anchor="middle" font-size="12" fill="#94a3b8">1</text>
<text x="84" y="176" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="bold">docs</text>
<text x="84" y="200" text-anchor="middle" font-size="10" fill="#64748b">raw material</text>
<line x1="138" y1="170" x2="152" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="152" y="120" width="108" height="100" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="206" y="154" text-anchor="middle" font-size="12" fill="#94a3b8">2</text>
<text x="206" y="176" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="bold">chunk</text>
<text x="206" y="200" text-anchor="middle" font-size="10" fill="#64748b">500-1000 tok</text>
<line x1="260" y1="170" x2="274" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="274" y="120" width="108" height="100" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="328" y="154" text-anchor="middle" font-size="12" fill="#94a3b8">3</text>
<text x="328" y="176" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="bold">embed</text>
<text x="328" y="200" text-anchor="middle" font-size="10" fill="#64748b">fixed-dim vector</text>
<line x1="382" y1="170" x2="396" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="396" y="120" width="108" height="100" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="450" y="154" text-anchor="middle" font-size="12" fill="#94a3b8">4</text>
<text x="450" y="176" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="bold">index</text>
<text x="450" y="200" text-anchor="middle" font-size="10" fill="#64748b">vector DB, ANN</text>
<line x1="504" y1="170" x2="518" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="518" y="120" width="108" height="100" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="572" y="154" text-anchor="middle" font-size="12" fill="#94a3b8">5</text>
<text x="572" y="176" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="bold">hybrid</text>
<text x="572" y="200" text-anchor="middle" font-size="10" fill="#64748b">BM25 + vector</text>
<line x1="626" y1="170" x2="640" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="640" y="120" width="108" height="100" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="694" y="154" text-anchor="middle" font-size="12" fill="#94a3b8">6</text>
<text x="694" y="176" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="bold">rerank</text>
<text x="694" y="200" text-anchor="middle" font-size="10" fill="#64748b">cross-encoder</text>
<line x1="748" y1="170" x2="762" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="762" y="120" width="108" height="100" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="816" y="154" text-anchor="middle" font-size="12" fill="#94a3b8">7</text>
<text x="816" y="176" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="bold">LLM</text>
<text x="816" y="200" text-anchor="middle" font-size="10" fill="#64748b">grounds answer</text>
<rect x="40" y="260" width="820" height="60" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="450" y="296" text-anchor="middle" font-size="13" fill="#1e40af">The exam never asks for one number: it asks you to argue the trade-off.</text>
<text x="450.0" y="390" text-anchor="middle" font-size="12" fill="#94a3b8">Chunks of 500-1000 tokens with 10-20% overlap. Bigger raises recall but also noise and cost.</text>
</svg>
