<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Rubric vs vibes: how a judge scores</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Vibes drift with the judge. A rubric drifts only when you change it.</text>
<rect x="40" y="100" width="400" height="240" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="240" y="132" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">VIBES</text>
<text x="240" y="176" text-anchor="middle" font-size="13" fill="#64748b">"does this look good?"</text>
<text x="240" y="216" text-anchor="middle" font-size="13" fill="#64748b">same answer scores 7, then 4</text>
<text x="240" y="256" text-anchor="middle" font-size="13" fill="#64748b">failures are unrepeatable</text>
<rect x="460" y="100" width="400" height="240" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="660" y="132" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">RUBRIC</text>
<text x="660" y="176" text-anchor="middle" font-size="13" fill="#64748b">named criteria with 1-5 scales</text>
<text x="660" y="216" text-anchor="middle" font-size="13" fill="#64748b">an example answer per level</text>
<text x="660" y="256" text-anchor="middle" font-size="13" fill="#64748b">same answer, same score, every run</text>
<line x1="440" y1="220" x2="460" y2="220" stroke="#64748b" stroke-width="3" marker-end="url(#ah)"/>
</svg>
