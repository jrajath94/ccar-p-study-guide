<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Charis SIL, Georgia, serif">
  <rect x="0" y="0" width="960" height="620" rx="10" fill="#0d0d0d"/>
  <text x="30" y="42" font-size="24" fill="#ececec" font-weight="bold">The tool-use loop: the model asks, your code acts</text>
  <!-- step 1: your app -->
  <rect x="30" y="80" width="260" height="120" rx="8" fill="#111111" stroke="#f0b429" stroke-width="2"/>
  <text x="52" y="112" font-size="15" fill="#f0b429" font-weight="bold">1 · YOUR APP</text>
  <text x="52" y="140" font-size="14" fill="#ececec">sends messages</text>
  <text x="52" y="164" font-size="14" fill="#ececec">+ a tools array</text>
  <text x="52" y="188" font-size="13" fill="#a8a8a8">(name, description,</text>
  <text x="52" y="206" font-size="13" fill="#a8a8a8">JSON input schema)</text>
  <!-- step 2: model asks -->
  <rect x="350" y="80" width="260" height="120" rx="8" fill="#111111" stroke="#6cb2ff" stroke-width="2"/>
  <text x="372" y="112" font-size="15" fill="#6cb2ff" font-weight="bold">2 · MODEL ASKS</text>
  <text x="372" y="140" font-size="13" fill="#ececec" font-family="ui-monospace, Menlo, monospace">tool_use block:</text>
  <text x="372" y="162" font-size="13" fill="#ececec" font-family="ui-monospace, Menlo, monospace">name: get_weather</text>
  <text x="372" y="184" font-size="13" fill="#ececec" font-family="ui-monospace, Menlo, monospace">input: {city: "Austin"}</text>
  <text x="372" y="206" font-size="13" fill="#a8a8a8">stop_reason: tool_use</text>
  <!-- step 3: your code -->
  <rect x="670" y="80" width="260" height="120" rx="8" fill="#111111" stroke="#f0b429" stroke-width="2"/>
  <text x="692" y="112" font-size="15" fill="#f0b429" font-weight="bold">3 · YOUR CODE</text>
  <text x="692" y="140" font-size="14" fill="#ececec">validates arguments</text>
  <text x="692" y="164" font-size="14" fill="#ececec">against the schema,</text>
  <text x="692" y="188" font-size="14" fill="#ececec">then executes</text>
  <text x="692" y="206" font-size="13" fill="#a8a8a8">the real function</text>
  <!-- arrows row 1 -->
  <polygon points="290,130 350,130 350,120 366,140 350,160 350,150 290,150" fill="#a8a8a8"/>
  <polygon points="610,130 670,130 670,120 686,140 670,160 670,150 610,150" fill="#a8a8a8"/>
  <!-- step 4: result back -->
  <rect x="670" y="300" width="260" height="120" rx="8" fill="#111111" stroke="#6cb2ff" stroke-width="2"/>
  <text x="692" y="332" font-size="15" fill="#6cb2ff" font-weight="bold">4 · RESULT RETURNS</text>
  <text x="692" y="360" font-size="13" fill="#ececec" font-family="ui-monospace, Menlo, monospace">tool_result block:</text>
  <text x="692" y="382" font-size="13" fill="#ececec" font-family="ui-monospace, Menlo, monospace">tool_use_id: …</text>
  <text x="692" y="404" font-size="13" fill="#ececec" font-family="ui-monospace, Menlo, monospace">content: "72°F, clear"</text>
  <!-- step 5: model answers -->
  <rect x="350" y="300" width="260" height="120" rx="8" fill="#111111" stroke="#6cb2ff" stroke-width="2"/>
  <text x="372" y="332" font-size="15" fill="#6cb2ff" font-weight="bold">5 · MODEL ANSWERS</text>
  <text x="372" y="360" font-size="14" fill="#ececec">reads the result,</text>
  <text x="372" y="384" font-size="14" fill="#ececec">writes the final text</text>
  <text x="372" y="408" font-size="13" fill="#a8a8a8">stop_reason: end_turn</text>
  <!-- step 6: user -->
  <rect x="30" y="300" width="260" height="120" rx="8" fill="#111111" stroke="#ececec" stroke-width="2"/>
  <text x="52" y="332" font-size="15" fill="#ececec" font-weight="bold">6 · USER SEES</text>
  <text x="52" y="360" font-size="14" fill="#ececec">"It is 72°F and clear</text>
  <text x="52" y="384" font-size="14" fill="#ececec">in Austin right now."</text>
  <!-- arrows -->
  <polygon points="800,200 800,300 790,300 810,316 830,300 820,300 820,200" fill="#a8a8a8"/>
  <polygon points="670,350 610,350 610,340 594,360 610,380 610,370 670,370" fill="#a8a8a8"/>
  <polygon points="350,350 290,350 290,340 274,360 290,380 290,370 350,370" fill="#a8a8a8"/>
  <!-- loop-back arrow from step 5 up to step 2 -->
  <path d="M 350 340 C 250 340, 250 160, 345 160" fill="none" stroke="#a8a8a8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="345,160 358,150 358,170" fill="#a8a8a8"/>
  <text x="180" y="262" font-size="13" fill="#a8a8a8">loops until</text>
  <text x="180" y="280" font-size="13" fill="#a8a8a8">end_turn</text>
  <!-- trust rule -->
  <rect x="30" y="460" width="900" height="120" rx="8" fill="#111111" stroke="#262626" stroke-width="1"/>
  <text x="52" y="494" font-size="15" fill="#f0b429" font-weight="bold">The trust rule</text>
  <text x="52" y="522" font-size="14" fill="#ececec">The model never touches your systems. It only asks, in structured form. Your code validates</text>
  <text x="52" y="548" font-size="14" fill="#ececec">the arguments against the schema and decides what actually runs. Every later security unit assumes this.</text>
</svg>
