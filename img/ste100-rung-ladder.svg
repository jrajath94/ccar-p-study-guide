<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Climb rung by rung</text><rect x="60" y="170" width="220" height="110" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="170.0" y="199" font-size="15" text-anchor="middle" font-weight="700" fill="#1F5FBF">Rung 0</text><text x="170.0" y="227" font-size="12" text-anchor="middle" fill="#24292F">what Claude is</text><text x="170.0" y="247" font-size="12" text-anchor="middle" fill="#24292F">tokens, prediction</text><line x1="284" y1="225" x2="316" y2="225" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="320" y="170" width="220" height="110" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="430.0" y="199" font-size="15" text-anchor="middle" font-weight="700" fill="#0E7C7B">Rung 1</text><text x="430.0" y="227" font-size="12" text-anchor="middle" fill="#24292F">the plainest version</text><text x="430.0" y="247" font-size="12" text-anchor="middle" fill="#24292F">one-screen facts</text><line x1="544" y1="225" x2="576" y2="225" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="580" y="170" width="220" height="110" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="690.0" y="199" font-size="15" text-anchor="middle" font-weight="700" fill="#A15C07">Rung 2</text><text x="690.0" y="227" font-size="12" text-anchor="middle" fill="#24292F">the working version</text><text x="690.0" y="247" font-size="12" text-anchor="middle" fill="#24292F">decision rules</text><line x1="804" y1="225" x2="836" y2="225" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="840" y="170" width="220" height="110" rx="10" fill="#F3E8F7" stroke="#7B2D8E" stroke-width="1.5"/><text x="950.0" y="199" font-size="15" text-anchor="middle" font-weight="700" fill="#7B2D8E">Rung 3</text><text x="950.0" y="227" font-size="12" text-anchor="middle" fill="#24292F">the granular layer</text><text x="950.0" y="247" font-size="12" text-anchor="middle" fill="#24292F">numbers and limits</text><text x="560.0" y="365" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Never start at Rung 3. Each rung makes the next one stick.</text></svg>