<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The context window is a budget: everything in plus everything out must fit</text><rect x="160" y="70" width="800" height="90" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="560" y="104" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">[ everything you send in  +  everything it may write out ]  &lt;=  window size</text><text x="560" y="134" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">1M tokens on the big three (128K max out)  |  200K on Haiku 4.5 (64K max out)</text><text x="560" y="200" font-size="15" fill="#24292F" text-anchor="middle" font-weight="700">Why it needs managing: three pains, in order</text><rect x="30" y="220" width="340" height="230" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="250" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">1. COST</text><text x="200.0" y="278" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">turn 20 re-sends turns 1-19;</text><text x="200.0" y="298" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">growth is quadratic</text><rect x="393" y="220" width="340" height="230" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="250" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">2. QUALITY</text><text x="563.0" y="278" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">&quot;lost in the middle&quot;: a fact at</text><text x="563.0" y="298" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">token 400,000 is used less reliably</text><rect x="756" y="220" width="340" height="230" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="250" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">3. HARD WALL</text><text x="926.0" y="278" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">cross the limit: the request fails</text><text x="926.0" y="298" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">or old content is silently dropped</text></svg>