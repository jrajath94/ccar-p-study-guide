<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="498" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Design 5: cache-breakpoint design</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Put stable content above the breakpoint. Keep volatile content below it.</text>
<rect x="150" y="100" width="600" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="450" y="125" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">system prompt (4,000 tokens, stable)</text>
<text x="450" y="145" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#64748b">cached: pay full price once, then a tenth</text>
<line x1="150" y1="175" x2="750" y2="175" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8,5"/>
<text x="450" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">BREAKPOINT</text>
<rect x="150" y="210" width="600" height="60" rx="8" fill="#fffbeb" stroke="#d97706"/>
<text x="450" y="235" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">per-user data (volatile)</text>
<text x="450" y="255" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#64748b">below the breakpoint: never cached, never breaks the cache</text>
<rect x="180" y="310" width="540" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="450.0" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">The cache-killer</text>
<text x="450.0" y="356" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">per-user data embedded at the TOP of the prompt</text>
<text x="450.0" y="375" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">every request has a different prefix - zero cache hits</text>
<text x="450.0" y="394" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">the fix is moving it below the breakpoints</text>
</svg>