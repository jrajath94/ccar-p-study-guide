<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Prompt caching prices (relative to base input)</text><text x="170" y="97" font-size="14" text-anchor="start" font-weight="600" fill="#24292F">Write, 5-min TTL</text><rect x="400" y="80" width="480" height="24" rx="6" fill="#F2F3F5" stroke="#D0D4D9"/><rect x="400" y="80" width="300.0" height="24" rx="6" fill="#EAF0FA" stroke="#1F5FBF"/><text x="888" y="97.0" font-size="13" fill="#24292F">1.25x</text><text x="170" y="153" font-size="14" text-anchor="start" font-weight="600" fill="#24292F">Write, 1-hour TTL</text><rect x="400" y="136" width="480" height="24" rx="6" fill="#F2F3F5" stroke="#D0D4D9"/><rect x="400" y="136" width="480.0" height="24" rx="6" fill="#F3E8F7" stroke="#7B2D8E"/><text x="888" y="153.0" font-size="13" fill="#24292F">2x</text><text x="170" y="209" font-size="14" text-anchor="start" font-weight="600" fill="#24292F">Read (cache hit)</text><rect x="400" y="192" width="480" height="24" rx="6" fill="#F2F3F5" stroke="#D0D4D9"/><rect x="400" y="192" width="24.0" height="24" rx="6" fill="#EFF0EA" stroke="#0E7C7B"/><text x="888" y="209.0" font-size="13" fill="#24292F">0.10x</text><text x="170" y="265" font-size="14" text-anchor="start" font-weight="600" fill="#24292F">Normal input</text><rect x="400" y="248" width="480" height="24" rx="6" fill="#F2F3F5" stroke="#D0D4D9"/><rect x="400" y="248" width="240.0" height="24" rx="6" fill="#E8F4F8" stroke="#2471A3"/><text x="888" y="265.0" font-size="13" fill="#24292F">1x base</text><text x="560.0" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Max 4 breakpoints per request. Min cacheable prefix: 1024 tokens (Sonnet 5), 2048 (older models).</text></svg>