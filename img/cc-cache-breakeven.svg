<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="440" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="438" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Cache economics: the break-even math</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Pay 1.25x once to write the prefix, then 0.1x per read until the 5-minute TTL expires.</text>
<rect x="40" y="100" width="820" height="150" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="450" y="134" text-anchor="middle" font-size="13" fill="#64748b">no cache: every request pays full price for all 8,500 tokens</text>
<rect x="80" y="150" width="740" height="26" rx="6" fill="#dc2626" opacity="0.8"/>
<text x="450" y="168" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">$0.0255 per request, forever</text>
<text x="450" y="208" text-anchor="middle" font-size="13" fill="#64748b">cached: one 1.25x write, then 0.1x reads</text>
<rect x="80" y="222" width="120" height="26" rx="6" fill="#d97706" opacity="0.8"/>
<rect x="200" y="222" width="620" height="26" rx="6" fill="#16a34a" opacity="0.8"/>
<text x="140" y="240" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">1.25x</text>
<text x="510" y="240" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">0.1x per read</text>
<rect x="40" y="280" width="14" height="42" rx="7" fill="#dc2626"/>
<rect x="70" y="280" width="790" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="92" y="308" text-anchor="start" font-size="12" fill="#1e293b">Low reuse:  traffic slower than the TTL pays the write premium for nothing</text>
<rect x="40" y="328" width="14" height="42" rx="7" fill="#dc2626"/>
<rect x="70" y="328" width="790" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="92" y="356" text-anchor="start" font-size="12" fill="#1e293b">Short prompts:  below the 512-4096 token minimum, caching is unavailable</text>
<rect x="40" y="376" width="14" height="42" rx="7" fill="#dc2626"/>
<rect x="70" y="376" width="790" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="92" y="404" text-anchor="start" font-size="12" fill="#1e293b">Volatile prefix:  per-user system prompts never survive long enough to pay back</text>
</svg>
