<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="380" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Anatomy of a trap pattern</text><rect x="40" y="80" width="220" height="220" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="150.0" y="109" font-size="15" text-anchor="middle" font-weight="700" fill="#1F5FBF">1. Stem tell</text><text x="150.0" y="137" font-size="13" text-anchor="middle" fill="#24292F">a phrase in the</text><text x="150.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">question that</text><text x="150.0" y="177" font-size="13" text-anchor="middle" fill="#24292F">names the concept</text><rect x="320" y="80" width="220" height="220" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="430.0" y="109" font-size="15" text-anchor="middle" font-weight="700" fill="#0E7C7B">2. Decision rule</text><text x="430.0" y="137" font-size="13" text-anchor="middle" fill="#24292F">if the stem says X,</text><text x="430.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">pick Y</text><text x="430.0" y="177" font-size="13" text-anchor="middle" fill="#24292F">no second-guessing</text><rect x="600" y="80" width="220" height="220" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="710.0" y="109" font-size="15" text-anchor="middle" font-weight="700" fill="#A15C07">3. Correct pick</text><text x="710.0" y="137" font-size="13" text-anchor="middle" fill="#24292F">the option that</text><text x="710.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">matches the rule</text><text x="710.0" y="177" font-size="13" text-anchor="middle" fill="#24292F">exactly</text><rect x="880" y="80" width="200" height="220" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/><text x="980.0" y="109" font-size="15" text-anchor="middle" font-weight="700" fill="#C0392B">The trap</text><text x="980.0" y="137" font-size="13" text-anchor="middle" fill="#24292F">the attractive</text><text x="980.0" y="157" font-size="13" text-anchor="middle" fill="#24292F">wrong option</text><text x="980.0" y="177" font-size="13" text-anchor="middle" fill="#24292F">rule it out first</text><line x1="260" y1="190" x2="320" y2="190" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="540" y1="190" x2="600" y2="190" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="820" y1="190" x2="880" y2="190" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="345" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Name the trap before you read the options. The trap option is built to feel right.</text></svg>