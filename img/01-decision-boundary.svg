<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="460" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Split by decision boundary, not by character count</text><rect x="30" y="60" width="520" height="330" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="290" y="92" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">WRONG: every N characters</text><rect x="70" y="120" width="440" height="90" rx="10" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="290" y="148" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">...indemnification clause ends|here the</text><text x="290" y="172" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">liability cap begins...</text><line x1="290" y1="125" x2="290" y2="205" stroke="#B42318" stroke-width="3"/><text x="290" y="228" font-size="13" fill="#B42318" text-anchor="middle" font-weight="700">boundary cuts a clause in half</text><text x="290" y="260" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">each half lacks the context</text><text x="290" y="278" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">to be judged on its own</text><text x="290" y="320" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="700">pieces are not independently judgeable</text><rect x="570" y="60" width="520" height="330" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="830" y="92" font-size="16" fill="#1A7F37" text-anchor="middle" font-weight="700">RIGHT: by contract section</text><rect x="610" y="120" width="440" height="55" rx="10" fill="#FFFFFF" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="830" y="154" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">Section 3: Indemnification</text><rect x="610" y="190" width="440" height="55" rx="10" fill="#FFFFFF" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="830" y="224" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">Section 4: Liability cap</text><rect x="610" y="260" width="440" height="55" rx="10" fill="#FFFFFF" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="830" y="294" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">Section 7: Termination</text><text x="830" y="352" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">each piece: one decision,</text><text x="830" y="374" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">one validator between pieces</text><text x="560.0" y="446" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">Rule: each piece must be independently judgeable. If judging piece 7 needs piece 6, attach shared context (brief, glossary, definitions).</text></svg>