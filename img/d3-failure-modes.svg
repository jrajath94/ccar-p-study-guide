<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="460" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="458" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Integration failure modes: the seams where it breaks</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Every integration question hides one of these.</text>
<rect x="40" y="100" width="14" height="72" rx="7" fill="#dc2626"/>
<rect x="70" y="100" width="790" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="92" y="128" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">SCHEMA DRIFT  |  the API changed, your tool did not</text>
<text x="92" y="152" text-anchor="start" font-size="12" fill="#64748b">fix: version pins + contract tests</text>
<rect x="40" y="184" width="14" height="72" rx="7" fill="#d97706"/>
<rect x="70" y="184" width="790" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="92" y="212" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">AUTH EXPIRY  |  token died mid-conversation</text>
<text x="92" y="236" text-anchor="start" font-size="12" fill="#64748b">fix: refresh before the call, never after the failure</text>
<rect x="40" y="268" width="14" height="72" rx="7" fill="#7c3aed"/>
<rect x="70" y="268" width="790" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="92" y="296" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">RATE LIMITS  |  429 from a downstream API</text>
<text x="92" y="320" text-anchor="start" font-size="12" fill="#64748b">fix: backoff + queue, surface the wait honestly</text>
<rect x="40" y="352" width="14" height="72" rx="7" fill="#2563eb"/>
<rect x="70" y="352" width="790" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="92" y="380" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">TOOL OUTPUT INJECTION  |  a tool result smuggles instructions</text>
<text x="92" y="404" text-anchor="start" font-size="12" fill="#64748b">fix: treat tool output as data, never as orders</text>
</svg>
