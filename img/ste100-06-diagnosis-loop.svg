<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker></defs><text x="560.0" y="34" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The professional loop</text><rect x="20" y="80" width="253" height="230" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="146.5" y="110" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">Detect</text><text x="146.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">dashboard shows the dip</text><text x="146.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">per-segment evals</text><line x1="273" y1="195" x2="293" y2="195" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="293" y="80" width="253" height="230" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="419.5" y="110" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">Diagnose</text><text x="419.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">which segment moved?</text><text x="419.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">what changed upstream?</text><line x1="546" y1="195" x2="566" y2="195" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="566" y="80" width="253" height="230" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="692.5" y="110" font-size="15" fill="#0E7C7B" text-anchor="middle" font-weight="700">Fix narrowly</text><text x="692.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">one segment, one fix</text><text x="692.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">no big rewrites</text><line x1="819" y1="195" x2="839" y2="195" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="839" y="80" width="253" height="230" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="965.5" y="110" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">Re-evaluate</text><text x="965.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">full set + regressions</text><text x="965.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">ship only if green</text><path d="M 1065 310 L 1065 340 L 55 340 L 55 310" stroke="#5C6570" stroke-width="2" fill="none" marker-end="url(#ah)"/><text x="560" y="332" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="400">the loop turns again</text><text x="560.0" y="386" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">Detect, diagnose the segment, fix narrowly, re-evaluate. Never skip diagnosis.</text></svg>