<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="380" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The input stage: the messy world in, safe material out</text><rect x="95" y="90" width="185" height="150" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="187.5" y="120" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">CAPTURE</text><text x="187.5" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">get it + its context</text><rect x="307" y="90" width="185" height="150" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="399.5" y="120" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">VALIDATE</text><text x="399.5" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">size, type, shape</text><rect x="519" y="90" width="185" height="150" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="611.5" y="120" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">NORMALIZE</text><text x="611.5" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">one canonical form</text><rect x="731" y="90" width="185" height="150" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="823.5" y="120" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">REDACT</text><text x="823.5" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">strip secrets + PII</text><line x1="280" y1="165" x2="305" y2="165" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="492" y1="165" x2="517" y2="165" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="704" y1="165" x2="729" y2="165" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="48" y="170" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="600">raw world</text><line x1="78" y1="165" x2="93" y2="165" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="918" y1="165" x2="948" y2="165" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="1008" y="170" font-size="13.5" fill="#1A7F37" text-anchor="middle" font-weight="600">safe, clean</text><text x="1008" y="192" font-size="13.5" fill="#1A7F37" text-anchor="middle" font-weight="600">material</text><rect x="180" y="270" width="760" height="62" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="560" y="296" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Order matters: validate before the model ever sees it; redact before anything leaves your control.</text><text x="560" y="320" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">Failures fail fast and loudly, never as weird model behavior.</text><text x="560.0" y="366" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">The model cannot leak what it never saw: redaction is a privacy control, not a cleanup step.</text></svg>