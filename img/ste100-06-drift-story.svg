<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="420" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker></defs><text x="560.0" y="34" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The drift story: week 12 to week 14</text><line x1="60" y1="200" x2="1060" y2="200" stroke="#5C6570" stroke-width="2.5"/><circle cx="140" cy="200" r="10" fill="#1F5FBF"/><text x="140" y="150" font-size="14.5" fill="#1F5FBF" text-anchor="middle" font-weight="700">Week 12</text><text x="140" y="248" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">policy PDF</text><text x="140" y="270" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">reformatted</text><circle cx="400" cy="200" r="10" fill="#A15C07"/><text x="400" y="150" font-size="14.5" fill="#A15C07" text-anchor="middle" font-weight="700">Week 14</text><text x="400" y="248" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">quality 96% to 91%</text><text x="400" y="270" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">refund segment: 82%</text><circle cx="660" cy="200" r="10" fill="#0E7C7B"/><text x="660" y="150" font-size="14.5" fill="#0E7C7B" text-anchor="middle" font-weight="700">Diagnose</text><text x="660" y="248" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">chunker splits the table</text><text x="660" y="270" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">retriever gets half</text><circle cx="920" cy="200" r="10" fill="#1A7F37"/><text x="920" y="150" font-size="14.5" fill="#1A7F37" text-anchor="middle" font-weight="700">Fix ships</text><text x="920" y="248" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">fix chunk boundaries</text><text x="920" y="270" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">back to 96%, no regressions</text><text x="560.0" y="406" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">The dashboard caught it before users did. That is the whole point of the loop.</text></svg>