<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">The Batches API: half price, next day</text><rect x="90" y="90" width="440" height="200" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="310.0" y="120" font-size="16" text-anchor="middle" font-weight="700" fill="#0E7C7B">Batch it</text><text x="310.0" y="148" font-size="13" text-anchor="middle" fill="#24292F">50% off standard price</text><text x="310.0" y="168" font-size="13" text-anchor="middle" fill="#24292F">results within 24 hours</text><text x="310.0" y="188" font-size="13" text-anchor="middle" fill="#24292F">nightly evals, bulk labels</text><rect x="600" y="90" width="440" height="200" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/><text x="820.0" y="120" font-size="16" text-anchor="middle" font-weight="700" fill="#C0392B">Limits</text><text x="820.0" y="148" font-size="13" text-anchor="middle" fill="#24292F">100,000 requests or 256 MB</text><text x="820.0" y="168" font-size="13" text-anchor="middle" fill="#24292F">results kept 29 days</text><text x="820.0" y="188" font-size="13" text-anchor="middle" fill="#24292F">no streaming</text><text x="560.0" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">$2 per million input becomes $1. Same tokens, same model, because you can wait a day.</text></svg>