<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="440" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="438" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Defense in depth: four layers, one incident catches the rest</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">GDPR: data minimization and deletion. HIPAA: PHI access controls and audit trails. FedRAMP: accredited infrastructure.</text>
<rect x="40" y="110" width="820" height="66" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="70" y="138" text-anchor="start" font-size="14" fill="#991b1b" font-weight="bold">PREVENT</text>
<text x="200" y="138" text-anchor="start" font-size="13" fill="#1e293b">deny before the model acts</text>
<text x="200" y="158" text-anchor="start" font-size="12" fill="#64748b">least-privilege scopes, ZDR, policy denial</text>
<rect x="40" y="186" width="820" height="66" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="70" y="214" text-anchor="start" font-size="14" fill="#92400e" font-weight="bold">DETECT</text>
<text x="200" y="214" text-anchor="start" font-size="13" fill="#1e293b">see the leak while it happens</text>
<text x="200" y="234" text-anchor="start" font-size="12" fill="#64748b">PreToolUse hooks, PII scanners, audit logs</text>
<rect x="40" y="262" width="820" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
<text x="70" y="290" text-anchor="start" font-size="14" fill="#5b21b6" font-weight="bold">RESPOND</text>
<text x="200" y="290" text-anchor="start" font-size="13" fill="#1e293b">contain the blast radius</text>
<text x="200" y="310" text-anchor="start" font-size="12" fill="#64748b">kill switch, revoke key, incident runbook</text>
<rect x="40" y="338" width="820" height="66" rx="10" fill="#ccfbf1" stroke="#0d9488"/>
<text x="70" y="366" text-anchor="start" font-size="14" fill="#115e59" font-weight="bold">GOVERN</text>
<text x="200" y="366" text-anchor="start" font-size="13" fill="#1e293b">prove it afterward</text>
<text x="200" y="386" text-anchor="start" font-size="12" fill="#64748b">deletion certificates, audit trails, reviews</text>
<text x="450.0" y="414" text-anchor="middle" font-size="12" fill="#94a3b8">Compliance evidence is a deliverable, not a side effect.</text>
</svg>
