<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="480" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Stream when a human is watching. Not when nobody is.</text><rect x="60" y="70" width="480" height="330" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="300" y="102" font-size="16" fill="#1A7F37" text-anchor="middle" font-weight="700">STREAM</text><text x="300" y="150" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">a human is watching: chat,</text><text x="300" y="182" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">copilots, any interface where</text><text x="300" y="214" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">waiting feels like failure</text><text x="300" y="246" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="300" y="278" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">collapses TTFT, what the</text><text x="300" y="310" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">user actually feels</text><rect x="580" y="70" width="480" height="330" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="820" y="102" font-size="16" fill="#5C6570" text-anchor="middle" font-weight="700">DO NOT STREAM</text><text x="820" y="150" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">batch jobs, eval harnesses,</text><text x="820" y="182" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">background agents: they want</text><text x="820" y="214" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">the complete response object</text><text x="820" y="246" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="820" y="278" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">parsing an event stream adds</text><text x="820" y="310" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">failure modes for no benefit</text><rect x="160" y="425" width="800" height="36" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="560" y="449" font-size="13" fill="#A15C07" text-anchor="middle" font-weight="600">Tool calls can stream too, but most loops wait for the complete tool_use block: partial arguments are dangerous.</text></svg>