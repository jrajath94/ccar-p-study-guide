<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="440" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker></defs><text x="560.0" y="34" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Split every absolute promise</text><rect x="60" y="80" width="480" height="300" rx="10" fill="#F2F4F7" stroke="#B42318" stroke-width="1.5"/><text x="300.0" y="110" font-size="15" fill="#B42318" text-anchor="middle" font-weight="700">"100% accurate"</text><text x="300.0" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">refuse it kindly</text><text x="300.0" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">becomes: 95% measured weekly</text><text x="300.0" y="180" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">+ human review on low confidence</text><text x="300.0" y="202" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">+ written remedy on a miss</text><rect x="580" y="80" width="480" height="300" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="820.0" y="110" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">"99.9% uptime covers quality"</text><text x="820.0" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">it does not</text><text x="820.0" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">becomes: two separate SLAs</text><text x="820.0" y="180" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">availability by monitors</text><text x="820.0" y="202" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">quality by human graders</text><text x="560.0" y="426" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">No probabilistic system hits 100%. Replace the absolute with a measured promise.</text></svg>