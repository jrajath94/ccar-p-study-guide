<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="340" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">Tokens: Claude reads text in chunks</text><rect x="250" y="120" width="180" height="90" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="340" y="172" font-size="22" text-anchor="middle" font-weight="700" fill="#1F5FBF">un</text><rect x="460" y="120" width="180" height="90" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="550" y="172" font-size="22" text-anchor="middle" font-weight="700" fill="#0E7C7B">believ</text><rect x="670" y="120" width="180" height="90" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="760" y="172" font-size="22" text-anchor="middle" font-weight="700" fill="#A15C07">able</text><text x="560.0" y="270" font-size="14" text-anchor="middle" font-weight="400" fill="#5C6570">"unbelievable" becomes three tokens: un, believ, able. About four characters per token.</text><text x="560.0" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Context windows and prices are counted in tokens, not words.</text></svg>