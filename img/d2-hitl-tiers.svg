<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="468" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Tool gating: the approval follows the blast radius</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Destructive tools need a gate in the loop, not in the prompt.</text>
<rect x="40" y="100" width="200" height="76" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="140" y="144" text-anchor="middle" font-size="13" fill="#166534" font-weight="bold">READ TOOLS</text>
<rect x="250" y="100" width="610" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="270" y="130" text-anchor="start" font-size="13" fill="#64748b">search, lookup, summarize</text>
<text x="270" y="154" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">run freely, log everything</text>
<rect x="40" y="188" width="200" height="76" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="140" y="232" text-anchor="middle" font-size="13" fill="#1e40af" font-weight="bold">REVERSIBLE WRITES</text>
<rect x="250" y="188" width="610" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="270" y="218" text-anchor="start" font-size="13" fill="#64748b">file ticket, update status</text>
<text x="270" y="242" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">run, show the diff, offer undo</text>
<rect x="40" y="276" width="200" height="76" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="140" y="320" text-anchor="middle" font-size="13" fill="#92400e" font-weight="bold">DESTRUCTIVE</text>
<rect x="250" y="276" width="610" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="270" y="306" text-anchor="start" font-size="13" fill="#64748b">delete, refund, restart</text>
<text x="270" y="330" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">explicit human approval before the call</text>
<rect x="40" y="364" width="200" height="76" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="140" y="408" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">IRREVERSIBLE</text>
<rect x="250" y="364" width="610" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="270" y="394" text-anchor="start" font-size="13" fill="#64748b">terminate account, wipe device</text>
<text x="270" y="418" text-anchor="start" font-size="13" fill="#1e293b" font-weight="bold">approval plus a second factor</text>
</svg>
