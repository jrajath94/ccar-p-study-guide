<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="300" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">The passing line: 720 of 1000</text><rect x="90" y="140" width="940" height="46" rx="8" fill="#F2F3F5" stroke="#D0D4D9"/><rect x="90" y="140" width="676.8" height="46" rx="8" fill="#FDECEA" stroke="#C0392B"/><rect x="766.8" y="140" width="263.20000000000005" height="46" rx="8" fill="#EFF0EA" stroke="#0E7C7B"/><line x1="766.8" y1="126" x2="766.8" y2="200" stroke="#24292F" stroke-width="3"/><text x="90" y="224" font-size="13" text-anchor="middle" font-weight="700" fill="#24292F">0</text><text x="766.8" y="224" font-size="13" text-anchor="middle" font-weight="700" fill="#24292F">720</text><text x="1030" y="224" font-size="13" text-anchor="middle" font-weight="700" fill="#24292F">1000</text><text x="428.4" y="168" font-size="13" text-anchor="middle" font-weight="600" fill="#C0392B">below 720: fail</text><text x="898.4" y="168" font-size="13" text-anchor="middle" font-weight="600" fill="#0E7C7B">720 and up: pass</text><text x="560.0" y="250" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">The score is scaled, not a raw percent. Aim well above the line, not at it.</text></svg>