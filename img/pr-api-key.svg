<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="398" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Your API key is the front door</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">The key buys Claude answers. It lives in the environment, never in code or git.</text>
<rect x="40" y="110" width="180" height="130" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="130" y="150" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="bold">.env file</text>
<text x="130" y="175" text-anchor="middle" font-size="12" fill="#64748b">ANTHROPIC_API_KEY</text>
<text x="130" y="195" text-anchor="middle" font-size="12" fill="#64748b">= sk-ant-...</text>
<line x1="220" y1="175" x2="260" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="260" y="110" width="220" height="130" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="370" y="150" text-anchor="middle" font-size="14" fill="#1e40af" font-weight="bold">your code</text>
<text x="370" y="175" text-anchor="middle" font-size="12" fill="#64748b">client = Anthropic()</text>
<text x="370" y="195" text-anchor="middle" font-size="12" fill="#64748b">SDK reads the variable</text>
<text x="370" y="215" text-anchor="middle" font-size="12" fill="#64748b">itself</text>
<line x1="480" y1="175" x2="520" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="520" y="110" width="180" height="130" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="610" y="150" text-anchor="middle" font-size="14" fill="#166534" font-weight="bold">Claude API</text>
<text x="610" y="175" text-anchor="middle" font-size="12" fill="#64748b">bills your account</text>
<text x="610" y="195" text-anchor="middle" font-size="12" fill="#64748b">for tokens used</text>
<line x1="700" y1="175" x2="740" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="740" y="110" width="120" height="130" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="800" y="150" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="bold">answer</text>
<text x="450" y="300" text-anchor="middle" font-size="13" fill="#dc2626">Leaked key = someone else's bill on your account. Rotate it, revoke it, never commit it.</text>
<text x="450.0" y="360" text-anchor="middle" font-size="12" fill="#94a3b8">Key, SDK, API: the minimum moving parts of every request.</text>
</svg>
