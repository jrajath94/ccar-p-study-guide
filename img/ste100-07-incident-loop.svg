<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="498" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Operational runbooks: the incident loop</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">At 2am the spend dashboard spikes to 40x baseline. Follow the runbook, in order.</text>
<rect x="25" y="110" width="160" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="105.0" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">DETECT</text>
<text x="105.0" y="156" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">spend dashboard,</text>
<text x="105.0" y="175" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">alerts on 300+</text>
<text x="105.0" y="194" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">tool-call sessions</text>
<rect x="200" y="110" width="160" height="200" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="280.0" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#d97706">TRIAGE</text>
<text x="280.0" y="156" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">which sessions,</text>
<text x="280.0" y="175" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">which tool,</text>
<text x="280.0" y="194" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">blast radius?</text>
<rect x="375" y="110" width="160" height="200" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="455.0" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">MITIGATE</text>
<text x="455.0" y="156" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">kill sessions via</text>
<text x="455.0" y="175" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">admin API, flip on</text>
<text x="455.0" y="194" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">the iteration cap</text>
<rect x="550" y="110" width="160" height="200" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="630.0" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">ROOT-CAUSE</text>
<text x="630.0" y="156" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">read the traces:</text>
<text x="630.0" y="175" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">tool always returned</text>
<text x="630.0" y="194" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">&quot;retry&quot; - obeyed forever</text>
<rect x="725" y="110" width="160" height="200" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="805.0" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">HARDEN</text>
<text x="805.0" y="156" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">terminal error after</text>
<text x="805.0" y="175" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">3 retries;</text>
<text x="805.0" y="194" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">fix the wrapper</text>
<line x1="185" y1="210" x2="200" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="360" y1="210" x2="375" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="535" y1="210" x2="550" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="710" y1="210" x2="725" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<text x="450.0" y="350" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">Mitigation beats diagnosis: stop the bleeding before diagnosing.</text>
<rect x="250" y="375" width="400" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="450.0" y="399" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">The order is the lesson</text>
<text x="450.0" y="421" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">detect, triage, mitigate, root-cause, harden</text>
<text x="450.0" y="440" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">every minute of diagnosis is money burning</text>
</svg>