<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="428" viewBox="0 0 1120 428" font-family="Anthropic Sans, Inter, 'Source Sans 3', sans-serif"><rect x="0" y="0" width="1120" height="428" fill="#F7F4EE"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6B7A"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1E4D8C"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#1B2838">Cache economics: 1,000-token prefix, 50 requests, Sonnet 5</text><rect x="80" y="80" width="440" height="200" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/><text x="300.0" y="112" font-size="18" text-anchor="middle" font-weight="700" fill="#C0392B">No cache: $0.10</text><text x="300.0" y="140" font-size="13" text-anchor="middle" fill="#1B2838">50 x 1,000 tokens</text><text x="300.0" y="160" font-size="13" text-anchor="middle" fill="#1B2838">x $2 per million</text><rect x="600" y="80" width="440" height="200" rx="10" fill="#E6E2DA" stroke="#1F7A72" stroke-width="1.5"/><text x="820.0" y="112" font-size="18" text-anchor="middle" font-weight="700" fill="#1F7A72">Cached: $0.0125</text><text x="820.0" y="140" font-size="13" text-anchor="middle" fill="#1B2838">1 write x $2.50/M</text><text x="820.0" y="160" font-size="13" text-anchor="middle" fill="#1B2838">+ 50 reads x $0.20/M</text><text x="560.0" y="330" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6B7A">Write 1.25x base input. Read 0.10x. The write is repaid after the first cache hit.</text><text x="24" y="419" font-size="13" fill="#5C6B7A">Source: original</text></svg>