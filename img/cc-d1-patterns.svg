<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Three patterns, one rule: simplest sufficient wins</text>
  <rect x="20" y="60" width="200" height="170" rx="10" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="120" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#064e3b">Augmented LLM</text>
  <text x="120" y="116" text-anchor="middle" font-size="13.5" fill="#475569">one model call,</text>
  <text x="120" y="136" text-anchor="middle" font-size="13.5" fill="#475569">enriched with retrieval,</text>
  <text x="120" y="156" text-anchor="middle" font-size="13.5" fill="#475569">tools, or memory</text>
  <text x="120" y="186" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#064e3b">one well-scoped task</text>
  <text x="120" y="208" text-anchor="middle" font-size="13" fill="#475569">cheapest, fastest</text>
  <rect x="240" y="60" width="200" height="170" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="340" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">Workflow</text>
  <text x="340" y="116" text-anchor="middle" font-size="13.5" fill="#475569">fixed sequence of calls</text>
  <text x="340" y="142" text-anchor="middle" font-size="13" fill="#1e293b">step 1 &#8594; step 2 &#8594; step 3</text>
  <text x="340" y="164" text-anchor="middle" font-size="13.5" fill="#475569">developer-defined order</text>
  <text x="340" y="186" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e40af">steps known in advance</text>
  <text x="340" y="208" text-anchor="middle" font-size="13" fill="#475569">predictable, auditable</text>
  <rect x="460" y="60" width="200" height="170" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="560" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#78350f">Agentic loop</text>
  <text x="560" y="116" text-anchor="middle" font-size="13.5" fill="#475569">model chooses its own</text>
  <text x="560" y="136" text-anchor="middle" font-size="13.5" fill="#475569">tools and steps, open-ended</text>
  <text x="560" y="164" text-anchor="middle" font-size="13" fill="#78350f">&#8635; plan &#8594; act &#8594; observe &#8635;</text>
  <text x="560" y="186" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#78350f">path cannot be listed up front</text>
  <text x="560" y="208" text-anchor="middle" font-size="13" fill="#475569">cost and latency vary</text>
  <text x="60" y="272" font-size="13.5" fill="#475569">autonomy</text>
  <line x1="130" y1="268" x2="550" y2="268" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1.5"/></marker></defs>
  <text x="60" y="300" font-size="13.5" fill="#475569">cost and latency variance</text>
  <line x1="230" y1="296" x2="550" y2="296" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
  <text x="340" y="326" text-anchor="middle" font-size="13.5" fill="#475569">"Add autonomy" with no stated reason is the agentic-by-default trap.</text>
</svg>
