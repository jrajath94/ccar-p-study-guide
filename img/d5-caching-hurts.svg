<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">When caching hurts: three ways to lose money</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">A cache that never hits is a tax, not an optimization.</text>
<rect x="40" y="100" width="820" height="89" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="450.0" y="132" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">LOW REUSE</text>
<text x="60" y="162" text-anchor="start" font-size="13" fill="#64748b">traffic slower than the TTL: the write premium buys nothing</text>
<rect x="40" y="192" width="820" height="89" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="450.0" y="224" text-anchor="middle" font-size="15" fill="#92400e" font-weight="bold">SHORT PROMPTS</text>
<text x="60" y="254" text-anchor="start" font-size="13" fill="#64748b">below the 512-token minimum: caching is unavailable</text>
<rect x="40" y="284" width="820" height="89" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
<text x="450.0" y="316" text-anchor="middle" font-size="15" fill="#5b21b6" font-weight="bold">VOLATILE PREFIX</text>
<text x="60" y="346" text-anchor="start" font-size="13" fill="#64748b">per-user system prompts: expired before the second read</text>
</svg>
