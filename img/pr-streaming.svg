<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Streaming changes delivery, not cost or quality</text>
  <g font-size="13">
    <rect x="20" y="70" width="110" height="44" rx="22" fill="#f1f5f9" stroke="#64748b"/>
    <text x="75" y="97" text-anchor="middle" fill="#1e293b">message_start</text>
    <text x="142" y="97" font-size="18" fill="#64748b">&#8594;</text>
    <rect x="162" y="70" width="150" height="44" rx="22" fill="#f1f5f9" stroke="#64748b"/>
    <text x="237" y="97" text-anchor="middle" fill="#1e293b">content_block_start</text>
    <text x="324" y="97" font-size="18" fill="#64748b">&#8594;</text>
    <rect x="344" y="70" width="160" height="44" rx="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="424" y="97" text-anchor="middle" fill="#1e40af">content_block_delta &#215;N</text>
    <text x="516" y="97" font-size="18" fill="#64748b">&#8594;</text>
    <rect x="536" y="70" width="124" height="44" rx="22" fill="#f1f5f9" stroke="#64748b"/>
    <text x="598" y="97" text-anchor="middle" fill="#1e293b">block_stop</text>
    <text x="75" y="150" font-size="18" fill="#64748b">&#8595;</text>
    <rect x="20" y="168" width="124" height="44" rx="22" fill="#f1f5f9" stroke="#64748b"/>
    <text x="82" y="195" text-anchor="middle" fill="#1e293b">message_delta</text>
    <text x="156" y="195" font-size="18" fill="#64748b">&#8594;</text>
    <rect x="176" y="168" width="118" height="44" rx="22" fill="#f1f5f9" stroke="#64748b"/>
    <text x="235" y="195" text-anchor="middle" fill="#1e293b">message_stop</text>
  </g>
  <rect x="340" y="150" width="320" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="500" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">Two rules</text>
  <text x="500" y="202" text-anchor="middle" font-size="13" fill="#475569">Stream when a human is watching.</text>
  <text x="500" y="222" text-anchor="middle" font-size="13" fill="#475569">Mid-stream failure arrives as an</text>
  <text x="500" y="242" text-anchor="middle" font-size="13" fill="#475569">"error" event, not an HTTP code.</text>
  <text x="180" y="252" font-size="13.5" fill="#475569">The SDK reassembles the events;</text>
  <text x="180" y="272" font-size="13.5" fill="#475569">get_final_message() returns the</text>
  <text x="180" y="292" font-size="13.5" fill="#475569">same object a full call would.</text>
</svg>
