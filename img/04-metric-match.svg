<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Precision, recall, F1: the metric must fit the task shape</text><rect x="60" y="70" width="1000" height="90" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="560" y="104" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">P = TP / (TP + FP)      R = TP / (TP + FN)      F1 = 2PR / (P + R)</text><text x="560" y="134" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">TP: flagged and correct   FP: flagged but innocent   FN: missed, should have been flagged</text><rect x="30" y="190" width="340" height="260" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="220" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">PRECISION</text><text x="200.0" y="248" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">of everything flagged,</text><text x="200.0" y="268" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">how many were correct?</text><text x="200.0" y="287" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">use when false alarms hurt</text><rect x="393" y="190" width="340" height="260" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="220" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">RECALL</text><text x="563.0" y="248" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">of everything it should</text><text x="563.0" y="268" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">have flagged, how many caught?</text><text x="563.0" y="287" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">use when misses hurt</text><rect x="756" y="190" width="340" height="260" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="220" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">F1</text><text x="926.0" y="248" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">the harmonic mean of both;</text><text x="926.0" y="268" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">punishes great-at-one,</text><text x="926.0" y="287" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">terrible-at-the-other</text></svg>