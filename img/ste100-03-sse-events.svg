<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1A7F37"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A15C07"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0E7C7B"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B3FA0"/></marker></defs><text x="560" y="38" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The SSE event sequence: the story of an answer being written</text><rect x="30" y="120" width="160" height="90" rx="10" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="110" y="170" font-size="12.5" fill="#24292F" text-anchor="middle">message_start</text><line x1="190" y1="165" x2="215" y2="165" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="215" y="120" width="160" height="90" rx="10" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="295" y="170" font-size="12.5" fill="#24292F" text-anchor="middle">content_block_start</text><line x1="375" y1="165" x2="400" y2="165" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="400" y="120" width="160" height="90" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="480" y="170" font-size="12.5" fill="#24292F" text-anchor="middle">content_block_delta x N</text><line x1="560" y1="165" x2="585" y2="165" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="585" y="120" width="160" height="90" rx="10" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="665" y="170" font-size="12.5" fill="#24292F" text-anchor="middle">content_block_stop</text><line x1="745" y1="165" x2="770" y2="165" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="770" y="120" width="160" height="90" rx="10" fill="#F3F4F6" stroke="#5C6570" stroke-width="1.5"/><text x="850" y="170" font-size="12.5" fill="#24292F" text-anchor="middle">message_stop</text><line x1="930" y1="165" x2="955" y2="165" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="955" y="120" width="160" height="90" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="1035" y="170" font-size="12.5" fill="#24292F" text-anchor="middle">message_delta: usage</text><text x="560" y="280" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">your code concatenates the deltas into the full text</text><rect x="160" y="330" width="800" height="140" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="560" y="358" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">PRODUCTION RULE</text><text x="560" y="382" font-size="13.5" fill="#24292F" text-anchor="middle">handle resume or graceful fallback:</text><text x="560" y="403" font-size="13.5" fill="#24292F" text-anchor="middle">show what arrived, offer a retry, never present a fragment as complete</text></svg>