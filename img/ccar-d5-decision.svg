<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<rect width="900" height="470" rx="14" fill="#1e293b"/>
<text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#e8e6e1">The D5 decision procedure: constraint, door, trap rejection</text>
<text x="450" y="62" text-anchor="middle" font-size="13" fill="#9fb0c3">Every governance item starts at the diamond. Pick the door from the constraint.</text>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="aht" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#0d9488"/></marker></defs>
<polygon points="450,88 590,150 450,212 310,150" fill="#28303d" stroke="#d97706" stroke-width="1.5"/>
<text x="450" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#e8e6e1">Name the constraint</text>
<text x="450" y="164" text-anchor="middle" font-size="12" fill="#9fb0c3">irreversible? regulated?</text>
<text x="450" y="182" text-anchor="middle" font-size="12" fill="#9fb0c3">high-volume? adversarial?</text>
<rect x="60" y="252" width="240" height="96" rx="10" fill="#28303d" stroke="#dc2626" stroke-width="1.5"/>
<text x="180" y="282" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#e8e6e1">Review before release</text>
<text x="180" y="304" text-anchor="middle" font-size="12" fill="#9fb0c3">irreversible or regulated</text>
<text x="180" y="326" text-anchor="middle" font-size="12" fill="#9fb0c3">approvals expire ~5 min,</text>
<text x="180" y="344" text-anchor="middle" font-size="12" fill="#9fb0c3">default to deny</text>
<line x1="180" y1="212" x2="180" y2="252" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ahb)"/>
<rect x="320" y="252" width="240" height="96" rx="10" fill="#28303d" stroke="#2563eb" stroke-width="1.5"/>
<text x="440" y="282" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#e8e6e1">Risk-gated routing</text>
<text x="440" y="304" text-anchor="middle" font-size="12" fill="#9fb0c3">high-volume mixed risk</text>
<text x="440" y="326" text-anchor="middle" font-size="12" fill="#9fb0c3">5 to 15% to humans,</text>
<text x="440" y="344" text-anchor="middle" font-size="12" fill="#9fb0c3">sampled audit on the rest</text>
<line x1="440" y1="212" x2="440" y2="252" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ahb)"/>
<rect x="580" y="252" width="240" height="96" rx="10" fill="#28303d" stroke="#0d9488" stroke-width="1.5"/>
<text x="700" y="282" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#e8e6e1">Policy engine</text>
<text x="700" y="304" text-anchor="middle" font-size="12" fill="#9fb0c3">rule must never bend</text>
<text x="700" y="326" text-anchor="middle" font-size="12" fill="#9fb0c3">deterministic, like code,</text>
<text x="700" y="344" text-anchor="middle" font-size="12" fill="#9fb0c3">no prompt can negotiate</text>
<line x1="700" y1="212" x2="700" y2="252" stroke="#0d9488" stroke-width="1.5" marker-end="url(#ahb)"/>
<rect x="60" y="376" width="240" height="52" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="180" y="408" text-anchor="middle" font-size="12.5" fill="#9fb0c3">REJECT: Sampling as a gate</text>
<rect x="320" y="376" width="240" height="52" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="440" y="408" text-anchor="middle" font-size="12.5" fill="#9fb0c3">REJECT: Bigger model as a control</text>
<rect x="580" y="376" width="240" height="52" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="700" y="408" text-anchor="middle" font-size="12.5" fill="#9fb0c3">REJECT: Model alignment as safety</text>
</svg>