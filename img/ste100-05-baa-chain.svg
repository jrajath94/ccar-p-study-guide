<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker></defs><text x="560.0" y="34" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The HIPAA BAA chain</text><rect x="20" y="80" width="253" height="230" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="146.5" y="110" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">Covered entity</text><text x="146.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">the hospital</text><text x="146.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">owns the PHI</text><line x1="273" y1="195" x2="293" y2="195" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="293" y="80" width="253" height="230" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="419.5" y="110" font-size="15" fill="#0E7C7B" text-anchor="middle" font-weight="700">Model provider</text><text x="419.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">signs a BAA</text><text x="419.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">e.g. Bedrock, Vertex</text><line x1="546" y1="195" x2="566" y2="195" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="566" y="80" width="253" height="230" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="692.5" y="110" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">Sub-processors</text><text x="692.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">each one signs too</text><text x="692.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">hosting, logging, eval</text><line x1="819" y1="195" x2="839" y2="195" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="839" y="80" width="253" height="230" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="965.5" y="110" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">Business associate</text><text x="965.5" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">bound by the BAA</text><text x="965.5" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">breach = their breach</text><text x="560.0" y="386" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">Every hand that touches PHI signs. One missing BAA breaks the chain.</text></svg>