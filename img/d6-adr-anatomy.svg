<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="560" fill="#FFFFFF"/><rect x="60" y="30" width="640" height="470" rx="10" fill="#FFFFFF" stroke="#163D7A" stroke-width="1.5"/><text x="380" y="62" font-size="17" fill="#163D7A" text-anchor="middle" font-weight="600">ADR-004: Retrieval with rerank</text><rect x="84" y="84" width="592" height="68" rx="8" fill="#EAF0FA" stroke="#E3E0D8"/><text x="104" y="112" font-size="15" fill="#163D7A" text-anchor="start" font-weight="600">1. Title</text><text x="104" y="136" font-size="13" fill="#5C6570" text-anchor="start" font-weight="400">the decision in one line</text><rect x="84" y="164" width="592" height="68" rx="8" fill="#EFF0EA" stroke="#E3E0D8"/><text x="104" y="192" font-size="15" fill="#163D7A" text-anchor="start" font-weight="600">2. Context</text><text x="104" y="216" font-size="13" fill="#5C6570" text-anchor="start" font-weight="400">the problem and the forces at play</text><rect x="84" y="244" width="592" height="68" rx="8" fill="#EAF0FA" stroke="#E3E0D8"/><text x="104" y="272" font-size="15" fill="#163D7A" text-anchor="start" font-weight="600">3. Decision</text><text x="104" y="296" font-size="13" fill="#5C6570" text-anchor="start" font-weight="400">what we chose, and the options we rejected</text><rect x="84" y="324" width="592" height="68" rx="8" fill="#EFF0EA" stroke="#E3E0D8"/><text x="104" y="352" font-size="15" fill="#163D7A" text-anchor="start" font-weight="600">4. Consequences</text><text x="104" y="376" font-size="13" fill="#5C6570" text-anchor="start" font-weight="400">what gets better, what gets worse</text><rect x="84" y="404" width="592" height="68" rx="8" fill="#EAF0FA" stroke="#E3E0D8"/><text x="104" y="432" font-size="15" fill="#163D7A" text-anchor="start" font-weight="600">5. Status</text><text x="104" y="456" font-size="13" fill="#5C6570" text-anchor="start" font-weight="400">proposed, accepted, or superseded</text><rect x="740" y="30" width="320" height="470" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="900" y="66" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="600">The rules</text><text x="900" y="108" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Numbered, in order</text><text x="900" y="138" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Stored with the code</text><text x="900" y="168" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Short: one page</text><text x="900" y="198" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Never deleted,</text><text x="900" y="228" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">only superseded</text><text x="900" y="258" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Written at decision</text><text x="900" y="288" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">time, not later</text><text x="560" y="535" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">Six months later, nobody remembers why. The ADR does.</text></svg>