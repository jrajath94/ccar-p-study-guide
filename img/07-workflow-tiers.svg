<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="428" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">AI-assisted work in three tiers</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">The AI drafts. Deterministic systems and humans verify. The tier picks the gate.</text>
<rect x="40" y="96" width="170" height="88" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="125" y="148" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">GREEN: AI-friendly</text>
<rect x="220" y="96" width="640" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="240" y="130" text-anchor="start" font-size="13" fill="#1e293b">Boilerplate, test scaffolding, docstrings, explaining legacy code</text>
<text x="240" y="156" text-anchor="start" font-size="12" fill="#64748b">Gate: Light review</text>
<rect x="40" y="200" width="170" height="88" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="125" y="252" text-anchor="middle" font-size="15" fill="#92400e" font-weight="bold">YELLOW: review carefully</text>
<rect x="220" y="200" width="640" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="240" y="234" text-anchor="start" font-size="13" fill="#1e293b">New business logic, shared-code refactors, dependency changes</text>
<text x="240" y="260" text-anchor="start" font-size="12" fill="#64748b">Gate: Read for behavior at the boundaries, not style</text>
<rect x="40" y="304" width="170" height="88" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="125" y="356" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">RED: senior gate</text>
<rect x="220" y="304" width="640" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="240" y="338" text-anchor="start" font-size="13" fill="#1e293b">Auth, cryptography, DB migrations, irreversible actions</text>
<text x="240" y="364" text-anchor="start" font-size="12" fill="#64748b">Gate: Senior review plus passing tests, no exceptions</text>
<text x="450.0" y="404" text-anchor="middle" font-size="12" fill="#94a3b8">Risk rises top to bottom. The gate strength must rise with it.</text>
</svg>
