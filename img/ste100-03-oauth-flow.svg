<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="480" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1A7F37"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A15C07"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0E7C7B"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B3FA0"/></marker></defs><text x="560" y="38" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">OAuth in three steps: the password never touches your app</text><rect x="40" y="90" width="300" height="220" rx="10" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="190" y="118" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">STEP 1</text><text x="190" y="142" font-size="13.5" fill="#24292F" text-anchor="middle">client registers</text><text x="190" y="163" font-size="13.5" fill="#24292F" text-anchor="middle">with the auth server</text><line x1="340" y1="200" x2="410" y2="200" stroke="#1F5FBF" stroke-width="2" marker-end="url(#ahb)"/><rect x="410" y="90" width="300" height="220" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="560" y="118" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">STEP 2</text><text x="560" y="142" font-size="13.5" fill="#24292F" text-anchor="middle">user goes to the auth server;</text><text x="560" y="163" font-size="13.5" fill="#24292F" text-anchor="middle">types the password THERE</text><line x1="710" y1="200" x2="780" y2="200" stroke="#1F5FBF" stroke-width="2" marker-end="url(#ahb)"/><rect x="780" y="90" width="300" height="220" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="930" y="118" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">STEP 3</text><text x="930" y="142" font-size="13.5" fill="#24292F" text-anchor="middle">server issues a short-lived</text><text x="930" y="163" font-size="13.5" fill="#24292F" text-anchor="middle">token with narrow scopes</text><text x="560" y="380" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">that separation is the whole point of OAuth: theft buys the attacker minutes, not months</text></svg>