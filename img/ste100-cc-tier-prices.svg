<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="488" viewBox="0 0 1120 488" font-family="Anthropic Sans, Inter, 'Source Sans 3', sans-serif"><rect x="0" y="0" width="1120" height="488" fill="#F7F4EE"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6B7A"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1E4D8C"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#1B2838">Model tiers: price per million tokens</text><text x="150" y="92" font-size="14" text-anchor="start" font-weight="600" fill="#1B2838">Fable 5.1 (top reasoning)</text><text x="150" y="112" font-size="12" text-anchor="start" font-weight="400" fill="#5C6B7A">last resort</text><rect x="430" y="84" width="420" height="24" rx="6" fill="#F2F3F5" stroke="#D0D4D9"/><rect x="430" y="84" width="420.0" height="24" rx="6" fill="#E7F1F8" stroke="#1E4D8C"/><text x="858" y="101.0" font-size="13" fill="#1B2838">$10 in / $50 out</text><text x="150" y="154" font-size="14" text-anchor="start" font-weight="600" fill="#1B2838">Opus 5.5 (top capability)</text><text x="150" y="174" font-size="12" text-anchor="start" font-weight="400" fill="#5C6B7A">agentic coding</text><rect x="430" y="146" width="420" height="24" rx="6" fill="#F2F3F5" stroke="#D0D4D9"/><rect x="430" y="146" width="168.0" height="24" rx="6" fill="#E6E2DA" stroke="#1F7A72"/><text x="858" y="163.0" font-size="13" fill="#1B2838">$4 in / $20 out</text><text x="150" y="216" font-size="14" text-anchor="start" font-weight="600" fill="#1B2838">Sonnet 5 (balanced)</text><text x="150" y="236" font-size="12" text-anchor="start" font-weight="400" fill="#5C6B7A">production default</text><rect x="430" y="208" width="420" height="24" rx="6" fill="#F2F3F5" stroke="#D0D4D9"/><rect x="430" y="208" width="84.0" height="24" rx="6" fill="#F6E7A8" stroke="#C46B2C"/><text x="858" y="225.0" font-size="13" fill="#1B2838">$2 in / $10 out</text><text x="150" y="278" font-size="14" text-anchor="start" font-weight="600" fill="#1B2838">Haiku 4.5 (fast)</text><text x="150" y="298" font-size="12" text-anchor="start" font-weight="400" fill="#5C6B7A">high volume</text><rect x="430" y="270" width="420" height="24" rx="6" fill="#F2F3F5" stroke="#D0D4D9"/><rect x="430" y="270" width="42.0" height="24" rx="6" fill="#E8F4F8" stroke="#2471A3"/><text x="858" y="287.0" font-size="13" fill="#1B2838">$1 in / $5 out</text><text x="560.0" y="358" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6B7A">Output costs exactly 5x input on every tier. Reason by tier, not by model name.</text><text x="24" y="479" font-size="13" fill="#5C6B7A">Source: original</text></svg>