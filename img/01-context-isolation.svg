<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="560" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Context isolation: the mechanism that makes multi-agent worth its cost</text><rect x="390" y="70" width="340" height="90" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="560" y="100" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">main agent window</text><text x="560" y="126" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">stays small and focused</text><text x="560" y="148" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">never sees the 150K raw tokens</text><rect x="120" y="200" width="380" height="88" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="310" y="230" font-size="14" fill="#A15C07" text-anchor="middle" font-weight="700">subagent A window</text><text x="310" y="254" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">assignment + 50K tokens of docs</text><line x1="560" y1="160" x2="310" y2="202" stroke="#1F5FBF" stroke-width="1.8" marker-end="url(#ahb)"/><text x="435" y="173" font-size="13" fill="#1F5FBF" text-anchor="middle" font-weight="600">spawns</text><rect x="640" y="200" width="380" height="88" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="830" y="230" font-size="13" fill="#0E7C7B" text-anchor="middle" font-weight="700">returns</text><text x="830" y="252" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">2K-token summary only</text><line x1="500" y1="244" x2="638" y2="244" stroke="#0E7C7B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="120" y="305" width="380" height="88" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="310" y="335" font-size="14" fill="#A15C07" text-anchor="middle" font-weight="700">subagent B window</text><text x="310" y="359" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">assignment + 50K tokens of docs</text><line x1="560" y1="160" x2="310" y2="305" stroke="#1F5FBF" stroke-width="1.8" marker-end="url(#ahb)"/><rect x="640" y="305" width="380" height="88" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="830" y="335" font-size="13" fill="#0E7C7B" text-anchor="middle" font-weight="700">returns</text><text x="830" y="357" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">2K-token summary only</text><line x1="500" y1="349" x2="638" y2="349" stroke="#0E7C7B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="120" y="410" width="380" height="88" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="310" y="440" font-size="14" fill="#A15C07" text-anchor="middle" font-weight="700">subagent C window</text><text x="310" y="464" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">assignment + 50K tokens of docs</text><line x1="560" y1="160" x2="310" y2="410" stroke="#1F5FBF" stroke-width="1.8" marker-end="url(#ahb)"/><rect x="640" y="410" width="380" height="88" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="830" y="440" font-size="13" fill="#0E7C7B" text-anchor="middle" font-weight="700">returns</text><text x="830" y="462" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">2K-token summary only</text><line x1="500" y1="454" x2="638" y2="454" stroke="#0E7C7B" stroke-width="1.8" marker-end="url(#ah)"/><rect x="330" y="520" width="460" height="30" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="560" y="541" font-size="13.5" fill="#1A7F37" text-anchor="middle" font-weight="600">Main agent sees: 3 summaries (~6K tokens), never the 150K raw tokens.</text></svg>