<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<rect width="960" height="690" rx="14" fill="#1e293b"/>
<text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#e8e6e1">Debug the eval failure: name the layer, change one thing</text>
<text x="480" y="62" text-anchor="middle" font-size="13" fill="#9fb0c3">The four-step procedure plus the triage tree. One change at a time.</text>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="aht" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#0d9488"/></marker><marker id="aha" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#d97706"/></marker></defs>
<text x="40" y="100" font-size="13" font-weight="bold" fill="#9fb0c3">THE PROCEDURE</text>
<rect x="40" y="120" width="400" height="100" rx="10" fill="#28303d" stroke="#2563eb" stroke-width="1.5"/>
<text x="240" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">1. Reproduce</text>
<text x="240" y="172" text-anchor="middle" font-size="12.5" fill="#9fb0c3">same input,</text>
<text x="240" y="192" text-anchor="middle" font-size="12.5" fill="#9fb0c3">same failure</text>
<rect x="40" y="232" width="400" height="100" rx="10" fill="#28303d" stroke="#2563eb" stroke-width="1.5"/>
<text x="240" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">2. Isolate the layer</text>
<text x="240" y="284" text-anchor="middle" font-size="12.5" fill="#9fb0c3">retrieval, prompt,</text>
<text x="240" y="304" text-anchor="middle" font-size="12.5" fill="#9fb0c3">model, or tools?</text>
<rect x="40" y="344" width="400" height="100" rx="10" fill="#28303d" stroke="#2563eb" stroke-width="1.5"/>
<text x="240" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">3. One change</text>
<text x="240" y="396" text-anchor="middle" font-size="12.5" fill="#9fb0c3">never two;</text>
<text x="240" y="416" text-anchor="middle" font-size="12.5" fill="#9fb0c3">two changes</text>
<text x="240" y="436" text-anchor="middle" font-size="12.5" fill="#9fb0c3">prove nothing</text>
<rect x="40" y="456" width="400" height="100" rx="10" fill="#28303d" stroke="#2563eb" stroke-width="1.5"/>
<text x="240" y="486" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">4. Check the trace</text>
<text x="240" y="508" text-anchor="middle" font-size="12.5" fill="#9fb0c3">did the failing</text>
<text x="240" y="528" text-anchor="middle" font-size="12.5" fill="#9fb0c3">layer move?</text>
<text x="500" y="100" font-size="13" font-weight="bold" fill="#9fb0c3">THE TRIAGE TREE</text>
<rect x="500" y="120" width="420" height="100" rx="10" fill="#28303d" stroke="#16a34a" stroke-width="1.5"/>
<text x="710" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">It invents facts</text>
<text x="710" y="172" text-anchor="middle" font-size="12.5" fill="#9fb0c3">ground it: retrieval,</text>
<text x="710" y="192" text-anchor="middle" font-size="12.5" fill="#9fb0c3">citations, shorter claims</text>
<rect x="500" y="232" width="420" height="100" rx="10" fill="#28303d" stroke="#d97706" stroke-width="1.5"/>
<text x="710" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">It misses instructions</text>
<text x="710" y="284" text-anchor="middle" font-size="12.5" fill="#9fb0c3">fix the prompt,</text>
<text x="710" y="304" text-anchor="middle" font-size="12.5" fill="#9fb0c3">not the model</text>
<rect x="500" y="344" width="420" height="100" rx="10" fill="#28303d" stroke="#2563eb" stroke-width="1.5"/>
<text x="710" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">It picks the wrong model</text>
<text x="710" y="396" text-anchor="middle" font-size="12.5" fill="#9fb0c3">re-route the slice,</text>
<text x="710" y="416" text-anchor="middle" font-size="12.5" fill="#9fb0c3">not a blanket upgrade</text>
<rect x="40" y="580" width="880" height="88" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="480" y="610" text-anchor="middle" font-size="15" font-weight="bold" fill="#e8e6e1">The CI gate that makes it stick</text>
<text x="480" y="632" text-anchor="middle" font-size="12.5" fill="#9fb0c3">200 to 500 golden cases. 5% of production nightly. Judge agreement near 85% before trust.</text>
</svg>