<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="560" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Multi-agent failure modes and their mitigations: memorize the pairs</text><rect x="30" y="70" width="340" height="84" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="200" y="100" font-size="14.5" fill="#B42318" text-anchor="middle" font-weight="700">Duplicate work</text><text x="200" y="124" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">two subagents research the same vendor</text><line x1="370" y1="112" x2="400" y2="112" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="400" y="70" width="690" height="84" rx="10" fill="#FFFFFF" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="745" y="120" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">partition explicitly: unique slice per worker</text><rect x="30" y="164" width="340" height="84" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="200" y="194" font-size="14.5" fill="#B42318" text-anchor="middle" font-weight="700">Conflicting actions</text><text x="200" y="218" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">two agents write the same record differently</text><line x1="370" y1="206" x2="400" y2="206" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="400" y="164" width="690" height="84" rx="10" fill="#FFFFFF" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="745" y="214" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">single-writer rule; orchestrator owns writes</text><rect x="30" y="258" width="340" height="84" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="200" y="288" font-size="14.5" fill="#B42318" text-anchor="middle" font-weight="700">Runaway delegation</text><text x="200" y="312" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">workers spawn workers; cost explodes</text><line x1="370" y1="300" x2="400" y2="300" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="400" y="258" width="690" height="84" rx="10" fill="#FFFFFF" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="745" y="308" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">max depth, max fan-out, per-task token budget</text><rect x="30" y="352" width="340" height="84" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="200" y="382" font-size="14.5" fill="#A15C07" text-anchor="middle" font-weight="700">Silent divergence</text><text x="200" y="406" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">a worker misreads its assignment, unnoticed</text><line x1="370" y1="394" x2="400" y2="394" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="400" y="352" width="690" height="84" rx="10" fill="#FFFFFF" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="745" y="402" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">structured summaries + confidence; orchestrator validates</text><rect x="30" y="446" width="340" height="84" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="200" y="476" font-size="14.5" fill="#A15C07" text-anchor="middle" font-weight="700">Irreversible side effects</text><text x="200" y="500" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">a subagent sends the email, deletes the row</text><line x1="370" y1="488" x2="400" y2="488" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="400" y="446" width="690" height="84" rx="10" fill="#FFFFFF" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="745" y="496" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">approval gates; workers propose, humans approve</text><text x="560.0" y="546" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">The exam trap answers are single giant agent (dilution) and swarm (unbounded coordination). The credited pick is orchestrator-workers.</text></svg>