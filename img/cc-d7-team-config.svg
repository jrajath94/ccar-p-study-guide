<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Team behavior lives in committed project config</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Depending on every individual to comply forever is not a control.</text>
<rect x="40" y="100" width="400" height="143" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="240.0" y="132" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">COMMITTED (team sees it)</text>
<text x="60" y="162" text-anchor="start" font-size="13" fill="#1e293b">CLAUDE.md: coding standards, compliance reminders</text>
<text x="60" y="189" text-anchor="start" font-size="13" fill="#1e293b">Project MCP config: shared servers</text>
<text x="60" y="216" text-anchor="start" font-size="13" fill="#1e293b">Secrets in environment variables, never in the file</text>
<rect x="460" y="100" width="400" height="143" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="660.0" y="132" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">NOT A CONTROL</text>
<text x="480" y="162" text-anchor="start" font-size="13" fill="#1e293b">Personal config: only one engineer sees it</text>
<text x="480" y="189" text-anchor="start" font-size="13" fill="#1e293b">A wiki: no tooling reads it</text>
<text x="480" y="216" text-anchor="start" font-size="13" fill="#1e293b">Verbal agreement: evaporates under deadline</text>
<text x="450" y="360" text-anchor="middle" font-size="13" fill="#64748b">Enforcement lives in managed settings; guidance lives in committed CLAUDE.md. Different layers.</text>
</svg>
