<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="560" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The strategy shelf: data shape plus query pattern points to the strategy</text><rect x="30" y="70" width="340" height="300" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="100" font-size="14.5" fill="#0E7C7B" text-anchor="middle" font-weight="700">Dense semantic search</text><text x="200.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">embeds query, finds nearest vectors</text><text x="200.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="200.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">&quot;how do I reset my password?&quot;</text><text x="200.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">-&gt; paraphrase matches</text><rect x="393" y="70" width="340" height="300" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="100" font-size="14.5" fill="#1F5FBF" text-anchor="middle" font-weight="700">BM25 keyword search</text><text x="563.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">ranks by exact term overlap</text><text x="563.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="563.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">&quot;ERR_4017&quot;</text><text x="563.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">-&gt; exact codes and IDs</text><rect x="756" y="70" width="340" height="300" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="100" font-size="14.5" fill="#A15C07" text-anchor="middle" font-weight="700">Hybrid + rerank</text><text x="926.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">dense and BM25 merged, cross-encoder</text><text x="926.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="926.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">mixed corpora</text><text x="926.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">-&gt; reranks the merged set</text><rect x="60" y="400" width="1000" height="120" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="560" y="430" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="700">Same corpus, three query patterns</text><text x="560" y="458" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">&quot;total refunds in March&quot; -&gt; text-to-SQL (structured table)   |   &quot;who approved the vendor that supplies part X?&quot; -&gt; GraphRAG (multi-hop)</text><text x="560" y="486" font-size="13" fill="#24292F" text-anchor="middle" font-weight="700">query pattern in + data shape in -&gt; strategy out</text></svg>