<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="428" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Trace anatomy: what a production trace holds</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">No debugger exists for a conversation. The trace is the debugger.</text>
<rect x="180" y="92" width="540" height="270" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="450" y="122" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="bold">TRACE  (one request, keyed by correlation ID)</text>
<rect x="210" y="140" width="480" height="38" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="226" y="164" text-anchor="start" font-size="13" fill="#1e293b">model version, temperature, system prompt</text>
<text x="690" y="164" text-anchor="end" font-size="11" fill="#94a3b8">the exact inputs</text>
<rect x="210" y="184" width="480" height="38" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="226" y="208" text-anchor="start" font-size="13" fill="#1e293b">tool schemas (what the model could call)</text>
<text x="690" y="208" text-anchor="end" font-size="11" fill="#94a3b8">the capability surface</text>
<rect x="210" y="228" width="480" height="38" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="226" y="252" text-anchor="start" font-size="13" fill="#1e293b">every tool_use / tool_result pair</text>
<text x="690" y="252" text-anchor="end" font-size="11" fill="#94a3b8">where most bugs live</text>
<rect x="210" y="272" width="480" height="38" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="226" y="296" text-anchor="start" font-size="13" fill="#1e293b">stop_reason: max_tokens / tool_use / end_turn</text>
<text x="690" y="296" text-anchor="end" font-size="11" fill="#94a3b8">read this first</text>
<rect x="210" y="316" width="480" height="38" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="226" y="340" text-anchor="start" font-size="13" fill="#1e293b">token usage per stage</text>
<text x="690" y="340" text-anchor="end" font-size="11" fill="#94a3b8">the cost ledger</text>
<text x="450.0" y="396" text-anchor="middle" font-size="12" fill="#94a3b8">Five steps, in order: capture, read stop reasons, inspect tool pairs, reproduce, fix. Always in this order.</text>
</svg>
