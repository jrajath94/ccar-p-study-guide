<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="498" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">How they will ask this: the exam angles</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Each design maps to a question shape. Learn the shape, not just the facts.</text>
<text x="70" y="115" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1e293b">RAG</text>
<text x="180" y="115" text-anchor="start" font-size="12" font-weight="normal" fill="#64748b">chunking vs data shape; hybrid + rerank; the cost equation</text>
<text x="70" y="155" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1e293b">Agent</text>
<text x="180" y="155" text-anchor="start" font-size="12" font-weight="normal" fill="#64748b">tool bloat; HITL placement; error handling</text>
<text x="70" y="195" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1e293b">Multi-agent</text>
<text x="180" y="195" text-anchor="start" font-size="12" font-weight="normal" fill="#64748b">topology by task shape; context isolation</text>
<text x="70" y="235" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1e293b">MCP</text>
<text x="180" y="235" text-anchor="start" font-size="12" font-weight="normal" fill="#64748b">transport choice; OAuth scopes; treat server as untrusted</text>
<text x="70" y="275" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1e293b">Caching</text>
<text x="180" y="275" text-anchor="start" font-size="12" font-weight="normal" fill="#64748b">break-even judgment; the cache-killer; TTL math</text>
<text x="70" y="315" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1e293b">Failover</text>
<text x="180" y="315" text-anchor="start" font-size="12" font-weight="normal" fill="#64748b">the three doors; degraded mode</text>
<text x="70" y="355" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1e293b">Evals</text>
<text x="180" y="355" text-anchor="start" font-size="12" font-weight="normal" fill="#64748b">golden set discipline; judge calibration; CI gates</text>
<text x="450.0" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Constraint-first reading works on every one of these.</text>
<text x="450.0" y="465" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#64748b">Find the rule in the scenario. Then pick the control that satisfies it.</text>
</svg>