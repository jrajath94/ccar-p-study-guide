<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="418" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Hybrid retrieval plus rerank: the two-stage pipeline</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Dense finds meaning, BM25 finds exact terms. Fusion finds both, rerank orders them.</text>
<rect x="40" y="110" width="240" height="110" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="160" y="150" text-anchor="middle" font-size="14" fill="#1e40af" font-weight="bold">dense (vector)</text>
<text x="160" y="176" text-anchor="middle" font-size="12" fill="#64748b">semantic similarity</text>
<rect x="660" y="110" width="200" height="110" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="760" y="150" text-anchor="middle" font-size="14" fill="#92400e" font-weight="bold">BM25 (lexical)</text>
<text x="760" y="176" text-anchor="middle" font-size="12" fill="#64748b">exact term match</text>
<rect x="330" y="110" width="280" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
<text x="470" y="150" text-anchor="middle" font-size="15" fill="#5b21b6" font-weight="bold">FUSION</text>
<text x="470" y="176" text-anchor="middle" font-size="12" fill="#64748b">reciprocal rank fusion</text>
<line x1="280" y1="165" x2="330" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="610" y1="165" x2="660" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="470" y1="220" x2="470" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="280" y="252" width="380" height="100" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="470" y="288" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">RERANK (cross-encoder)</text>
<text x="470" y="314" text-anchor="middle" font-size="12" fill="#64748b">scores query+doc together, keeps top-k</text>
<text x="450.0" y="386" text-anchor="middle" font-size="12" fill="#94a3b8">Rerank is the expensive step: only the fused top-50 go through it.</text>
</svg>
