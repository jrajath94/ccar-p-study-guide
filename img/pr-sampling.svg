<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="428" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Sampling: the three randomness dials</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Defaults work for chat. Production picks these on purpose.</text>
<rect x="40" y="100" width="160" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="120" y="146" text-anchor="middle" font-size="15" fill="#1e40af" font-weight="bold">temperature</text>
<line x1="240" y1="140" x2="640" y2="140" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
<circle cx="440" cy="140" r="11" fill="#2563eb"/>
<text x="240" y="168" text-anchor="middle" font-size="12" fill="#64748b">0.0</text>
<text x="640" y="168" text-anchor="middle" font-size="12" fill="#64748b">1.0</text>
<text x="240" y="122" text-anchor="start" font-size="11" fill="#94a3b8">predictable</text>
<text x="640" y="122" text-anchor="end" font-size="11" fill="#94a3b8">creative</text>
<text x="680" y="146" text-anchor="start" font-size="12" fill="#64748b">Tune this one first.</text>
<rect x="40" y="200" width="160" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
<text x="120" y="246" text-anchor="middle" font-size="15" fill="#5b21b6" font-weight="bold">top_p</text>
<line x1="240" y1="240" x2="640" y2="240" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
<circle cx="440" cy="240" r="11" fill="#7c3aed"/>
<text x="240" y="268" text-anchor="middle" font-size="12" fill="#64748b">0.0</text>
<text x="640" y="268" text-anchor="middle" font-size="12" fill="#64748b">1.0</text>
<text x="240" y="222" text-anchor="start" font-size="11" fill="#94a3b8">tiny set</text>
<text x="640" y="222" text-anchor="end" font-size="11" fill="#94a3b8">wide set</text>
<text x="680" y="246" text-anchor="start" font-size="12" fill="#64748b">Smallest token set whose odds pass top_p.</text>
<rect x="40" y="300" width="160" height="80" rx="10" fill="#ccfbf1" stroke="#0d9488"/>
<text x="120" y="346" text-anchor="middle" font-size="15" fill="#115e59" font-weight="bold">top_k</text>
<line x1="240" y1="340" x2="640" y2="340" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
<circle cx="440" cy="340" r="11" fill="#0d9488"/>
<text x="240" y="368" text-anchor="middle" font-size="12" fill="#64748b">1</text>
<text x="640" y="368" text-anchor="middle" font-size="12" fill="#64748b">large</text>
<text x="240" y="322" text-anchor="start" font-size="11" fill="#94a3b8">top 1</text>
<text x="640" y="322" text-anchor="end" font-size="11" fill="#94a3b8">many</text>
<text x="680" y="346" text-anchor="start" font-size="12" fill="#64748b">Cut candidates to the K most likely.</text>
<text x="450.0" y="404" text-anchor="middle" font-size="12" fill="#94a3b8">Low temperature for grading, extracting, classifying. High for brainstorming.</text>
</svg>
