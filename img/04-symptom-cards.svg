<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="540" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Signature symptoms: read the symptom, run the confirming test</text><rect x="30" y="70" width="340" height="400" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="100" font-size="14.5" fill="#B42318" text-anchor="middle" font-weight="700">HALLUCINATION</text><text x="200.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">confident false facts, invented</text><text x="200.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">citations, numbers that look right</text><text x="200.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">plausible but made-up answers</text><text x="200.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="200.0" y="206" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">CONFIRM:</text><text x="200.0" y="226" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">give the source text, ask it to quote:</text><text x="200.0" y="246" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">if the answer changes, it was ungrounded</text><rect x="393" y="70" width="340" height="400" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="100" font-size="14.5" fill="#A15C07" text-anchor="middle" font-weight="700">PROMPT FAILURE</text><text x="563.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">right content, wrong format;</text><text x="563.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">skipped steps; answered a</text><text x="563.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">different question</text><text x="563.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="563.0" y="206" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">CONFIRM:</text><text x="563.0" y="226" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">rewrite the instruction explicitly:</text><text x="563.0" y="246" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">if behavior flips, the prompt was the bug</text><rect x="756" y="70" width="340" height="400" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="100" font-size="14.5" fill="#0E7C7B" text-anchor="middle" font-weight="700">MODEL MISMATCH</text><text x="926.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">reasoning collapses on hard cases,</text><text x="926.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">works on easy ones; long context</text><text x="926.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">degrades</text><text x="926.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400"></text><text x="926.0" y="206" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">CONFIRM:</text><text x="926.0" y="226" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">run the same prompt on a larger model:</text><text x="926.0" y="246" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">if it now works, the small model was the ceiling</text></svg>