<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="380" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">The decision-rule habit: if the stem says X, pick Y</text><rect x="60" y="90" width="290" height="190" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="205.0" y="119" font-size="15" text-anchor="middle" font-weight="700" fill="#1F5FBF">Stem says "34 tools,</text><text x="205.0" y="147" font-size="13" text-anchor="middle" fill="#24292F">accuracy falling</text><text x="205.0" y="167" font-size="13" text-anchor="middle" fill="#24292F">overlapping</text><text x="205.0" y="187" font-size="13" text-anchor="middle" fill="#24292F">descriptions</text><rect x="415" y="90" width="290" height="190" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="560.0" y="119" font-size="15" text-anchor="middle" font-weight="700" fill="#0E7C7B">Rule fires:</text><text x="560.0" y="147" font-size="13" text-anchor="middle" fill="#24292F">decompose before</text><text x="560.0" y="167" font-size="13" text-anchor="middle" fill="#24292F">you route</text><text x="560.0" y="187" font-size="13" text-anchor="middle" fill="#24292F">bloat first</text><rect x="770" y="90" width="290" height="190" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="915.0" y="119" font-size="15" text-anchor="middle" font-weight="700" fill="#A15C07">Pick:</text><text x="915.0" y="147" font-size="13" text-anchor="middle" fill="#24292F">the decomposition</text><text x="915.0" y="167" font-size="13" text-anchor="middle" fill="#24292F">option, not the</text><text x="915.0" y="187" font-size="13" text-anchor="middle" fill="#24292F">router option</text><line x1="350" y1="185" x2="415" y2="185" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="705" y1="185" x2="770" y2="185" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="330" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Build one rule per trap pattern. On exam day the rule answers, not your memory.</text></svg>