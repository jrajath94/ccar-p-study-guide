<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="440" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The selection framework: the cheapest model that passes</text><rect x="30" y="70" width="340" height="260" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="100" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">1. WRITE THE BAR</text><text x="200.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">accuracy target, latency budget,</text><text x="200.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">cost ceiling; e.g. 90% correct,</text><text x="200.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">p95 under 800 ms, under $5K/mo</text><rect x="393" y="70" width="340" height="260" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="100" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">2. START AT THE BOTTOM</text><text x="563.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">prototype on Haiku with</text><text x="563.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">a good prompt; measure on</text><text x="563.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">a representative eval set</text><rect x="756" y="70" width="340" height="260" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="100" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">3. CLIMB ON EVIDENCE</text><text x="926.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Haiku misses -&gt; Sonnet -&gt; Opus;</text><text x="926.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Fable is the last resort,</text><text x="926.0" y="167" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">never the default</text><line x1="370" y1="200" x2="393" y2="200" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="733" y1="200" x2="756" y2="200" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="230" y="360" width="660" height="44" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="560" y="388" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">Re-run the ladder quarterly: prices move, traffic mixes change, selection recurs.</text></svg>