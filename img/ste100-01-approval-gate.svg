ight="110" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="410" y="150" font-size="13.5" fill="#24292F" text-anchor="middle">high stakes?</text><text x="410" y="170" font-size="13.5" fill="#24292F" text-anchor="middle">irreversible?</text><line x1="510" y1="130" x2="590" y2="80" stroke="#1A7F37" stroke-width="2" marker-end="url(#ahg)"/><line x1="510" y1="180" x2="590" y2="230" stroke="#B42318" stroke-width="2" marker-end="url(#ahr)"/><rect x="590" y="40" width="220" height="110" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="700" y="79" font-size="13.5" fill="#24292F" text-anchor="middle">LOW STAKES</text><text x="700" y="100" font-size="13.5" fill="#24292F" text-anchor="middle">auto-apply</text><text x="700" y="121" font-size="13.5" fill="#24292F" text-anchor="middle">+ audit trail</text><rect x="590" y="190" width="220" height="110" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/><text x="700" y="229" font-size="13.5" fill="#24292F" text-anchor="middle">HIGH STAKES</text><text x="700" y="250" font-size="13.5" fill="#24292F" text-anchor="middle">human approves</text><text x="700" y="271" font-size="13.5" fill="#24292F" text-anchor="middle">then execute</text><line x1="810" y1="95" x2="880" y2="95" stroke="#1A7F37" stroke-width="2" marker-end="url(#ahg)"/><line x1="810" y1="245" x2="880" y2="245" stroke="#B42318" stroke-width="2" marker-end="url(#ahr)"/><rect x="880" y="90" width="200" height="160" rx="10" fill="#F3F4F6" stroke="#5C6570" stroke-width="1.5"/><text x="980" y="164" font-size="13.5" fill="#24292F" text-anchor="middle">action</text><text x="980" y="186" font-size="13.5" fill="#24292F" text-anchor="middle">logged</text><text x="560" y="380" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">every row trades something: the approval gate trades a little latency for safety</text><text x="560" y="410" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">exam move: name th