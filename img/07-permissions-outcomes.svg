<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="398" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">The three permission outcomes</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Every tool call is pattern-matched first. The outcome decides what happens next.</text>
<rect x="340" y="88" width="220" height="52" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="450.0" y="108.0" text-anchor="middle" font-size="14" fill="#1e293b">Tool call arrives</text>
<text x="450.0" y="130.0" text-anchor="middle" font-size="12" fill="#64748b">e.g. Bash(git push --force)</text>
<line x1="450" y1="140" x2="180" y2="168" stroke="#16a34a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="172" width="240" height="118" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="160.0" y="204" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">ALLOW</text>
<text x="60" y="234" text-anchor="start" font-size="12" fill="#64748b">Runs silently, no prompt</text>
<text x="60" y="261" text-anchor="start" font-size="12" fill="#64748b">Bash(npm run test:*)</text>
<text x="60" y="288" text-anchor="start" font-size="12" fill="#94a3b8">first match wins</text>
<line x1="450" y1="140" x2="460" y2="168" stroke="#d97706" stroke-width="2" marker-end="url(#ah)"/>
<rect x="320" y="172" width="240" height="118" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="440.0" y="204" text-anchor="middle" font-size="15" fill="#92400e" font-weight="bold">ASK</text>
<text x="340" y="234" text-anchor="start" font-size="12" fill="#64748b">Pauses for human approval</text>
<text x="340" y="261" text-anchor="start" font-size="12" fill="#64748b">WebFetch (ask)</text>
<text x="340" y="288" text-anchor="start" font-size="12" fill="#94a3b8">ask is a speed bump</text>
<line x1="450" y1="140" x2="740" y2="168" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
<rect x="600" y="172" width="240" height="118" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="720.0" y="204" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">DENY</text>
<text x="620" y="234" text-anchor="start" font-size="12" fill="#64748b">Blocked and logged</text>
<text x="620" y="261" text-anchor="start" font-size="12" fill="#64748b">Bash(sudo *)</text>
<text x="620" y="288" text-anchor="start" font-size="12" fill="#94a3b8">deny wins on conflict</text>
<text x="450" y="330" text-anchor="middle" font-size="13" fill="#64748b">Guarantee strength rises left to right. When a stem says "must never", only DENY qualifies.</text>
<text x="450.0" y="366" text-anchor="middle" font-size="12" fill="#94a3b8">The outcomes the permission system produces for each attempted action.</text>
</svg>
