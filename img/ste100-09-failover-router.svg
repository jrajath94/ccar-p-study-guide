<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="498" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Design 6: multi-cloud failover - the three doors</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Three ways to survive a provider outage. Pick by how much pain you accept.</text>
<rect x="40" y="100" width="250" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="165.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16a34a">Door 1: Retry</text>
<text x="165.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">same provider,</text>
<text x="165.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">another region</text>
<text x="165.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="165.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">cheapest,</text>
<text x="165.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">shares the</text>
<text x="165.0" y="241" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">outage risk</text>
<rect x="325" y="100" width="250" height="170" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="450.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#d97706">Door 2: Second provider</text>
<text x="450.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">hot standby</text>
<text x="450.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">model</text>
<text x="450.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="450.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">costs more,</text>
<text x="450.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">survives a</text>
<text x="450.0" y="241" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">full outage</text>
<rect x="610" y="100" width="250" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="735.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">Door 3: Router</text>
<text x="735.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">per-request</text>
<text x="735.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">routing</text>
<text x="735.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="735.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">smartest,</text>
<text x="735.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">needs evals</text>
<text x="735.0" y="241" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">to prove parity</text>
<rect x="230" y="320" width="440" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="450.0" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">The router decides on</text>
<text x="450.0" y="366" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">latency, cost, and quality signals per request</text>
<text x="450.0" y="385" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">degraded mode defined up front: what still works</text>
<text x="450.0" y="404" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">when the primary is down</text>
<line x1="450" y1="270" x2="450" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
</svg>