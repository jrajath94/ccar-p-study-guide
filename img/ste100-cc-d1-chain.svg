<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="408" viewBox="0 0 1120 408" font-family="Anthropic Sans, Inter, 'Source Sans 3', sans-serif"><rect x="0" y="0" width="1120" height="408" fill="#F7F4EE"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6B7A"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#1B2838">The four-link chain turns a vague ask into a contract</text><rect x="52" y="100" width="230" height="170" rx="10" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/><text x="167.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#1E4D8C">Requirement</text><text x="167.0" y="157" font-size="13" text-anchor="middle" fill="#1B2838">every ticket reaches</text><text x="167.0" y="177" font-size="13" text-anchor="middle" fill="#1B2838">the right queue</text><rect x="314" y="100" width="230" height="170" rx="10" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/><text x="429.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#1F7A72">Metric</text><text x="429.0" y="157" font-size="13" text-anchor="middle" fill="#1B2838">precision on a</text><text x="429.0" y="177" font-size="13" text-anchor="middle" fill="#1B2838">500-ticket holdout</text><rect x="576" y="100" width="230" height="170" rx="10" fill="#F6E7A8" stroke="#C46B2C" stroke-width="1.5"/><text x="691.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#C46B2C">Threshold</text><text x="691.0" y="157" font-size="13" text-anchor="middle" fill="#1B2838">at least 95%</text><text x="691.0" y="177" font-size="13" text-anchor="middle" fill="#1B2838">to pass the gate</text><rect x="838" y="100" width="230" height="170" rx="10" fill="#D9E8D3" stroke="#1F7A72" stroke-width="1.5"/><text x="953.0" y="129" font-size="15" text-anchor="middle" font-weight="700" fill="#1F7A72">Owner</text><text x="953.0" y="157" font-size="13" text-anchor="middle" fill="#1B2838">support lead</text><text x="953.0" y="177" font-size="13" text-anchor="middle" fill="#1B2838">signs the breach</text><line x1="282" y1="185" x2="314" y2="185" stroke="#5C6B7A" stroke-width="2" marker-end="url(#ah)"/><line x1="544" y1="185" x2="576" y2="185" stroke="#5C6B7A" stroke-width="2" marker-end="url(#ah)"/><line x1="806" y1="185" x2="838" y2="185" stroke="#5C6B7A" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="325" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6B7A">Write the chain before the build. One chain permits one build. Vague words permit three builds.</text><text x="24" y="399" font-size="13" fill="#5C6B7A">Source: original</text></svg>
