<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="498" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Configuration layers: highest precedence wins</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Settings resolve from the most specific authority down to defaults.</text>
<rect x="190.0" y="95" width="520" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="450.0" y="119" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">1. Managed (enterprise) policy</text>
<text x="450.0" y="141" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">set by IT / platform admins, pushed to every machine</text>
<text x="450.0" y="160" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">developer CANNOT override - compliance rules live here</text>
<rect x="250.0" y="189" width="400" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="450.0" y="213" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16a34a">2. Project settings  (.claude/settings.json)</text>
<text x="450.0" y="235" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">checked into version control - the whole team inherits</text>
<text x="450.0" y="254" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">shared permissions, shared hooks, project conventions</text>
<rect x="300.0" y="283" width="300" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="450.0" y="307" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#d97706">3. User settings</text>
<text x="450.0" y="329" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">~/.claude/settings.json</text>
<text x="450.0" y="348" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">personal defaults that follow</text>
<text x="450.0" y="367" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">the developer across repos</text>
<rect x="310.0" y="397" width="280" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="450.0" y="421" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#64748b">4. Built-in defaults</text>
<text x="450.0" y="443" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">the tool&#x27;s out-of-box behavior</text>
<line x1="800" y1="130" x2="800" y2="440" stroke="#2563eb" stroke-width="2" marker-end="url(#ahb)"/>
<text x="815" y="285" text-anchor="start" font-size="12" font-weight="bold" fill="#2563eb">wins</text>
</svg>