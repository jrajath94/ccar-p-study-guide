<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="570" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#163D7A"/></marker></defs><polygon points="560,70 170,470 950,470" fill="#F1F4FA" stroke="#163D7A" stroke-width="2"/><text x="560" y="45" font-size="17" fill="#163D7A" text-anchor="middle" font-weight="600">ACCURACY</text><text x="120" y="505" font-size="17" fill="#163D7A" text-anchor="middle" font-weight="600">LATENCY</text><text x="1000" y="505" font-size="17" fill="#163D7A" text-anchor="middle" font-weight="600">COST</text><circle cx="560" cy="165" r="14" fill="#1F5FBF" stroke="#FFFFFF" stroke-width="3"/><text x="560" y="141" font-size="14" fill="#24292F" text-anchor="middle" font-weight="600">A: frontier model</text><circle cx="520" cy="330" r="14" fill="#0E7C7B" stroke="#FFFFFF" stroke-width="3"/><text x="520" y="306" font-size="14" fill="#24292F" text-anchor="middle" font-weight="600">B: balanced</text><circle cx="745" cy="415" r="14" fill="#A15C07" stroke="#FFFFFF" stroke-width="3"/><text x="745" y="391" font-size="14" fill="#24292F" text-anchor="middle" font-weight="600">C: cheap and fast</text><text x="560" y="545" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">Push hard toward one corner and the other two pull back. There is no corner that wins all three.</text></svg>