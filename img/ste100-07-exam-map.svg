<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="498" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Exam-day notes for D7: the smallest domain</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">D7 is 7% of the exam - roughly 4 of 63 items. Each one is a production scenario with a constraint.</text>
<rect x="40" y="100" width="400" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="240.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">How they ask it</text>
<text x="240.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">scenario-shaped items</text>
<text x="240.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">do NOT memorize config paths</text>
<text x="240.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">practice constraint-first reading</text>
<text x="240.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">find &quot;must never&quot;, &quot;at 2am&quot;,</text>
<text x="240.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">&quot;even if a developer edits...&quot;</text>
<rect x="460" y="100" width="400" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="660.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16a34a">&quot;Most correct&quot; distractors</text>
<text x="660.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">several options partly right</text>
<text x="660.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">ask: which GUARANTEES</text>
<text x="660.0" y="184" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">the outcome?</text>
<text x="660.0" y="203" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b"></text>
<text x="660.0" y="222" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">deny beats ask</text>
<text x="450.0" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">The precedence chain the exam tests:</text>
<rect x="60" y="310" width="240" height="120" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="180.0" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#64748b">Rollout order</text>
<text x="180.0" y="356" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">managed policy first</text>
<text x="180.0" y="375" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">then project conventions</text>
<text x="180.0" y="394" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">then personal settings</text>
<rect x="330" y="310" width="240" height="120" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="450.0" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#64748b">Incident order</text>
<text x="450.0" y="356" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">detect, triage,</text>
<text x="450.0" y="375" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">mitigate, root-cause,</text>
<text x="450.0" y="394" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">harden</text>
<rect x="600" y="310" width="240" height="120" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="720.0" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#64748b">Debug order</text>
<text x="720.0" y="356" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">correlation ID,</text>
<text x="720.0" y="375" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">stop reasons, tool pairs,</text>
<text x="720.0" y="394" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">frozen replay</text>
<text x="450.0" y="465" text-anchor="middle" font-size="13" font-weight="normal" fill="#64748b">prevention beats detection - managed layer beats project settings</text>
</svg>