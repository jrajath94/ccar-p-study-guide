<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="398" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">The data boundary: what may cross, what must not</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">A prompt is data. The boundary decides what is allowed to flow into AI tools.</text>
<rect x="40" y="100" width="380" height="170" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="230.0" y="132" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">MAY FLOW (with rules)</text>
<text x="60" y="162" text-anchor="start" font-size="13" fill="#1e293b">Public code: anywhere</text>
<text x="60" y="189" text-anchor="start" font-size="13" fill="#1e293b">Internal code: only tools under the org data agreement</text>
<text x="60" y="216" text-anchor="start" font-size="13" fill="#1e293b">Anonymized tickets: after PII redaction</text>
<text x="60" y="243" text-anchor="start" font-size="13" fill="#1e293b">Secrets: by NAME ("DB_PASSWORD"), never by value</text>
<rect x="480" y="100" width="380" height="170" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="670.0" y="132" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">MUST NEVER CROSS</text>
<text x="500" y="162" text-anchor="start" font-size="13" fill="#1e293b">API keys, passwords, private keys, tokens</text>
<text x="500" y="189" text-anchor="start" font-size="13" fill="#1e293b">Customer PII: names, emails, card numbers</text>
<text x="500" y="216" text-anchor="start" font-size="13" fill="#1e293b">Source code with no vendor data agreement</text>
<text x="500" y="243" text-anchor="start" font-size="13" fill="#1e293b">Anything under a "never" policy: use ZDR terms</text>
<line x1="420" y1="215" x2="480" y2="215" stroke="#dc2626" stroke-width="3" marker-end="url(#ahr)"/>
<text x="450" y="196" text-anchor="middle" font-size="20" fill="#dc2626" font-weight="bold">X</text>
<text x="450.0" y="366" text-anchor="middle" font-size="12" fill="#94a3b8">Prevention beats detection: a PreToolUse hook blocks secret patterns before the model sees them.</text>
</svg>
