<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Pick the availability target your architecture can actually hold</text><text x="200" y="78" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="700">TARGET</text><text x="470" y="78" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="700">ALLOWED DOWNTIME / 30 DAYS</text><text x="800" y="78" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="700">WHAT IT MEANS</text><rect x="60" y="95" width="280" height="100" rx="10" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="200" y="150" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">99%</text><rect x="360" y="95" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="470" y="150" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">7 hours 12 minutes</text><rect x="600" y="95" width="460" height="100" rx="10" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="830" y="150" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">one bad afternoon a month is fine</text><rect x="60" y="207" width="280" height="100" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="200" y="262" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">99.9%</text><rect x="360" y="207" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="470" y="262" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">43 minutes</text><rect x="600" y="207" width="460" height="100" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="830" y="262" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">tight but achievable with one region + retries</text><rect x="60" y="319" width="280" height="100" rx="10" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="200" y="374" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">99.99%</text><rect x="360" y="319" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="470" y="374" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">4 minutes 19 seconds</text><rect x="600" y="319" width="460" height="100" rx="10" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="830" y="374" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">needs multi-region failover and serious engineering</text><rect x="160" y="440" width="800" height="50" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="560" y="470" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="600">Each extra nine roughly multiplies the engineering cost. Never promise 99.99% because it sounds good.</text></svg>