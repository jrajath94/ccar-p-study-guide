<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Usage policy and safety levels: two different instruments</text><rect x="60" y="70" width="490" height="360" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="305" y="102" font-size="15" fill="#B42318" text-anchor="middle" font-weight="700">USAGE POLICY</text><text x="305" y="132" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">what the system may not be used for</text><text x="305" y="175" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">weapons development</text><text x="305" y="207" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">cyberattacks on critical infrastructure</text><text x="305" y="239" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">CSAM, violent wrongdoing</text><text x="305" y="271" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">fraud and deception at scale</text><text x="305" y="303" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">guardrails backstop the model&#x27;s</text><text x="305" y="335" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">own refusals</text><rect x="570" y="70" width="490" height="360" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="815" y="102" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">AI SAFETY LEVELS</text><text x="815" y="132" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">ASL-1 to ASL-4: a ratcheting ladder</text><rect x="640" y="170" width="350" height="44" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="815" y="198" font-size="13.5" fill="#A15C07" text-anchor="middle" font-weight="700">ASL-1: standard practices</text><rect x="640" y="222" width="350" height="44" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="815" y="250" font-size="13.5" fill="#A15C07" text-anchor="middle" font-weight="700">ASL-2: stronger safeguards</text><rect x="640" y="274" width="350" height="44" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="815" y="302" font-size="13.5" fill="#A15C07" text-anchor="middle" font-weight="700">ASL-3: serious containment</text><rect x="640" y="326" width="350" height="44" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="815" y="354" font-size="13.5" fill="#A15C07" text-anchor="middle" font-weight="700">ASL-4: highest rigor</text><rect x="160" y="455" width="800" height="36" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="560" y="479" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">As capabilities grow, the required safety practices ratchet up.</text></svg>