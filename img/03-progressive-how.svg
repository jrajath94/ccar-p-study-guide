<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="560" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Progressive discovery: five moves, each attacking one monolith failure</text><rect x="20" y="70" width="200" height="380" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="120.0" y="100" font-size="13.5" fill="#1F5FBF" text-anchor="middle" font-weight="700">Thin core prompt</text><text x="120.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">identity, task frame, pointers;</text><text x="120.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">one line per capability</text><rect x="236" y="70" width="200" height="380" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="336.0" y="100" font-size="13.5" fill="#0E7C7B" text-anchor="middle" font-weight="700">Just-in-time loading</text><text x="336.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">load the skill or document only</text><text x="336.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">when the agent asks for it</text><rect x="452" y="70" width="200" height="380" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="552.0" y="100" font-size="13.5" fill="#A15C07" text-anchor="middle" font-weight="700">Subagents, fresh contexts</text><text x="552.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">small task-specific prompt;</text><text x="552.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">returns only the result</text><rect x="668" y="70" width="200" height="380" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="768.0" y="100" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="700">Summarize as you go</text><text x="768.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">compact the history, keep decisions,</text><text x="768.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">discard verbatim tool output</text><rect x="884" y="70" width="200" height="380" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="984.0" y="100" font-size="13.5" fill="#1A7F37" text-anchor="middle" font-weight="700">Cache-friendly structure</text><text x="984.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">stable core caches at 90% off;</text><text x="984.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">per-turn additions stay cheap</text><text x="560.0" y="546" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">Unused context is never paid for and never distracts. The window is a hard ceiling, not a target.</text></svg>