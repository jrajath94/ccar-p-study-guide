<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="560" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Chunking strategies and when each wins</text><text x="230" y="78" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="700">STRATEGY</text><text x="520" y="78" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="700">HOW IT CUTS</text><text x="800" y="78" font-size="12.5" fill="#5C6570" text-anchor="middle" font-weight="700">BEST FOR / WATCH OUT</text><rect x="40" y="95" width="340" height="100" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="210" y="150" font-size="14" fill="#1F5FBF" text-anchor="middle" font-weight="700">Fixed-size</text><rect x="400" y="95" width="240" height="100" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="520" y="150" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">every N tokens (e.g. 512), no questions</text><rect x="660" y="95" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="870" y="133" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">best: simple baselines</text><text x="870" y="159" font-size="12.5" fill="#B42318" text-anchor="middle" font-weight="400">watch: cuts mid-idea</text><rect x="40" y="207" width="340" height="100" rx="10" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="210" y="262" font-size="14" fill="#0E7C7B" text-anchor="middle" font-weight="700">Recursive</text><rect x="400" y="207" width="240" height="100" rx="10" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="520" y="262" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">separators, largest first: paragraphs, sentences</text><rect x="660" y="207" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="870" y="245" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">best: general docs; the default winner</text><text x="870" y="271" font-size="12.5" fill="#B42318" text-anchor="middle" font-weight="400">watch: blind across paragraphs</text><rect x="40" y="319" width="340" height="100" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="210" y="374" font-size="14" fill="#A15C07" text-anchor="middle" font-weight="700">Semantic</text><rect x="400" y="319" width="240" height="100" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="520" y="374" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">where meaning shifts, via embedding similarity</text><rect x="660" y="319" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="870" y="357" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">best: topic drift essays</text><text x="870" y="383" font-size="12.5" fill="#B42318" text-anchor="middle" font-weight="400">watch: slower, needs threshold tuning</text><rect x="40" y="431" width="340" height="100" rx="10" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="210" y="486" font-size="14" fill="#B42318" text-anchor="middle" font-weight="700">Proposition-level</text><rect x="400" y="431" width="240" height="100" rx="10" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="520" y="486" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">one atomic fact per chunk</text><rect x="660" y="431" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="870" y="469" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">best: precise factual Q&amp;A</text><text x="870" y="495" font-size="12.5" fill="#B42318" text-anchor="middle" font-weight="400">watch: explodes chunk count and cost</text></svg>