<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1A7F37"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A15C07"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0E7C7B"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B3FA0"/></marker></defs><text x="560" y="38" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Four feedback loops, four timescales: the loops make the system reliable</text><rect x="30" y="70" width="220" height="90" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="140" y="110" font-size="13" fill="#24292F" text-anchor="middle">PRODUCT LOOP</text><text x="140" y="130" font-size="13" fill="#24292F" text-anchor="middle">(hours to days)</text><line x1="250" y1="115" x2="290" y2="115" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="290" y="70" width="800" height="90" rx="10" fill="#F3F4F6" stroke="#5C6570" stroke-width="1.5"/><text x="690" y="110" font-size="13" fill="#24292F" text-anchor="middle">thumbs up/down, corrections, "that was wrong" clicks</text><text x="690" y="130" font-size="13" fill="#24292F" text-anchor="middle">feeds prompt tweaks and routing rules</text><rect x="30" y="175" width="220" height="90" rx="10" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="140" y="214" font-size="13" fill="#24292F" text-anchor="middle">EVAL LOOP</text><text x="140" y="236" font-size="13" fill="#24292F" text-anchor="middle">(weekly)</text><line x1="250" y1="220" x2="290" y2="220" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="290" y="175" width="800" height="90" rx="10" fill="#F3F4F6" stroke="#5C6570" stroke-width="1.5"/><text x="690" y="214" font-size="13" fill="#24292F" text-anchor="middle">re-run the golden set on every prompt or model change</text><text x="690" y="236" font-size="13" fill="#24292F" text-anchor="middle">catches regressions before users do</text><rect x="30" y="280" width="220" height="90" rx="10" fill="#F3EEFB" stroke="#6B3FA0" stroke-width="1.5"/><text x="140" y="320" font-size="13" fill="#24292F" text-anchor="middle">DATA LOOP</text><text x="140" y="340" font-size="13" fill="#24292F" text-anchor="middle">(monthly to quarterly)</text><line x1="250" y1="325" x2="290" y2="325" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="290" y="280" width="800" height="90" rx="10" fill="#F3F4F6" stroke="#5C6570" stroke-width="1.5"/><text x="690" y="320" font-size="13" fill="#24292F" text-anchor="middle">production examples become training signal</text><text x="690" y="340" font-size="13" fill="#24292F" text-anchor="middle">better retrieval, fine-tuning data, few-shot examples</text><rect x="30" y="385" width="220" height="90" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="140" y="424" font-size="13" fill="#24292F" text-anchor="middle">HUMAN LOOP</text><text x="140" y="446" font-size="13" fill="#24292F" text-anchor="middle">(continuous sampling)</text><line x1="250" y1="430" x2="290" y2="430" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="290" y="385" width="800" height="90" rx="10" fill="#F3F4F6" stroke="#5C6570" stroke-width="1.5"/><text x="690" y="424" font-size="13" fill="#24292F" text-anchor="middle">humans review edge cases and high-stakes actions</text><text x="690" y="446" font-size="13" fill="#24292F" text-anchor="middle">catches what metrics miss: tone, novel failures, drift</text></svg>