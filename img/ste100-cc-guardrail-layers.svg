<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="508" viewBox="0 0 1120 508" font-family="Anthropic Sans, Inter, 'Source Sans 3', sans-serif"><rect x="0" y="0" width="1120" height="508" fill="#F7F4EE"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6B7A"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1E4D8C"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#1B2838">Five guardrail layers, outside in</text><rect x="120" y="70" width="880" height="58" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/><text x="140" y="94" font-size="14" text-anchor="start" font-weight="700" fill="#1E4D8C">1. Input filtering</text><text x="140" y="114" font-size="12" text-anchor="start" font-weight="400" fill="#1B2838">injection detectors, PII redaction, jailbreak patterns</text><rect x="120" y="140" width="880" height="58" rx="8" fill="#E8F4F8" stroke="#2471A3" stroke-width="1.5"/><text x="140" y="164" font-size="14" text-anchor="start" font-weight="700" fill="#2471A3">2. Classifier gates</text><text x="140" y="184" font-size="12" text-anchor="start" font-weight="400" fill="#1B2838">allow or block classes of content</text><rect x="120" y="210" width="880" height="58" rx="8" fill="#E6E2DA" stroke="#1F7A72" stroke-width="1.5"/><text x="140" y="234" font-size="14" text-anchor="start" font-weight="700" fill="#1F7A72">3. Policy engines</text><text x="140" y="254" font-size="12" text-anchor="start" font-weight="400" fill="#1B2838">deterministic rules, evaluated like code; no prompt can negotiate</text><rect x="120" y="280" width="880" height="58" rx="8" fill="#F6E7A8" stroke="#C46B2C" stroke-width="1.5"/><text x="140" y="304" font-size="14" text-anchor="start" font-weight="700" fill="#C46B2C">4. Output filtering</text><text x="140" y="324" font-size="12" text-anchor="start" font-weight="400" fill="#1B2838">scan the response before the user sees it</text><rect x="120" y="350" width="880" height="58" rx="8" fill="#F3E8F7" stroke="#7B2D8E" stroke-width="1.5"/><text x="140" y="374" font-size="14" text-anchor="start" font-weight="700" fill="#7B2D8E">5. Tool-use controls</text><text x="140" y="394" font-size="12" text-anchor="start" font-weight="400" fill="#1B2838">least-privilege scopes, allow-lists, human confirmation</text><text x="560.0" y="445" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6B7A">Defense in depth: each layer catches what the others miss.</text><text x="24" y="499" font-size="13" fill="#5C6B7A">Source: original</text></svg>