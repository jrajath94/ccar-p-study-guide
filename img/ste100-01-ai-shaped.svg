<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="470" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1A7F37"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A15C07"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0E7C7B"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B3FA0"/></marker></defs><text x="560" y="38" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Is the task AI-shaped? All four conditions must hold</text><rect x="30" y="70" width="250" height="220" rx="10" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="155" y="98" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">1. MESSY INPUT</text><text x="155" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">language or messy data,</text><text x="155" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">not a clean table</text><rect x="300" y="70" width="250" height="220" rx="10" fill="#F3EEFB" stroke="#6B3FA0" stroke-width="1.5"/><text x="425" y="98" font-size="15" fill="#6B3FA0" text-anchor="middle" font-weight="700">2. NO IF-STATEMENT</text><text x="425" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">you cannot write the rule</text><text x="425" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">as an if-statement</text><rect x="570" y="70" width="250" height="220" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="695" y="98" font-size="15" fill="#A15C07" text-anchor="middle" font-weight="700">3. NEEDS JUDGMENT</text><text x="695" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">the task needs judgment,</text><text x="695" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">not lookup</text><rect x="840" y="70" width="250" height="220" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="965" y="98" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">4. BOUNDED COST</text><text x="965" y="122" font-size="13.5" fill="#24292F" text-anchor="middle">a wrong answer has a bounded,</text><text x="965" y="143" font-size="13.5" fill="#24292F" text-anchor="middle">checkable cost; a verifier exists</text><rect x="160" y="330" width="800" height="100" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="560" y="358" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">ALL FOUR HOLD -> AI-SHAPED</text><text x="560" y="382" font-size="13.5" fill="#24292F" text-anchor="middle">use Claude; design the system around it</text><text x="560" y="458" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">Any condition fails -> write the if-statement, or use search / a database. The exam loves this.</text></svg>