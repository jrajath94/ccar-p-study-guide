<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" font-family="Anthropic Sans, Inter, 'Source Sans 3', sans-serif"><rect x="0" y="0" width="1120" height="360" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">The six-phase lifecycle</text><rect x="40" y="120" width="150" height="100" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="115.0" y="148" font-size="14" text-anchor="middle" font-weight="700" fill="#1F5FBF">1. Discover</text><line x1="193" y1="170" x2="211" y2="170" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="214" y="120" width="150" height="100" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="289.0" y="148" font-size="14" text-anchor="middle" font-weight="700" fill="#0E7C7B">2. Design</text><line x1="367" y1="170" x2="385" y2="170" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="388" y="120" width="150" height="100" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="463.0" y="148" font-size="14" text-anchor="middle" font-weight="700" fill="#A15C07">3. Build</text><line x1="541" y1="170" x2="559" y2="170" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="562" y="120" width="150" height="100" rx="10" fill="#F3E8F7" stroke="#7B2D8E" stroke-width="1.5"/><text x="637.0" y="148" font-size="14" text-anchor="middle" font-weight="700" fill="#7B2D8E">4. Hand off</text><line x1="715" y1="170" x2="733" y2="170" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="736" y="120" width="150" height="100" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="1.5"/><text x="811.0" y="148" font-size="14" text-anchor="middle" font-weight="700" fill="#C0392B">5. Monitor</text><line x1="889" y1="170" x2="907" y2="170" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="910" y="120" width="150" height="100" rx="10" fill="#E8F4F8" stroke="#2471A3" stroke-width="1.5"/><text x="985.0" y="148" font-size="14" text-anchor="middle" font-weight="700" fill="#2471A3">6. Iterate</text><line x1="1060" y1="235" x2="40" y2="235" stroke="#5C6570" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ah)"/><text x="560.0" y="300" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Then the loop turns again. The eval set judges every iteration.</text></svg>