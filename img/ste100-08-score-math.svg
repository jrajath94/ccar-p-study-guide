<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="480" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="478" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">The 720 score: what it is and is not</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">The exam is criterion-referenced. 720 is not 72 percent correct.</text>
<rect x="60" y="100" width="780" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="450.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">The scale: 100 to 1,000</text>
<text x="450.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">your raw score maps to a scaled score - the scale is fixed</text>
<rect x="60" y="210" width="780" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="450.0" y="234" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16a34a">Pass: 720</text>
<text x="450.0" y="256" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">meet the passing standard, set by subject-matter experts</text>
<rect x="60" y="320" width="780" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="450.0" y="344" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#dc2626">Not this</text>
<text x="450.0" y="366" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">720 is NOT 72% of items correct</text>
<text x="450.0" y="385" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">the number of right answers needed floats with item difficulty</text>
<text x="450.0" y="404" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">chasing a raw count is the wrong target</text>
<line x1="450" y1="190" x2="450" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#ahb)"/>
<line x1="450" y1="300" x2="450" y2="320" stroke="#16a34a" stroke-width="2" marker-end="url(#ahg)"/>
</svg>