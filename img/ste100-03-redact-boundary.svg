<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="480" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1A7F37"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A15C07"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0E7C7B"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B3FA0"/></marker></defs><text x="560" y="38" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Redact at the boundary: PII never enters the logging pipeline raw</text><rect x="40" y="110" width="220" height="110" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/><text x="150" y="160" font-size="13.5" fill="#24292F" text-anchor="middle">PII in prompts,</text><text x="150" y="180" font-size="13.5" fill="#24292F" text-anchor="middle">tool results, traces</text><line x1="260" y1="165" x2="330" y2="165" stroke="#1A7F37" stroke-width="2" marker-end="url(#ahg)"/><rect x="330" y="110" width="260" height="110" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="460" y="149" font-size="13.5" fill="#24292F" text-anchor="middle">REDACT AT THE</text><text x="460" y="170" font-size="13.5" fill="#24292F" text-anchor="middle">BOUNDARY</text><text x="460" y="191" font-size="13.5" fill="#24292F" text-anchor="middle">strip or hash PII</text><line x1="590" y1="165" x2="660" y2="165" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="660" y="110" width="200" height="110" rx="10" fill="#F3F4F6" stroke="#5C6570" stroke-width="1.5"/><text x="760" y="160" font-size="13.5" fill="#24292F" text-anchor="middle">logs</text><text x="760" y="180" font-size="13.5" fill="#24292F" text-anchor="middle">safe</text><rect x="660" y="260" width="200" height="110" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="760" y="299" font-size="13.5" fill="#24292F" text-anchor="middle">full payloads:</text><text x="760" y="320" font-size="13.5" fill="#24292F" text-anchor="middle">short-lived encrypted</text><text x="760" y="341" font-size="13.5" fill="#24292F" text-anchor="middle">debug store only</text><line x1="760" y1="220" x2="760" y2="260" stroke="#A15C07" stroke-width="2" marker-end="url(#aha)"/><text x="560" y="420" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="400">log everything raw and you build a compliance time bomb (GDPR, HIPAA)</text></svg>