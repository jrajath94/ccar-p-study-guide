<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The five metric families: measure what the task actually needs</text><rect x="20" y="70" width="200" height="360" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="120.0" y="100" font-size="13.5" fill="#1F5FBF" text-anchor="middle" font-weight="700">ACCURACY</text><text x="120.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">did the output do the job right?</text><text x="120.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">formula depends on the task</text><rect x="236" y="70" width="200" height="360" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="336.0" y="100" font-size="13.5" fill="#0E7C7B" text-anchor="middle" font-weight="700">LATENCY</text><text x="336.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">report percentiles, not averages;</text><text x="336.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">users feel the p95, not the mean</text><rect x="452" y="70" width="200" height="360" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="552.0" y="100" font-size="13.5" fill="#A15C07" text-anchor="middle" font-weight="700">COST</text><text x="552.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">tokens in/out, tool and judge calls;</text><text x="552.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">first-class: bills scale with usage</text><rect x="668" y="70" width="200" height="360" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="768.0" y="100" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="700">SAFETY</text><text x="768.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">harmful, biased, disallowed outputs;</text><text x="768.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">measured on adversarial sets</text><rect x="884" y="70" width="200" height="360" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="984.0" y="100" font-size="13.5" fill="#1A7F37" text-anchor="middle" font-weight="700">SECURITY</text><text x="984.0" y="128" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">injection success, exfiltration blocked,</text><text x="984.0" y="146" font-size="12.5" fill="#24292F" text-anchor="middle" font-weight="400">PII leaked; attack-style tests</text></svg>