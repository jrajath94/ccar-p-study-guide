<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="400" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="398" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Safety is layers, not a model feature</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Constitutional training is one layer. Production stacks four.</text>
<rect x="30" y="130" width="200" height="120" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="130.0" y="190.0" text-anchor="middle" font-size="15" fill="#92400e" font-weight="bold">input checks</text>
<text x="130" y="192" text-anchor="middle" font-size="14" fill="#92400e" font-weight="bold">input checks</text>
<text x="130" y="216" text-anchor="middle" font-size="11" fill="#64748b">strip injection, PII, jailbreaks</text>
<line x1="230" y1="190" x2="242" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="242" y="130" width="200" height="120" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="342.0" y="190.0" text-anchor="middle" font-size="15" fill="#1e40af" font-weight="bold">model</text>
<text x="342" y="192" text-anchor="middle" font-size="14" fill="#1e40af" font-weight="bold">model</text>
<text x="342" y="216" text-anchor="middle" font-size="11" fill="#64748b">helpful, honest, harmless</text>
<line x1="442" y1="190" x2="454" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="454" y="130" width="200" height="120" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="554.0" y="190.0" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">output checks</text>
<text x="554" y="192" text-anchor="middle" font-size="14" fill="#166534" font-weight="bold">output checks</text>
<text x="554" y="216" text-anchor="middle" font-size="11" fill="#64748b">PII leaks, grounding, toxicity</text>
<line x1="654" y1="190" x2="666" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="666" y="130" width="200" height="120" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="766.0" y="190.0" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">human review</text>
<text x="766" y="192" text-anchor="middle" font-size="14" fill="#991b1b" font-weight="bold">human review</text>
<text x="766" y="216" text-anchor="middle" font-size="11" fill="#64748b">the final gate on risky actions</text>
<text x="450" y="300" text-anchor="middle" font-size="13" fill="#64748b">Exam angle: a system prompt is never a compliance control. Layers are.</text>
<text x="450.0" y="360" text-anchor="middle" font-size="12" fill="#94a3b8">Each layer catches what the others miss.</text>
</svg>
