<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="560" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The error contract: each status gets its own response</text><rect x="60" y="70" width="180" height="90" rx="10" fill="#B42318" opacity="0.18"/><text x="150" y="122" font-size="20" fill="#B42318" text-anchor="middle" font-weight="700">400</text><rect x="260" y="70" width="380" height="90" rx="10" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="450" y="122" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">your request was malformed</text><line x1="640" y1="115" x2="668" y2="115" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="668" y="70" width="392" height="90" rx="10" fill="#FFFFFF" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="864" y="122" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">fix the code; retrying fails the same way</text><rect x="60" y="172" width="180" height="90" rx="10" fill="#B42318" opacity="0.18"/><text x="150" y="224" font-size="20" fill="#B42318" text-anchor="middle" font-weight="700">401</text><rect x="260" y="172" width="380" height="90" rx="10" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="450" y="224" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">missing or invalid API key</text><line x1="640" y1="217" x2="668" y2="217" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="668" y="172" width="392" height="90" rx="10" fill="#FFFFFF" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="864" y="224" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">fix the credential; never retry blindly, never log the key</text><rect x="60" y="274" width="180" height="90" rx="10" fill="#A15C07" opacity="0.18"/><text x="150" y="326" font-size="20" fill="#A15C07" text-anchor="middle" font-weight="700">429</text><rect x="260" y="274" width="380" height="90" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="450" y="326" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">rate limit: too many requests</text><line x1="640" y1="319" x2="668" y2="319" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="668" y="274" width="392" height="90" rx="10" fill="#FFFFFF" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="864" y="326" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">wait and retry with backoff; the normal slow-down signal</text><rect x="60" y="376" width="180" height="90" rx="10" fill="#0E7C7B" opacity="0.18"/><text x="150" y="428" font-size="20" fill="#0E7C7B" text-anchor="middle" font-weight="700">500 / 529</text><rect x="260" y="376" width="380" height="90" rx="10" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="450" y="428" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">provider error / overloaded</text><line x1="640" y1="421" x2="668" y2="421" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="668" y="376" width="392" height="90" rx="10" fill="#FFFFFF" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="864" y="428" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">retry with backoff; the failure is on their side</text><rect x="160" y="490" width="800" height="44" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="560" y="518" font-size="14" fill="#1F5FBF" text-anchor="middle" font-weight="600">Exponential backoff is the standard retry rhythm: wait 1s, then 2, then 4, then 8.</text></svg>