<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="1120" height="560" fill="#FFFFFF"/>
<text x="560" y="40" font-size="22" fill="#163D7A" text-anchor="middle" font-weight="700">Three human-in-the-loop patterns: which one, when</text>
<text x="560" y="66" font-size="14" fill="#5C6570" text-anchor="middle">Every pattern keeps a person in charge. They differ in when the person steps in.</text>
<!-- column 1 -->
<rect x="20" y="90" width="346" height="440" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/>
<rect x="20" y="90" width="346" height="58" rx="10" fill="#1F5FBF"/>
<text x="193" y="113" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">1. Review-before-release</text>
<text x="193" y="133" font-size="12" fill="#DCE6F7" text-anchor="middle">every output approved</text>
<text x="40" y="180" font-size="13" fill="#5C6570" font-weight="700">WHAT HAPPENS</text>
<text x="40" y="202" font-size="14" fill="#24292F">No output reaches the world until</text>
<text x="40" y="222" font-size="14" fill="#24292F">a person signs it off.</text>
<text x="40" y="262" font-size="13" fill="#5C6570" font-weight="700">REQUIRED WHEN</text>
<text x="40" y="284" font-size="14" fill="#24292F">Irreversible or legally binding:</text>
<text x="40" y="304" font-size="14" fill="#24292F">payments, published advice, filings.</text>
<text x="40" y="344" font-size="13" fill="#5C6570" font-weight="700">COST</text>
<text x="40" y="366" font-size="14" fill="#24292F">Highest: a reviewer for every action.</text>
<text x="40" y="406" font-size="13" fill="#5C6570" font-weight="700">PREVENTS / MISSES</text>
<text x="40" y="428" font-size="14" fill="#0E7C7B">Prevents individual harm.</text>
<text x="40" y="448" font-size="14" fill="#24292F">Misses nothing in-sample, scales</text>
<text x="40" y="468" font-size="14" fill="#24292F">poorly: slow at high volume.</text>
<!-- column 2 -->
<rect x="387" y="90" width="346" height="440" rx="10" fill="#FFF7E8" stroke="#A15C07" stroke-width="1.5"/>
<rect x="387" y="90" width="346" height="58" rx="10" fill="#A15C07"/>
<text x="560" y="113" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">2. Risk-gated routing</text>
<text x="560" y="133" font-size="12" fill="#F6E8C8" text-anchor="middle">only risky outputs reviewed</text>
<text x="407" y="180" font-size="13" fill="#5C6570" font-weight="700">WHAT HAPPENS</text>
<text x="407" y="202" font-size="14" fill="#24292F">Low-risk outputs go straight out;</text>
<text x="407" y="222" font-size="14" fill="#24292F">risky ones queue for a human.</text>
<text x="407" y="262" font-size="13" fill="#5C6570" font-weight="700">REQUIRED WHEN</text>
<text x="407" y="284" font-size="14" fill="#24292F">Scale matters and risk varies:</text>
<text x="407" y="304" font-size="14" fill="#24292F">support replies, document drafts.</text>
<text x="407" y="344" font-size="13" fill="#5C6570" font-weight="700">COST</text>
<text x="407" y="366" font-size="14" fill="#24292F">Medium: reviewers handle the queue.</text>
<text x="407" y="406" font-size="13" fill="#5C6570" font-weight="700">PREVENTS / MISSES</text>
<text x="407" y="428" font-size="14" fill="#0E7C7B">Concentrates attention on risk.</text>
<text x="407" y="448" font-size="14" fill="#24292F">Misses harm in items wrongly</text>
<text x="407" y="468" font-size="14" fill="#24292F">scored low-risk: gate quality rules.</text>
<!-- column 3 -->
<rect x="754" y="90" width="346" height="440" rx="10" fill="#EAF6F5" stroke="#0E7C7B" stroke-width="1.5"/>
<rect x="754" y="90" width="346" height="58" rx="10" fill="#0E7C7B"/>
<text x="927" y="113" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">3. Sampled audit</text>
<text x="927" y="133" font-size="12" fill="#CDE7E5" text-anchor="middle">random 2-5% reviewed after the fact</text>
<text x="774" y="180" font-size="13" fill="#5C6570" font-weight="700">WHAT HAPPENS</text>
<text x="774" y="202" font-size="14" fill="#24292F">Outputs ship; reviewers grade a</text>
<text x="774" y="222" font-size="14" fill="#24292F">random sample against a rubric.</text>
<text x="774" y="262" font-size="13" fill="#5C6570" font-weight="700">REQUIRED WHEN</text>
<text x="774" y="284" font-size="14" fill="#24292F">The gate must not block throughput:</text>
<text x="774" y="304" font-size="14" fill="#24292F">content pipelines, batch jobs.</text>
<text x="774" y="344" font-size="13" fill="#5C6570" font-weight="700">COST</text>
<text x="774" y="366" font-size="14" fill="#24292F">Lowest: a few reviewers, fixed rate.</text>
<text x="774" y="406" font-size="13" fill="#5C6570" font-weight="700">PREVENTS / MISSES</text>
<text x="774" y="428" font-size="14" fill="#0E7C7B">Measures error rate and drift.</text>
<text x="774" y="448" font-size="14" fill="#C0392B">Does NOT prevent individual</text>
<text x="774" y="468" font-size="14" fill="#C0392B">harm: harm already shipped.</text>
<text x="560" y="552" font-size="13" fill="#5C6570" text-anchor="middle">Exam rule: if the action is irreversible, pick pattern 1. If the exam says throughput must not block, pattern 3 detects but never prevents.</text>
</svg>
