<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="560" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The management toolkit: six moves, each matched to a cause</text><rect x="30" y="70" width="340" height="205" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="100" font-size="14.5" fill="#1F5FBF" text-anchor="middle" font-weight="700">Key facts at the edges</text><text x="200.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">lost-in-the-middle: decision-relevant</text><text x="200.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">content belongs at the start or end</text><rect x="393" y="70" width="340" height="205" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="100" font-size="14.5" fill="#0E7C7B" text-anchor="middle" font-weight="700">Retrieve, don&#x27;t stuff</text><text x="563.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">fetch a few relevant chunks per</text><text x="563.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">request; smaller beats bigger</text><rect x="756" y="70" width="340" height="205" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="100" font-size="14.5" fill="#A15C07" text-anchor="middle" font-weight="700">Summarize old turns</text><text x="926.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">compaction: trade perfect recall</text><text x="926.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">for a much smaller window</text><rect x="30" y="300" width="340" height="205" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="330" font-size="14.5" fill="#B42318" text-anchor="middle" font-weight="700">Prune tool results</text><text x="200.0" y="358" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">cap reads, truncate verbose output;</text><text x="200.0" y="378" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">fastest-growing consumer</text><rect x="393" y="300" width="340" height="205" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="330" font-size="14.5" fill="#1A7F37" text-anchor="middle" font-weight="700">Keep headroom for output</text><text x="563.0" y="358" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">budget input + max output;</text><text x="563.0" y="378" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">leave room for the answer</text><rect x="756" y="300" width="340" height="205" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="330" font-size="14.5" fill="#5C6570" text-anchor="middle" font-weight="700">Cache the static prefix</text><text x="926.0" y="358" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">system, tools, stable examples</text><text x="926.0" y="378" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">up front; only new content grows</text><text x="560.0" y="546" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">Exam shape: slowing, pricier, forgetful long sessions. The credited moves are compaction plus pruning tool results, not a bigger model.</text></svg>