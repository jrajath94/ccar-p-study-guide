<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="360" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560.0" y="34" font-size="20" text-anchor="middle" font-weight="700" fill="#24292F">The 120-minute budget</text><rect x="60" y="120" width="583.3333333333334" height="64" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="351.6666666666667" y="148" font-size="13" text-anchor="middle" font-weight="700" fill="#1F5FBF">First pass</text><text x="351.6666666666667" y="168" font-size="12" text-anchor="middle" font-weight="400" fill="#24292F">answer what you know</text><text x="351.6666666666667" y="208" font-size="12" text-anchor="middle" font-weight="400" fill="#5C6570">70 min</text><rect x="643.3333333333334" y="120" width="208.33333333333334" height="64" fill="#F3E8F7" stroke="#7B2D8E" stroke-width="1.5"/><text x="747.5" y="148" font-size="13" text-anchor="middle" font-weight="700" fill="#7B2D8E">Flagged</text><text x="747.5" y="168" font-size="12" text-anchor="middle" font-weight="400" fill="#24292F">long scenarios</text><text x="747.5" y="208" font-size="12" text-anchor="middle" font-weight="400" fill="#5C6570">25 min</text><rect x="851.6666666666667" y="120" width="83.33333333333333" height="64" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="893.3333333333334" y="208" font-size="12" text-anchor="middle" font-weight="400" fill="#5C6570">10 min</text><text x="893.3333333333334" y="228" font-size="12" text-anchor="middle" font-weight="700" fill="#0E7C7B">Final 10 min</text><text x="893.3333333333334" y="246" font-size="11" text-anchor="middle" font-weight="400" fill="#24292F">flagged only</text><rect x="935.0000000000001" y="120" width="125.0" height="64" fill="#E8F4F8" stroke="#2471A3" stroke-width="1.5"/><text x="997.5000000000001" y="148" font-size="13" text-anchor="middle" font-weight="700" fill="#2471A3">Buffer</text><text x="997.5000000000001" y="208" font-size="12" text-anchor="middle" font-weight="400" fill="#5C6570">15 min</text><text x="560.0" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">About 1:54 per item. Flag anything that eats 3 minutes and move on.</text><text x="560.0" y="316" font-size="13" text-anchor="middle" font-weight="400" fill="#5C6570">Change an answer only when you can name the error.</text></svg>