<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="460" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The processing stage: three ingredients, one thinking step</text><rect x="60" y="90" width="300" height="200" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="210.0" y="120" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">MODEL CALL</text><text x="210.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">stateless: everything it knows</text><text x="210.0" y="168" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">is in the prompt</text><text x="210.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">(system, history, retrieved</text><text x="210.0" y="207" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">context, tool results)</text><rect x="410" y="90" width="300" height="200" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="560.0" y="120" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">TOOLS</text><text x="560.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">its hands: APIs, databases,</text><text x="560.0" y="168" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">search, code execution</text><text x="560.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">narrow schemas,</text><text x="560.0" y="207" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">explicit contracts</text><rect x="760" y="90" width="300" height="200" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="910.0" y="120" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">STATE</text><text x="910.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">what persists: history,</text><text x="910.0" y="168" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">task list, scratchpad,</text><text x="910.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">database row</text><text x="910.0" y="207" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">stale state = classic bug</text><rect x="360" y="320" width="400" height="70" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="560" y="348" font-size="16" fill="#1A7F37" text-anchor="middle" font-weight="700">ONE THINKING STEP</text><text x="560" y="372" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">loop as needed</text><line x1="210" y1="290" x2="430" y2="318" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="560" y1="290" x2="560" y2="318" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="910" y1="290" x2="690" y2="318" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560.0" y="428" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">Each model call pays for its full input every time (minus caching).</text><text x="560.0" y="446" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">A 10-turn conversation re-bills the whole history on every turn.</text></svg>