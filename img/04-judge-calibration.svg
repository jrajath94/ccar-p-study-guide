<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="520" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Calibration: prove the judge agrees with humans</text><rect x="30" y="70" width="340" height="220" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="200.0" y="100" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">1. SAMPLE</text><text x="200.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">take 100-200 outputs</text><rect x="393" y="70" width="340" height="220" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="563.0" y="100" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">2. SCORE TWICE</text><text x="563.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">humans and judge score</text><text x="563.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">with the same rubric</text><rect x="756" y="70" width="340" height="220" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="926.0" y="100" font-size="16" fill="#A15C07" text-anchor="middle" font-weight="700">3. MEASURE</text><text x="926.0" y="128" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">Cohen&#x27;s kappa:</text><text x="926.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">agreement beyond chance</text><line x1="370" y1="180" x2="393" y2="180" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="733" y1="180" x2="756" y2="180" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="320" width="1000" height="150" rx="10" fill="#F4F2ED" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="560" y="352" font-size="14" fill="#5C6570" text-anchor="middle" font-weight="700">read the kappa</text><text x="560" y="384" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="600">above 0.8: strong   |   0.6 to 0.8: acceptable   |   below 0.6: the rubric or the judge needs work</text><text x="560" y="416" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">recalibrate on a fresh sample whenever the judge model, the rubric, or the data changes</text><text x="560" y="444" font-size="13" fill="#B42318" text-anchor="middle" font-weight="600">a judge is only as good as its agreement with the humans it stands in for</text></svg>