<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<rect width="960" height="620" rx="14" fill="#1e293b"/>
<text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#e8e6e1">The decision memo: cost per ticket is not the cost of the decision</text>
<text x="480" y="62" text-anchor="middle" font-size="13" fill="#9fb0c3">500K tickets a month. Three designs. The cheapest sticker loses.</text>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="aht" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#0d9488"/></marker><marker id="aha" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#d97706"/></marker></defs>
<text x="40" y="100" font-size="13" font-weight="bold" fill="#9fb0c3">THE OPTIONS</text>
<rect x="40" y="120" width="280" height="140" rx="10" fill="#28303d" stroke="#2563eb" stroke-width="1.5"/>
<text x="180" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">Design A</text>
<text x="180" y="172" text-anchor="middle" font-size="12.5" fill="#9fb0c3">$9,000 / mo</text>
<text x="180" y="192" text-anchor="middle" font-size="12.5" fill="#9fb0c3">9 s latency</text>
<text x="180" y="212" text-anchor="middle" font-size="12.5" fill="#9fb0c3">97% accuracy</text>
<rect x="340" y="120" width="280" height="140" rx="10" fill="#28303d" stroke="#0d9488" stroke-width="1.5"/>
<text x="480" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">Design B</text>
<text x="480" y="172" text-anchor="middle" font-size="12.5" fill="#9fb0c3">$2,000 / mo</text>
<text x="480" y="192" text-anchor="middle" font-size="12.5" fill="#9fb0c3">3 s latency</text>
<text x="480" y="212" text-anchor="middle" font-size="12.5" fill="#9fb0c3">94% accuracy</text>
<rect x="640" y="120" width="280" height="140" rx="10" fill="#28303d" stroke="#d97706" stroke-width="1.5"/>
<text x="780" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">Design C</text>
<text x="780" y="172" text-anchor="middle" font-size="12.5" fill="#9fb0c3">$400 / mo</text>
<text x="780" y="192" text-anchor="middle" font-size="12.5" fill="#9fb0c3">1 s latency</text>
<text x="780" y="212" text-anchor="middle" font-size="12.5" fill="#9fb0c3">88% accuracy</text>
<rect x="40" y="290" width="880" height="150" rx="10" fill="#28303d" stroke="#dc2626" stroke-width="1.5"/>
<text x="480" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#fca5a5">The math the memo must show</text>
<text x="480" y="342" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Misroute cost: 500,000 tickets x 12% error x $6 per error = $360,000 a month.</text>
<text x="480" y="362" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Design C saves $1,600 a month on paper and burns $360,000 a month in misroutes.</text>
<text x="480" y="382" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Detail that does not change the decision is noise; this detail changes it.</text>
<rect x="40" y="470" width="880" height="110" rx="10" fill="#28303d" stroke="#16a34a" stroke-width="1.5"/>
<text x="480" y="500" text-anchor="middle" font-size="15" font-weight="bold" fill="#bbf7d0">The credited verdict</text>
<text x="480" y="522" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Recommend B: $2,000 a month, 3 s, 94%. Tripwire: re-decide at 2M tickets a month.</text>
<text x="480" y="542" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Recommend, do not decree. Name the owner.</text>
</svg>