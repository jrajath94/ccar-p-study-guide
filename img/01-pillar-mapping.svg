<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="600" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Every architectural decision names its pillar and the SLA it must not break</text><text x="200" y="78" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="700">TECHNICAL CHOICE</text><text x="560" y="78" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="700">PILLAR SERVED</text><text x="920" y="78" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="700">SLA IT MUST RESPECT</text><rect x="30" y="95" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="200" y="139" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">Route easy queries to a small model</text><rect x="390" y="95" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="560" y="139" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">Cost, efficiency</text><rect x="750" y="95" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="920" y="139" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">accuracy on the easy segment;</text><rect x="30" y="177" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="200" y="221" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">Parallelization (sectioning)</text><rect x="390" y="177" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="560" y="221" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">Efficiency (latency)</text><rect x="750" y="177" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="920" y="221" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">p95 latency; merge quality must not regress</text><rect x="30" y="259" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="200" y="303" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">Evaluator-optimizer loop</text><rect x="390" y="259" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="560" y="303" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">Productivity, transformation</text><rect x="750" y="259" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#A15C07" stroke-width="1.5" opacity="1.0"/><text x="920" y="303" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">accuracy SLA; iteration cap bounds cost</text><rect x="30" y="341" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="200" y="385" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">Human approval gate on actions</text><rect x="390" y="341" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="560" y="385" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">Cost (prevents big errors)</text><rect x="750" y="341" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="920" y="385" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">latency gets looser by design; say so</text><rect x="30" y="423" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="200" y="467" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">Multi-agent research harness</text><rect x="390" y="423" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="560" y="467" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">Transformation (breadth)</text><rect x="750" y="423" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="920" y="467" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">accuracy on synthesis; token budget ceiling</text><rect x="30" y="505" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="200" y="549" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">Output validation + allowlists</text><rect x="390" y="505" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="560" y="549" font-size="13" fill="#24292F" text-anchor="middle" font-weight="600">Cost (error containment)</text><rect x="750" y="505" width="340" height="74" rx="10" fill="#FFFFFF" stroke="#5C6570" stroke-width="1.5" opacity="1.0"/><text x="920" y="549" font-size="13" fill="#24292F" text-anchor="middle" font-weight="400">availability: fail safe, not fail-closed</text><text x="560.0" y="568" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">The pattern: every row trades something. Routing trades a little accuracy risk for a lot of cost.</text><text x="560.0" y="586" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">The credited answers name the trade and pick the side the constraint demands.</text></svg>