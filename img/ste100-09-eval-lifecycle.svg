<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="480" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="478" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Design 7: evals-as-code pipeline</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Evals are the system. Everything else is scaffolding.</text>
<rect x="40" y="100" width="180" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="130.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">Golden</text>
<text x="130.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">frozen versioned</text>
<text x="130.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">test cases</text>
<rect x="245" y="100" width="180" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="335.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16a34a">Judge</text>
<text x="335.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">LLM-as-judge</text>
<text x="335.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">+ rubric</text>
<rect x="450" y="100" width="180" height="170" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="540.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#d97706">CI gates</text>
<text x="540.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">run on every</text>
<text x="540.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">change</text>
<rect x="655" y="100" width="180" height="170" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="745.0" y="124" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c3aed">Monitor</text>
<text x="745.0" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">alert on score</text>
<text x="745.0" y="165" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">drops</text>
<line x1="220" y1="185" x2="245" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="425" y1="185" x2="450" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="630" y1="185" x2="655" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="810" y1="270" x2="810" y2="330" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahp)"/>
<line x1="90" y1="330" x2="90" y2="270" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahp)"/>
<rect x="180" y="310" width="540" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="450.0" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">The loop</text>
<text x="450.0" y="356" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">production failures feed back into the golden set</text>
<text x="450.0" y="375" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">refresh the eval set to mirror the production mix</text>
<text x="450.0" y="394" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#1e293b">version prompts like code</text>
</svg>