<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="440" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker></defs><text x="560.0" y="34" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Two SLAs, measured separately</text><rect x="60" y="80" width="480" height="290" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/><text x="300.0" y="110" font-size="15" fill="#1F5FBF" text-anchor="middle" font-weight="700">Availability SLA</text><text x="300.0" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">SLI: 5xx rate at the gateway</text><text x="300.0" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">SLO: 99.9% per 30 days</text><text x="300.0" y="180" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">budget: 43 minutes down</text><text x="300.0" y="202" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">measured by: monitors</text><rect x="580" y="80" width="480" height="290" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5"/><text x="820.0" y="110" font-size="15" fill="#0E7C7B" text-anchor="middle" font-weight="700">Quality SLA</text><text x="820.0" y="136" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">SLI: graded sample correct</text><text x="820.0" y="158" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">SLO: 95% of 1,000 weekly</text><text x="820.0" y="180" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">remedy: quality review</text><text x="820.0" y="202" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">measured by: human graders</text><line x1="560" y1="80" x2="560" y2="370" stroke="#B42318" stroke-width="2" stroke-dasharray="8,6"/><text x="560" y="392" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="600">a 99.9% uptime SLA says nothing about the 50 wrong answers</text><text x="560.0" y="426" font-size="13" fill="#5C6570" text-anchor="middle" font-weight="400">Availability asks 'is it up'. Quality asks 'is it right'. Never mix them.</text></svg>