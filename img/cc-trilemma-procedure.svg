<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="498" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">The trilemma decision procedure, in order</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Cost, latency, quality: read the binding constraint, then pick the cheapest tier that fits.</text>
<rect x="40" y="100" width="52" height="52" rx="26" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="133" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="bold">1</text>
<rect x="110" y="100" width="750" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="130" y="125" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">Read the constraints</text>
<text x="130" y="147" text-anchor="start" font-size="12" fill="#64748b">"p95 under 2s" pins latency; "95% accuracy" pins quality; "$0.01/req" pins cost.</text>
<rect x="40" y="176" width="52" height="52" rx="26" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<text x="66" y="209" text-anchor="middle" font-size="18" fill="#7c3aed" font-weight="bold">2</text>
<rect x="110" y="176" width="750" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="130" y="201" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">Rank them, find the binding one</text>
<text x="130" y="223" text-anchor="start" font-size="12" fill="#64748b">Only one constraint truly binds. Design to it.</text>
<rect x="40" y="252" width="52" height="52" rx="26" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<text x="66" y="285" text-anchor="middle" font-size="18" fill="#16a34a" font-weight="bold">3</text>
<rect x="110" y="252" width="750" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="130" y="277" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">Pick the CHEAPEST tier that satisfies it</text>
<text x="130" y="299" text-anchor="start" font-size="12" fill="#64748b">Default to balanced; move on evidence, not hope.</text>
<rect x="40" y="328" width="52" height="52" rx="26" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<text x="66" y="361" text-anchor="middle" font-size="18" fill="#0d9488" font-weight="bold">4</text>
<rect x="110" y="328" width="750" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="130" y="353" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">Cheat the triangle with architecture</text>
<text x="130" y="375" text-anchor="start" font-size="12" fill="#64748b">Cache stable prefixes. Route easy bulk to the fast tier. Batch what has no deadline.</text>
<rect x="40" y="404" width="52" height="52" rx="26" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="66" y="437" text-anchor="middle" font-size="18" fill="#d97706" font-weight="bold">5</text>
<rect x="110" y="404" width="750" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="130" y="429" text-anchor="start" font-size="14" fill="#1e293b" font-weight="bold">Discipline the output</text>
<text x="130" y="451" text-anchor="start" font-size="12" fill="#64748b">Output tokens cost ~5x input. One-sentence answers and JSON beat prose.</text>
</svg>
