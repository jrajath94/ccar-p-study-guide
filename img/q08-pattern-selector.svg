<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="512" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="510" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Pattern selector: how much agency does this task need?</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Fewer paths than needed is fragile; more than needed is a cost fire.</text>
<rect x="40" y="100" width="820" height="116" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="450.0" y="132" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">WORKFLOW</text>
<text x="60" y="162" text-anchor="start" font-size="13" fill="#1e293b">paths fixed, deterministic routing</text>
<text x="60" y="189" text-anchor="start" font-size="13" fill="#64748b">refund under $50, no fraud flags: same steps every time</text>
<rect x="40" y="222" width="820" height="116" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="450.0" y="254" text-anchor="middle" font-size="15" fill="#1e40af" font-weight="bold">AUGMENTED LLM CALL</text>
<text x="60" y="284" text-anchor="start" font-size="13" fill="#1e293b">one reasoning step, then tools</text>
<text x="60" y="311" text-anchor="start" font-size="13" fill="#64748b">summarize ticket, then file it: decide, act, done</text>
<rect x="40" y="344" width="820" height="116" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
<text x="450.0" y="376" text-anchor="middle" font-size="15" fill="#5b21b6" font-weight="bold">AGENTIC LOOP</text>
<text x="60" y="406" text-anchor="start" font-size="13" fill="#1e293b">model chooses next steps</text>
<text x="60" y="433" text-anchor="start" font-size="13" fill="#64748b">novel tickets, unknown steps: plan, act, check, replan</text>
<text x="450.0" y="482" text-anchor="middle" font-size="12" fill="#94a3b8">The exam rewards the simplest pattern that survives the failure modes.</text>
</svg>
