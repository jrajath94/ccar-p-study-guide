<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="400" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">The output stage: never let raw model text trigger a real-world action</text><rect x="40" y="90" width="300" height="170" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="190.0" y="120" font-size="16" fill="#B42318" text-anchor="middle" font-weight="700">VALIDATE</text><text x="190.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">schema? policy?</text><text x="190.0" y="168" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">confident enough?</text><text x="190.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">allowlists, not vibes</text><rect x="410" y="90" width="300" height="170" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5" opacity="1.0"/><text x="560.0" y="120" font-size="16" fill="#1F5FBF" text-anchor="middle" font-weight="700">FORMAT</text><text x="560.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">human-readable</text><text x="560.0" y="168" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">or exact JSON</text><text x="560.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">formatting is code&#x27;s job</text><rect x="780" y="90" width="300" height="170" rx="10" fill="#EFF0EA" stroke="#0E7C7B" stroke-width="1.5" opacity="1.0"/><text x="930.0" y="120" font-size="16" fill="#0E7C7B" text-anchor="middle" font-weight="700">ACT or PRESENT</text><text x="930.0" y="148" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">log everything;</text><text x="930.0" y="168" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">high stakes get</text><text x="930.0" y="187" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">a human gate</text><line x1="340" y1="175" x2="408" y2="175" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><line x1="710" y1="175" x2="778" y2="175" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><text x="560" y="305" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">model text in</text><line x1="60" y1="320" x2="1060" y2="320" stroke="#5C6570" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ah)"/><rect x="180" y="330" width="760" height="40" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="560" y="356" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="600">The exam&#x27;s favorite failure: an agent that acts on model output with no validation step.</text></svg>