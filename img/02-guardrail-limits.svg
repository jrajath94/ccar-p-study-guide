<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="480" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker></defs><text x="560" y="40" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Prompt guardrails steer behavior. They are not security controls.</text><rect x="30" y="60" width="520" height="350" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5" opacity="1.0"/><text x="290" y="92" font-size="15" fill="#1A7F37" text-anchor="middle" font-weight="700">WHAT THEY DO WELL</text><text x="290" y="140" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">refuse disallowed requests</text><circle cx="110" cy="134" r="6" fill="#1A7F37"/><text x="290" y="180" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">escalate ambiguous ones</text><circle cx="110" cy="174" r="6" fill="#1A7F37"/><text x="290" y="220" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">validate output shape</text><circle cx="110" cy="214" r="6" fill="#1A7F37"/><text x="290" y="260" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">cheap steering of normal behavior</text><circle cx="110" cy="254" r="6" fill="#1A7F37"/><rect x="570" y="60" width="520" height="350" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="830" y="92" font-size="15" fill="#B42318" text-anchor="middle" font-weight="700">WHERE THEY STOP</text><text x="830" y="140" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">prompt injection can argue</text><text x="830" y="180" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">with your guardrails,</text><text x="830" y="220" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">and the model sometimes</text><text x="830" y="260" font-size="14" fill="#24292F" text-anchor="middle" font-weight="400">loses the argument</text><rect x="570" y="320" width="520" height="70" rx="10" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" opacity="1.0"/><text x="830" y="348" font-size="13.5" fill="#B42318" text-anchor="middle" font-weight="700">Real boundaries live outside the prompt:</text><text x="830" y="370" font-size="13.5" fill="#24292F" text-anchor="middle" font-weight="400">input filters, output validators, human review</text><text x="560.0" y="466" font-size="13.5" fill="#5C6570" text-anchor="middle" font-weight="400">A prompt instruction is text the model reads. A security control is code the model cannot argue with.</text></svg>