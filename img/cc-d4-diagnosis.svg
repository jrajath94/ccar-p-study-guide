<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Match the symptom to the failure before touching anything</text>
  <g font-size="13.5">
    <rect x="20" y="60" width="230" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="135" y="84" text-anchor="middle" fill="#78350f">top retrieved chunks</text>
    <text x="135" y="104" text-anchor="middle" fill="#78350f">are off-topic</text>
    <text x="272" y="97" font-size="22" fill="#64748b">&#8594;</text>
    <rect x="300" y="60" width="150" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="375" y="84" text-anchor="middle" font-weight="bold" fill="#1e40af">Retrieval</text>
    <text x="375" y="104" text-anchor="middle" font-weight="bold" fill="#1e40af">failure</text>
    <text x="472" y="97" font-size="22" fill="#64748b">&#8594;</text>
    <rect x="500" y="60" width="160" height="60" rx="8" fill="#d1fae5" stroke="#047857"/>
    <text x="580" y="84" text-anchor="middle" fill="#064e3b">fix chunking,</text>
    <text x="580" y="104" text-anchor="middle" fill="#064e3b">embeddings, query</text>
    <rect x="20" y="140" width="230" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="135" y="164" text-anchor="middle" fill="#78350f">right docs in,</text>
    <text x="135" y="184" text-anchor="middle" fill="#78350f">wrong answers out</text>
    <text x="272" y="177" font-size="22" fill="#64748b">&#8594;</text>
    <rect x="300" y="140" width="150" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="375" y="164" text-anchor="middle" font-weight="bold" fill="#1e40af">Generation</text>
    <text x="375" y="184" text-anchor="middle" font-weight="bold" fill="#1e40af">failure</text>
    <text x="472" y="177" font-size="22" fill="#64748b">&#8594;</text>
    <rect x="500" y="140" width="160" height="60" rx="8" fill="#d1fae5" stroke="#047857"/>
    <text x="580" y="164" text-anchor="middle" fill="#064e3b">grounding, prompt,</text>
    <text x="580" y="184" text-anchor="middle" fill="#064e3b">or model tier</text>
    <rect x="20" y="220" width="230" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="135" y="244" text-anchor="middle" fill="#78350f">fast tier fine on easy,</text>
    <text x="135" y="264" text-anchor="middle" fill="#78350f">fails the hard slice</text>
    <text x="272" y="257" font-size="22" fill="#64748b">&#8594;</text>
    <rect x="300" y="220" width="150" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="375" y="244" text-anchor="middle" font-weight="bold" fill="#1e40af">Tier</text>
    <text x="375" y="264" text-anchor="middle" font-weight="bold" fill="#1e40af">mismatch</text>
    <text x="472" y="257" font-size="22" fill="#64748b">&#8594;</text>
    <rect x="500" y="220" width="160" height="60" rx="8" fill="#d1fae5" stroke="#047857"/>
    <text x="580" y="244" text-anchor="middle" fill="#064e3b">route the hard</text>
    <text x="580" y="264" text-anchor="middle" fill="#064e3b">slice up, not all traffic</text>
    <rect x="20" y="300" width="230" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="135" y="324" text-anchor="middle" fill="#78350f">judge scores drift</text>
    <text x="135" y="344" text-anchor="middle" fill="#78350f">from human judgment</text>
    <text x="272" y="337" font-size="22" fill="#64748b">&#8594;</text>
    <rect x="300" y="300" width="150" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="375" y="324" text-anchor="middle" font-weight="bold" fill="#1e40af">Judge</text>
    <text x="375" y="344" text-anchor="middle" font-weight="bold" fill="#1e40af">miscalibration</text>
    <text x="472" y="337" font-size="22" fill="#64748b">&#8594;</text>
    <rect x="500" y="300" width="160" height="60" rx="8" fill="#d1fae5" stroke="#047857"/>
    <text x="580" y="324" text-anchor="middle" fill="#064e3b">sample, compare,</text>
    <text x="580" y="344" text-anchor="middle" fill="#064e3b">recalibrate the rubric</text>
  </g>
</svg>
