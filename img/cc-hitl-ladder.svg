<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker></defs>
<rect width="900" height="430" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="428" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">HITL tiers: who approves what</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Human placement is a design decision, not a feeling.</text>
<rect x="40" y="100" width="820" height="116" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="450.0" y="132" text-anchor="middle" font-size="15" fill="#166534" font-weight="bold">READ-ONLY</text>
<text x="60" y="162" text-anchor="start" font-size="12" fill="#64748b">look up account, search tickets</text>
<text x="60" y="189" text-anchor="start" font-size="12" fill="#166534">no approval: just log it</text>
<rect x="40" y="176" width="820" height="116" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="450.0" y="208" text-anchor="middle" font-size="15" fill="#1e40af" font-weight="bold">REVERSIBLE WRITE</text>
<text x="60" y="238" text-anchor="start" font-size="12" fill="#64748b">file a ticket, update status</text>
<text x="60" y="265" text-anchor="start" font-size="12" fill="#1e40af">no approval: show what was done, offer undo</text>
<rect x="40" y="252" width="820" height="116" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="450.0" y="284" text-anchor="middle" font-size="15" fill="#92400e" font-weight="bold">DESTRUCTIVE / SENSITIVE</text>
<text x="60" y="314" text-anchor="start" font-size="12" fill="#64748b">reset password, restart prod, delete data</text>
<text x="60" y="341" text-anchor="start" font-size="12" fill="#92400e">explicit approval, full preview; timeout defaults to DENY</text>
<rect x="40" y="328" width="820" height="116" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="450.0" y="360" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="bold">IRREVERSIBLE / REGULATED</text>
<text x="60" y="390" text-anchor="start" font-size="12" fill="#64748b">terminate account, wipe device</text>
<text x="60" y="417" text-anchor="start" font-size="12" fill="#991b1b">approval plus a second factor (different human)</text>
</svg>
