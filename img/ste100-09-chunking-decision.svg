<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#16a34a"/></marker><marker id="ahp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#7c3aed"/></marker></defs>
<rect width="900" height="500" rx="14" fill="#ffffff"/>
<rect x="1" y="1" width="898" height="498" rx="13" fill="none" stroke="#cbd5e1"/>
<text x="450.0" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Design 1: chunking strategy, matched to data shape</text>
<text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#64748b">Different data shapes need different handling. Uniform chunking is a trap.</text>
<polygon points="450,75 545,170 450,265 355,170" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="450" y="166" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d97706">Data shape?</text>
<text x="450" y="186" text-anchor="middle" font-size="11" font-weight="normal" fill="#1e293b">prose / tables / code</text>
<rect x="60" y="300" width="240" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="180.0" y="324" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">Prose documents</text>
<text x="180.0" y="346" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">chunk by section</text>
<text x="180.0" y="365" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">500-token windows</text>
<text x="180.0" y="384" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">10-20% overlap</text>
<rect x="330" y="300" width="240" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="450.0" y="324" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#16a34a">Tables</text>
<text x="450.0" y="346" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">index as structured rows</text>
<text x="450.0" y="365" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">metadata filters</text>
<text x="450.0" y="384" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">never slice mid-row</text>
<rect x="600" y="300" width="240" height="130" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="720.0" y="324" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c3aed">Code</text>
<text x="720.0" y="346" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">chunk by function</text>
<text x="720.0" y="365" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">keep signatures</text>
<text x="720.0" y="384" text-anchor="middle" font-size="12" font-weight="normal" fill="#1e293b">with bodies</text>
<line x1="380" y1="240" x2="180" y2="300" stroke="#d97706" stroke-width="2" marker-end="url(#ah)"/>
<line x1="450" y1="265" x2="450" y2="300" stroke="#d97706" stroke-width="2" marker-end="url(#ah)"/>
<line x1="520" y1="240" x2="720" y2="300" stroke="#d97706" stroke-width="2" marker-end="url(#ah)"/>
<text x="450.0" y="465" text-anchor="middle" font-size="13" font-weight="normal" fill="#64748b">Then: hybrid dense + keyword search over the combined index.</text>
</svg>