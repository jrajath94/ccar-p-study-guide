<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="1120" height="500" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5C6570"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1F5FBF"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#B42318"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1A7F37"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A15C07"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0E7C7B"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6B3FA0"/></marker></defs><text x="560" y="38" font-size="17" fill="#24292F" text-anchor="middle" font-weight="700">Sessions slow down and get forgetful: diagnose the growth, not the window</text><rect x="40" y="90" width="220" height="110" rx="10" fill="#F3F4F6" stroke="#5C6570" stroke-width="1.5"/><text x="150" y="129" font-size="13.5" fill="#24292F" text-anchor="middle">SYMPTOM</text><text x="150" y="150" font-size="13.5" fill="#24292F" text-anchor="middle">slower + pricier</text><text x="150" y="171" font-size="13.5" fill="#24292F" text-anchor="middle">by turn 30</text><line x1="260" y1="145" x2="320" y2="145" stroke="#5C6570" stroke-width="2" marker-end="url(#ah)"/><rect x="320" y="90" width="260" height="110" rx="10" fill="#FFF6E6" stroke="#A15C07" stroke-width="1.5"/><text x="450" y="129" font-size="13.5" fill="#24292F" text-anchor="middle">CAUSE</text><text x="450" y="150" font-size="13.5" fill="#24292F" text-anchor="middle">unbounded history growth</text><text x="450" y="171" font-size="13.5" fill="#24292F" text-anchor="middle">tool results pile up</text><line x1="580" y1="145" x2="640" y2="145" stroke="#1A7F37" stroke-width="2" marker-end="url(#ahg)"/><rect x="640" y="60" width="440" height="170" rx="10" fill="#EAF7EE" stroke="#1A7F37" stroke-width="1.5"/><text x="860" y="129" font-size="13.5" fill="#24292F" text-anchor="middle">CREDITED MOVES</text><text x="860" y="150" font-size="13.5" fill="#24292F" text-anchor="middle">compaction: summarize old turns</text><text x="860" y="171" font-size="13.5" fill="#24292F" text-anchor="middle">pruning: drop stale tool results</text><rect x="40" y="300" width="1040" height="150" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/><text x="560" y="328" font-size="15" fill="#B42318" text-anchor="middle" font-weight="700">THE TRAPS</text><text x="560" y="352" font-size="13.5" fill="#24292F" text-anchor="middle">switch to a bigger context model (the window is not the problem)</text><text x="560" y="373" font-size="13.5" fill="#24292F" text-anchor="middle">raise output limits (does not touch history growth)</text></svg>