<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<rect width="960" height="600" rx="14" fill="#1e293b"/>
<text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#e8e6e1">The retrieval pipeline: filter first, rank the short list</text>
<text x="480" y="62" text-anchor="middle" font-size="13" fill="#9fb0c3">100K docs, 200M tokens. Each stage has exactly one job.</text>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="aht" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#0d9488"/></marker><marker id="aha" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#d97706"/></marker></defs>
<rect x="16" y="96" width="172" height="150" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="102" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">Corpus</text>
<text x="102" y="148" text-anchor="middle" font-size="12" fill="#9fb0c3">100K docs,</text>
<text x="102" y="168" text-anchor="middle" font-size="12" fill="#9fb0c3">200M tokens</text>
<rect x="200" y="96" width="172" height="150" rx="10" fill="#28303d" stroke="#0d9488" stroke-width="1.5"/>
<text x="286" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">Metadata filter</text>
<text x="286" y="148" text-anchor="middle" font-size="12" fill="#9fb0c3">product, region,</text>
<text x="286" y="168" text-anchor="middle" font-size="12" fill="#9fb0c3">date: removes ~90%</text>
<text x="286" y="188" text-anchor="middle" font-size="12" fill="#9fb0c3">before similarity</text>
<rect x="384" y="96" width="172" height="150" rx="10" fill="#28303d" stroke="#2563eb" stroke-width="1.5"/>
<text x="470" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">Dense + BM25</text>
<text x="470" y="148" text-anchor="middle" font-size="12" fill="#9fb0c3">hybrid recall,</text>
<text x="470" y="168" text-anchor="middle" font-size="12" fill="#9fb0c3">top 40 to 100</text>
<rect x="568" y="96" width="172" height="150" rx="10" fill="#28303d" stroke="#d97706" stroke-width="1.5"/>
<text x="654" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">Cross-encoder</text>
<text x="654" y="148" text-anchor="middle" font-size="12" fill="#9fb0c3">re-rank the short</text>
<text x="654" y="168" text-anchor="middle" font-size="12" fill="#9fb0c3">list down to 5</text>
<rect x="752" y="96" width="172" height="150" rx="10" fill="#28303d" stroke="#16a34a" stroke-width="1.5"/>
<text x="838" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">Grounded answer</text>
<text x="838" y="148" text-anchor="middle" font-size="12" fill="#9fb0c3">cite sources;</text>
<text x="838" y="168" text-anchor="middle" font-size="12" fill="#9fb0c3">+10 to 20</text>
<text x="838" y="188" text-anchor="middle" font-size="12" fill="#9fb0c3">faithfulness points</text>
<line x1="188" y1="171" x2="200" y2="171" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="372" y1="171" x2="384" y2="171" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="556" y1="171" x2="568" y2="171" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="740" y1="171" x2="752" y2="171" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="16" y="280" width="928" height="120" rx="10" fill="#28303d" stroke="#64748b" stroke-width="1.5"/>
<text x="480" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#e8e6e1">Chunk by data shape, not by habit</text>
<text x="480" y="332" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Manuals: 512 tokens with 50 overlap. Tickets: one ticket, one chunk. APIs: one endpoint, one chunk.</text>
<text x="480" y="352" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Contracts: hierarchical, child precision with parent context. Code: one function or class per chunk.</text>
<rect x="16" y="424" width="928" height="120" rx="10" fill="#28303d" stroke="#dc2626" stroke-width="1.5"/>
<text x="480" y="454" text-anchor="middle" font-size="15" font-weight="bold" fill="#fca5a5">The trap</text>
<text x="480" y="476" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Doubling the chunk count when answers go wrong. Fix the chunking or the query instead;</text>
<text x="480" y="496" text-anchor="middle" font-size="12.5" fill="#9fb0c3">more chunks of the wrong shape is more noise, not more signal.</text>
</svg>