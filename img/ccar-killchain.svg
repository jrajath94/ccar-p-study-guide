<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Charis SIL', Georgia, 'Times New Roman', serif">
<rect width="960" height="540" rx="14" fill="#1e293b"/>
<text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#e8e6e1">Indirect injection: the attack rides in as data</text>
<text x="480" y="62" text-anchor="middle" font-size="13" fill="#9fb0c3">attacker@example.com hides an instruction in third-party content.</text>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#64748b"/></marker><marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#2563eb"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#dc2626"/></marker><marker id="aht" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#0d9488"/></marker><marker id="aha" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#d97706"/></marker></defs>
<rect x="24" y="96" width="216" height="150" rx="10" fill="#28303d" stroke="#dc2626" stroke-width="1.5"/>
<text x="132" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">1. Plant</text>
<text x="132" y="148" text-anchor="middle" font-size="12.5" fill="#9fb0c3">attacker hides</text>
<text x="132" y="168" text-anchor="middle" font-size="12.5" fill="#9fb0c3">"ignore policy" in a</text>
<text x="132" y="188" text-anchor="middle" font-size="12.5" fill="#9fb0c3">doc or page</text>
<rect x="256" y="96" width="216" height="150" rx="10" fill="#28303d" stroke="#d97706" stroke-width="1.5"/>
<text x="364" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">2. Retrieve</text>
<text x="364" y="148" text-anchor="middle" font-size="12.5" fill="#9fb0c3">agent pulls the doc</text>
<text x="364" y="168" text-anchor="middle" font-size="12.5" fill="#9fb0c3">as trusted context</text>
<rect x="488" y="96" width="216" height="150" rx="10" fill="#28303d" stroke="#dc2626" stroke-width="1.5"/>
<text x="596" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">3. Obey</text>
<text x="596" y="148" text-anchor="middle" font-size="12.5" fill="#9fb0c3">model reads data</text>
<text x="596" y="168" text-anchor="middle" font-size="12.5" fill="#9fb0c3">as instruction</text>
<rect x="720" y="96" width="216" height="150" rx="10" fill="#28303d" stroke="#dc2626" stroke-width="1.5"/>
<text x="828" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#cfe3ff">4. Execute</text>
<text x="828" y="148" text-anchor="middle" font-size="12.5" fill="#9fb0c3">tool runs: sends data,</text>
<text x="828" y="168" text-anchor="middle" font-size="12.5" fill="#9fb0c3">changes state</text>
<line x1="240" y1="171" x2="256" y2="171" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="472" y1="171" x2="488" y2="171" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="704" y1="171" x2="720" y2="171" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="24" y="280" width="912" height="200" rx="10" fill="#28303d" stroke="#0d9488" stroke-width="1.5"/>
<text x="480" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#7ee0d2">Break the chain at any link</text>
<text x="480" y="332" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Treat all external content as data, never as instructions.</text>
<text x="480" y="352" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Delimit untrusted input. Sandbox the reader or use a second model to screen it.</text>
<text x="480" y="372" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Confirm high-stakes actions with the user. Jailbreak attacks training; injection attacks structure.</text>
<text x="480" y="392" text-anchor="middle" font-size="12.5" fill="#9fb0c3">Different attacks, different doors.</text>
</svg>