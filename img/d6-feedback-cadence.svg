<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="1120" height="560" fill="#FFFFFF"/>
<text x="560" y="40" font-size="22" fill="#163D7A" text-anchor="middle" font-weight="700">The feedback cadence ladder: who hears what, how often</text>
<text x="560" y="66" font-size="14" fill="#5C6570" text-anchor="middle">More frequent loops are cheaper; slower loops decide bigger things. Run all four.</text>
<!-- band 1: always -->
<rect x="20" y="90" width="1080" height="98" rx="10" fill="#EAF6F5" stroke="#0E7C7B" stroke-width="1.5"/>
<rect x="44" y="112" width="170" height="54" rx="8" fill="#0E7C7B"/>
<text x="129" y="146" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Always</text>
<text x="250" y="130" font-size="15" fill="#24292F" font-weight="700">Demo on real data by week 2 or 3</text>
<text x="250" y="154" font-size="14" fill="#5C6570">Who: end users, live in the room</text>
<text x="660" y="130" font-size="15" fill="#24292F">Catches: wrong success metrics, workflow misfit</text>
<text x="660" y="154" font-size="14" fill="#5C6570">The cheapest loop: surprise is cheapest before week 4</text>
<!-- band 2: weekly -->
<rect x="20" y="202" width="1080" height="98" rx="10" fill="#EAF0FA" stroke="#1F5FBF" stroke-width="1.5"/>
<rect x="44" y="224" width="170" height="54" rx="8" fill="#1F5FBF"/>
<text x="129" y="258" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Weekly</text>
<text x="250" y="242" font-size="15" fill="#24292F" font-weight="700">Eval dashboard review, 15 minutes</text>
<text x="250" y="266" font-size="14" fill="#5C6570">Who: product owner + eval owner</text>
<text x="660" y="242" font-size="15" fill="#24292F">Red metrics get a named investigator</text>
<text x="660" y="266" font-size="14" fill="#5C6570">Decisions: what gets fixed this week</text>
<!-- band 3: monthly -->
<rect x="20" y="314" width="1080" height="98" rx="10" fill="#FFF7E8" stroke="#A15C07" stroke-width="1.5"/>
<rect x="44" y="336" width="170" height="54" rx="8" fill="#A15C07"/>
<text x="129" y="370" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Monthly</text>
<text x="250" y="354" font-size="15" fill="#24292F" font-weight="700">Business review with the sponsor</text>
<text x="250" y="378" font-size="14" fill="#5C6570">Who: executive sponsor (+ legal if risky)</text>
<text x="660" y="354" font-size="15" fill="#24292F">Agenda: cost trend, quality trend</text>
<text x="660" y="378" font-size="14" fill="#5C6570">Leaves with: one decision, named owners</text>
<!-- band 4: quarterly -->
<rect x="20" y="426" width="1080" height="98" rx="10" fill="#F4EEF7" stroke="#7B4B94" stroke-width="1.5"/>
<rect x="44" y="448" width="170" height="54" rx="8" fill="#7B4B94"/>
<text x="129" y="482" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">Quarterly</text>
<text x="250" y="466" font-size="15" fill="#24292F" font-weight="700">Architecture revisit</text>
<text x="250" y="490" font-size="14" fill="#5C6570">Who: engineering + product owner</text>
<text x="660" y="466" font-size="15" fill="#24292F">New models, cost drift, trade-off checks</text>
<text x="660" y="490" font-size="14" fill="#5C6570">Re-opens: ADR status, eval-set freshness</text>
</svg>
